# GERADO pelo hook `ruff-base` de github.com/welt-studio/standards (ruff/base.toml).
# NÃO EDITE: o hook desfaz qualquer mudança. A versão do padrão é o `rev` desse hook no
# .pre-commit-config.yaml; regra nova entra no standards, para todos os projetos.

# Padrão Ruff da Welt Studio: o mesmo para todos os projetos Python.
#
# O projeto não usa este arquivo daqui: o hook `ruff-base` (este repo, `.pre-commit-hooks.yaml`)
# copia-o para `ruff-base.toml` na raiz do projeto, e o `ruff.toml` de cada pacote faz `extend`
# dessa cópia. O projeto só declara fatos dele (`known-first-party`); regra, limite e exceção vêm
# daqui. Precisou de regra nova? Entra aqui, para todos, numa tag nova.

target-version = "py314"
line-length = 100
# A versão exata do Ruff mora no `uv.lock` de cada projeto. Aqui fica só o piso: a primeira versão
# que conhece todas as regras do `select`. Regra nova que exija um Ruff mais novo sobe o piso. Sem
# `preview`: no Ruff, uma versão patch pode mudar o que está em preview.
required-version = ">=0.17.1"
# Fora do lint e do format, como no Prettier e no jscpd do padrão: saída de gerador (migrations do
# Alembic/Django, que não são escritas à mão) e código de terceiros (transcrito ou copiado em
# `vendor/`, ou minificado), que segue o original. É a lista comum do padrão (`eslint/ignores.json`
# no standards), igual em todas as ferramentas, e um teste do standards reprova se esta divergir;
# os padrões de JS/CSS não casam com nada aqui. `force-exclude` faz valer também para arquivo
# passado pelo nome (é assim que o hook e a CI rodam).
extend-exclude = [
    "**/*.gen.ts",
    "**/migrations/**",
    "**/alembic/versions/**",
    "**/vendor/**",
    "**/*.min.js",
    "**/*.min.mjs",
    "**/*.min.cjs",
    "**/*.min.css",
]
force-exclude = true

[lint]
# Lista explícita, sem `ALL`: subir o Ruff não liga regra nova sozinho.
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "S",       # bandit (segurança)
    "B",       # flake8-bugbear
    "A",       # flake8-builtins
    "C4",      # flake8-comprehensions
    "C90",     # mccabe (complexidade)
    "RET",     # flake8-return
    "SIM",     # flake8-simplify
    "ARG",     # flake8-unused-arguments
    "PLC",     # pylint convention (inclui PLC0415: import dentro de função)
    "PLE",     # pylint errors
    "PLR",     # pylint refactor (limites em [lint.pylint])
    "PLW",     # pylint warnings
    "ASYNC",   # async/await
    "DTZ",     # datetime sem timezone
    "PIE",     # flake8-pie
    "T20",     # print
    "ERA",     # código comentado
    "TD",      # formato de TODO
    "FIX",     # TODO/FIXME/HACK no código (vão para o débito técnico, parking lot ou roadmap)
    "PTH",     # pathlib no lugar de os.path
    "RUF",     # regras do Ruff (inclui RUF100: noqa que não suprime nada)
    "PERF",    # perflint
    "FURB",    # refurb
    "BLE",     # except Exception cego
    "G",       # formato de logging
    "LOG",     # uso do logging (ex.: logger.exception fora de except, que perde o traceback)
    "ISC001",  # concatenação implícita de string na mesma linha
    "ISC003",  # concatenação explícita (+) onde a implícita basta
    "ISC004",  # concatenação implícita dentro de lista/tupla (vírgula esquecida). ISC002 fica
               # fora: conflita com o formatter.
    "TRY",     # tryceratops
    "ANN",     # anotações de tipo
    "SLF",     # acesso a membro privado de fora da classe
    "TC",      # TYPE_CHECKING: import usado em runtime escondido lá (TC004) e afins
    "FAST",    # FastAPI (só dispara em código FastAPI)
    "DJ",      # Django (só dispara em código Django)
    "TID251",  # APIs proibidas ([lint.flake8-tidy-imports.banned-api]), inclusive `Any` e `cast`
    "PGH003",  # `# type: ignore` sem o código da regra (o hook `pyright-base` reprova qualquer um)
    "PGH004",  # noqa sem código
    "T10",     # `breakpoint()`/`pdb` esquecido
    "NPY",     # API depreciada do NumPy (só dispara em código NumPy)
    "PT",      # estilo do pytest (`raises` com `match`, assert simples, sem assert do unittest)
    "RSE",     # `raise X()` com parênteses à toa
    "FLY",     # `"".join([...])` estático que devia ser f-string
    "TID252",  # import relativo que sobe pasta: import absoluto
    "EM",      # mensagem da exceção numa variável antes do `raise` (o traceback não a repete)
]
# Senha escrita no código (S105/S106) e chamada em default de argumento (B008) ficam ligadas
# (decisão do PO, 2026-10-28): desligadas para todos, escondiam segredo de verdade por causa de um
# falso positivo de alguns. O `Depends(...)` do FastAPI e afins são liberados um a um em
# `[lint.flake8-bugbear]`.
ignore = [
    # Mover import "só de tipo" para `TYPE_CHECKING`: no Python 3.14 a anotação já é avaliada só
    # quando pedida (PEP 649), então quase não há ganho; e Pydantic, SQLAlchemy (`Mapped[...]`) e
    # FastAPI (toda função num `Depends`) leem anotações em runtime — mover quebra o app. O
    # contrário continua cobrado: TC004 (import usado em runtime dentro do `TYPE_CHECKING`).
    "TC001",
    "TC002",
    "TC003",
    # Conflitam com o `ruff format` (docs.astral.sh/ruff/formatter/#conflicting-lint-rules).
    "W191",
    "E111",
    "E114",
    "E117",
]

[lint.mccabe]
# Igual ao `complexity` do ESLint.
max-complexity = 12

[lint.pylint]
# `max-args` 5 e `max-statements` 30 são os mesmos `max-params` e `max-statements` do ESLint (decisão
# do PO, 2026-10-28): o Ruff não tem limite de linhas por função, então o de instruções é a trava de
# tamanho de função no Python. `max-branches` e `max-returns` são os padrões do Ruff.
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 30

[lint.flake8-type-checking]
# O Pydantic e as rotas do FastAPI leem as anotações em runtime: com isto, um tipo de campo ou de
# rota importado só dentro de `TYPE_CHECKING` vira TC004 (quebraria o app ao subir).
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
runtime-evaluated-decorators = [
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.delete",
]

[lint.isort]
# O pacote `alembic` é sempre de terceiros, mas a pasta `alembic/` das migrations, ao lado do código,
# faz o Ruff tomá-lo como do projeto conforme a pasta em que roda: da raiz do repo ou de dentro do
# pacote, o mesmo import ia para grupos diferentes e o `--fix` reordenava de um jeito e de outro.
known-third-party = ["alembic"]

[lint.flake8-bugbear]
# É assim que o FastAPI declara dependência e parâmetro de rota (`db: Session = Depends(get_db)`): a
# chamada no default é lida pelo FastAPI a cada requisição, não compartilhada entre chamadas. Fora
# destas, chamada em default de argumento (B008) reprova.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Python >=3.14 já adia a avaliação das anotações (PEP 649)."
# Relógio em teste tem uma lib só, a do padrão de testes (`pytest-base`).
"freezegun".msg = "Use time-machine (padrão de testes da Welt Studio)."
# Contornar o tipo em vez de tipar (decisão do PO, 2026-11-05): `Any` desliga a checagem de tudo que
# o toca, e `cast` faz o checker acreditar sem conferir. Vale também nos testes. Dado dinâmico (JSON,
# TOML, payload) é `object` (ou `dict[str, object]`) estreitado com `isinstance` ou validado; tipo de
# lib de terceiros não se compensa no nosso código. O `_typeshed.Incomplete` é `Any` com outro nome.
# O que furaria esta lista (o `noqa` com o código, o de arquivo, a config do projeto que a desligue
# ou a redefina sem estes itens) é reprovado pelo hook `ruff-base`.
"typing.Any".msg = "Use o tipo real, ou `object` estreitado com isinstance (padrão da Welt Studio)."
"typing_extensions.Any".msg = "Use o tipo real, ou `object` estreitado com isinstance (padrão da Welt Studio)."
"_typeshed.Incomplete".msg = "É `Any` com outro nome: use o tipo real, ou `object` estreitado."
"typing.cast".msg = "Estreite com isinstance ou valide: o cast faz o checker acreditar sem conferir."
"typing_extensions.cast".msg = "Estreite com isinstance ou valide: o cast faz o checker acreditar sem conferir."

[lint.pep8-naming]
# `@declared_attr` recebe a classe (`cls`): é como o SQLAlchemy declara coluna/relacionamento em
# mixin. Sem isto, o N805 pediria `self`.
classmethod-decorators = ["sqlalchemy.orm.declared_attr"]

[lint.per-file-ignores]
# Testes: assert, número mágico, senha de fixture (S105/S106, decisão do PO em 2026-10-28), fixture
# injetada e acesso a privado são o normal; tamanho não é defeito (como os testes no ESLint). O resto
# do padrão vale. Um padrão só para as duas formas (pasta `tests/` e arquivo `test_*.py`), com a
# alternativa `{...}` do glob: uma lista de exceções.
"**/{tests/**/*,test_*}.py" = ["S101", "S105", "S106", "PLR2004", "SLF001", "ANN", "ARG001", "ARG002", "PLR0913", "PLR0915", "PLR0917", "C901"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
