# Ambiente de desenvolvimento dos scripts dos hooks (`sync_base.py`, `check_*.py`): não é pacote
# publicado. Os hooks rodam nos projetos só com a stdlib; aqui ficam as ferramentas que conferem o
# próprio código pelo padrão (Ruff, Pyright, deptry, pytest).
[project]
name = "standards"
version = "0"
requires-python = "==3.14.*"

[dependency-groups]
dev = [
    # O pre-commit roda no Python deste ambiente (`uv run pre-commit`), e os hooks herdam esse Python:
    # sem `default_language_version`, a versão vem só do `.python-version` (hook `python-base`).
    "pre-commit==4.7.0",
    "ruff==0.17.1",
    "pyright==1.1.414",
    # Dependência não usada ou não declarada (hook `deptry`)
    "deptry==0.25.1",
    # Padrão de testes da Welt Studio (hook `pytest-base`): ordem aleatória, timeout, rede bloqueada
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "pytest-randomly==5.0.0",
    "pytest-timeout==2.4.0",
    "pytest-socket==0.8.1",
    "time-machine==3.5.1",
    # Gerador das regras do Semgrep (`hooks/generate_semgrep.py`): lê os modelos e as consultas em
    # YAML e escreve as regras. Roda só aqui, não nos projetos.
    "pyyaml==6.0.3",
    "types-pyyaml==6.0.12.20261103",
    # O motor das regras, nos testes de paridade com o CodeQL (`tests/test_semgrep_parity.py`). Pelo
    # lockfile, a versão e as dependências ficam fixas, como as das outras ferramentas; o motor Pro
    # (fluxo entre arquivos) é instalado à parte, pelo `semgrep install-semgrep-pro`, com o token.
    "semgrep==1.184.0",
]

[tool.uv]
# Sem `[build-system]`: o uv instala só as dependências, não o repo como pacote.
package = false
required-version = "==0.13.1"
# Versão nova só entra com 7 dias de publicada (política de versões; correção de segurança mais nova
# entra em `exclude-newer-package`).
exclude-newer = "7 days"

[tool.deptry]
# O deptry roda da raiz (`deptry .`) e só reconhece como código próprio o que está nela; os scripts
# dos hooks moram em `hooks/` e se importam pelo nome (o mesmo fato do `src` do `ruff.toml` e do
# `pythonpath` abaixo). Os que outro script importa entram aqui; esquecido, o deptry acusa DEP001.
known_first_party = [
    "check_pyright",
    "check_ruff",
    "comments",
    "dockerfiles",
    "globs",
    "jsonc",
    "parsed",
    "pyproject",
    "repo",
    "semgrep_files",
    "sync_base",
]
# O `yaml` vem do grupo `dev` de propósito: o gerador das regras do Semgrep, a cópia dos testes do
# CodeQL e a paridade (`generate_semgrep.py`, `sync_codeql_tests.py`, `semgrep_parity.py` e o
# `semgrep_files.py` deles) rodam só neste repo, não são hooks publicados. Os hooks dos projetos continuam só com a stdlib.
per_rule_ignores = { DEP004 = ["yaml"] }
# Os testes do CodeQL copiados (`semgrep/test/vendor/`) importam os frameworks que testam (Flask,
# Django...): são alvo das regras, não código deste repo.
extend_exclude = ["semgrep/test/vendor"]

[tool.pytest.ini_options]
strict = true
filterwarnings = ["error"]
python_files = ["test_*.py"]
testpaths = ["tests"]
# Os scripts dos hooks rodam soltos (o pre-commit executa o arquivo) e importam uns aos outros pelo
# nome; os testes os importam do mesmo jeito.
pythonpath = ["hooks"]
timeout = 60
# Cobertura em toda rodada (o `fail_under` só vale com `--cov`), com as linhas que faltam no relatório.
# Os scripts não usam rede: nenhum host liberado além do loopback.
markers = [
    "semgrep: paridade das regras do Semgrep com o CodeQL; roda o motor Pro (login) e é lenta",
]
addopts = [
    # A paridade com o CodeQL fica fora da rodada de sempre: `-m semgrep` no job próprio da CI.
    "-m",
    "not semgrep",
    "--cov",
    "--cov-report=term-missing:skip-covered",
    "--disable-socket",
    "--allow-hosts=127.0.0.1,localhost",
]

[tool.coverage.run]
branch = true
source = ["hooks"]

[tool.coverage.report]
fail_under = 80
