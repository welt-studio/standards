rules:
  - id: limit-labeled-receiver-object-argument
    languages:
      - javascript
    severity: ERROR
    message: "Consulta mongoose montada com o corpo da requisição."
    mode: taint
    options:
      interfile: true
    pattern-sources:
      - pattern: "$REQ.body"
      - pattern: "mongoose.Query"
        label: QUERY_CLASS
    pattern-sinks:
      - patterns:
          - pattern: "new $C($A, $B, $X, ...)"
          - focus-metavariable: "$X"
        requires:
          - $C: QUERY_CLASS
