rules:
  - id: welt-js-incomplete-html-attribute-sanitization
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "Vulnerabilidade de XSS: a saída deste sanitizador de HTML pode conter aspas ou '&' ao chegar neste atributo, pois a classe removida não cobre o delimitador do atributo. Escape com entidades HTML."
    metadata:
      category: security
      cwe: "CWE-079: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      codeql: js/incomplete-html-attribute-sanitization
    pattern-either:
      - patterns:
          - pattern: '$L + $E.replace(/$RE/, "")'
          - metavariable-regex:
              metavariable: "$L"
              regex: "(?s).*=\\s*\\\\?\\\"['\\\"]$"
          - metavariable-regex:
              metavariable: "$RE"
              regex: "^\\[(?!\\^)(?![^\\]]*\")[^\\]]+\\]$"
      - patterns:
          - pattern: '$L + $E.replace(/$RE/, "")'
          - metavariable-regex:
              metavariable: "$L"
              regex: "(?s).*=\\s*\\\\?'['\\\"]$"
          - metavariable-regex:
              metavariable: "$RE"
              regex: "^\\[(?!\\^)(?![^\\]]*')[^\\]]+\\]$"
      - patterns:
          - pattern: '$L + $E.replace(/$RE/, "")'
          - metavariable-regex:
              metavariable: "$L"
              regex: "(?is).*\\bon[a-z]+\\s*=\\s*\\\"[^\\\"]*['\\\"]$"
          - metavariable-regex:
              metavariable: "$RE"
              regex: "^\\[(?!\\^)(?![^\\]]*&)[^\\]]+\\]$"
