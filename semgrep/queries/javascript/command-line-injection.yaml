rules:
  - id: welt-js-command-line-injection
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: "Injeção de comando: este comando de sistema é construído a partir de um valor controlado pelo usuário e pode executar comandos arbitrários. Use execFile/spawn com lista de argumentos fixa e valide a entrada."
    metadata:
      category: security
      cwe: "CWE-078: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      codeql: js/command-line-injection
    mode: taint
    pattern-sources:
      - label: USER
        pattern-either:
          - "$model": javascript/http-request-sources
          - "$model": javascript/github-actions-payload-sources
          - "$model": javascript/form-parser-sources
          - "$model": javascript/websocket-message-sources
          - "$model": javascript/graphql-resolver-sources
          - "$model": javascript/react-server-function-sources
          # Resposta de um servidor de terceiros (os dados do `res.on("data")` de http/https): o
          # CodeQL a trata como fonte só nesta consulta.
          - patterns:
              - pattern: "$D"
              - pattern-either:
                  - pattern-inside: "http.get(..., ($RES, ...) => {...})"
                  - pattern-inside: "http.get(..., function ($RES, ...) {...})"
                  - pattern-inside: "http.request(..., ($RES, ...) => {...})"
                  - pattern-inside: "http.request(..., function ($RES, ...) {...})"
                  - pattern-inside: "https.get(..., ($RES, ...) => {...})"
                  - pattern-inside: "https.get(..., function ($RES, ...) {...})"
                  - pattern-inside: "https.request(..., ($RES, ...) => {...})"
                  - pattern-inside: "https.request(..., function ($RES, ...) {...})"
              - pattern-either:
                  - pattern-inside: '$RES.on("data", ($D) => {...})'
                  - pattern-inside: '$RES.on("data", function ($D) {...})'
      # O interpretador de comandos e o `-c` (ou `/c`) da lista de argumentos chegam ao `spawn`
      # escritos na chamada, por uma variável, um campo de objeto ou o retorno de uma função
      # (`spawn(getShell(), ["-c", comando])`): só o fluxo de dados os liga. Cada valor vira um
      # rótulo, e a lista que recebe o `-c` e o valor do usuário é o sumidouro
      # (IndirectCommandArgument.qll: `sh`/`bash` com `-c`, `cmd`/`cmd.exe` com `/c`).
      - label: UNIX_SHELL
        pattern-either: &unix_shells
          - pattern: '"sh"'
          - pattern: '"bash"'
          - pattern: '"/bin/sh"'
          - pattern: '"/bin/bash"'
      - label: UNIX_FLAG
        pattern: &unix_flag '"-c"'
      - label: CMD_SHELL
        pattern-either: &cmd_shells
          - pattern: '"cmd"'
          - pattern: '"cmd.exe"'
          - pattern: '"CMD"'
          - pattern: '"CMD.EXE"'
          - pattern: '"Cmd"'
          - pattern: '"Cmd.exe"'
      - label: CMD_FLAG
        pattern-either: &cmd_flags
          - pattern: '"/c"'
          - pattern: '"/C"'
    pattern-propagators:
      - "$model": javascript/commander-propagators
      - "$model": javascript/promise-then-propagators
      - "$model": javascript/graphql-root-value-propagators
      - pattern: "child_process.$M($SH, $ARGS, ...)"
        from: "$SH"
        to: "$ARGS"
        requires: UNIX_SHELL
        label: UNIX_ARGS
      - pattern: "child_process.$M($SH, $ARGS, ...)"
        from: "$SH"
        to: "$ARGS"
        requires: CMD_SHELL
        label: CMD_ARGS
    pattern-sinks:
      - requires: USER
        pattern-either:
          - "$model": javascript/child-process-exec-sinks
          - "$model": javascript/child-process-sinks
          - "$model": javascript/execa-x-sink
          - "$model": javascript/execa-sinks
      - requires: USER and UNIX_ARGS and UNIX_FLAG
        patterns:
          - pattern: "child_process.$M($SH, $X, ...)"
          - metavariable-regex:
              metavariable: "$M"
              regex:
                "$text": javascript/child-process-command-method-regex
          - focus-metavariable: "$X"
      - requires: USER and CMD_ARGS and CMD_FLAG
        patterns:
          - pattern: "child_process.$M($SH, $X, ...)"
          - metavariable-regex:
              metavariable: "$M"
              regex:
                "$text": javascript/child-process-command-method-regex
          - focus-metavariable: "$X"
      # Lista montada por atribuição de índices (`args[0] = "-c"; args[1] = comando;`) e passada ao
      # shell depois: a lista é o sumidouro (o valor do usuário escrito nela a contamina).
      - requires: USER
        patterns:
          - pattern: "child_process.$M($SH, $A, ...)"
          - pattern-inside: |
              $A[$J] = $F;
              ...
          - metavariable-regex:
              metavariable: "$M"
              regex:
                "$text": javascript/child-process-command-method-regex
          - metavariable-pattern:
              metavariable: "$SH"
              pattern-either: *unix_shells
          - metavariable-pattern:
              metavariable: "$F"
              pattern: *unix_flag
          - focus-metavariable: "$A"
      - requires: USER
        patterns:
          - pattern: "child_process.$M($SH, $A, ...)"
          - pattern-inside: |
              $A[$J] = $F;
              ...
          - metavariable-regex:
              metavariable: "$M"
              regex:
                "$text": javascript/child-process-command-method-regex
          - metavariable-pattern:
              metavariable: "$SH"
              pattern-either: *cmd_shells
          - metavariable-pattern:
              metavariable: "$F"
              pattern-either: *cmd_flags
          - focus-metavariable: "$A"
    # O CodeQL não tem sanitizador de comando: só os que o fluxo de dados já descarta (conversão
    # para número, `typeof`, tamanho).
    pattern-sanitizers:
      - pattern: "+$X"
      - pattern: "typeof $X"
      - "$model": javascript/parse-int-x-sanitizer
      - "$model": javascript/number-x-sanitizer
      - "$model": javascript/x-length
    options:
      interfile: true
