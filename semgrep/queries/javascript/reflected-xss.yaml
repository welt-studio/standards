rules:
  - id: welt-js-reflected-xss
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "Vulnerabilidade de XSS refletido: dados controlados pelo usuário na requisição chegam à resposta HTTP sem escape. Escape a saída para HTML ou use um template com autoescape."
    metadata:
      category: security
      cwe: "CWE-079: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      codeql: js/reflected-xss
    mode: taint
    pattern-sources:
      - "$model": javascript/express-request-sources
      - "$model": javascript/nextjs-server-side-sources
    pattern-sinks:
      - patterns:
          - pattern-either:
              - "$model": javascript/express-response-write-sinks
              - pattern: "$RES.status(...).send($X)"
              - pattern: "$RES.type(...).send($X)"
              - pattern: "$RES.set(...).send($X)"
          - metavariable-regex:
              metavariable: "$RES"
              regex:
                "$text": javascript/response-variable-name-regex
          - focus-metavariable: "$X"
          - "$model": javascript/non-html-content-type-exclusions
      - patterns:
          - pattern-either:
              - pattern: "$CTX.body = $X"
              - pattern: "$CTX.response.body = $X"
          - metavariable-regex:
              metavariable: "$CTX"
              regex:
                "$text": javascript/koa-context-variable-name-regex
          - focus-metavariable: "$X"
      - patterns:
          - pattern: 'new Response($X, {headers: {"$K": "$CT"}})'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex:
                "$text": javascript/content-type-header-name-regex
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new Response($X, {headers: $H})"
          - pattern-inside: '$H = new Headers({"$K": "$CT"}); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex:
                "$text": javascript/content-type-header-name-regex
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new Response($X, {headers})"
          - pattern-inside: 'headers = new Headers({"$K": "$CT"}); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex:
                "$text": javascript/content-type-header-name-regex
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new Response($X, {headers: $H})"
          - pattern-inside: '$H.append("$K", "$CT"); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex:
                "$text": javascript/content-type-header-name-regex
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new Response($X, {headers})"
          - pattern-inside: 'headers.append("$K", "$CT"); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex:
                "$text": javascript/content-type-header-name-regex
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new Response($X, {headers: $H})"
          - pattern-inside: '$H.set("$K", "$CT"); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex:
                "$text": javascript/content-type-header-name-regex
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new Response($X, {headers})"
          - pattern-inside: 'headers.set("$K", "$CT"); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex:
                "$text": javascript/content-type-header-name-regex
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: 'new NextResponse($X, {headers: {"$K": "$CT"}})'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex:
                "$text": javascript/content-type-header-name-regex
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new NextResponse($X, {headers: $H})"
          - pattern-inside: '$H = new Headers({"$K": "$CT"}); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex:
                "$text": javascript/content-type-header-name-regex
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new NextResponse($X, {headers})"
          - pattern-inside: 'headers = new Headers({"$K": "$CT"}); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex:
                "$text": javascript/content-type-header-name-regex
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new NextResponse($X, {headers: $H})"
          - pattern-inside: '$H.append("$K", "$CT"); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex:
                "$text": javascript/content-type-header-name-regex
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new NextResponse($X, {headers})"
          - pattern-inside: 'headers.append("$K", "$CT"); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex:
                "$text": javascript/content-type-header-name-regex
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new NextResponse($X, {headers: $H})"
          - pattern-inside: '$H.set("$K", "$CT"); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex:
                "$text": javascript/content-type-header-name-regex
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new NextResponse($X, {headers})"
          - pattern-inside: 'headers.set("$K", "$CT"); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex:
                "$text": javascript/content-type-header-name-regex
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
    pattern-sanitizers:
      - "$model": javascript/escape-function-sanitizers
      - "$model": javascript/encode-uri-component-x-sanitizer
      - "$model": javascript/encode-uri-x-sanitizer
      - "$model": javascript/sanitize-x-sanitizer
      - "$model": javascript/html-sanitizer-library-sanitizers
      - "$model": javascript/dom-purify-sanitize-x-sanitizer
      - "$model": javascript/validator-escape-sanitizers
      - "$model": javascript/parse-int-x-sanitizer
      - "$model": javascript/parse-float-x-sanitizer
      - "$model": javascript/number-x-sanitizer
      - "$model": javascript/boolean-x-sanitizer
      - "$model": javascript/numeric-and-strip-tags-sanitizers
      - "$model": javascript/striptags-x-sanitizer
      - "$model": javascript/html-encoding-sanitizers
      - "$model": javascript/x-length
      - "$model": javascript/json-stringify-x-sanitizer
      - pattern: "+$X"
      - pattern: "typeof $X"
      - patterns:
          - pattern: "$X"
          - pattern-inside: "if (!/$RE/.exec($X)) {...}"
          - metavariable-regex:
              metavariable: "$RE"
              regex: ".*[<>].*"
      - patterns:
          - pattern: "$X"
          - pattern-inside: "if (!/$RE/.test($X)) {...}"
          - metavariable-regex:
              metavariable: "$RE"
              regex: ".*[<>].*"
      - pattern: "serializeJavaScript($X)"
    options:
      interfile: true
