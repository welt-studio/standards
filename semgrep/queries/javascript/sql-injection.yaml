# js/sql-injection e as consultas de NoSQL. O que se repete por forma de import (`require`, `import x from`,
# `import * as x`, `import { x }`) ou por módulo mora uma vez só em uma âncora YAML (`&nome`, usada como `*nome`):
# a declaração de import, a criação do cliente e a regex de nomes de método. Nome de âncora: o trecho em
# minúsculas (`a_new_mod_athena` é `$A = new $MOD.Athena(...)`).
rules:
  - id: welt-js-sql-injection
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: "Injeção de SQL: esta consulta é montada a partir de dados controlados pelo usuário. Use consultas parametrizadas (placeholders) em vez de concatenar valores no texto SQL."
    metadata:
      category: security
      cwe: "CWE-089: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      codeql: js/sql-injection
    mode: taint
    pattern-sources: &sql_sources # Requisição HTTP (Express, Next.js).
      - $model: javascript/http-request-sources
      # Parâmetros de rota do koa-route (do segundo argumento do handler em diante).
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $R = require("koa-route");
                  ...
              - pattern-inside: |
                  import * as $R from "koa-route";
                  ...
              - pattern-inside: |
                  import $R from "koa-route";
                  ...
          - pattern-either:
              - pattern-inside: |
                  $R.$M($ROUTE, ($C, $P, ...) => {...})
              - pattern-inside: |
                  $R.$M($ROUTE, ($C, $P, ...) => $E)
              - pattern-inside: |
                  $R.$M($ROUTE, function ($C, $P, ...) {...})
              - pattern-inside: |
                  $R.$M($ROUTE, async ($C, $P, ...) => {...})
              - pattern-inside: |
                  $R.$M($ROUTE, async function ($C, $P, ...) {...})
          - pattern: $P
      # Dados dos eventos do socket.io.
      - patterns:
          - pattern-inside: |
              $IO = require("socket.io")(...);
              ...
          - pattern-either:
              - pattern-inside: |
                  $IO.on("connection", ($S) => {...})
              - pattern-inside: |
                  $IO.on("connection", function ($S) {...})
              - pattern-inside: |
                  $IO.on("connection", async ($S) => {...})
          - pattern-either:
              - pattern-inside: |
                  $S.on($EVENT, ($D, ...) => {...})
              - pattern-inside: |
                  $S.on($EVENT, ($D, ...) => $E)
              - pattern-inside: |
                  $S.on($EVENT, function ($D, ...) {...})
              - pattern-inside: |
                  $S.on($EVENT, async ($D, ...) => {...})
              - pattern-inside: |
                  $S.on($EVENT, async function ($D, ...) {...})
          - pattern: $D
      # Serviço `$routeParams` do AngularJS.
      - pattern: $routeParams.$P
    pattern-sinks:
      # Bancos SQL, só pelo módulo importado: o objeto de conexão vem de uma criação do módulo no
      # arquivo (variável, `await`, callback do `getConnection`/`connect` ou encadeamento direto).
      # mysql, mysql2 e mysql2/promise: `query` e `execute` de uma conexão ou de um pool.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $C.$M($X, ...)
                  - pattern-not: $C.$M({...}, ...)
              - pattern: "$C.$M({..., sql: $X, ...}, ...)"
          - &query_or_execute_method_name
            metavariable-regex:
              metavariable: $M
              regex: ^(?:query|execute)$
          - &mysql_module
            pattern-either:
              - pattern-inside: |
                  $MOD = require("mysql");
                  ...
              - pattern-inside: |
                  $MOD = require("mysql2");
                  ...
              - pattern-inside: |
                  $MOD = require("mysql2/promise");
                  ...
              - pattern-inside: |
                  import $MOD from "mysql";
                  ...
              - pattern-inside: |
                  import $MOD from "mysql2";
                  ...
              - pattern-inside: |
                  import $MOD from "mysql2/promise";
                  ...
              - pattern-inside: |
                  import * as $MOD from "mysql";
                  ...
              - pattern-inside: |
                  import * as $MOD from "mysql2";
                  ...
              - pattern-inside: |
                  import * as $MOD from "mysql2/promise";
                  ...
          - &mysql_connection
            pattern-either:
              - pattern-inside: |
                  $C = <... $MOD.createConnection(...) ...>;
                  ...
              - pattern-inside: |
                  $C = <... $MOD.createPool(...) ...>;
                  ...
              - patterns:
                  - pattern-inside: |
                      $POOL = <... $MOD.createPool(...) ...>;
                      ...
                  - pattern-either:
                      - pattern-inside: |
                          $POOL.getConnection(function ($E, $C) {...})
                      - pattern-inside: |
                          $POOL.getConnection(($E, $C) => {...})
                      - pattern-inside: |
                          $POOL.getConnection(($E, $C) => $B)
                      - pattern-inside: |
                          $POOL.getConnection(async ($E, $C) => {...})
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: $MOD.createConnection(...).$M($X, ...)
              - pattern: $MOD.createPool(...).$M($X, ...)
          - *query_or_execute_method_name
          - *mysql_module
          - focus-metavariable: $X
      # pg e pg-pool: `query` e `execute` de um cliente ou pool, `pg.Query` e `pg-cursor`.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $C.$M($X, ...)
                  - pattern-not: $C.$M({...}, ...)
              - pattern: "$C.$M({..., text: $X, ...}, ...)"
          - *query_or_execute_method_name
          - &pg_module
            pattern-either:
              - pattern-inside: |
                  $MOD = require("pg");
                  ...
              - pattern-inside: |
                  $MOD = require("pg-pool");
                  ...
              - pattern-inside: |
                  import $MOD from "pg";
                  ...
              - pattern-inside: |
                  import $MOD from "pg-pool";
                  ...
              - pattern-inside: |
                  import * as $MOD from "pg";
                  ...
          - pattern-either:
              - pattern-inside: |
                  $C = <... new $MOD.Client(...) ...>;
                  ...
              - pattern-inside: |
                  $C = <... new $MOD.Pool(...) ...>;
                  ...
              - pattern-inside: |
                  $C = <... new $MOD(...) ...>;
                  ...
              - &pg_pool_connect
                patterns:
                  - pattern-inside: |
                      $POOL = <... new $MOD.Pool(...) ...>;
                      ...
                  - pattern-either:
                      - pattern-inside: |
                          $C = <... $POOL.connect(...) ...>;
                          ...
                      - pattern-inside: |
                          $POOL.connect(function ($E, $C, ...) {...})
                      - pattern-inside: |
                          $POOL.connect(($E, $C, ...) => {...})
                      - pattern-inside: |
                          $POOL.connect(async ($E, $C, ...) => {...})
          - focus-metavariable: $X
      - patterns:
          - pattern: new $MOD.Query($X, ...)
          - *pg_module
          - focus-metavariable: $X
      - patterns:
          - pattern: new $CUR($X, ...)
          - pattern-either:
              - pattern-inside: |
                  $CUR = require("pg-cursor");
                  ...
              - pattern-inside: |
                  import $CUR from "pg-cursor";
                  ...
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: new $MOD.Client(...).$M($X, ...)
              - pattern: new $MOD.Pool(...).$M($X, ...)
          - *query_or_execute_method_name
          - *pg_module
          - focus-metavariable: $X
      # pg-promise: o objeto do banco (`pgp(conexão)`) e o parâmetro do `task`/`tx`/`taskIf`/`txIf`.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $C.$M($X, ...)
                  - pattern-not: $C.$M({...}, ...)
              - pattern: "$C.$M({..., text: $X, ...}, ...)"
          - &pg_promise_method_name
            metavariable-regex:
              metavariable: $M
              regex: ^(?:any|each|many|manyOrNone|map|multi|multiResult|none|one|oneOrNone|query|result)$
          - &pg_promise_database
            pattern-either:
              - patterns:
                  - &pg_promise_import
                    pattern-either:
                      - pattern-inside: |
                          $INIT = require("pg-promise");
                          ...
                      - pattern-inside: |
                          import $INIT from "pg-promise";
                          ...
                  - pattern-inside: |
                      $PGP = <... $INIT(...) ...>;
                      ...
                  - pattern-inside: |
                      $C = <... $PGP(...) ...>;
                      ...
              - patterns:
                  - pattern-inside: |
                      $PGP = <... require("pg-promise")(...) ...>;
                      ...
                  - pattern-inside: |
                      $C = <... $PGP(...) ...>;
                      ...
              - patterns:
                  - *pg_promise_import
                  - pattern-inside: |
                      $PGP = <... $INIT(...) ...>;
                      ...
                  - pattern-inside: |
                      $D = <... $PGP(...) ...>;
                      ...
                  - &pg_promise_task_callback
                    pattern-either:
                      - pattern-inside: |
                          $D.$TASK(..., function ($C) {...})
                      - pattern-inside: |
                          $D.$TASK(..., ($C) => {...})
                      - pattern-inside: |
                          $D.$TASK(..., ($C) => $B)
                      - pattern-inside: |
                          $D.$TASK(..., async ($C) => {...})
                      - pattern-inside: |
                          $D.$TASK({..., cnd: ($C) => $B, ...}, ...)
                  - metavariable-regex:
                      metavariable: $TASK
                      regex: ^(?:task|taskIf|tx|txIf)$
              - patterns:
                  - pattern-inside: |
                      $PGP = <... require("pg-promise")(...) ...>;
                      ...
                  - pattern-inside: |
                      $D = <... $PGP(...) ...>;
                      ...
                  - *pg_promise_task_callback
                  - metavariable-regex:
                      metavariable: $TASK
                      regex: ^(?:task|taskIf|tx|txIf)$
          - focus-metavariable: $X
      # sqlite3, sqlite e better-sqlite3.
      - patterns:
          - pattern-either:
              - patterns:
                  - $model: javascript/get-call
                  - pattern-not: $R.get({...}, ...)
              - patterns:
                  - pattern: $R.$M($X, ...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(?:all|each|exec|prepare|run)$
          - pattern-either:
              - pattern-inside: |
                  $MOD = require("sqlite3");
                  ...
              - pattern-inside: |
                  $MOD = require("sqlite3").verbose();
                  ...
              - pattern-inside: |
                  import $MOD from "sqlite3";
                  ...
              - pattern-inside: |
                  import * as $MOD from "sqlite3";
                  ...
          - pattern-inside: |
              $R = <... new $MOD.Database(...) ...>;
              ...
          - focus-metavariable: $X
      - patterns:
          - pattern: $R.$M($X, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:all|each|exec|get|prepare|run)$
          - pattern-either:
              - pattern-inside: |
                  $MOD = require("sqlite");
                  ...
              - pattern-inside: |
                  import $MOD from "sqlite";
                  ...
              - pattern-inside: |
                  import * as $MOD from "sqlite";
                  ...
          - pattern-inside: |
              $R = <... $MOD.open(...) ...>;
              ...
          - focus-metavariable: $X
      - patterns:
          - pattern: $R.$M($X, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:exec|prepare)$
          - pattern-either:
              - pattern-inside: |
                  $MOD = require("better-sqlite3");
                  ...
              - pattern-inside: |
                  import $MOD from "better-sqlite3";
                  ...
              - pattern-inside: |
                  import * as $MOD from "better-sqlite3";
                  ...
          - pattern-either:
              - pattern-inside: |
                  $R = <... new $MOD(...) ...>;
                  ...
              - pattern-inside: |
                  $R = <... $MOD(...) ...>;
                  ...
          - focus-metavariable: $X
      # mssql: `query` e `batch` do módulo, de uma requisição ou de um pool de conexões.
      - patterns:
          - pattern: $C.$M($X, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:query|batch)$
          - &mssql_module
            pattern-either:
              - pattern-inside: |
                  $MOD = require("mssql");
                  ...
              - pattern-inside: |
                  import $MOD from "mssql";
                  ...
              - pattern-inside: |
                  import * as $MOD from "mssql";
                  ...
          - pattern-either:
              - pattern-inside: |
                  $C = <... new $MOD.Request(...) ...>;
                  ...
              - pattern-inside: |
                  $C = <... new $MOD.ConnectionPool(...) ...>;
                  ...
              - patterns:
                  - pattern-inside: |
                      $POOL = <... new $MOD.ConnectionPool(...) ...>;
                      ...
                  - pattern-inside: |
                      $C = <... $POOL.request() ...>;
                      ...
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: $MOD.$M($X, ...)
              - pattern: new $MOD.Request(...).$M($X, ...)
              - pattern: new $MOD.ConnectionPool(...).$M($X, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:query|batch)$
          - *mssql_module
          - focus-metavariable: $X
      # sequelize: `query` (a consulta ou o objeto com `query`), `literal` e `asIs`.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $C.query($X, ...)
                  - pattern-not: $C.query({...}, ...)
              - pattern: "$C.query({..., query: $X, ...}, ...)"
          - &sequelize_instance
            pattern-either:
              - patterns:
                  - &sequelize_module
                    pattern-either:
                      - pattern-inside: |
                          $MOD = require("sequelize");
                          ...
                      - pattern-inside: |
                          import $MOD from "sequelize";
                          ...
                      - pattern-inside: |
                          import * as $MOD from "sequelize";
                          ...
                  - pattern-either:
                      - pattern-inside: |
                          $C = <... new $MOD(...) ...>;
                          ...
                      - pattern-inside: |
                          $C = <... new $MOD.Sequelize(...) ...>;
                          ...
              - patterns:
                  - pattern-inside: |
                      import {..., Sequelize, ...} from "sequelize";
                      ...
                  - pattern-inside: |
                      $C = <... new Sequelize(...) ...>;
                      ...
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: new $MOD(...).query($X, ...)
              - pattern: new $MOD.Sequelize(...).query($X, ...)
          - *sequelize_module
          - focus-metavariable: $X
      - patterns:
          - pattern: new Sequelize(...).query($X, ...)
          - pattern-inside: |
              import {..., Sequelize, ...} from "sequelize";
              ...
          - focus-metavariable: $X
      - patterns:
          - pattern: $MOD.$M($X, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:literal|asIs)$
          - *sequelize_module
          - focus-metavariable: $X
      # knex: `raw` e os métodos `...Raw` de um objeto knex.
      - patterns:
          - pattern: $K. ... .$M($X, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:raw|\w*Raw)$
          - pattern-either:
              - pattern-inside: |
                  $MOD = require("knex");
                  ...
              - pattern-inside: |
                  import $MOD from "knex";
                  ...
              - pattern-inside: |
                  import * as $MOD from "knex";
                  ...
          - pattern-either:
              - pattern-inside: |
                  $K = <... $MOD(...) ...>;
                  ...
              - pattern-inside: |
                  $K = <... $MOD.knex(...) ...>;
                  ...
              - patterns:
                  - pattern-inside: |
                      $KNEX = <... $MOD(...) ...>;
                      ...
                  - pattern-either:
                      - pattern-inside: |
                          $KNEX.transaction(($K) => {...})
                      - pattern-inside: |
                          $KNEX.transaction(async ($K) => {...})
          - focus-metavariable: $X
      - patterns:
          - pattern: $MOD(...). ... .$M($X, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:raw|\w*Raw)$
          - pattern-either:
              - pattern-inside: |
                  $MOD = require("knex");
                  ...
              - pattern-inside: |
                  import $MOD from "knex";
                  ...
          - focus-metavariable: $X
      # AWS SDK v3: o comando que carrega a consulta, enviado por `client.send`.
      - patterns:
          - pattern: $CLIENT.send($ARG)
          - metavariable-pattern:
              metavariable: $ARG
              patterns:
                - pattern: new $C(...)
                - &aws_command_class_regex
                  metavariable-regex:
                    metavariable: $C
                    regex: ^(?:StartQueryExecution|CreateNamedQuery|UpdateNamedQuery|CreatePreparedStatement|SelectObjectContent|ExecuteStatement|BatchExecuteStatement|ExecuteSql)Command$
          - focus-metavariable: $ARG
      - patterns:
          - pattern: $CLIENT.send($P)
          - pattern-inside: |
              $P = new $C(...);
              ...
          - *aws_command_class_regex
          - focus-metavariable: $P
      # AWS SDK v2: a propriedade que carrega a consulta, no objeto passado ao método do serviço.
      - patterns:
          - &mod_require_aws_sdk
            pattern-inside: |
              $MOD = require("aws-sdk");
              ...
          - &a_new_mod_athena
            pattern-inside: |
              $A = new $MOD.Athena(...);
              ...
          - pattern: "$A.$M({..., QueryString: $X, ...}, ...)"
          - &athena_query_method_name
            metavariable-regex:
              metavariable: $M
              regex: ^(?:startQueryExecution|createNamedQuery|updateNamedQuery)$
          - focus-metavariable: $X
      - patterns:
          - *mod_require_aws_sdk
          - &a_new_mod_athena_with_call
            pattern-inside: |
              $A = new $MOD.Athena(...);
              ...
              <... $A.$M($P, ...) ...>;
          - pattern: "$P = {..., QueryString: $X, ...}"
          - *athena_query_method_name
          - focus-metavariable: $X
      - patterns:
          - &import_as_mod_from_aws_sdk
            pattern-inside: |
              import * as $MOD from "aws-sdk";
              ...
          - *a_new_mod_athena
          - pattern: "$A.$M({..., QueryString: $X, ...}, ...)"
          - *athena_query_method_name
          - focus-metavariable: $X
      - patterns:
          - *import_as_mod_from_aws_sdk
          - *a_new_mod_athena_with_call
          - pattern: "$P = {..., QueryString: $X, ...}"
          - *athena_query_method_name
          - focus-metavariable: $X
      - patterns:
          - &import_mod_from_aws_sdk
            pattern-inside: |
              import $MOD from "aws-sdk";
              ...
          - *a_new_mod_athena
          - pattern: "$A.$M({..., QueryString: $X, ...}, ...)"
          - *athena_query_method_name
          - focus-metavariable: $X
      - patterns:
          - *import_mod_from_aws_sdk
          - *a_new_mod_athena_with_call
          - pattern: "$P = {..., QueryString: $X, ...}"
          - *athena_query_method_name
          - focus-metavariable: $X
      - patterns:
          - &import_athena_as_alias_from_aws_sdk
            pattern-inside: |
              import { Athena as $ALIAS } from "aws-sdk";
              ...
          - &a_new_alias
            pattern-inside: |
              $A = new $ALIAS(...);
              ...
          - pattern: "$A.$M({..., QueryString: $X, ...}, ...)"
          - *athena_query_method_name
          - focus-metavariable: $X
      - patterns:
          - *import_athena_as_alias_from_aws_sdk
          - &a_new_alias_with_call
            pattern-inside: |
              $A = new $ALIAS(...);
              ...
              <... $A.$M($P, ...) ...>;
          - pattern: "$P = {..., QueryString: $X, ...}"
          - *athena_query_method_name
          - focus-metavariable: $X
      - patterns:
          - &import_athena_from_aws_sdk
            pattern-inside: |
              import { Athena } from "aws-sdk";
              ...
          - pattern-inside: |
              $A = new Athena(...);
              ...
          - pattern: "$A.$M({..., QueryString: $X, ...}, ...)"
          - *athena_query_method_name
          - focus-metavariable: $X
      - patterns:
          - *import_athena_from_aws_sdk
          - pattern-inside: |
              $A = new Athena(...);
              ...
              <... $A.$M($P, ...) ...>;
          - pattern: "$P = {..., QueryString: $X, ...}"
          - *athena_query_method_name
          - focus-metavariable: $X
      - patterns:
          - *mod_require_aws_sdk
          - &a_new_mod_s3
            pattern-inside: |
              $A = new $MOD.S3(...);
              ...
          - pattern: "$A.$M({..., Expression: $X, ...}, ...)"
          - &s3_select_method_name
            metavariable-regex:
              metavariable: $M
              regex: ^(?:selectObjectContent)$
          - focus-metavariable: $X
      - patterns:
          - *mod_require_aws_sdk
          - &a_new_mod_s3_with_call
            pattern-inside: |
              $A = new $MOD.S3(...);
              ...
              <... $A.$M($P, ...) ...>;
          - pattern: "$P = {..., Expression: $X, ...}"
          - *s3_select_method_name
          - focus-metavariable: $X
      - patterns:
          - *import_as_mod_from_aws_sdk
          - *a_new_mod_s3
          - pattern: "$A.$M({..., Expression: $X, ...}, ...)"
          - *s3_select_method_name
          - focus-metavariable: $X
      - patterns:
          - *import_as_mod_from_aws_sdk
          - *a_new_mod_s3_with_call
          - pattern: "$P = {..., Expression: $X, ...}"
          - *s3_select_method_name
          - focus-metavariable: $X
      - patterns:
          - *import_mod_from_aws_sdk
          - *a_new_mod_s3
          - pattern: "$A.$M({..., Expression: $X, ...}, ...)"
          - *s3_select_method_name
          - focus-metavariable: $X
      - patterns:
          - *import_mod_from_aws_sdk
          - *a_new_mod_s3_with_call
          - pattern: "$P = {..., Expression: $X, ...}"
          - *s3_select_method_name
          - focus-metavariable: $X
      - patterns:
          - &import_s3_as_alias_from_aws_sdk
            pattern-inside: |
              import { S3 as $ALIAS } from "aws-sdk";
              ...
          - *a_new_alias
          - pattern: "$A.$M({..., Expression: $X, ...}, ...)"
          - *s3_select_method_name
          - focus-metavariable: $X
      - patterns:
          - *import_s3_as_alias_from_aws_sdk
          - *a_new_alias_with_call
          - pattern: "$P = {..., Expression: $X, ...}"
          - *s3_select_method_name
          - focus-metavariable: $X
      - patterns:
          - &import_s3_from_aws_sdk
            pattern-inside: |
              import { S3 } from "aws-sdk";
              ...
          - pattern-inside: |
              $A = new S3(...);
              ...
          - pattern: "$A.$M({..., Expression: $X, ...}, ...)"
          - *s3_select_method_name
          - focus-metavariable: $X
      - patterns:
          - *import_s3_from_aws_sdk
          - pattern-inside: |
              $A = new S3(...);
              ...
              <... $A.$M($P, ...) ...>;
          - pattern: "$P = {..., Expression: $X, ...}"
          - *s3_select_method_name
          - focus-metavariable: $X
      - patterns:
          - *mod_require_aws_sdk
          - &a_new_mod_rdsdataservice
            pattern-inside: |
              $A = new $MOD.RDSDataService(...);
              ...
          - pattern: "$A.$M({..., sql: $X, ...}, ...)"
          - &rds_execute_method_name
            metavariable-regex:
              metavariable: $M
              regex: ^(?:executeStatement|batchExecuteStatement)$
          - focus-metavariable: $X
      - patterns:
          - *mod_require_aws_sdk
          - &a_new_mod_rdsdataservice_with_call
            pattern-inside: |
              $A = new $MOD.RDSDataService(...);
              ...
              <... $A.$M($P, ...) ...>;
