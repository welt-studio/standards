    pattern-sanitizers:
      # Conversões, guardas de tipo e de esquema, `$eq` e corpo sem objetos aninhados.
      - $model: javascript/parse-int-x-sanitizer
      - $model: javascript/number-x-sanitizer
      - $model: javascript/parse-float-x-sanitizer
      - $model: javascript/x-length
      - $model: javascript/boolean-x-sanitizer
      - &string_typeof_guard
        patterns:
          - pattern: $X
          - pattern-inside: |
              if (typeof $X === "string") {...}
          - pattern-not-inside: JSON.parse(...)
      - &mongoose_object_id_valid_guard
        patterns:
          - pattern: $X
          - pattern-inside: |
              if (mongoose.Types.ObjectId.isValid($X)) {...}
      - &eq_operator_operand
        patterns:
          - pattern: $X
          - pattern-inside: |
              {..., $eq: $X, ...}
      - &ajv_compiled_validator_guard
        patterns:
          - pattern: $X
          - &ajv_new_ajv
            pattern-inside: |
              $AJV = new Ajv(...);
              ...
          - pattern-inside: |
              $V = $AJV.compile(...);
              ...
          - pattern-inside: |
              if ($V($X)) {...}
      - &ajv_validate_guard
        patterns:
          - pattern: $X
          - *ajv_new_ajv
          - pattern-inside: |
              if ($AJV.validate($S, $X)) {...}
      - &joi_require_validated
        patterns:
          - pattern: $X
          - pattern-inside: |
              $MOD = require("joi");
              ...
          - &joi_schema_from_mod_call
            pattern-inside: |
              $S = <... $MOD.$F(...) ...>;
              ...
          - &joi_validate_result
            pattern-inside: |
              $R = $S.validate($X);
              ...
          - &joi_result_without_error
            pattern-inside: |
              if (!$R.error) {...}
      - &joi_import_namespace_validated
        patterns:
          - pattern: $X
          - pattern-inside: |
              import * as $MOD from "joi";
              ...
          - *joi_schema_from_mod_call
          - *joi_validate_result
          - *joi_result_without_error
      - &joi_import_default_validated
        patterns:
          - pattern: $X
          - pattern-inside: |
              import $MOD from "joi";
              ...
          - *joi_schema_from_mod_call
          - *joi_validate_result
          - *joi_result_without_error
      - &urlencoded_body_not_extended
        patterns:
          - pattern: $REQ.body
          - pattern-inside: |
              $APP.use($BP.urlencoded({..., extended: false, ...}));
              ...
          - pattern-not-inside: |
              $APP2.use($BP2.json(...));
              ...
          - pattern-not-inside: |
              $APP2.use($BP2.urlencoded({..., extended: true, ...}));
              ...
          - pattern-not-inside: |
              $APP2.use($BP2.urlencoded());
              ...
    options:
      interfile: true

  - id: welt-js-nosql-injection-typed
    languages:
      - typescript
    severity: ERROR
    message: "Injeção de NoSQL: este objeto de consulta é montado a partir de dados controlados pelo usuário. Valide o tipo (string) ou o esquema antes de consultar."
    metadata:
      category: security
      cwe: "CWE-089: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      codeql: js/sql-injection
    mode: taint
    pattern-sources: *nosql_sources
    pattern-sinks:
      # Só TypeScript: o tipo do receptor vem da declaração (`metavariable-type` não existe em JS).
      - requires: OBJ
        patterns:
          - pattern: $C.$MET($X, ...)
          - metavariable-type:
              metavariable: $C
              types:
                - mongodb.Collection
                - mongoose.Model
                - mongoose.Query
          - *mongo_query_method_name
          - focus-metavariable: $X
    pattern-sanitizers:
      # Conversões, guardas de tipo e de esquema, `$eq` e corpo sem objetos aninhados.
      - $model: javascript/parse-int-x-sanitizer
      - $model: javascript/number-x-sanitizer
      - $model: javascript/parse-float-x-sanitizer
      - $model: javascript/x-length
      - $model: javascript/boolean-x-sanitizer
      - *string_typeof_guard
      - *mongoose_object_id_valid_guard
      - *eq_operator_operand
      - *ajv_compiled_validator_guard
      - *ajv_validate_guard
      - *joi_require_validated
      - *joi_import_namespace_validated
      - *joi_import_default_validated
      - *urlencoded_body_not_extended
    options:
      interfile: true
