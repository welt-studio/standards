    pattern-sanitizers:
      &sql_sanitizers # Escape do mysql e do mysql2 (o módulo ou uma conexão), conversão para número e checagens de tipo.
      - patterns:
          - pattern: $MOD.$F($X)
          - &mysql_escape_method_name
            metavariable-regex:
              metavariable: $F
              regex: ^(?:escape|escapeId)$
          - *mysql_module
      - patterns:
          - pattern: $C.$F($X)
          - *mysql_escape_method_name
          - *mysql_module
          - *mysql_connection
      - $model: javascript/parse-int-x-sanitizer
      - $model: javascript/number-x-sanitizer
      - $model: javascript/parse-float-x-sanitizer
      - pattern: +$X
      - $model: javascript/x-length
      - $model: javascript/boolean-x-sanitizer
      - patterns:
          - pattern: $X
          - pattern-inside: if (typeof $X === "string") {...}
      # Cadeia de `replace` que escapa os caracteres especiais do filtro LDAP.
      - pattern-regex: '[\w.]+(?=(?:(?!;)[\s\S])*?\.replace\(\s*/\\\*/)(?=(?:(?!;)[\s\S])*?\.replace\(\s*/\\\(/)(?=(?:(?!;)[\s\S])*?\.replace\(\s*/\\\)/)(?=(?:(?!;)[\s\S])*?\.replace\(\s*/\\\\/)(?=(?:(?!;)[\s\S])*?\.replace\(\s*/\\//)(?:\s*\.replace\(\s*/(?:\\.|[^/\\])+/\w*\s*,\s*(?:\"(?:\\.|[^\"\\])*\"|''(?:\\.|[^''\\])*'')\s*\))+'
      # Filtros do ldapjs: o valor vira atributo codificado, não texto.
      - patterns:
          - pattern: new $F(...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(?:And|Approx|Equality|Extensible|GreaterThanEquals|LessThanEquals|Not|Or|Presence|Substring)Filter$
    options:
      interfile: true

  - id: welt-js-sql-injection-typed
    languages:
      - typescript
    severity: ERROR
    message: "Injeção de SQL: esta consulta é montada a partir de dados controlados pelo usuário. Use consultas parametrizadas (placeholders) em vez de concatenar valores no texto SQL."
    metadata:
      category: security
      cwe: "CWE-089: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      codeql: js/sql-injection
    mode: taint
    pattern-sources: *sql_sources
    pattern-sinks:
      # Só TypeScript: o tipo do receptor vem da declaração (`metavariable-type` não existe em JS).
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $C.$M($X, ...)
                  - pattern-not: $C.$M({...}, ...)
              - pattern: "$C.$M({..., sql: $X, ...}, ...)"
              - pattern: "$C.$M({..., text: $X, ...}, ...)"
          - metavariable-type:
              metavariable: $C
              types:
                - IDatabase
                - ITask
                - IBaseProtocol
          - *pg_promise_method_name
          - focus-metavariable: $X
    pattern-sanitizers: *sql_sanitizers
    options:
      interfile: true

  - id: welt-js-nosql-injection
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: "Injeção de NoSQL: este objeto de consulta é montado a partir de dados controlados pelo usuário. Valide o tipo (string) ou o esquema antes de consultar."
    metadata:
      category: security
      cwe: "CWE-089: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      codeql: js/sql-injection
    mode: taint
    pattern-sources: &nosql_sources
      # Toda fonte de requisição vale como texto contaminado (`TAINT`); o sumidouro só quer objeto
      # (`OBJ`), que é uma propriedade de `req.query` (`QUERY`), `req.body` e `req.param(...)` de um
      # tratador registrado, ou o resultado de `JSON.parse` de um valor contaminado.
      - label: TAINT
        pattern-either:
          - $model: javascript/http-request-sources
      - label: QUERY
        patterns:
          - $model: javascript/req-query
          - $model: javascript/express-route-handler
      - label: OBJ
        requires: QUERY
        pattern: $Q.$K
      - label: OBJ
        patterns:
          - pattern-either:
              - $model: javascript/req-body
              - $model: javascript/req-param
          - $model: javascript/express-route-handler
      - label: OBJ
        requires: TAINT
        pattern: JSON.parse(...)
    pattern-sinks:
      - requires: OBJ
        pattern-either:
          # Driver `mongodb`: a coleção que `db.collection(...)` devolve.
          - patterns:
              - pattern: $D.collection(...).$MET($X, ...)
              - &mongo_module
                pattern-either:
                  - pattern-inside: |
                      $MG = require("mongodb");
                      ...
                  - pattern-inside: |
                      $MG = require("mongodb").MongoClient;
                      ...
                  - pattern-inside: |
                      $MG = require("mongoose");
                      ...
                  - pattern-inside: |
                      import $MG from "mongodb";
                      ...
                  - pattern-inside: |
                      import $MG from "mongoose";
                      ...
                  - pattern-inside: |
                      import * as $MG from "mongodb";
                      ...
                  - pattern-inside: |
                      import * as $MG from "mongoose";
                      ...
                  - pattern-inside: |
                      import {..., $N, ...} from "mongodb";
                      ...
                  - pattern-inside: |
                      import {..., $N, ...} from "mongoose";
                      ...
              - &mongo_read_write_method_name
                metavariable-regex:
                  metavariable: $MET
                  regex: ^(?:aggregate|count|countDocuments|deleteMany|deleteOne|find|findOne|findOneAndDelete|findOneAndReplace|findOneAndUpdate|remove|replaceOne|update|updateMany|updateOne|watch)$
              - focus-metavariable: $X
          - patterns:
              - pattern: $D.collection(...).$MET($A, $X, ...)
              - *mongo_module
              - &mongo_update_only_method_name
                metavariable-regex:
                  metavariable: $MET
                  regex: ^(?:distinct|findOneAndUpdate|update|updateMany|updateOne)$
              - focus-metavariable: $X
          - patterns:
              - *mongo_module
              - &collection_alias_forms
                pattern-either:
                  - pattern-inside: |
                      $C = $D.collection(...);
                      ...
                  - pattern-inside: |
                      $C = await $D.collection(...);
                      ...
              - pattern: $C.$MET($X, ...)
              - *mongo_read_write_method_name
              - focus-metavariable: $X
          - patterns:
              - *mongo_module
              - *collection_alias_forms
              - pattern: $C.$MET($A, $X, ...)
              - *mongo_update_only_method_name
              - focus-metavariable: $X
          # mongoose e marsdb: modelo, consulta encadeada e o resultado dos callbacks.
          - patterns:
              - &mongoose_model_alias
                patterns:
                  - &mongoose_module
                    pattern-either:
                      - pattern-inside: |
                          $MG = require("mongoose");
                          ...
                      - pattern-inside: |
                          import $MG from "mongoose";
                          ...
                      - pattern-inside: |
                          import * as $MG from "mongoose";
                          ...
                  - pattern-inside: |
                      $M = <... $MG.model(...) ...>;
                      ...
              - pattern: $M. ... .$MET($X, ...)
              - &mongo_query_method_name
                metavariable-regex:
                  metavariable: $MET
                  regex: ^(?:find|findOne|findById|findByIdAndDelete|findByIdAndRemove|findOneAndDelete|findOneAndRemove|findOneAndReplace|geoSearch|remove|replaceOne|exists|aggregate|watch|\$where|and|or|nor|setUpdate|count|countDocuments|deleteMany|deleteOne|where|findByIdAndUpdate|findOneAndUpdate|update|updateMany|updateOne)$
              - focus-metavariable: $X
          - patterns:
              - *mongoose_model_alias
              - pattern: $M. ... .$MET($A, $X, ...)
              - &mongo_update_method_name
                metavariable-regex:
                  metavariable: $MET
                  regex: ^(?:distinct|where|findByIdAndUpdate|findOneAndUpdate|update|updateMany|updateOne)$
              - focus-metavariable: $X
          - patterns:
              - pattern: $MG.createConnection(...).model(...). ... .$MET($X, ...)
              - *mongoose_module
              - *mongo_query_method_name
              - focus-metavariable: $X
          - patterns:
              - pattern: $MG.createConnection(...).model(...). ... .$MET($A, $X, ...)
