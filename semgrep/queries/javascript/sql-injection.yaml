# js/sql-injection e as consultas de NoSQL. O que se repete por forma de import (`require`, `import x from`,
# `import * as x`, `import { x }`) ou por módulo mora uma vez só em uma âncora YAML (`&nome`, usada como `*nome`):
# a declaração de import, a criação do cliente e a regex de nomes de método. Nome de âncora: o trecho em
# minúsculas (`a_new_mod_athena` é `$A = new $MOD.Athena(...)`).
rules:
  - id: welt-js-sql-injection
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: "Injeção de SQL: esta consulta é montada a partir de dados controlados pelo usuário. Use consultas parametrizadas (placeholders) em vez de concatenar valores no texto SQL."
    metadata:
      category: security
      cwe: "CWE-089: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      codeql: js/sql-injection
    mode: taint
    pattern-sources:
      # Requisição HTTP (Express, Next.js).
      - $model: javascript/express-request-sources-signed-cookies
      - $model: javascript/nextjs-server-side-sources
      # Parâmetros de rota do koa-route (do segundo argumento do handler em diante).
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $R = require("koa-route");
                  ...
              - pattern-inside: |
                  import * as $R from "koa-route";
                  ...
              - pattern-inside: |
                  import $R from "koa-route";
                  ...
          - pattern-either:
              - pattern-inside: |
                  $R.$M($ROUTE, ($C, $P, ...) => {...})
              - pattern-inside: |
                  $R.$M($ROUTE, ($C, $P, ...) => $E)
              - pattern-inside: |
                  $R.$M($ROUTE, function ($C, $P, ...) {...})
              - pattern-inside: |
                  $R.$M($ROUTE, async ($C, $P, ...) => {...})
              - pattern-inside: |
                  $R.$M($ROUTE, async function ($C, $P, ...) {...})
          - pattern: $P
      # Dados dos eventos do socket.io.
      - patterns:
          - pattern-inside: |
              $IO = require("socket.io")(...);
              ...
          - pattern-either:
              - pattern-inside: |
                  $IO.on("connection", ($S) => {...})
              - pattern-inside: |
                  $IO.on("connection", function ($S) {...})
              - pattern-inside: |
                  $IO.on("connection", async ($S) => {...})
          - pattern-either:
              - pattern-inside: |
                  $S.on($EVENT, ($D, ...) => {...})
              - pattern-inside: |
                  $S.on($EVENT, ($D, ...) => $E)
              - pattern-inside: |
                  $S.on($EVENT, function ($D, ...) {...})
              - pattern-inside: |
                  $S.on($EVENT, async ($D, ...) => {...})
              - pattern-inside: |
                  $S.on($EVENT, async function ($D, ...) {...})
          - pattern: $D
      # Serviço `$routeParams` do AngularJS.
      - pattern: $routeParams.$P
    pattern-sinks:
      # Alças de banco SQL pelo nome da variável (a origem não aparece no arquivo); `exec`, `execute` e
      # `prepare` ficam sem `client`, que é o cliente SAP HANA, identificado só pelo módulo.
      - patterns:
          - pattern-either:
              - pattern: $DB.$M($X, ...)
              - pattern: $A.$DB.$M($X, ...)
          - pattern-not: $DB.$M({...}, ...)
          - pattern-not: $A.$DB.$M({...}, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:query|all|run|each|raw|any|one|many|none|oneOrNone|manyOrNone|result|multi|multiResult|map|batch|queryRaw|queryRawUnsafe|executeRaw|\$queryRawUnsafe|\$executeRawUnsafe|\$queryRaw|unsafe|sql|queryAsync|execSql|executeSql|queryStream|queryArray|queryObject|select|selectRaw|whereRaw|havingRaw|orderByRaw|joinRaw|execQuery|runSql|executeUpdate|executeQuery)$
          - &sql_handle_variable_name
            metavariable-regex:
              metavariable: $DB
              regex: (?i)^_?(?:this\.)?(?:\w*(?:db|database|conn|connection|client|pool|sequelize|knex|pg|mysql|mysql2|sqlite|sqlite3|trx|tx|transaction|stmt|statement|session|dbh|cnx|orm|athena|dynamodb|hana|ldap|rds|snowflake|mssql|oracledb|odbc|cursor|request|query)\w*)$
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - $model: javascript/get-call
              - pattern: $A.$R.get($X, ...)
          - metavariable-regex:
              metavariable: $R
              regex: (?i)^_?(?:this\.)?(?:\w*(?:db|database|conn|connection|client|pool|sequelize|knex|pg|mysql|mysql2|sqlite|sqlite3|trx|tx|transaction|stmt|statement|session|dbh|cnx|orm|athena|dynamodb|hana|ldap|rds|snowflake|mssql|oracledb|odbc|cursor|request|query)\w*)$
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: "$DB.$M({..., sql: $X, ...}, ...)"
              - pattern: "$A.$DB.$M({..., sql: $X, ...}, ...)"
              - pattern: "$DB.$M({..., text: $X, ...}, ...)"
              - pattern: "$A.$DB.$M({..., text: $X, ...}, ...)"
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:query|execute|exec|any|one|many|none|oneOrNone|manyOrNone|result|multi|multiResult|map)$
          - *sql_handle_variable_name
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: $DB.$M($X, ...)
              - pattern: this.$DB.$M($X, ...)
          - &sql_exec_execute_prepare_method
            metavariable-regex:
              metavariable: $M
              regex: ^(?:exec|execute|prepare)$
          - metavariable-regex:
              metavariable: $DB
              regex: (?i)^_?(?:this\.)?(?:\w*(?:db|database|conn|connection|pool|sequelize|knex|pg|mysql|mysql2|sqlite|sqlite3|trx|tx|transaction|stmt|statement|session|dbh|cnx|orm|athena|dynamodb|hana|ldap|rds|snowflake|mssql|oracledb|odbc|cursor|request|query)\w*)$
          - focus-metavariable: $X
      # AWS SDK v3: o comando que carrega a consulta, enviado por `client.send`.
      - patterns:
          - pattern: $CLIENT.send($ARG)
          - metavariable-pattern:
              metavariable: $ARG
              patterns:
                - pattern: new $C(...)
                - &aws_command_class_regex
                  metavariable-regex:
                    metavariable: $C
                    regex: ^(?:StartQueryExecution|CreateNamedQuery|UpdateNamedQuery|CreatePreparedStatement|SelectObjectContent|ExecuteStatement|BatchExecuteStatement|ExecuteSql)Command$
          - focus-metavariable: $ARG
      - patterns:
          - pattern: $CLIENT.send($P)
          - pattern-inside: |
              $P = new $C(...);
              ...
          - *aws_command_class_regex
          - focus-metavariable: $P
      # AWS SDK v2: a propriedade que carrega a consulta, no objeto passado ao método do serviço.
      - patterns:
          - &mod_require_aws_sdk
            pattern-inside: |
              $MOD = require("aws-sdk");
              ...
          - &a_new_mod_athena
            pattern-inside: |
              $A = new $MOD.Athena(...);
              ...
          - pattern: "$A.$M({..., QueryString: $X, ...}, ...)"
          - &athena_query_method_name
            metavariable-regex:
              metavariable: $M
              regex: ^(?:startQueryExecution|createNamedQuery|updateNamedQuery)$
          - focus-metavariable: $X
      - patterns:
          - *mod_require_aws_sdk
          - &a_new_mod_athena_with_call
            pattern-inside: |
              $A = new $MOD.Athena(...);
              ...
              <... $A.$M($P, ...) ...>;
          - pattern: "$P = {..., QueryString: $X, ...}"
          - *athena_query_method_name
          - focus-metavariable: $X
      - patterns:
          - &import_as_mod_from_aws_sdk
            pattern-inside: |
              import * as $MOD from "aws-sdk";
              ...
          - *a_new_mod_athena
          - pattern: "$A.$M({..., QueryString: $X, ...}, ...)"
          - *athena_query_method_name
          - focus-metavariable: $X
      - patterns:
          - *import_as_mod_from_aws_sdk
          - *a_new_mod_athena_with_call
          - pattern: "$P = {..., QueryString: $X, ...}"
          - *athena_query_method_name
          - focus-metavariable: $X
      - patterns:
          - &import_mod_from_aws_sdk
            pattern-inside: |
              import $MOD from "aws-sdk";
              ...
          - *a_new_mod_athena
          - pattern: "$A.$M({..., QueryString: $X, ...}, ...)"
          - *athena_query_method_name
          - focus-metavariable: $X
      - patterns:
          - *import_mod_from_aws_sdk
          - *a_new_mod_athena_with_call
          - pattern: "$P = {..., QueryString: $X, ...}"
          - *athena_query_method_name
          - focus-metavariable: $X
      - patterns:
          - &import_athena_as_alias_from_aws_sdk
            pattern-inside: |
              import { Athena as $ALIAS } from "aws-sdk";
              ...
          - &a_new_alias
            pattern-inside: |
              $A = new $ALIAS(...);
              ...
          - pattern: "$A.$M({..., QueryString: $X, ...}, ...)"
          - *athena_query_method_name
          - focus-metavariable: $X
      - patterns:
          - *import_athena_as_alias_from_aws_sdk
          - &a_new_alias_with_call
            pattern-inside: |
              $A = new $ALIAS(...);
              ...
              <... $A.$M($P, ...) ...>;
          - pattern: "$P = {..., QueryString: $X, ...}"
          - *athena_query_method_name
          - focus-metavariable: $X
      - patterns:
          - &import_athena_from_aws_sdk
            pattern-inside: |
              import { Athena } from "aws-sdk";
              ...
          - pattern-inside: |
              $A = new Athena(...);
              ...
          - pattern: "$A.$M({..., QueryString: $X, ...}, ...)"
          - *athena_query_method_name
          - focus-metavariable: $X
      - patterns:
          - *import_athena_from_aws_sdk
          - pattern-inside: |
              $A = new Athena(...);
              ...
              <... $A.$M($P, ...) ...>;
          - pattern: "$P = {..., QueryString: $X, ...}"
          - *athena_query_method_name
          - focus-metavariable: $X
      - patterns:
          - *mod_require_aws_sdk
          - &a_new_mod_s3
            pattern-inside: |
