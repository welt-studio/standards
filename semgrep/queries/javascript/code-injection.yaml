rules:
  - id: welt-js-code-injection
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: "Injeção de código: este valor, controlado pelo usuário, é interpretado como código (eval, new Function, setTimeout com string, vm, motor de template). Não execute dados do usuário como código."
    metadata:
      category: security
      cwe: "CWE-094: Improper Control of Generation of Code ('Code Injection')"
      codeql: js/code-injection
    mode: taint
    pattern-sources:
      - "$model": javascript/http-request-sources
      - "$model": javascript/location-hash
      - "$model": javascript/location-search
      - "$model": javascript/window-location-hash
      - "$model": javascript/window-location-search
      - "$model": javascript/window-location-href
      - "$model": javascript/document-location-hash
      - "$model": javascript/document-location-search
      - "$model": javascript/document-location-href
      - "$model": javascript/document-url-sources
      - "$model": javascript/document-base-uri-source
      - "$model": javascript/document-referrer
      - "$model": javascript/window-name
      - "$model": javascript/window-location-and-message-sources
      - "$model": javascript/github-actions-payload-sources
      - "$model": javascript/form-parser-sources
      - "$model": javascript/websocket-message-sources
      - "$model": javascript/graphql-resolver-sources
      - "$model": javascript/react-server-function-sources
    pattern-propagators:
      - "$model": javascript/commander-propagators
      - "$model": javascript/promise-then-propagators
      - "$model": javascript/graphql-root-value-propagators
    pattern-sinks:
      - patterns:
          - pattern: "eval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "new Function(..., $X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "Function(..., $X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "execScript($X, ...)"
              - pattern: "execCommand($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "setTimeout($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "setInterval($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "setImmediate($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "vm.runInThisContext($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "vm.runInNewContext($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "vm.runInContext($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "vm.compileFunction($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "new vm.Script($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "vm.Script($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "new vm.SourceTextModule($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "$E.$M($X, ...)"
              - pattern: "new $E.$M($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $E = require("node:vm");
                  ...
              - pattern-inside: |
                  import * as $E from "node:vm";
                  ...
              - pattern-inside: |
                  import $E from "node:vm";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:Script|SourceTextModule|compileFunction|runInContext|runInNewContext|runInThisContext)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$M($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  import {..., $M, ...} from "node:vm";
                  ...
              - pattern-inside: |
                  const {..., $M, ...} = require("node:vm");
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:Script|SourceTextModule|compileFunction|runInContext|runInNewContext|runInThisContext)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$parse($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$compile($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$interpolate($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "window.eval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "self.eval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "globalThis.eval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "global.eval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "pug.compile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "pug.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "jade.compile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "jade.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "dot.template($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "dot.compile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "ejs.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "nunjucks.renderString($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "lodash.template($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "_.template($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "handlebars.compile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "Handlebars.compile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "mustache.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "Mustache.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$H.compile($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $H = require("hogan.js");
                  ...
              - pattern-inside: |
                  import * as $H from "hogan.js";
                  ...
              - pattern-inside: |
                  import $H from "hogan.js";
                  ...
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "eta.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "squirrelly.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "webix.exec($X)"
              - pattern: "webix.ui({..., template: $X, ...})"
              - pattern: "webix.ui({..., template: function (...) { ...; return $X; } , ...})"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "executeJavaScript($X)"
          - focus-metavariable: "$X"
      # Módulos de template e de serialização que executam o texto recebido.
      - patterns:
          - pattern: "$E.unserialize($X)"
          - pattern-either:
              - pattern-inside: |
                  $E = require("node-serialize");
                  ...
              - pattern-inside: |
                  import * as $E from "node-serialize";
                  ...
              - pattern-inside: |
                  import $E from "node-serialize";
                  ...
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "unserialize($X)"
          - pattern-either:
              - pattern-inside: |
                  import {..., unserialize, ...} from "node-serialize";
                  ...
              - pattern-inside: |
                  const {..., unserialize, ...} = require("node-serialize");
                  ...
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$E.render($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $E = require("whiskers");
                  ...
              - pattern-inside: |
                  import * as $E from "whiskers";
                  ...
              - pattern-inside: |
                  import $E from "whiskers";
                  ...
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "render($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  import {..., render, ...} from "whiskers";
                  ...
              - pattern-inside: |
                  const {..., render, ...} = require("whiskers");
                  ...
          - focus-metavariable: "$X"
      # O corpo de um `<script>` criado com `document.createElement("script")`.
      - patterns:
          - pattern: "$S.textContent = $X"
          - pattern-inside: |
              $S = document.createElement("script");
              ...
          - focus-metavariable: "$X"
      # Operador de código de uma consulta do MongoDB (`$where` roda JavaScript no servidor).
      - patterns:
          - pattern: "{..., $where: $X, ...}"
          - focus-metavariable: "$X"
      # Expressões do AngularJS que o serviço interpreta como código.
      - patterns:
          - pattern: "$filter('orderBy')($ARR, $X, ...)"
          - focus-metavariable: "$X"
      # Os métodos do `$scope`/`$rootScope` que interpretam o argumento como expressão (o serviço
      # que o AngularJS injeta pelo nome do parâmetro), direto ou por uma variável local.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: "$SCOPE.$M($X, ...)"
                  - metavariable-regex:
                      metavariable: "$SCOPE"
                      regex: "^\\$(?:scope|rootScope)$"
              - patterns:
                  - pattern: "$ALIAS.$M($X, ...)"
                  - pattern-inside: |
                      $ALIAS = $SC;
                      ...
                  - metavariable-regex:
                      metavariable: "$SC"
                      regex: "^\\$(?:scope|rootScope)$"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^\\$(?:apply|applyAsync|eval|evalAsync|watch|watchCollection|watchGroup)$"
          - focus-metavariable: "$X"
      # O serviço do AngularJS guardado em uma variável local antes da chamada.
      - patterns:
          - pattern: "$ALIAS($X, ...)"
          - pattern-inside: |
              $ALIAS = $SERVICE;
              ...
          - metavariable-regex:
              metavariable: "$SERVICE"
              regex: "^\\$(?:compile|parse|interpolate)$"
          - focus-metavariable: "$X"
      # Função do `vm` guardada em uma variável local antes da chamada.
      - patterns:
          - pattern: "$F($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $F = require("vm").$M;
                  ...
              - pattern-inside: |
                  $F = vm.$M;
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:runInThisContext|runInNewContext|runInContext|compileFunction)$"
          - focus-metavariable: "$X"
      # Código do `node -e` (qualquer elemento da lista de argumentos que leva o `-e`).
      - patterns:
          - pattern-either:
              - pattern: 'child_process.$M("node", [..., "-e", ..., $X, ...], ...)'
              - pattern: 'child_process.$M("node", [..., $X, ..., "-e", ...], ...)'
              - pattern: 'child_process.$M(process.argv[0], [..., "-e", ..., $X, ...], ...)'
              - pattern: 'child_process.$M(process.argv[0], [..., $X, ..., "-e", ...], ...)'
          - metavariable-regex:
              metavariable: "$M"
              regex:
                "$text": javascript/child-process-command-method-regex
          - focus-metavariable: "$X"
      # O terminal do `node-pty` executa o que se escreve nele.
      - patterns:
          - pattern: "$SH.write($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $PTY = require("node-pty");
                  ...
                  $SH = $PTY.spawn(...);
                  ...
              - pattern-inside: |
                  import * as $PTY from "node-pty";
                  ...
                  $SH = $PTY.spawn(...);
                  ...
              - pattern-inside: |
                  import $PTY from "node-pty";
                  ...
                  $SH = $PTY.spawn(...);
                  ...
              - pattern-inside: |
                  import {..., spawn, ...} from "node-pty";
                  ...
                  $SH = spawn(...);
                  ...
              - pattern-inside: |
                  const {..., spawn, ...} = require("node-pty");
                  ...
                  $SH = spawn(...);
                  ...
          - focus-metavariable: "$X"
      # `Module.prototype._compile` compila o código recebido.
      - patterns:
          - pattern: "$M._compile($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $MOD = require("module");
                  ...
                  $M = new $MOD(...);
                  ...
              - pattern-inside: |
                  import $MOD from "module";
                  ...
                  $M = new $MOD(...);
                  ...
              - pattern-inside: |
                  $M = new module.constructor(...);
                  ...
              - pattern-inside: |
                  $M = new module.constructor;
                  ...
          - focus-metavariable: "$X"
      # JavaScript injetado em um `WebView` do React Native.
      - patterns:
          - pattern: "<WebView ... injectedJavaScript={$X} ... />"
          - pattern-either:
              - pattern-inside: |
                  import {..., WebView, ...} from "react-native";
                  ...
              - pattern-inside: |
                  const {..., WebView, ...} = require("react-native");
                  ...
          - focus-metavariable: "$X"
      # `injectJavaScript` chamado no elemento `<WebView />` guardado em uma variável.
      - patterns:
          - pattern: "$W.injectJavaScript($X)"
          - pattern-inside: |
              $W = <WebView ... />;
              ...
          - pattern-either:
              - pattern-inside: |
                  import {..., WebView, ...} from "react-native";
                  ...
              - pattern-inside: |
                  const {..., WebView, ...} = require("react-native");
                  ...
          - focus-metavariable: "$X"
      # Corpo de um elemento `<script>` em JSX.
      - patterns:
          - pattern: "<script ...>{$X}</script>"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "WebAssembly.compile(..., $X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "WebAssembly.compileStreaming(..., $X, ...)"
          - focus-metavariable: "$X"
      # Atributo de evento (`onclick`...) escrito com um texto, que o navegador executa.
      - patterns:
          - pattern-either:
              - pattern: "$E.attr($N, $X)"
              - pattern: "$E.setAttribute($N, $X)"
          - metavariable-regex:
              metavariable: "$N"
              regex: '(?i)^["'']on.+["'']$'
          - focus-metavariable: "$X"
    pattern-sanitizers:
      - "$model": javascript/parse-int-x-sanitizer
      - "$model": javascript/number-x-sanitizer
      - "$model": javascript/parse-float-x-sanitizer
      - pattern: "+$X"
      - "$model": javascript/json-stringify-x-sanitizer
      - "$model": javascript/x-length
      - "$model": javascript/boolean-x-sanitizer
    options:
      interfile: true
