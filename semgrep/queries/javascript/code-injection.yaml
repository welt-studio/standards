rules:
  - id: welt-js-code-injection
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: "Injeção de código: este valor, controlado pelo usuário, é interpretado como código (eval, new Function, setTimeout com string, vm, motor de template). Não execute dados do usuário como código."
    metadata:
      category: security
      cwe: "CWE-094: Improper Control of Generation of Code ('Code Injection')"
      codeql: js/code-injection
    mode: taint
    pattern-sources:
      - "$model": javascript/express-request-sources-signed-cookies
      - "$model": javascript/nextjs-server-side-sources
      - "$model": javascript/location-hash
      - "$model": javascript/location-search
      - "$model": javascript/location-href-and-pathname-sources
      - "$model": javascript/window-location-hash
      - "$model": javascript/window-location-search
      - "$model": javascript/window-location-href
      - "$model": javascript/window-location-pathname-source
      - "$model": javascript/document-location-hash
      - "$model": javascript/document-location-search
      - "$model": javascript/document-location-href
      - "$model": javascript/document-location-pathname-source
      - "$model": javascript/document-url-sources
      - "$model": javascript/document-base-uri-source
      - "$model": javascript/document-referrer
      - "$model": javascript/window-name
      - "$model": javascript/window-location-and-message-sources
      - "$model": javascript/github-actions-payload-sources
      - "$model": javascript/form-parser-sources
      - "$model": javascript/websocket-message-sources
      - "$model": javascript/graphql-resolver-sources
      - "$model": javascript/react-server-function-sources
    pattern-propagators:
      - "$model": javascript/commander-propagators
      - "$model": javascript/promise-then-propagators
    pattern-sinks:
      - patterns:
          - pattern: "eval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "new Function(..., $X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "Function(..., $X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "setTimeout($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "setInterval($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "setImmediate($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "vm.runInThisContext($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "vm.runInNewContext($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "vm.runInContext($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "vm.compileFunction($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "new vm.Script($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "vm.Script($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$VM.runInNewContext($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$VM.runInThisContext($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$VM.runInContext($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$VM.Script($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "new $VM.Script($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$.globalEval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "jQuery.globalEval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$SCOPE.$eval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$SCOPE.$evalAsync($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$SCOPE.$apply($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$SCOPE.$watch($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$SCOPE.$applyAsync($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$parse($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$compile($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$interpolate($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$WINDOW.eval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "window.eval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "self.eval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "globalThis.eval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "global.eval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$W.injectJavaScript($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$W.executeJavaScript($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$W.evaluateJavaScript($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$PAGE.evaluate($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$PAGE.evaluateOnNewDocument($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$PAGE.addScriptTag({..., content: $X, ...})"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "new Function($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "Function($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "pug.compile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "pug.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "jade.compile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "jade.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "dot.template($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "dot.compile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "ejs.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "ejs.compile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "nunjucks.renderString($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "lodash.template($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "_.template($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "handlebars.compile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "Handlebars.compile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "mustache.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "Mustache.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$H.compile($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $H = require("hogan.js");
                  ...
              - pattern-inside: |
                  import * as $H from "hogan.js";
                  ...
              - pattern-inside: |
                  import $H from "hogan.js";
                  ...
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "eta.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "eta.compile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "squirrelly.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "webix.ui($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "webix.ui({..., template: $X, ...})"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "new Vue({..., template: $X, ...})"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "Vue.compile($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "require('safer-eval')($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "saferEval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "safeEval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$VM2.run($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "new VM().run($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "new NodeVM().run($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "new vm2.VM().run($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "executeJavaScript($X)"
          - focus-metavariable: "$X"
      # Operador de código de uma consulta do MongoDB (`$where` roda JavaScript no servidor).
      - patterns:
          - pattern: "{..., $where: $X, ...}"
          - focus-metavariable: "$X"
      # Expressões do AngularJS que o serviço interpreta como código.
      - patterns:
          - pattern-either:
              - pattern: "$SCOPE.$watchCollection($X, ...)"
              - pattern: "$SCOPE.$watchGroup($X, ...)"
              - pattern: "$filter('orderBy')($ARR, $X, ...)"
          - focus-metavariable: "$X"
      # O serviço do AngularJS guardado em uma variável local antes da chamada.
      - patterns:
          - pattern: "$ALIAS($X, ...)"
          - pattern-inside: |
              $ALIAS = $SERVICE;
              ...
          - metavariable-regex:
              metavariable: "$SERVICE"
              regex: "^\\$(?:compile|parse|interpolate)$"
          - focus-metavariable: "$X"
      # Função do `vm` guardada em uma variável local antes da chamada.
      - patterns:
          - pattern: "$F($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $F = require("vm").$M;
                  ...
              - pattern-inside: |
                  $F = vm.$M;
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:runInThisContext|runInNewContext|runInContext|compileFunction)$"
          - focus-metavariable: "$X"
      # Código do `node -e` (qualquer elemento da lista de argumentos que leva o `-e`).
      - patterns:
          - pattern-either:
              - pattern: 'child_process.$M("node", [..., "-e", ..., $X, ...], ...)'
              - pattern: 'child_process.$M("node", [..., $X, ..., "-e", ...], ...)'
              - pattern: 'child_process.$M(process.argv[0], [..., "-e", ..., $X, ...], ...)'
              - pattern: 'child_process.$M(process.argv[0], [..., $X, ..., "-e", ...], ...)'
          - metavariable-regex:
              metavariable: "$M"
              regex:
                "$text": javascript/child-process-argument-list-method-regex
          - focus-metavariable: "$X"
      # O terminal do `node-pty` executa o que se escreve nele.
      - patterns:
          - pattern: "$SH.write($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $PTY = require("node-pty");
                  ...
                  $SH = $PTY.spawn(...);
                  ...
              - pattern-inside: |
                  import * as $PTY from "node-pty";
                  ...
                  $SH = $PTY.spawn(...);
                  ...
              - pattern-inside: |
                  import $PTY from "node-pty";
                  ...
                  $SH = $PTY.spawn(...);
                  ...
              - pattern-inside: |
                  import {..., spawn, ...} from "node-pty";
                  ...
                  $SH = spawn(...);
                  ...
              - pattern-inside: |
                  const {..., spawn, ...} = require("node-pty");
                  ...
                  $SH = spawn(...);
                  ...
          - focus-metavariable: "$X"
      # `Module.prototype._compile` compila o código recebido.
      - patterns:
          - pattern: "$M._compile($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $MOD = require("module");
                  ...
                  $M = new $MOD(...);
                  ...
              - pattern-inside: |
                  import $MOD from "module";
                  ...
                  $M = new $MOD(...);
                  ...
              - pattern-inside: |
                  $M = new module.constructor(...);
                  ...
              - pattern-inside: |
                  $M = new module.constructor;
                  ...
          - focus-metavariable: "$X"
      # JavaScript injetado em um `WebView` do React Native.
      - patterns:
          - pattern: "<WebView ... injectedJavaScript={$X} ... />"
          - pattern-either:
              - pattern-inside: |
                  import {..., WebView, ...} from "react-native";
                  ...
              - pattern-inside: |
                  const {..., WebView, ...} = require("react-native");
                  ...
          - focus-metavariable: "$X"
      # Corpo de um elemento `<script>` em JSX.
      - patterns:
          - pattern: "<script ...>{$X}</script>"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "WebAssembly.compile(..., $X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "WebAssembly.compileStreaming(..., $X, ...)"
          - focus-metavariable: "$X"
      # Atributo de evento (`onclick`...) escrito com um texto, que o navegador executa.
      - patterns:
          - pattern-either:
              - pattern: "$E.attr($N, $X)"
              - pattern: "$E.setAttribute($N, $X)"
          - metavariable-regex:
              metavariable: "$N"
              regex: '(?i)^["'']on.+["'']$'
          - focus-metavariable: "$X"
    pattern-sanitizers:
      - "$model": javascript/parse-int-x-sanitizer
      - "$model": javascript/number-x-sanitizer
      - "$model": javascript/parse-float-x-sanitizer
      - pattern: "+$X"
      - "$model": javascript/json-stringify-x-sanitizer
      - "$model": javascript/x-length
      - "$model": javascript/encode-uri-component-x-sanitizer
      - "$model": javascript/boolean-x-sanitizer
    options:
      interfile: true
