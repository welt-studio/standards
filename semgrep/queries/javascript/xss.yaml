rules:
  - id: welt-js-xss
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "Vulnerabilidade de XSS: dados controlados pelo usuário (URL, parâmetros, postMessage, requisição) chegam ao HTML da página sem escape. Use textContent/escape ou um sanitizador (DOMPurify)."
    metadata:
      category: security
      cwe: "CWE-079: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      codeql: js/xss
    mode: taint
    pattern-sources:
      - "$model": javascript/express-request-sources
      - "$model": javascript/nextjs-server-side-sources
      - "$model": javascript/location-hash
      - "$model": javascript/location-search
      - "$model": javascript/location-href-and-pathname-sources
      - "$model": javascript/window-location-hash
      - "$model": javascript/window-location-search
      - "$model": javascript/window-location-href
      - "$model": javascript/window-location-pathname-source
      - "$model": javascript/document-location-hash
      - "$model": javascript/document-location-search
      - "$model": javascript/document-location-href
      - "$model": javascript/document-location-pathname-source
      - "$model": javascript/document-url-sources
      - "$model": javascript/document-base-uri-source
      - "$model": javascript/document-referrer
      - "$model": javascript/window-name
      - "$model": javascript/window-location-and-message-sources
      - pattern: "useRouter().query"
      - pattern: "useRouter().query.$K"
      - pattern: "useSearchParams()"
      - pattern: "useSearchParams().get(...)"
      - pattern: "useParams()"
      - pattern: "useParams().$K"
      - pattern: router.query
      - pattern: "router.query.$K"
      - pattern: "$ROUTER.query"
      - pattern: props.searchParams
      - pattern: props.params
      - pattern: "$P.searchParams"
      - pattern: "useLocation().search"
      - pattern: "useLocation().hash"
      - pattern: "useLocation().pathname"
      - pattern: "useRouteMatch().params"
      - pattern: "new URLSearchParams(location.search).get(...)"
      - pattern: "$.urlParam(...)"
    pattern-sinks:
      - "$model": javascript/dom-xss-sinks
    pattern-sanitizers:
      - "$model": javascript/escape-function-sanitizers
      - "$model": javascript/encode-uri-component-x-sanitizer
      - "$model": javascript/encode-uri-x-sanitizer
      - "$model": javascript/sanitize-x-sanitizer
      - "$model": javascript/html-sanitizer-library-sanitizers
      - "$model": javascript/dom-purify-sanitize-x-sanitizer
      - "$model": javascript/validator-escape-sanitizers
      - "$model": javascript/parse-int-x-sanitizer
      - "$model": javascript/parse-float-x-sanitizer
      - "$model": javascript/number-x-sanitizer
      - "$model": javascript/boolean-x-sanitizer
      - "$model": javascript/numeric-and-strip-tags-sanitizers
      - "$model": javascript/striptags-x-sanitizer
      - "$model": javascript/html-encoding-sanitizers
      - "$model": javascript/x-length
      - "$model": javascript/json-stringify-x-sanitizer
      - pattern: "+$X"
      - pattern: "typeof $X"
      - patterns:
          - pattern: '"$P" + $X'
          - metavariable-regex:
              metavariable: "$P"
              regex:
                "$text": javascript/non-html-string-prefix-regex
      - "$model": javascript/dom-purify-sanitize-x-sanitizer
      - "$model": javascript/dom-text-sanitizers
      - "$model": javascript/jquery-check-sanitizer
      - patterns:
          - pattern: "$X"
          - pattern-inside: "if (typeof $X === 'object') {...}"
      - patterns:
          - pattern: "$X"
          - pattern-inside: "if (typeof $X !== 'string') {...}"
      - "$model": javascript/is-element-check-sanitizer
      - "$model": javascript/angle-bracket-replacement-sanitizers
      - "$model": javascript/indexof-call
      - "$model": javascript/message-origin-check-sanitizers
    options:
      interfile: true
