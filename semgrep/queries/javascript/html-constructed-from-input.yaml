rules:
  - id: welt-js-html-constructed-from-input
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "HTML montado a partir de parâmetro de função de biblioteca: se o valor contiver HTML, o resultado será XSS ao ir para o DOM. Escape o valor (ou use textContent) antes de montar o HTML."
    metadata:
      category: security
      cwe: "CWE-079: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      codeql: js/html-constructed-from-input
    # O parâmetro de função exportada vale para código de pacote publicado: teste e fixture ficam
    # de fora (o CodeQL parte do `main` do `package.json`).
    paths:
      exclude:
        - "*.test.*"
        - "*.spec.*"
        - "__tests__/"
        - "fixtures/"
        - "testing/"
    mode: taint
    # O CodeQL marca a folha de uma montagem de HTML (ou a entrada de um XML ou de um Markdown) que
    # chega a um sumidouro de XSS (`HtmlConcatenationSink`, `XmlParsedSink`, `MarkdownSink`). Aqui
    # o valor da biblioteca (rótulo INPUT) ganha o rótulo HTML, XML ou MD ao passar pela montagem
    # (cada montagem exige INPUT), e só o sumidouro de XSS que recebe um desses rótulos alerta: o
    # valor que vai direto a `innerHTML` não é "HTML montado", e a montagem que não chega a um
    # sumidouro também não alerta. O fluxo segue a variável, a função e o arquivo (motor Pro).
    # Limite: o alerta fica no sumidouro de XSS, e o CodeQL marca a folha da concatenação.
    pattern-sources:
      - label: INPUT
        pattern-either:
          - "$model": javascript/module-exports-parameter-sources
          - "$model": javascript/jquery-plugin-parameter-sources
      # Montagem de HTML (`HtmlConcatenationRoot`): as partes constantes têm uma tag. A regex olha
      # a abertura da tag (`<tag`, `</tag`) em cada parte, e o `join` só conta com separador vazio.
      - label: HTML
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: '"$A" + $X'
              - pattern: '$X + "$A"'
              - pattern: '<... "$A" ...> + $X'
              - pattern: '$X + <... "$A" ...>'
          - metavariable-regex:
              metavariable: "$A"
              regex: "(?s).*</?[a-zA-Z]"
      - label: HTML
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "`$A${$X}$B`"
              - pattern: "`$A${$X}$B${$Y}$C`"
              - pattern: "`$A${$X}$B${$Y}$C${$Z}$D`"
          - metavariable-regex:
              metavariable: "$A"
              regex: "(?s).*</?[a-zA-Z]"
      - label: HTML
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "`$A${$X}$B`"
              - pattern: "`$A${$X}$B${$Y}$C`"
              - pattern: "`$A${$X}$B${$Y}$C${$Z}$D`"
          - metavariable-regex:
              metavariable: "$B"
              regex: "(?s).*</?[a-zA-Z]"
      - label: HTML
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "`$A${$X}$B${$Y}$C`"
              - pattern: "`$A${$X}$B${$Y}$C${$Z}$D`"
          - metavariable-regex:
              metavariable: "$C"
              regex: "(?s).*</?[a-zA-Z]"
      - label: HTML
        requires: INPUT
        patterns:
          - pattern: "`$A${$X}$B${$Y}$C${$Z}$D`"
          - metavariable-regex:
              metavariable: "$D"
              regex: "(?s).*</?[a-zA-Z]"
      - label: HTML
        requires: INPUT
        patterns:
          - pattern: '[..., "$A", ...].join("")'
          - metavariable-regex:
              metavariable: "$A"
              regex: "(?s).*</?[a-zA-Z]"
      # XML (`DomParserXmlParserInvocation`): o tipo do documento tem `xml` (o `text/html` não).
      - label: XML
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: 'new DOMParser().parseFromString($X, "$T")'
              - patterns:
                  - pattern: '$D.parseFromString($X, "$T")'
                  - pattern-inside: |
                      $D = new DOMParser();
                      ...
          - metavariable-regex:
              metavariable: "$T"
              regex: ".*xml"
      # Markdown que preserva HTML (`MarkdownStep`, Markdown.qll): o pacote vem do `require`/`import`,
      # ou do nome global quando nada no arquivo o liga a outra coisa.
      # marked: a chamada do módulo.
      - label: MD
        requires: INPUT
        patterns:
          - pattern: "$V($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $V = require("marked");
                  ...
              - pattern-inside: |
                  import $V from "marked";
                  ...
              - pattern-inside: |
                  import * as $V from "marked";
                  ...
      - label: MD
        requires: INPUT
        patterns:
          - pattern: "marked($X, ...)"
          - pattern-not-inside: |
              import marked from "$M";
              ...
          - pattern-not-inside: |
              import * as marked from "$M";
              ...
          - pattern-not-inside: |
              import { ..., marked, ... } from "$M";
              ...
          - pattern-not-inside: |
              import { ..., $O as marked, ... } from "$M";
              ...
          - pattern-not-inside: |
              marked = $E;
              ...
      # snarkdown: a chamada do módulo.
      - label: MD
        requires: INPUT
        patterns:
          - pattern: "$V($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $V = require("snarkdown");
                  ...
              - pattern-inside: |
                  import $V from "snarkdown";
                  ...
              - pattern-inside: |
                  import * as $V from "snarkdown";
                  ...
      # showdown: `new showdown.Converter()`.
      - label: MD
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "new $S.Converter(...).makeHtml($X, ...)"
              - pattern: "new $S.Converter(...).makeMd($X, ...)"
              - patterns:
                  - pattern-either:
                      - pattern: "$C.makeHtml($X, ...)"
                      - pattern: "$C.makeMd($X, ...)"
                  - pattern-inside: |
                      $C = new $S.Converter(...);
                      ...
          - pattern-either:
              - pattern-inside: |
                  $S = require("showdown");
                  ...
              - pattern-inside: |
                  import $S from "showdown";
                  ...
              - pattern-inside: |
                  import * as $S from "showdown";
                  ...
      - label: MD
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "new showdown.Converter(...).makeHtml($X, ...)"
              - pattern: "new showdown.Converter(...).makeMd($X, ...)"
              - patterns:
                  - pattern-either:
                      - pattern: "$C.makeHtml($X, ...)"
                      - pattern: "$C.makeMd($X, ...)"
                  - pattern-inside: |
                      $C = new showdown.Converter(...);
                      ...
          - pattern-not-inside: |
              import showdown from "$M";
              ...
          - pattern-not-inside: |
              import * as showdown from "$M";
              ...
          - pattern-not-inside: |
              import { ..., showdown, ... } from "$M";
              ...
          - pattern-not-inside: |
              import { ..., $O as showdown, ... } from "$M";
              ...
          - pattern-not-inside: |
              showdown = $E;
              ...
          - pattern-not-inside: |
              function showdown(...) {...}
      - label: MD
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "new $K(...).makeHtml($X, ...)"
              - pattern: "new $K(...).makeMd($X, ...)"
              - patterns:
                  - pattern-either:
                      - pattern: "$C.makeHtml($X, ...)"
                      - pattern: "$C.makeMd($X, ...)"
                  - pattern-inside: |
                      $C = new $K(...);
                      ...
          - pattern-either:
              - pattern-inside: |
                  import { ..., Converter as $K, ... } from "showdown";
                  ...
      - label: MD
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "new Converter(...).makeHtml($X, ...)"
              - pattern: "new Converter(...).makeMd($X, ...)"
              - patterns:
                  - pattern-either:
                      - pattern: "$C.makeHtml($X, ...)"
                      - pattern: "$C.makeMd($X, ...)"
                  - pattern-inside: |
                      $C = new Converter(...);
                      ...
          - pattern-either:
              - pattern-inside: |
                  import { ..., Converter, ... } from "showdown";
                  ...
      # mermaid: `render(id, texto, ...)` do módulo e do `mermaidAPI`.
      - label: MD
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "$V.render($ID, $X, ...)"
              - pattern: "$V.mermaidAPI.render($ID, $X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $V = require("mermaid");
                  ...
              - pattern-inside: |
                  import $V from "mermaid";
                  ...
              - pattern-inside: |
                  import * as $V from "mermaid";
                  ...
      - label: MD
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "mermaid.render($ID, $X, ...)"
              - pattern: "mermaid.mermaidAPI.render($ID, $X, ...)"
          - pattern-not-inside: |
              import mermaid from "$M";
              ...
          - pattern-not-inside: |
              import * as mermaid from "$M";
              ...
          - pattern-not-inside: |
              import { ..., mermaid, ... } from "$M";
              ...
          - pattern-not-inside: |
              import { ..., $O as mermaid, ... } from "$M";
              ...
          - pattern-not-inside: |
              mermaid = $E;
              ...
          - pattern-not-inside: |
              function mermaid(...) {...}
      # unified/remark: a cadeia `unified().use(...).process(texto)`, a não ser que um plugin de
      # sanitização (`rehype-sanitize`, um pacote cujo nome tem `sanitize`) esteja na cadeia.
      - label: MD
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "<... $U(...) ...>.processSync($X, ...)"
              - pattern: "<... $U(...) ...>.process($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $U = require("unified");
                  ...
              - pattern-inside: |
                  import $U from "unified";
                  ...
              - pattern-inside: |
                  $U = require("remark");
                  ...
              - pattern-inside: |
                  import $U from "remark";
                  ...
          - pattern-not:
              patterns:
                - pattern-either:
                    - pattern: "<... $Q.use($S, ...) ...>.processSync($X, ...)"
                    - pattern: "<... $Q.use($S, ...) ...>.process($X, ...)"
                - pattern-either:
                    - pattern-inside: |
                        import $S from "$MOD";
                        ...
                    - pattern-inside: |
                        import { ..., $S, ... } from "$MOD";
                        ...
                    - pattern-inside: |
                        $S = require("$MOD");
                        ...
                - metavariable-regex:
                    metavariable: "$MOD"
                    regex: ".*sanitize"
      # markdown-it com `html: true`: a instância, ou o resultado de `use`/`set`/`configure`/`enable`/
      # `disable` sobre ela (sem o `markdown-it-sanitizer`).
      - label: MD
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "$V.render($X, ...)"
              - pattern: "$V.renderInline($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $V = require("markdown-it")({..., html: true, ...});
                  ...
              - pattern-inside: |
                  $V = require("markdown-it")({..., html: true, ...}).$M(...);
                  ...
              - pattern-inside: |
                  $V = require("markdown-it").Markdown({..., html: true, ...});
                  ...
      - label: MD
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "$V.render($X, ...)"
              - pattern: "$V.renderInline($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $V = new $K({..., html: true, ...});
                  ...
              - pattern-inside: |
                  $V = $K({..., html: true, ...});
                  ...
              - pattern-inside: |
                  $V = new $K({..., html: true, ...}).$M(...);
                  ...
              - pattern-inside: |
                  $V = $K({..., html: true, ...}).$M(...);
                  ...
          - pattern-either:
              - pattern-inside: |
                  $K = require("markdown-it");
                  ...
              - pattern-inside: |
                  import $K from "markdown-it";
                  ...
              - pattern-inside: |
                  import * as $K from "markdown-it";
                  ...
      - label: MD
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: 'require("markdown-it")({..., html: true, ...}).render($X, ...)'
              - pattern: 'require("markdown-it")({..., html: true, ...}).renderInline($X, ...)'
    pattern-propagators:
      # O callback do mermaid recebe o SVG renderizado a partir do texto.
      - pattern: "$V.render($ID, $X, function ($SVG) {...})"
        from: $X
        to: $SVG
        label: MD
        requires: INPUT
      - pattern: "$V.render($ID, $X, ($SVG) => {...})"
        from: $X
        to: $SVG
        label: MD
        requires: INPUT
      - pattern: "$V.mermaidAPI.render($ID, $X, function ($SVG) {...})"
        from: $X
        to: $SVG
        label: MD
        requires: INPUT
      # O XML parseado e movido pelo DOM (`domBasedTaintStep`): o nó que recebe o filho, e o
      # clone, viram o mesmo valor.
      - pattern: "$R.appendChild($X)"
        from: $X
        to: $R
      - pattern: "$R.insertBefore($X, ...)"
        from: $X
        to: $R
      - pattern: "$R.replaceChild($X, ...)"
        from: $X
        to: $R
      - pattern: "$R.append(..., $X, ...)"
        from: $X
        to: $R
      - pattern: "$R.prepend(..., $X, ...)"
        from: $X
        to: $R
      - pattern: "$R.replaceWith(..., $X, ...)"
        from: $X
        to: $R
      - pattern: "$R.replaceChildren(..., $X, ...)"
        from: $X
        to: $R
      - pattern: "$R.insertAdjacentElement($P, $X)"
        from: $X
        to: $R
    pattern-sinks:
      - requires: HTML or MD
        patterns:
          - "$model": javascript/dom-html-and-node-sinks
      # O XML parseado vai a um sumidouro de XSS; o argumento do próprio `parseFromString` faz
      # parte da fonte (o motor o trataria como o valor que já virou XML).
      - requires: XML
        patterns:
          - "$model": javascript/dom-html-and-node-sinks
          - pattern-not-inside:
              patterns:
                - pattern: "$D.parseFromString($Q, ...)"
                - focus-metavariable: "$Q"
    pattern-sanitizers:
      - "$model": javascript/escape-function-sanitizers
      - "$model": javascript/encode-uri-component-x-sanitizer
      - "$model": javascript/encode-uri-x-sanitizer
      - "$model": javascript/html-sanitizer-library-sanitizers
      - "$model": javascript/dom-purify-sanitize-x-sanitizer
      - "$model": javascript/parse-int-x-sanitizer
      - "$model": javascript/parse-float-x-sanitizer
      - "$model": javascript/number-x-sanitizer
      - "$model": javascript/boolean-x-sanitizer
      - "$model": javascript/numeric-and-strip-tags-sanitizers
      - "$model": javascript/striptags-x-sanitizer
      - "$model": javascript/html-encoding-sanitizers
      - "$model": javascript/x-length
      - "$model": javascript/json-stringify-x-sanitizer
      - pattern: "+$X"
      - pattern: "typeof $X"
      # `UnsafeJQueryPlugin::Sanitizer` (o CodeQL a aplica a esta consulta): o `this` do plugin
      # (`$(this)`) e a leitura de propriedade cujo nome tem `html` ou `template` (o autor do
      # plugin espera HTML ali).
      - pattern: "this"
      - patterns:
          - pattern: "$O.$P"
          - metavariable-regex:
              metavariable: "$P"
              regex: "(?i).*(html|template).*"
      - "$model": javascript/jquery-selector-prefix-sanitizers
      - "$model": javascript/dom-text-sanitizers
      - "$model": javascript/typeof-guard-sanitizers
      - "$model": javascript/angle-bracket-replacement-sanitizers
      - "$model": javascript/indexof-call
    options:
      interfile: true
