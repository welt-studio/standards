rules:
  - id: welt-js-html-constructed-from-input
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "HTML montado a partir de parâmetro de função de biblioteca: se o valor contiver HTML, o resultado será XSS ao ir para o DOM. Escape o valor (ou use textContent) antes de montar o HTML."
    metadata:
      category: security
      cwe: "CWE-079: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      codeql: js/html-constructed-from-input
    mode: taint
    pattern-sources:
      - "$model": javascript/module-exports-parameter-sources
      - "$model": javascript/jquery-plugin-parameter-sources
    pattern-sinks:
      - "$model": javascript/dom-xss-sinks
      - patterns:
          - pattern-either:
              - pattern: '$DOM.parseFromString($X, "text/xml")'
              - pattern: '$DOM.parseFromString($X, "text/html")'
              - pattern: "$MD.render($X)"
          - focus-metavariable: "$X"
    pattern-sanitizers:
      - "$model": javascript/escape-function-sanitizers
      - "$model": javascript/encode-uri-component-x-sanitizer
      - "$model": javascript/encode-uri-x-sanitizer
      - "$model": javascript/html-sanitizer-library-sanitizers
      - "$model": javascript/dom-purify-sanitize-x-sanitizer
      - "$model": javascript/parse-int-x-sanitizer
      - "$model": javascript/parse-float-x-sanitizer
      - "$model": javascript/number-x-sanitizer
      - "$model": javascript/boolean-x-sanitizer
      - "$model": javascript/numeric-and-strip-tags-sanitizers
      - "$model": javascript/striptags-x-sanitizer
      - "$model": javascript/html-encoding-sanitizers
      - "$model": javascript/x-length
      - "$model": javascript/json-stringify-x-sanitizer
      - pattern: "+$X"
      - pattern: "typeof $X"
      - patterns:
          - pattern: '"$P" + $X'
          - metavariable-regex:
              metavariable: "$P"
              regex:
                "$text": javascript/non-html-string-prefix-regex
      - "$model": javascript/dom-purify-sanitize-x-sanitizer
      - "$model": javascript/dom-text-sanitizers
      - "$model": javascript/jquery-check-sanitizer
      - patterns:
          - pattern: "$X"
          - pattern-inside: "if (typeof $X === 'object') {...}"
      - patterns:
          - pattern: "$X"
          - pattern-inside: "if (typeof $X !== 'string') {...}"
      - "$model": javascript/is-element-check-sanitizer
      - "$model": javascript/angle-bracket-replacement-sanitizers
      - "$model": javascript/indexof-call
      - "$model": javascript/message-origin-check-sanitizers
      - "$model": javascript/striptags-x-sanitizer
    options:
      interfile: true
