rules:
  - id: welt-js-regex-injection
    languages:
      - javascript
      - typescript
    severity: WARNING
    mode: taint
    options:
      interfile: true
    message: "Valor controlado pelo usuário usado para construir uma expressão regular sem escape. Escape o valor (por exemplo com `escapeRegExp`) antes de usá-lo."
    metadata:
      category: security
      cwe: "CWE-730: Regular Expression Denial of Service / CWE-400: Uncontrolled Resource Consumption"
      codeql: js/regex-injection
    pattern-sources:
      - "$model": javascript/request-sources-named-req-ctx-or-this-request
      - "$model": javascript/process-argv-source
    pattern-sanitizers:
      - pattern: "_.escapeRegExp(...)"
      - pattern: "escapeRegExp(...)"
      - pattern: "escapeStringRegexp(...)"
      - pattern: "escapeRegex(...)"
      - pattern: "RegExp.escape(...)"
      - patterns:
          - pattern: "$S.replace($RE, ...)"
          - metavariable-regex:
              metavariable: "$RE"
              regex: "(?s).*\\\\+[*.$?+^|{}()\\[\\]].*"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "new RegExp($X, ...)"
              - pattern: "RegExp($X, ...)"
              - pattern: "$S.match($X)"
              - pattern: "$S.matchAll($X)"
              - pattern: "$S.search($X)"
              - pattern: "$S.split($X)"
          - pattern-not: "URI(...).search($X)"
          - pattern-not: "$S.match({...})"
          - focus-metavariable: "$X"
