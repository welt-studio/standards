          - pattern: 'jsyaml.load($X, {..., schema: jsyaml.DEFAULT_SCHEMA.extend(require("js-yaml-js-types").function), ...})'
          - focus-metavariable: "$X"
      - patterns:
          - pattern: 'jsyaml.load($X, {..., schema: require("js-yaml-js-types").all.extend(...), ...})'
          - focus-metavariable: "$X"
      - patterns:
          - pattern: 'jsyaml.load($X, {..., schema: require("js-yaml-js-types").function.extend(...), ...})'
          - focus-metavariable: "$X"
      - patterns:
          - pattern: 'jsyaml.load($X, {..., schema: jsyaml.DEFAULT_SCHEMA.extend([..., require("js-yaml-js-types").all, ...]), ...})'
          - focus-metavariable: "$X"
      - patterns:
          - pattern-inside: |
              $C = {..., schema: jsyaml.DEFAULT_FULL_SCHEMA, ...};
              ...
          - pattern: "jsyaml.load($X, $C)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "jsyaml.loadAll($X, {..., schema: jsyaml.DEFAULT_FULL_SCHEMA, ...})"
          - focus-metavariable: "$X"
