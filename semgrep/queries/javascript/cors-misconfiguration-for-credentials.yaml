rules:
  - id: welt-js-cors-misconfiguration-for-credentials-null
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "O cabeçalho `Access-Control-Allow-Origin` é definido com a origem `null` junto com `Access-Control-Allow-Credentials: true`. Isso permite que qualquer site malicioso faça requisições autenticadas. Compare a origem com uma lista de permitidas e use apenas valores dessa lista."
    metadata:
      category: security
      cwe: "CWE-346: Origin Validation Error"
      codeql: js/cors-misconfiguration-for-credentials
    patterns:
      - pattern-either:
          - pattern: '$R.setHeader("Access-Control-Allow-Origin", null)'
          - pattern: '$R.setHeader("Access-Control-Allow-Origin", "null")'
          - pattern: '$R.setHeader("Access-Control-Allow-Origin", undefined)'
      - pattern-either:
          - pattern-inside: 'function(...) { ... $R.setHeader("Access-Control-Allow-Credentials", true); ... }'
          - pattern-inside: '(...) => { ... $R.setHeader("Access-Control-Allow-Credentials", true); ... }'
          - pattern-inside: 'function $F(...) { ... $R.setHeader("Access-Control-Allow-Credentials", true); ... }'
  - id: welt-js-cors-misconfiguration-for-credentials
    languages:
      - javascript
      - typescript
    severity: WARNING
    mode: taint
    options:
      interfile: true
    message: "O cabeçalho `Access-Control-Allow-Origin` é definido com uma origem controlada pelo usuário junto com `Access-Control-Allow-Credentials: true`. Isso permite que qualquer site malicioso faça requisições autenticadas. Compare a origem com uma lista de permitidas e use apenas valores dessa lista."
    metadata:
      category: security
      cwe: "CWE-346: Origin Validation Error"
      codeql: js/cors-misconfiguration-for-credentials
    pattern-sources:
      - "$model": javascript/http-request-sources-cookies
      - pattern: "url.parse($U, ...).query"
      - pattern: "url.parse($U, ...).query.$K"
      - pattern: "$R.headers.origin"
      - pattern: '$R.headers["origin"]'
      - pattern: '$R.get("Origin")'
      - pattern: '$R.header("Origin")'
    pattern-sanitizers:
      - patterns:
          - pattern-inside: "if ($O in $Y) {...}"
          - pattern: "$O"
      - patterns:
          - pattern-inside: "if ($Y.indexOf($O) !== -1) {...}"
          - pattern: "$O"
      - patterns:
          - pattern-inside: "if ($Y.indexOf($O) > -1) {...}"
          - pattern: "$O"
      - patterns:
          - pattern-inside: "if ($Y.indexOf($O) >= 0) {...}"
          - pattern: "$O"
      - patterns:
          - pattern-inside: "if ($Y.includes($O)) {...}"
          - pattern: "$O"
      - patterns:
          - pattern-inside: "if ($Y.has($O)) {...}"
          - pattern: "$O"
      - patterns:
          - pattern-inside: "if ($Y[$O]) {...}"
          - pattern: "$O"
      - patterns:
          - pattern-inside: "if (<... $Y.includes($O) ...>) {...}"
          - pattern: "$O"
      - patterns:
          - pattern-inside: "if (<... $Y.indexOf($O) ...>) {...}"
          - pattern: "$O"
    pattern-sinks:
      - patterns:
          - pattern: '$R.setHeader("Access-Control-Allow-Origin", $V)'
          - focus-metavariable: "$V"
          - pattern-either:
              - pattern-inside: 'function(...) { ... $R.setHeader("Access-Control-Allow-Credentials", true); ... }'
              - pattern-inside: '(...) => { ... $R.setHeader("Access-Control-Allow-Credentials", true); ... }'
              - pattern-inside: 'function $F(...) { ... $R.setHeader("Access-Control-Allow-Credentials", true); ... }'
