          - metavariable-regex:
              metavariable: "$REQ"
              regex:
                "$text": javascript/request-or-context-variable-name-regex
          - pattern-inside: "$APP.get($P, ..., function($REQ, ...) {...})"
      - patterns:
          - pattern-either:
              - pattern: "const $V = $REQ.query.$X"
              - pattern: "let $V = $REQ.query.$X"
              - pattern: "var $V = $REQ.query.$X"
