rules:
  - id: welt-js-sensitive-get-query
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "Esta rota GET lê uma senha ou outro dado sensível da query string. A URL fica registrada em logs, histórico do navegador e cabeçalhos Referer. Envie o valor no corpo de uma requisição POST."
    metadata:
      category: security
      cwe: "CWE-598: Use of GET Request Method With Sensitive Query Strings"
      codeql: js/sensitive-get-query
    pattern-either:
      - patterns:
          - pattern: "$REQ.query.$N"
          - metavariable-regex:
              metavariable: "$N"
              regex:
                "$text": javascript/sensitive-passwords
          - metavariable-regex:
              metavariable: "$REQ"
              regex:
                "$text": javascript/request-or-context-variable-name-regex
          - pattern-inside: "$APP.get($P, ..., function($REQ, ...) {...})"
      - patterns:
          - pattern: "$REQ.query[$S]"
          - metavariable-regex:
              metavariable: "$S"
              regex: "^[\"'`](?!(?is:[^\"'`]*(?:[^\\w$.\"\\'`-]|redact|censor|obfuscate|hash|md5|sha|random|(?<!unen)crypt|(?<!un)encode|certain|concert|secretar|wildcard|coauthor|account(ant|ab|ing|ed)|(?<!pro)file|path|([_-]|\\b)url)))(?is:[^\"'`]*(?:(?:pass(wd|word|code|.?phrase)(?!.*question)|(auth(entication|ori[sz]ation)?).?key|oauth|api.?(key|tok)|([_-]|\\b)mfa([_-]|\\b))))[\"'`]?$"
          - metavariable-regex:
              metavariable: "$REQ"
              regex:
                "$text": javascript/request-or-context-variable-name-regex
          - pattern-inside: "$APP.get($P, ..., function($REQ, ...) {...})"
      - patterns:
          - pattern: "$REQ.param($S)"
          - metavariable-regex:
              metavariable: "$S"
