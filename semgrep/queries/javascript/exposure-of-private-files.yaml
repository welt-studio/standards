rules:
  - id: welt-js-exposure-of-private-files
    languages:
      - javascript
      - typescript
    severity: WARNING
    mode: taint
    options:
      interfile: true
    message: "Esta configuração serve a pasta `node_modules` (ou um subdiretório dela) como arquivos estáticos, o que pode expor dados privados (dependências, configuração, segredos). Sirva só uma pasta dedicada, como `public`, ou subpastas específicas."
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      codeql: js/exposure-of-private-files
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: '"..."'
              - pattern: "'...'"
              - pattern: "`...`"
          - pattern-regex: "[\"'`](?:\\.?\\.?/)*node_modules(?:/|/[a-zA-Z@_-]+/?)?[\"'`]"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "express.static($P, ...)"
              - pattern: "connect.static($P, ...)"
              - pattern: "require('serve-static')($P, ...)"
              - pattern: "serveStatic($P, ...)"
              - pattern: "serveHandler($RQ, $RS, {..., public: $P, ...})"
          - focus-metavariable: "$P"
  - id: welt-js-exposure-of-private-files-root
    languages:
      - javascript
      - typescript
    severity: WARNING
    mode: taint
    options:
      interfile: true
    message: "Esta configuração serve a pasta do projeto, a pasta raiz ou a pasta pessoal como arquivos estáticos, o que pode expor dados privados (dependências, configuração, segredos). Sirva só uma pasta dedicada, como `public`, ou subpastas específicas."
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      codeql: js/exposure-of-private-files
    pattern-sources:
      - "$model": javascript/dirname-source
      - pattern: "os.homedir()"
      - pattern: "require('os').homedir()"
      - patterns:
          - pattern-either:
              - pattern: '"..."'
              - pattern: "'...'"
              - pattern: "`...`"
          - pattern-regex: "[\"'`](?:\\.|\\./|/)[\"'`]"
    pattern-sanitizers:
      - patterns:
          - pattern: "$D + $S"
          - metavariable-regex:
              metavariable: "$S"
              regex: '^(?!["''`]/["''`]$)'
      - patterns:
          - pattern-either:
              - pattern: "path.join(__dirname, $S, ...)"
              - pattern: "path.resolve(__dirname, $S, ...)"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "express.static($P, ...)"
              - pattern: "connect.static($P, ...)"
              - pattern: "require('serve-static')($P, ...)"
              - pattern: "serveStatic($P, ...)"
              - pattern: "serveHandler($RQ, $RS, {..., public: $P, ...})"
          - focus-metavariable: "$P"
