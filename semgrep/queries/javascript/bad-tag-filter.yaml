rules:
  - id: welt-js-bad-tag-filter
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "Esta expressão regular de filtro de tags HTML não cobre todas as variantes (maiúsculas, quebras de linha, '</script >', aspas simples/duplas, '--!>'). Não filtre HTML com regex; use um parser/sanitizador."
    metadata:
      category: security
      cwe: "CWE-116: Improper Encoding or Escaping of Output"
      codeql: js/bad-tag-filter
    pattern-regex: "(?:(?<![\\w)\\]}])/(?=<(?:\\(\\?:)?script)(?:(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\]))+/(?![a-z]*i)[a-z]*)|(?:(?<![\\w)\\]}])/(?=<\\((?:\\?:)?script\\|SCRIPT\\))(?:(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\]))+/[a-z]*)|(?:(?<![\\w)\\]}])/(?=<(?:\\(\\?:)?script(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\])*?<\\\\/script(?:>|\\.\\*>))(?:(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\]))+/[a-z]*)|(?:(?<![\\w)\\]}])/(?=<(?:script|!--)(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\])*?(?<!\\\\)\\.(?:[*+]|\\|))(?:(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\]))+/(?![a-z]*s)[a-z]*)|(?:(?<![\\w)\\]}])/(?=<(?:\\(\\?:)?script\\((?=[^)]*(?:\\\\w|=))(?:[^)'\\\\]|\\\\.)*\\)\\*\\??>)(?:(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\]))+/[a-z]*)|(?:(?<![\\w)\\]}])/(?=<(?:\\(\\?:)?script\\((?=[^)]*(?:\\\\w|=))(?:[^)\\\"\\\\]|\\\\.)*\\)\\*\\??>)(?:(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\]))+/[a-z]*)|(?:(?<![\\w)\\]}])/(?=<(?:\\(\\?:)?script\\((?=[^)]*(?:\\\\w|=))(?:(?!\\\\s|\\\\t)(?:[^)\\\\]|\\\\.))*\\)\\*\\??>)(?:(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\]))+/[a-z]*)|(?:(?<![\\w)\\]}])/(?=(?!(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\])*--!)(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\])*?!--(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\])*?-->(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\])*?\\|(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\])*?>)(?:(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\]))+/[a-z]*)|(?:(?<![\\w)\\]}])/(?=(?!(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\])*--!)(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\])*?-->(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\])*?\\|(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\])*?<(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\])*?>)(?:(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\]))+/[a-z]*)|(?:(?<![\\w)\\]}])/-->/[a-z]*)"
