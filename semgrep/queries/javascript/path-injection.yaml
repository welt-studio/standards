      - &s_common_3
        pattern: "path.parse($X).name"
      - &s_common_4
        "$model": "javascript/encode-uri-component-x-sanitizer"
      - &s_common_5
        pattern: "path.extname($X)"
      - &s_common_6
        "$model": "javascript/x-length"
      - &s_common_7
        pattern: "slug($X)"
      - &s_common_8
        pattern: "slugify($X, ...)"
      - &s_common_9
        pattern: "sanitize_filename($X)"
      # replace que tira o `/` (flag g, ou flags que não são literais): nenhum estado passa. A que só
      # tira `../` do começo passa.
      - &s_replace_slash
        patterns:
          - pattern-either:
              - "$model": javascript/global-replace-with-regex-literal
              - pattern: "$X.replace(new RegExp($RE, 'g'), ...)"
              - pattern: '$X.replace(new RegExp($RE, "g"), ...)'
              - &f_replace_new_regexp
                patterns:
                  - pattern: "$X.replace(new RegExp($RE, $F), ...)"
                  - metavariable-regex:
                      metavariable: "$F"
                      regex: '^(?!["''`])'
          - &f_re_slash_class
            metavariable-regex:
              metavariable: "$RE"
              regex: "(?s)^(?:.*\\[.*/.*\\]|[\\\"']?(?:.*[|(])?\\\\+/(?:$|[|)\\\"']))"
          - metavariable-regex:
              metavariable: "$RE"
              regex: "^(?!^\\^?\\(\\\\\\.\\\\\\.(?:\\\\/|\\[[\\\\/]+\\])\\)[+*]$)"
      # replace de `.` com flags que não são literais: nenhum estado passa.
      - &s_replace_dots_unknown_flags
        patterns:
          - *f_replace_new_regexp
          - &f_re_dot_class
            metavariable-regex:
              metavariable: "$RE"
              regex: "(?s)^(?:.*\\[[^\\]]*\\.[^\\]]*\\]|[\\\"']?(?:.*[|(])?(?:\\\\+\\.){1,2}(?:$|[|)\\\"']))"
      # `x ||= f(x)`: o lado direito só roda com `x` falso.
      - &s_falsy_assignment_rhs
        patterns:
          - pattern: "$X"
          - pattern-inside:
              patterns:
                - pattern: "$X ||= $R"
                - focus-metavariable: "$R"
      # `if (p) { p = p.replace(/[/]/g, ""); }`: o `p` que sai pelo lado em que o teste falha é vazio, e
      # o que sai do ramo é limpo.
      - &s_test_then_clean
        patterns:
          - pattern: "$X"
          - pattern-inside:
              patterns:
                - pattern-either:
                    - pattern: |
                        if ($X) {
                          ...
                          $X = $X.replace(/$RE/g, ...);
                          ...
                        }
                        $...REST
                    - pattern: |
                        if (!$X) {...} else {
                          ...
                          $X = $X.replace(/$RE/g, ...);
                          ...
                        }
                        $...REST
                - *f_re_slash_class
                - focus-metavariable: "$...REST"
      # `path.split("/")` direto como argumento: o array não é caminho (o readFile dá erro).
      - &s_split_direct
        patterns:
          - pattern: "$X.split($S)"
          - &f_s_slash_literal
            metavariable-regex:
              metavariable: "$S"
              regex: '^["''`]/["''`]$'
          - pattern-inside: "$FN(..., $X.split($S), ...)"
      # `path.split("/")[0]`: o índice fixo não leva `..`.
      - &s_split_index
        patterns:
          - pattern-either:
              - pattern: "$X.split($S)[$N]"
          - *f_s_slash_literal
          - metavariable-regex:
              metavariable: "$N"
              regex: "^[0-9]+$"
      # `partes[partes.length - 1]`: o último elemento de um split.
      - &s_split_last
        patterns:
          - pattern: "$A[$A.length - 1]"
      # Comparação com texto fixo (lista branca): bloqueia os quatro estados.
      - &g_member_eq
        patterns:
          - pattern: "$X"
          - pattern-either:
              - pattern-inside:
                  patterns:
                    - pattern: "if ($C) $T"
                    - &f_c_no_or_or_negation
                      metavariable-regex:
                        metavariable: "$C"
                        regex: "(?s)^(?!.*(?:\\|\\||!\\s*\\())"
                    - &g_member_eq_true_cond
                      metavariable-pattern:
                        metavariable: "$C"
                        patterns:
                          - pattern-either:
                              - patterns:
                                  - pattern: "$X === $L"
                                  - &f_l_quote_prefix
                                    metavariable-regex:
                                      metavariable: "$L"
                                      regex: '^["''`]'
                              - patterns:
                                  - pattern: "$X == $L"
                                  - *f_l_quote_prefix
                    - focus-metavariable: "$T"
              - pattern-inside:
