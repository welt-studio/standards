# js/path-injection. O CodeQL segue o estado do caminho: normalizado ou cru, relativo ou absoluto
# (quatro estados). Cada guarda (isAbsolute, startsWith, includes("..")...) bloqueia só alguns
# estados, e o alerta sai se algum estado chega ao sumidouro. O Semgrep não tira só um rótulo do
# taint num sanitizador, então cada estado é uma regra: as fontes e os sumidouros são os mesmos
# (âncoras `&sources` e `&sinks`) e mudam os sanitizadores, que são (1) as transições que o
# estado não atravessa (normalize, resolve, relative, join, concatenação, replace) e (2) as
# guardas que o bloqueiam. Estados: RR cru relativo, RA cru absoluto, NR normalizado relativo, NA
# normalizado absoluto. O que se repete dentro das guardas (a condição `$C`, as regex de texto fixo, as
# formas `if`/`&&`/`?:`) é um fragmento com âncora de prefixo `f_`, declarado uma vez e usado como `*f_...`;
# a condição de cada guarda termina em `_cond`.
rules:
  # Estado cru e relativo (RR): o que veio do usuário, sem normalizar, sem `/` no começo.
  - id: welt-js-path-injection-raw-relative
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: "Injeção de caminho: este caminho de arquivo é construído a partir de dados controlados pelo usuário e pode acessar arquivos fora do diretório pretendido. Valide e normalize (path.resolve + verificação de prefixo) antes de usar."
    metadata:
      category: security
      cwe: "CWE-022: Improper Limitation of a Pathname to a Restricted Directory"
      codeql: "js/path-injection"
    mode: taint
    # Fontes das quatro regras: toda fonte entra nos quatro estados.
    pattern-sources: &sources
      - "$model": javascript/http-request-sources-cookies
      - patterns:
          - pattern: "$PT(...).$F"
          - &f_parse_torrent_import
            pattern-either:
              - pattern-inside: |
                  $PT = require("parse-torrent"); ...
              - pattern-inside: |
                  import $PT from "parse-torrent"; ...
          - &f_f_not_private_info_hash_length
            metavariable-regex:
              metavariable: "$F"
              regex: "^(?!private$|infoHash$|length$)"
      - patterns:
          - pattern: "$T.$F"
          - *f_parse_torrent_import
          - pattern-inside: "$PT.remote($U, ..., function ($ERR, $T) {...})"
          - *f_f_not_private_info_hash_length
      - patterns:
          - pattern: "$I.$NAME"
          - pattern-inside: |
              module.exports = {..., inputs: {..., $NAME: $_, ...}, ..., fn($I, ...) {...}, ...}
    # Sumidouros das quatro regras. `sendFile` sem `root` rejeita `../`: só conta normalizado (as
    # regras cruas o sanitizam); com `root`, só o `root` é destino; a entrada do realpath não é
    # destino (por isso fica de fora).
    pattern-sinks: &sinks
      - patterns:
          - pattern-either:
              - "$model": javascript/fs-path-sinks
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?!realpath(?:Sync)?$)"
      # mkdirp e rimraf: o módulo, e só pelo import.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $MK = require("mkdirp"); ...
              - pattern-inside: |
                  import $MK from "mkdirp"; ...
              - pattern-inside: |
                  import * as $MK from "mkdirp"; ...
          - pattern-either:
              - pattern: "$MK($X, ...)"
              - patterns:
                  - pattern: "$MK.$M($X, ...)"
                  - metavariable-regex:
                      metavariable: "$M"
                      regex: "^(?:sync|native|nativeSync|manual|manualSync|mkdirpNative|mkdirpManual|mkdirpManualSync|mkdirpNativeSync|mkdirpSync)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $RM = require("rimraf"); ...
              - pattern-inside: |
                  import $RM from "rimraf"; ...
              - pattern-inside: |
                  import * as $RM from "rimraf"; ...
          - pattern-either:
              - pattern: "$RM($X, ...)"
              - patterns:
                  - pattern: "$RM.$M($X, ...)"
                  - metavariable-regex:
                      metavariable: "$M"
                      regex: "^(?:sync|native|manual|windows|moveRemove|posix|rimrafSync|nativeSync|manualSync|windowsSync|moveRemoveSync|posixSync)$"
              - patterns:
                  - pattern: "$RM.$M.sync($X, ...)"
                  - metavariable-regex:
                      metavariable: "$M"
                      regex: "^(?:native|manual|windows|moveRemove|posix)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$F($X, ...)"
          - pattern-inside: |
              import {..., $F, ...} from "make-dir"; ...
          - &f_f_make_directory
            metavariable-regex:
              metavariable: "$F"
              regex: "^(?:makeDirectory|makeDirectorySync)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$F($X, ...)"
          - pattern-inside: |
              import {..., $N as $F, ...} from "make-dir"; ...
          - metavariable-regex:
              metavariable: "$N"
              regex: "^(?:makeDirectory|makeDirectorySync)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$MD.$F($X, ...)"
          - *f_f_make_directory
          - pattern-either:
              - pattern-inside: |
                  $MD = require("make-dir"); ...
              - pattern-inside: |
                  import * as $MD from "make-dir"; ...
          - focus-metavariable: "$X"
      # open: o pacote `open` (a função padrão e `openApp`).
      - patterns:
          - "$model": "common/open-call"
          - pattern-either:
              - pattern-inside: |
                  open = require("open"); ...
              - pattern-inside: |
                  import open from "open"; ...
              - pattern-inside: |
                  import open, {...} from "open"; ...
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$O.openApp($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $O = require("open"); ...
              - pattern-inside: |
                  import $O from "open"; ...
              - pattern-inside: |
                  import $O, {...} from "open"; ...
              - pattern-inside: |
                  import * as $O from "open"; ...
              - pattern-inside: |
                  import {..., openApp, ...} from "open"; ...
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "require($X)"
          - focus-metavariable: "$X"
      # resolve: o pacote `resolve`, não o `path.resolve`.
      - patterns:
          - pattern-either:
              - pattern: "$R($X, ...)"
              - pattern: "$R.sync($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $R = require("resolve"); ...
              - pattern-inside: |
                  import $R from "resolve"; ...
              - pattern-inside: |
                  import * as $R from "resolve"; ...
          - focus-metavariable: "$X"
      # Execa: `inputFile`, `pipe*` e o `cwd`, pelos nomes que o módulo exporta.
      - patterns:
          - pattern-either:
              - pattern: "$F($C, {..., inputFile: $X, ...}, ...)"
              - pattern: "$F($C, [...], {..., inputFile: $X, ...}, ...)"
              - pattern: "$F($C, {..., cwd: $X, ...}, ...)"
              - pattern: "$F($C, [...], {..., cwd: $X, ...}, ...)"
              - pattern: "$F(...).pipeStdout($X, ...)"
              - pattern: "$F(...).pipeStderr($X, ...)"
              - pattern: "$F(...).pipeAll($X, ...)"
          - pattern-inside: |
              import {..., $F, ...} from "execa"; ...
          - metavariable-regex:
              metavariable: "$F"
              regex: "^(?:execa|execaCommand|execaCommandSync|execaSync)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$({..., inputFile: $X, ...})`...`"
          - pattern-inside: |
              import {..., $, ...} from "execa"; ...
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "$E.$F($C, {..., inputFile: $X, ...}, ...)"
              - pattern: "$E.$F($C, [...], {..., inputFile: $X, ...}, ...)"
              - pattern: "$E.$F($C, {..., cwd: $X, ...}, ...)"
              - pattern: "$E.$F($C, [...], {..., cwd: $X, ...}, ...)"
              - pattern: "$E.$F(...).pipeStdout($X, ...)"
              - pattern: "$E.$F(...).pipeStderr($X, ...)"
              - pattern: "$E.$F(...).pipeAll($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $E = require("execa"); ...
              - pattern-inside: |
                  import * as $E from "execa"; ...
              - pattern-inside: |
                  import $E from "execa"; ...
          - metavariable-regex:
              metavariable: "$F"
              regex: "^(?:execa|execaCommand|execaCommandSync|execaSync)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$E.$({..., inputFile: $X, ...})`...`"
          - pattern-either:
              - pattern-inside: |
                  $E = require("execa"); ...
              - pattern-inside: |
                  import * as $E from "execa"; ...
              - pattern-inside: |
                  import $E from "execa"; ...
          - focus-metavariable: "$X"
      # `cwd` das funções de processo do `child_process`.
      - patterns:
          - pattern-either:
              - pattern: "$CP.$F($C, {..., cwd: $X, ...}, ...)"
              - pattern: "$CP.$F($C, [...], {..., cwd: $X, ...}, ...)"
          - metavariable-regex:
              metavariable: "$F"
              regex: "^(?:exec|execSync|execFile|execFileSync|spawn|spawnSync)$"
          - pattern-either:
              - pattern-inside: |
                  $CP = require("child_process"); ...
              - pattern-inside: |
                  $CP = require("node:child_process"); ...
              - pattern-inside: |
                  import $CP from "child_process"; ...
              - pattern-inside: |
                  import $CP from "node:child_process"; ...
              - pattern-inside: |
                  import * as $CP from "child_process"; ...
              - pattern-inside: |
                  import * as $CP from "node:child_process"; ...
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "$F($C, {..., cwd: $X, ...}, ...)"
              - pattern: "$F($C, [...], {..., cwd: $X, ...}, ...)"
          - metavariable-regex:
              metavariable: "$F"
              regex: "^(?:exec|execSync|execFile|execFileSync|spawn|spawnSync)$"
          - pattern-either:
              - pattern-inside: |
                  import {..., $F, ...} from "child_process"; ...
              - pattern-inside: |
                  import {..., $F, ...} from "node:child_process"; ...
          - focus-metavariable: "$X"
      # Puppeteer: o `path` de `pdf` e `screenshot` de uma página aberta pelo navegador do módulo.
      - patterns:
          - pattern-either:
              - pattern: "$PG.screenshot({..., path: $X, ...})"
              - pattern: "$PG.pdf({..., path: $X, ...})"
          - &f_puppeteer_module
            pattern-either:
              - pattern-inside: |
                  $P = require("puppeteer"); ...
              - pattern-inside: |
                  $P = require("puppeteer-core"); ...
              - pattern-inside: |
                  import $P from "puppeteer"; ...
              - pattern-inside: |
                  import $P from "puppeteer-core"; ...
              - pattern-inside: |
                  import * as $P from "puppeteer"; ...
              - pattern-inside: |
                  import * as $P from "puppeteer-core"; ...
          - pattern-inside: |
              $B = await $P.$LAUNCH(...);
              ...
          - pattern-inside: |
              $PG = await $B.newPage();
              ...
          - metavariable-regex:
              metavariable: "$LAUNCH"
              regex: "^(?:launch|connect)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "$PGS[$I].screenshot({..., path: $X, ...})"
              - pattern: "$PGS[$I].pdf({..., path: $X, ...})"
          - *f_puppeteer_module
          - pattern-inside: |
              $B = await $P.$LAUNCH(...);
              ...
          - pattern-inside: |
              $PGS = await $B.pages();
              ...
          - metavariable-regex:
              metavariable: "$LAUNCH"
              regex: "^(?:launch|connect)$"
          - focus-metavariable: "$X"
      # Prettier: o arquivo de configuração.
      - patterns:
          - pattern-either:
              - pattern: "$PR.resolveConfig($X, ...)"
              - pattern: "$PR.resolveConfigFile($X, ...)"
              - pattern: "$PR.getFileInfo($X, ...)"
          - &f_prettier_module
            pattern-either:
              - pattern-inside: |
                  $PR = require("prettier"); ...
              - pattern-inside: |
                  import $PR from "prettier"; ...
              - pattern-inside: |
                  import * as $PR from "prettier"; ...
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$PR.resolveConfig($F, {..., config: $X, ...})"
          - *f_prettier_module
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$RP.$F({..., cwd: $X, ...})"
          - metavariable-regex:
              metavariable: "$F"
              regex: "^(?:readPackageAsync|readPackageSync)$"
          - pattern-either:
              - pattern-inside: |
                  $RP = require("read-pkg"); ...
              - pattern-inside: |
                  import $RP from "read-pkg"; ...
              - pattern-inside: |
                  import * as $RP from "read-pkg"; ...
          - focus-metavariable: "$X"
      # Express: `req.files.<nome>.mv`, `render`, `sendFile`, `sendfile` e `download` da resposta
      # de um tratador registrado no `app` ou no roteador do Express.
      - patterns:
          - pattern: "$REQ.files.$F.mv($X, ...)"
          - pattern-inside: |
              $FU = require("express-fileupload"); ...
          - &f_express_handler
            "$model": "javascript/express-route-handler"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$RES.render($X, ...)"
          - *f_express_handler
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$RES.$M($X, ...)"
          - pattern-not: "$RES.$M($X, {..., root: $R, ...}, ...)"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:sendFile|sendfile)$"
          - *f_express_handler
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$RES.download($X, ...)"
          - pattern-not: "$RES.download($X, {..., root: $R, ...}, ...)"
          - pattern-not: "$RES.download($X, $O, {..., root: $R, ...}, ...)"
          - *f_express_handler
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "$RES.sendFile($P, {..., root: $X, ...}, ...)"
              - pattern: "$RES.sendfile($P, {..., root: $X, ...}, ...)"
              - pattern: "$RES.download($P, {..., root: $X, ...}, ...)"
              - pattern: "$RES.download($P, $O, {..., root: $X, ...}, ...)"
          - *f_express_handler
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$S($R, $X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $S = require("send"); ...
              - pattern-inside: |
                  import $S from "send"; ...
          - focus-metavariable: "$X"
      - patterns:
          - pattern: 'require("send")($R, $X, ...)'
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$C($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $C = require("chownr"); ...
              - pattern-inside: |
                  import $C from "chownr"; ...
          - focus-metavariable: "$X"
    pattern-sanitizers:
      - &s_common_0
        "$model": "javascript/filename-sanitizers"
      - &s_common_1
        "$model": "javascript/parse-int-x-sanitizer"
      - &s_common_2
        "$model": "javascript/number-x-sanitizer"
      - &s_common_3
        "$model": "javascript/encode-uri-component-x-sanitizer"
      - &s_common_4
        patterns:
          - pattern: "$M.extname($X)"
          - &path_module
            "$model": javascript/path-module
      - &s_common_5
        "$model": "javascript/x-length"
      - &s_common_6
        patterns:
          - pattern: "$S($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $S = require("slugify"); ...
              - pattern-inside: |
                  import $S from "slugify"; ...
              - pattern-inside: |
                  $S = require("slug"); ...
              - pattern-inside: |
                  import $S from "slug"; ...
      # replace que tira o `/` (flag g, ou flags que não são literais): nenhum estado passa. A que só
      # tira `../` do começo passa.
      - &s_replace_slash
        patterns:
          - pattern-either:
              - "$model": javascript/global-replace-with-regex-literal
              - pattern: "$X.replace(new RegExp($RE, 'g'), ...)"
              - pattern: '$X.replace(new RegExp($RE, "g"), ...)'
              - &f_replace_new_regexp
                patterns:
                  - pattern: "$X.replace(new RegExp($RE, $F), ...)"
                  - metavariable-regex:
                      metavariable: "$F"
                      regex: '^(?!["''`])'
          - &f_re_slash_class
            metavariable-regex:
              metavariable: "$RE"
              regex: "(?s)^(?:.*\\[.*/.*\\]|[\\\"']?(?:.*[|(])?\\\\+/(?:$|[|)\\\"']))"
          - metavariable-regex:
              metavariable: "$RE"
              regex: "^(?!^\\^?\\(\\\\\\.\\\\\\.(?:\\\\/|\\[[\\\\/]+\\])\\)[+*]$)"
      # replace de `.` com flags que não são literais: nenhum estado passa.
      - &s_replace_dots_unknown_flags
        patterns:
          - *f_replace_new_regexp
          - &f_re_dot_class
            metavariable-regex:
              metavariable: "$RE"
              regex: "(?s)^(?:.*\\[[^\\]]*\\.[^\\]]*\\]|[\\\"']?(?:.*[|(])?(?:\\\\+\\.){1,2}(?:$|[|)\\\"']))"
      # `x ||= f(x)`: o lado direito só roda com `x` falso.
      - &s_falsy_assignment_rhs
        patterns:
          - pattern: "$X"
          - pattern-inside:
              patterns:
                - pattern: "$X ||= $R"
                - focus-metavariable: "$R"
      # `if (p) { p = p.replace(/[/]/g, ""); }`: o `p` que sai pelo lado em que o teste falha é vazio, e
      # o que sai do ramo é limpo.
      - &s_test_then_clean
        patterns:
          - pattern: "$X"
          - pattern-inside:
              patterns:
                - pattern-either:
                    - pattern: |
                        if ($X) {
                          ...
                          $X = $X.replace(/$RE/g, ...);
                          ...
                        }
                        $...REST
                    - pattern: |
                        if (!$X) {...} else {
                          ...
                          $X = $X.replace(/$RE/g, ...);
                          ...
                        }
                        $...REST
                - *f_re_slash_class
                - focus-metavariable: "$...REST"
      # `path.split("/")` direto como argumento: o array não é caminho (o readFile dá erro).
      - &s_split_direct
        patterns:
          - pattern: "$X.split($S)"
          - &f_s_slash_literal
            metavariable-regex:
              metavariable: "$S"
              regex: '^["''`]/["''`]$'
          - pattern-inside: "$FN(..., $X.split($S), ...)"
      # `path.split("/")[0]`: o índice fixo não leva `..`.
      - &s_split_index
        patterns:
          - pattern-either:
              - pattern: "$X.split($S)[$N]"
          - *f_s_slash_literal
          - metavariable-regex:
              metavariable: "$N"
              regex: "^[0-9]+$"
      # `partes[partes.length - 1]`: o último elemento de um split.
      - &s_split_last
        patterns:
          - pattern: "$A[$A.length - 1]"
      # Comparação com texto fixo (lista branca): bloqueia os quatro estados.
      - &g_member_eq
        patterns:
          - pattern: "$X"
          - pattern-either:
              - pattern-inside:
                  patterns:
                    - pattern: "if ($C) $T"
                    - &f_c_no_or_or_negation
                      metavariable-regex:
                        metavariable: "$C"
                        regex: "(?s)^(?!.*(?:\\|\\||!\\s*\\())"
                    - &g_member_eq_true_cond
                      metavariable-pattern:
                        metavariable: "$C"
                        patterns:
                          - pattern-either:
                              - patterns:
                                  - pattern: "$X === $L"
                                  - &f_l_quote_prefix
                                    metavariable-regex:
                                      metavariable: "$L"
                                      regex: '^["''`]'
                              - patterns:
                                  - pattern: "$X == $L"
                                  - *f_l_quote_prefix
                    - focus-metavariable: "$T"
              - pattern-inside:
                  patterns:
                    - pattern: "$C && $KR"
                    - *f_c_no_or_or_negation
                    - *g_member_eq_true_cond
                    - focus-metavariable: "$KR"
              - pattern-inside:
                  patterns:
                    - pattern: "$C ? $KT : $KE"
                    - *f_c_no_or_or_negation
                    - *g_member_eq_true_cond
                    - focus-metavariable: "$KT"
              - pattern-inside:
                  patterns:
                    - pattern: "if ($C) {...} else $E"
                    - &f_c_no_and_or_negation
                      metavariable-regex:
                        metavariable: "$C"
                        regex: "(?s)^(?!.*(?:&&|!\\s*\\())"
                    - &g_member_eq_false_cond
                      metavariable-pattern:
                        metavariable: "$C"
                        patterns:
                          - pattern-either:
                              - patterns:
                                  - pattern: "$X !== $L"
                                  - *f_l_quote_prefix
                              - patterns:
                                  - pattern: "$X != $L"
                                  - *f_l_quote_prefix
                    - focus-metavariable: "$E"
              - pattern-inside:
                  patterns:
                    - &f_if_c_rest
                      pattern: |
                        if ($C) $T
                        $...REST
                    - *f_c_no_and_or_negation
                    - &f_t_returns_or_throws
                      metavariable-regex:
                        metavariable: "$T"
                        regex: "(?s)^\\s*\\{?(?:[^{}]*[;\\n])?\\s*(?:return|throw)\\b[^{};]*;?(?:\\s*//[^\\n]*)*\\s*\\}?\\s*$"
                    - *g_member_eq_false_cond
                    - focus-metavariable: "$...REST"
      # Duas comparações com texto fixo ligadas por `||`.
      - &g_member_eq_or2
        patterns:
          - pattern: "$X"
          - pattern-either:
              - pattern-inside:
                  patterns:
                    - pattern: "if ($C) $T"
                    - &f_c_or2
                      metavariable-regex:
                        metavariable: "$C"
                        regex: "(?s)^(?!.*(?:&&|!\\s*\\())[^|]*\\|\\|[^|]*$"
                    - &g_member_eq_or2_true_cond
                      metavariable-pattern:
                        metavariable: "$C"
                        patterns:
                          - pattern-either:
                              - patterns:
                                  - pattern: "$X === $L1 || $X === $L2"
                                  - &f_l1_quote_prefix
                                    metavariable-regex:
                                      metavariable: "$L1"
                                      regex: '^["''`]'
                                  - &f_l2_quote_prefix
                                    metavariable-regex:
                                      metavariable: "$L2"
                                      regex: '^["''`]'
                              - patterns:
                                  - pattern: "$X == $L1 || $X == $L2"
                                  - *f_l1_quote_prefix
                                  - *f_l2_quote_prefix
                    - focus-metavariable: "$T"
              - pattern-inside:
                  patterns:
                    - pattern: "$C && $KR"
                    - *f_c_or2
                    - *g_member_eq_or2_true_cond
                    - focus-metavariable: "$KR"
              - pattern-inside:
                  patterns:
                    - pattern: "$C ? $KT : $KE"
                    - *f_c_or2
                    - *g_member_eq_or2_true_cond
                    - focus-metavariable: "$KT"
              - pattern-inside:
                  patterns:
                    - pattern: "if ($C) {...} else $E"
                    - &f_c_and2
                      metavariable-regex:
                        metavariable: "$C"
                        regex: "(?s)^(?!.*(?:\\|\\||!\\s*\\())[^&]*&&[^&]*$"
                    - &g_member_eq_or2_false_cond
                      metavariable-pattern:
                        metavariable: "$C"
                        patterns:
                          - pattern-either:
                              - patterns:
