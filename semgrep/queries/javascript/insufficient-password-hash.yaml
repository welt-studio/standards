rules:
  - id: welt-js-insufficient-password-hash
    languages:
      - javascript
      - typescript
    severity: WARNING
    mode: taint
    options:
      interfile: true
    message: "Senha sendo processada com hash/cifra inadequado para senhas (`createHash`, `createCipher`). Use um algoritmo lento próprio para senhas, como bcrypt, scrypt ou argon2."
    metadata:
      category: security
      cwe: "CWE-916: Use of Password Hash With Insufficient Computational Effort"
      codeql: js/insufficient-password-hash
    pattern-sources:
      - patterns:
          - pattern: "$P"
          - metavariable-regex:
              metavariable: "$P"
              regex: "(?i)^(.*\\.)?(\\w*_)?(password|passwd|pwd|passphrase)(_?\\w*)?$"
          - pattern-not: "$F(...)"
    pattern-sanitizers:
      - patterns:
          - pattern: "$P"
          - metavariable-regex:
              metavariable: "$P"
              regex: "(?i).*(hash|hashed|salt|encrypted|crypt)\\w*$"
    pattern-sinks:
      - pattern-either:
          - pattern: "$C.createHash(...).write($X)"
          - pattern: "$C.createHash(...).update($X)"
          - pattern: "$C.createCipher(...).write($X)"
          - pattern: "$C.createCipher(...).update($X)"
          - pattern: "createHash(...).update($X)"
          - pattern: "createCipher(...).update($X)"
          - pattern: "$C.createHmac(...).update($X)"
