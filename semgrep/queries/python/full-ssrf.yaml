          - pattern-either:
              - pattern: "$S.$M($A, $X, ...)"
              - pattern: "$S.$M(..., url=$X, ...)"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(request)$"
          - focus-metavariable: "$X"
      - patterns:
