rules:
  - id: welt-py-clear-text-logging-sensitive-data
    message: "Dado sensível (senha, segredo ou dado pessoal) é escrito em claro no log ou na saída padrão. Remova o dado ou mascare antes de registrar."
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-312: Cleartext Storage of Sensitive Information"
      codeql: py/clear-text-logging-sensitive-data
      notes: |-
        Dado sensível pelo nome (SensitiveDataSources.qll): parâmetro, variável atribuída, atributo,
        chave de dicionário e função com nome de senha, segredo ou dado pessoal. `id` e `certificate`
        ficam de fora, como no CodeQL.
    mode: taint
    options:
      interfile: true
      taint_assume_safe_functions: true
    pattern-sources:
      - "$model": python/sensitive-parameter-sources
    pattern-sinks:
      - patterns:
          - pattern: "$L.$M(...)"
          - metavariable-regex:
              metavariable: "$L"
              regex: "(?i)^(.*\\.)?_*(\\w*logger\\w*|logging|log|\\w*_log|get_?logger\\(.*\\)|root|\\w*logging\\.\\w+)$"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(debug|info|warning|warn|error|critical|exception|fatal|log)$"
          - pattern-either:
              - pattern: "$L.$M($X, ...)"
              - pattern: "$L.$M($Z, $X, ...)"
              - pattern: "$L.$M($Z, $Y, $X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "print(..., $X, ...)"
              - pattern: "sys.stdout.write($X)"
              - pattern: "sys.stderr.write($X)"
          - focus-metavariable: "$X"
