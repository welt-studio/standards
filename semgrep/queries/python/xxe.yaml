rules:
  - id: welt-py-xxe
    message: "Dado controlado pelo usuário é lido por um parser XML que resolve entidades externas (XXE). Desligue a resolução (`resolve_entities=False`) ou use `defusedxml`."
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-611: Improper Restriction of XML External Entity Reference"
      codeql: py/xxe
      notes: |-
        Porta do `py/xxe` (XxeCustomizations.qll + XmlParsing.vulnerableTo(XXE) de Lxml.qll e Stdlib.qll
        para xml.sax/xml.dom com feature_external_ges ligada).
        lxml sem parser explícito (o padrão resolve entidades); `HTML` fica de fora, como no CodeQL.
        lxml com parser criado antes e que não desliga resolve_entities.
        lxml com parser criado na própria chamada.
        xml.sax / xml.dom com a feature de entidades externas ligada.
    mode: taint
    options:
      interfile: true
    pattern-sources:
      - "$model": python/django-view-parameter-sources
    pattern-sanitizers:
      - pattern-either:
          - "$model": python/html-escape-sanitizers
          - pattern: "xml.sax.saxutils.escape(...)"
          - "$model": python/flask-escape
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "etree.$FN($X)"
              - pattern: "lxml.etree.$FN($X)"
          - metavariable-regex:
              metavariable: "$FN"
              regex: "^(fromstring|fromstringlist|XML|XMLID|XMLDTDID|parse|parseid|iterparse)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "etree.$FN($X, $P, ...)"
              - pattern: "etree.$FN($X, ..., parser=$P, ...)"
              - pattern: "lxml.etree.$FN($X, $P, ...)"
              - pattern: "lxml.etree.$FN($X, ..., parser=$P, ...)"
          - metavariable-regex:
              metavariable: "$FN"
              regex: "^(fromstring|fromstringlist|XML|XMLID|XMLDTDID|parse|parseid)$"
          - pattern-inside: |
              $P = $M.XMLParser(...)
              ...
          - pattern-not-inside: |
              $P = $M.XMLParser(..., resolve_entities=False, ...)
              ...
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "etree.$FN($X, ..., parser=etree.XMLParser(...), ...)"
              - pattern: "lxml.etree.$FN($X, ..., parser=lxml.etree.XMLParser(...), ...)"
          - pattern-not: "etree.$FN($X, ..., parser=etree.XMLParser(..., resolve_entities=False, ...), ...)"
          - pattern-not: "lxml.etree.$FN($X, ..., parser=lxml.etree.XMLParser(..., resolve_entities=False, ...), ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-inside: |
              $P.setFeature(xml.sax.handler.feature_external_ges, True)
              ...
          - pattern-either:
              - "$model": python/parse-call
              - pattern: "xml.dom.minidom.parse($X, $P, ...)"
              - pattern: "xml.dom.minidom.parseString($X, $P, ...)"
              - pattern: "xml.dom.pulldom.parse($X, $P, ...)"
              - pattern: "xml.dom.pulldom.parseString($X, $P, ...)"
          - focus-metavariable: "$X"
