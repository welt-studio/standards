rules:
  - id: welt-py-cookie-injection
    message: "Dado vindo da requisição monta o nome, o valor ou o cabeçalho de um cookie (cookie injection). Valide ou codifique o dado antes de gravar o cookie."
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-20: Improper Input Validation"
      codeql: py/cookie-injection
      notes: |-
        Flask/Werkzeug: atributos do `request` (Flask.qll, Werkzeug.qll).
        Parâmetros de rota (Flask, FastAPI, Starlette, Bottle...): variáveis da URL e do corpo.
        Django/DRF: parâmetros da view depois do `request` (vêm da URL).
        Tornado: argumentos e dados do RequestHandler (Tornado.qll).
    mode: taint
    options:
      interfile: true
    pattern-sources:
      - "$model": python/flask-request-sources
    pattern-sanitizers:
      - "$model": python/int-sanitizer
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "$R.set_cookie($N, ...)"
              - pattern: "$R.set_signed_cookie($N, ...)"
              - pattern: "$R.set_cookie(..., key=$N, ...)"
              - pattern: "$R.set_cookie(..., name=$N, ...)"
          - focus-metavariable: "$N"
      - patterns:
          - pattern-either:
              - pattern: "$R.set_cookie($N, $V, ...)"
              - pattern: "$R.set_signed_cookie($N, $V, ...)"
              - pattern: "$R.set_cookie(..., value=$V, ...)"
          - focus-metavariable: "$V"
      - patterns:
          - pattern-either:
              - pattern: '$R["Set-Cookie"] = $X'
              - pattern: "$R['Set-Cookie'] = $X"
              - pattern: '$R.headers["Set-Cookie"] = $X'
              - pattern: "$R.headers['Set-Cookie'] = $X"
              - pattern: '$R.headers.add("Set-Cookie", $X)'
              - pattern: "$R.cookies[$N] = $X"
          - focus-metavariable: "$X"
