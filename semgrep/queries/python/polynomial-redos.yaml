rules:
  - id: welt-py-polynomial-redos
    message: "Texto controlado pelo usuário é testado contra uma expressão regular que pode levar tempo polinomial (quadrático ou pior) em entradas longas. Limite o tamanho da entrada ou reescreva a regex sem quantificadores sobrepostos."
    severity: WARNING
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-1333: Inefficient Regular Expression Complexity"
        - "CWE-730: OWASP Top Ten 2004 Category A9 - Denial of Service"
        - "CWE-400: Uncontrolled Resource Consumption"
      codeql: py/polynomial-redos
      notes: |-
        Porta APROXIMADA do `py/polynomial-redos` (PolynomialReDoSCustomizations.qll). O CodeQL roda a análise de
        NFA (SuperlinearBackTracking) sobre a regex; o Semgrep não tem isso. Aproximação: a regex literal que
        chega à chamada tem um átomo (\s \d \w . [classe]) com quantificador ilimitado repetido depois, ou um
        quantificador ilimitado logo antes de `$`; e o texto buscado vem do cliente.
        re.<fn>(regex, texto)
        padrão compilado na mesma função e executado depois
    mode: taint
    options:
      interfile: true
    pattern-sources:
      - "$model": python/django-view-parameter-sources
    pattern-sanitizers:
      - patterns:
          - pattern-inside: |
              if $U == "...":
                ...
          - pattern: "$U"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: 're.$F("$RE", $X, ...)'
              - pattern: 're.$F(r"$RE", $X, ...)'
              - pattern: 're.$F(pattern="$RE", string=$X, ...)'
              - pattern: 're.$F("$RE", string=$X, ...)'
          - metavariable-regex:
              metavariable: "$F"
              regex: "^(match|prefixmatch|fullmatch|search|split|findall|finditer)$"
          - metavariable-regex:
              metavariable: "$RE"
              regex: "(?s).*?(?:((?:\\\\[sdwSDW]|\\.|\\[(?:\\\\.|[^\\]\\\\])+\\]))[+*].*\\1[+*]|(?:\\\\[sdwSDW]|\\.|\\[(?:\\\\.|[^\\]\\\\])+\\])[+*]\\$|(?:\\\\[sdwSDW]|\\.|\\[(?:\\\\.|[^\\]\\\\])+\\])[+*]\\)?\\$)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: 're.$F("$RE", $A, $X, ...)'
              - pattern: 're.$F(r"$RE", $A, $X, ...)'
              - pattern: 're.$F("$RE", $A, string=$X, ...)'
          - metavariable-regex:
              metavariable: "$F"
              regex: "^(sub|subn)$"
          - metavariable-regex:
              metavariable: "$RE"
              regex: "(?s).*?(?:((?:\\\\[sdwSDW]|\\.|\\[(?:\\\\.|[^\\]\\\\])+\\]))[+*].*\\1[+*]|(?:\\\\[sdwSDW]|\\.|\\[(?:\\\\.|[^\\]\\\\])+\\])[+*]\\$|(?:\\\\[sdwSDW]|\\.|\\[(?:\\\\.|[^\\]\\\\])+\\])[+*]\\)?\\$)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-inside: |
              $P = re.compile("$RE", ...)
              ...
          - pattern-either:
              - pattern: "$P.$F($X, ...)"
              - pattern: "$P.$F(string=$X, ...)"
              - pattern: "$P.$F($A, $X, ...)"
          - metavariable-regex:
              metavariable: "$F"
              regex: "^(match|prefixmatch|fullmatch|search|split|findall|finditer|sub|subn)$"
          - metavariable-regex:
              metavariable: "$RE"
              regex: "(?s).*?(?:((?:\\\\[sdwSDW]|\\.|\\[(?:\\\\.|[^\\]\\\\])+\\]))[+*].*\\1[+*]|(?:\\\\[sdwSDW]|\\.|\\[(?:\\\\.|[^\\]\\\\])+\\])[+*]\\$|(?:\\\\[sdwSDW]|\\.|\\[(?:\\\\.|[^\\]\\\\])+\\])[+*]\\)?\\$)"
          - focus-metavariable: "$X"
