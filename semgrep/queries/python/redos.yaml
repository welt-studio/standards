rules:
  - id: welt-py-redos
    message: "A expressão regular tem repetição aninhada ou alternância repetida que pode causar backtracking exponencial (ReDoS) em entradas longas. Reescreva sem sobreposição entre os ramos ou limite o tamanho da entrada."
    severity: WARNING
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-1333: Inefficient Regular Expression Complexity"
        - "CWE-730: OWASP Top Ten 2004 Category A9 - Denial of Service"
        - "CWE-400: Uncontrolled Resource Consumption"
      codeql: py/redos
      notes: |-
        Porta APROXIMADA do `py/redos` (ReDoS.ql). O CodeQL decide por análise do autômato da regex
        (ExponentialBackTracking); o Semgrep só enxerga o texto. Duas heurísticas sobre a regex literal passada ao
        módulo `re`: (1) grupo repetido que contém um quantificador (`(a+)+`, `(?:.*,)*`); (2) grupo repetido com
        alternância (`(a|aa?)*`, `(\d|\w)*`). Perde casos em que a regex é montada por concatenação ou fica em
        variável, e acerta a mais alternâncias que não se sobrepõem.
    patterns:
      - pattern-either:
          - pattern: 're.$F("$RE", ...)'
          - pattern: 're.$F(r"$RE", ...)'
          - pattern: 're.$F(pattern="$RE", ...)'
      - metavariable-regex:
          metavariable: "$F"
          regex: "^(compile|match|prefixmatch|fullmatch|search|split|findall|finditer|sub|subn)$"
      - metavariable-regex:
          metavariable: "$RE"
          regex: "(?s).*?(?:\\((?:\\?[:=!])?\\(?(?:\\\\.|\\[(?:\\\\.|[^\\]\\\\])*\\]|[^()\\\\\\[\\]|+*?{}^$])\\)?(?:[+*]|\\{\\d*,\\d*\\})\\??(?:[^()\\\\\\[]|\\\\.|\\[(?:\\\\.|[^\\]\\\\])*\\])*\\)(?:[+*]|\\{\\d+,\\d*\\})|\\((?:\\?:)?(?:[^()|\\\\\\[]|\\\\.|\\[(?:\\\\.|[^\\]\\\\])*\\])*\\|(?:[^()\\\\\\[]|\\\\.|\\[(?:\\\\.|[^\\]\\\\])*\\])*\\)(?:[+*]|\\{\\d+,\\d*\\}))"
