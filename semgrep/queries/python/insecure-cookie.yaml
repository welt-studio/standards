rules:
  - id: welt-py-insecure-cookie
    message: "Cookie sensível enviado na resposta sem o atributo `secure`; o navegador pode transmiti-lo por HTTP em claro."
    severity: WARNING
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"
      codeql: py/insecure-cookie
      notes: |-
        Porta do `py/insecure-cookie` (CookieWrite de Concepts.qll + modelos Flask.qll, Django.qll, Aiohttp.qll).
        Sensível = nome do cookie pelo regex de SensitiveDataHeuristics.qll (notSensitive incluído).
    patterns:
      - pattern-either:
          - patterns:
              - "$model": python/set-cookie-name-calls
              - pattern-not: "$R.set_cookie(..., secure=$S, ...)"
              - "$model": python/set-cookie-without-kwargs
          - patterns:
              - "$model": python/set-cookie-name-calls
              - pattern: "$R.set_cookie(..., secure=False, ...)"
      - metavariable-regex:
          metavariable: "$NAME"
          regex:
            "$text": python/sensitive-names
