rules:
  - id: welt-py-regex-injection
    message: "A expressão regular é montada com dado controlado pelo usuário (injeção de regex / ReDoS). Escape o valor com `re.escape` antes de usá-lo."
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-730: OWASP Top Ten 2004 Category A9 - Denial of Service"
        - "CWE-400: Uncontrolled Resource Consumption"
      codeql: py/regex-injection
      notes: |-
        Porta do `py/regex-injection` (RegexInjectionCustomizations.qll + RegexExecution de Stdlib.qll:
        funções do módulo `re` que executam a expressão na hora, e `re.compile`). Saneador: `re.escape`.
    mode: taint
    options:
      interfile: true
    pattern-sources:
      - "$model": python/django-view-parameter-sources
    pattern-sanitizers:
      - pattern: "re.escape(...)"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "re.$M($X, ...)"
              - pattern: "re.$M(pattern=$X, ...)"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(match|prefixmatch|fullmatch|search|split|findall|finditer|sub|subn|compile)$"
          - focus-metavariable: "$X"
