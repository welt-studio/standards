rules:
  - id: welt-py-http-response-splitting
    message: "Dado vindo da requisição chega a um cabeçalho da resposta HTTP sem remover quebras de linha (header injection / response splitting)."
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-113: Improper Neutralization of CRLF Sequences in HTTP Headers ('HTTP Response Splitting')"
      codeql: py/http-response-splitting
      notes: |-
        Flask/Werkzeug: atributos do `request` (Flask.qll, Werkzeug.qll).
        Parâmetros de rota (Flask, FastAPI, Starlette, Bottle...): variáveis da URL e do corpo.
        Django/DRF: parâmetros da view depois do `request` (vêm da URL).
        Tornado: argumentos e dados do RequestHandler (Tornado.qll).
        http.server: cabeçalhos e caminho da requisição (Stdlib.qll, BaseHTTPRequestHandler).
        WSGI: o `environ` da aplicação.
        Remover \r e \n do valor.
        Flask / Werkzeug: o nome do cabeçalho (o valor é rejeitado pelo framework).
        http.server.
        WSGI: start_response(status, headers).
    mode: taint
    options:
      interfile: true
    pattern-sources:
      - "$model": python/flask-request-sources
      - pattern: self.headers
      - pattern: self.path
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  def $APP(environ, start_response):
                    ...
              - pattern-inside: |
                  def $APP(self, environ, start_response):
                    ...
          - pattern: environ
    pattern-sanitizers:
      - patterns:
          - pattern: "$X.replace(\"\\n\", ...)"
      - patterns:
          - pattern: "$X.replace(\"\\r\", ...)"
      - "$model": python/int-sanitizer
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "$H.add($N, ...)"
              - pattern: "$H.add_header($N, ...)"
              - pattern: "$H.set($N, ...)"
              - pattern: "$H.setdefault($N, ...)"
          - pattern-either:
              - "$model": python/flask-from-import
              - pattern-inside: |
                  from werkzeug.datastructures import $X
                  ...
              - "$model": python/inside-import-flask
              - pattern-inside: |
                  import werkzeug
                  ...
          - focus-metavariable: "$N"
      - patterns:
          - pattern-either:
              - pattern: "make_response($B, {$N: $V}, ...)"
              - pattern: "flask.make_response($B, {$N: $V}, ...)"
              - pattern: "$R.headers.extend($N)"
              - pattern: "$R.headers.update($N)"
              - pattern: "$R.headers[$N] = $V"
              - pattern: "$R[$N] = $V"
          - focus-metavariable: "$N"
      - patterns:
          - pattern-either:
              - pattern: "$S.send_header($N, $V)"
              - pattern: "$S.send_header($N, $V, ...)"
          - focus-metavariable: "$N"
      - patterns:
          - pattern: "$S.send_header($N, $V)"
          - focus-metavariable: "$V"
      - patterns:
          - pattern-either:
              - pattern: "$S.extra_response_headers = $X"
              - pattern: "$C(..., extra_response_headers=$X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "start_response($ST, $X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$S.setHeader($N, $V)"
          - focus-metavariable: "$N"
      - patterns:
          - pattern: "$S.setHeader($N, $V)"
          - focus-metavariable: "$V"
