rules:
  - id: welt-py-http-response-splitting
    message: "Dado vindo da requisição chega a um cabeçalho da resposta HTTP sem remover quebras de linha (header injection / response splitting)."
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-113: Improper Neutralization of CRLF Sequences in HTTP Headers ('HTTP Response Splitting')"
      codeql: py/http-response-splitting
      notes: |-
        Flask/Werkzeug: atributos do `request` (Flask.qll, Werkzeug.qll).
        Parâmetros de rota (Flask, FastAPI, Starlette, Bottle...): variáveis da URL e do corpo.
        Django/DRF: parâmetros da view depois do `request` (vêm da URL).
        Tornado: argumentos e dados do RequestHandler (Tornado.qll).
        http.server: cabeçalhos e caminho da requisição (Stdlib.qll, BaseHTTPRequestHandler).
        WSGI: o `environ` da aplicação.
        Remover \n do valor (ReplaceLineBreaksSanitizer, HttpHeaderInjectionCustomizations.qll).
        Flask / Werkzeug: só o NOME do cabeçalho (o valor é rejeitado pelo framework).
        http.server: o nome e o valor.
        WSGI: start_response(status, headers).
        Django, FastAPI, Tornado, Bottle e Aiohttp não têm sumidouro: rejeitam quebra de linha.
    mode: taint
    options:
      interfile: true
    pattern-sources:
      - "$model": python/flask-request-sources
      # Cabeçalhos e caminho da requisição só na subclasse de BaseHTTPRequestHandler
      # (SelfParam e AdditionalTaintStep do Stdlib.qll).
      - patterns:
          - pattern-either:
              - pattern: self.headers
              - pattern: self.path
          - pattern-either:
              - pattern-inside: |
                  class $C(http.server.BaseHTTPRequestHandler):
                    ...
              - pattern-inside: |
                  class $C(http.server.SimpleHTTPRequestHandler):
                    ...
              - pattern-inside: |
                  class $C(http.server.CGIHTTPRequestHandler):
                    ...
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  def $APP(environ, start_response):
                    ...
              - pattern-inside: |
                  def $APP(self, environ, start_response):
                    ...
          - pattern: environ
    pattern-sanitizers:
      # Só o `\n`: o CodeQL só reconhece `replace("\n", ...)` (ReplaceLineBreaksSanitizer).
      - patterns:
          - pattern: "$X.replace(\"\\n\", ...)"
      - "$model": python/int-sanitizer
    pattern-sinks:
      # Werkzeug (Headers.add/add_header/set/setdefault) pelo `headers` da resposta: só o nome.
      - patterns:
          - pattern: "$R.headers.$M($N, ...)"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(add|add_header|set|setdefault)$"
          - pattern-either:
              - "$model": python/flask-from-import
              - pattern-inside: |
                  from werkzeug.datastructures import $X
                  ...
              - "$model": python/inside-import-flask
              - pattern-inside: |
                  import werkzeug
                  ...
          - focus-metavariable: "$N"
      - patterns:
          - pattern-inside: |
              $H = werkzeug.datastructures.Headers(...)
              ...
          - pattern: "$H.$M($N, ...)"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(add|add_header|set|setdefault)$"
          - focus-metavariable: "$N"
      # `response.headers[nome] = valor` e `response.headers.extend(...)` (Werkzeug.qll).
      - patterns:
          - pattern-either:
              - pattern: "$R.headers[$N] = $V"
              - pattern: "$R.headers.extend($N)"
          - pattern-either:
              - "$model": python/flask-from-import
              - pattern-inside: |
                  from werkzeug.datastructures import $X
                  ...
              - "$model": python/inside-import-flask
              - pattern-inside: |
                  import werkzeug
                  ...
          - focus-metavariable: "$N"
      # Flask: os cabeçalhos de `make_response` e `Response` (o 3º argumento, o 2º quando só há dois,
      # ou `headers=`), em dicionário ou lista de pares escritos na chamada.
      - patterns:
          - pattern-either:
              - pattern: "flask.make_response($B, {$N: $V, ...})"
              - pattern: "flask.make_response($B, [($N, $V), ...])"
              - pattern: "flask.make_response($B, $S, {$N: $V, ...}, ...)"
              - pattern: "flask.make_response($B, $S, [($N, $V), ...], ...)"
              - pattern: "flask.make_response(..., headers={$N: $V, ...}, ...)"
              - pattern: "flask.make_response(..., headers=[($N, $V), ...], ...)"
              - pattern: "flask.Response($B, $S, {$N: $V, ...}, ...)"
              - pattern: "flask.Response($B, $S, [($N, $V), ...], ...)"
              - pattern: "flask.Response(..., headers={$N: $V, ...}, ...)"
              - pattern: "flask.Response(..., headers=[($N, $V), ...], ...)"
          - focus-metavariable: "$N"
      # http.server: `send_header` escreve o nome e o valor, na subclasse de BaseHTTPRequestHandler.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $C(http.server.BaseHTTPRequestHandler):
                    ...
              - pattern-inside: |
                  class $C(http.server.SimpleHTTPRequestHandler):
                    ...
              - pattern-inside: |
                  class $C(http.server.CGIHTTPRequestHandler):
                    ...
          - pattern: "self.send_header($N, $V)"
          - focus-metavariable: "$N"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $C(http.server.BaseHTTPRequestHandler):
                    ...
              - pattern-inside: |
                  class $C(http.server.SimpleHTTPRequestHandler):
                    ...
              - pattern-inside: |
                  class $C(http.server.CGIHTTPRequestHandler):
                    ...
          - pattern: "self.send_header($N, $V)"
          - focus-metavariable: "$V"
      # `extra_response_headers` só é lido pelo SimpleHTTPRequestHandler (e pelo CGI, que o herda).
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $C(http.server.SimpleHTTPRequestHandler):
                    ...
              - pattern-inside: |
                  class $C(http.server.CGIHTTPRequestHandler):
                    ...
          - pattern: "$S.extra_response_headers = $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "http.server.SimpleHTTPRequestHandler(..., extra_response_headers=$X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "start_response($ST, $X, ...)"
          - focus-metavariable: "$X"
