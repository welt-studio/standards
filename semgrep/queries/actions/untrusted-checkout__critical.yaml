rules:
  - id: welt-actions-untrusted-checkout-critical
    message: "Checkout do código de um pull request (ou comentário) não confiável num workflow privilegiado, seguido de um passo que executa esse código (instalação de dependências, scripts, action local). Quem abre o PR executa código com o token e os segredos do workflow. Use `pull_request` em vez de `pull_request_target`, ou separe a execução do código num workflow sem privilégios."
    severity: ERROR
    languages:
      - yaml
    metadata:
      category: security
      cwe: "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      codeql: actions/untrusted-checkout/critical
      confidence: MEDIUM
      technology:
        - github-actions
      notes: "Job sem privilégio: permissões só de leitura e sem segredos (hasExplicitSecretAccess)."
    paths:
      include:
        - "*.yml"
        - "*.yaml"
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside:
                  pattern-regex:
                    "$text": actions/workflow-on-pull-request-target-regex
