rules:
  - id: welt-actions-cache-poisoning-direct-cache
    message: "O job baixa código ou artefato não confiável (checkout do HEAD de um PR, ref vinda de input) e depois grava no cache do branch padrão. O conteúdo envenenado volta em builds privilegiados. Não grave cache num job que processa código externo, ou use uma chave de cache exclusiva do job."
    severity: ERROR
    languages:
      - yaml
    metadata:
      category: security
      cwe: "CWE-349: Acceptance of Extraneous Untrusted Data With Trusted Data"
      codeql: actions/cache-poisoning/direct-cache
      confidence: MEDIUM
      technology:
        - github-actions
    paths:
      include:
        - "*.yml"
        - "*.yaml"
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside:
                  pattern-regex:
                    "$text": actions/workflow-on-workflow-dispatch-regex
              - pattern-either:
                  - patterns:
                      - "$model": actions/uses-step
                      - metavariable-regex:
                          metavariable: "$U"
                          regex: "^actions/cache(?:/save)?@"
                  - patterns:
                      - pattern: |
                          - uses: $U
                            with:
                              ...
                              bundler-cache: true
                              ...
                            ...
                      - metavariable-regex:
                          metavariable: "$U"
                          regex: "^(?:actions|ruby)/setup-ruby@"
              - "$model": actions/job-with-steps
