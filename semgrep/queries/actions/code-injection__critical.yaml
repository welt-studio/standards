                      - "$model": actions/run-key
                      - metavariable-regex:
                          metavariable: "$S"
                          regex:
                            "$text": actions/github-expression-discussion-comment-changes
                  - patterns:
                      - "$model": actions/github-script-step-script
                      - metavariable-regex:
                          metavariable: "$S"
                          regex: "(?is)^(?!.*\\btojson\\().*?\\$\\{\\{(?:\\s*(?:github\\.event\\.discussion\\.title|github\\.event\\.changes\\.title\\.from|github\\.event\\.discussion\\.body|github\\.event\\.comment\\.body|github\\.event\\.changes\\.body\\.from|github\\.event\\.changes\\.head\\.ref\\.from)\\b|(?:(?!\\}\\}).)*?(?:from|to)json\\(\\s*(?:github\\.event\\.comment|github\\.event\\.discussion|github\\.event\\.changes|github\\.event)\\s*\\))(?:(?!\\}\\}).)*\\}\\}"
              - pattern-not-inside:
