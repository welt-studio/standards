rules:
  - id: welt-actions-code-injection-critical
    message: 'Entrada controlada por terceiros (título, corpo, branch etc.) é interpolada direto no script do passo num workflow privilegiado, o que permite injeção de código. Passe o valor por `env:` e use a variável do shell ("$VAR") em vez de `${{ ... }}` dentro do `run:`.'
    severity: ERROR
    languages:
      - yaml
    metadata:
      category: security
      cwe: "CWE-094: Improper Control of Generation of Code"
      codeql: actions/code-injection/critical
      confidence: MEDIUM
      technology:
        - github-actions
    paths:
      include:
        - "*.yml"
        - "*.yaml"
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside:
                  pattern-regex:
                    "$text": actions/workflow-on-discussion-regex
              - pattern-either:
                  - patterns:
                      - "$model": actions/run-key
                      - metavariable-regex:
                          metavariable: "$S"
                          regex:
                            "$text": actions/github-expression-discussion-changes
                  - patterns:
                      - "$model": actions/github-script-step-script
                      - metavariable-regex:
                          metavariable: "$S"
                          regex: "(?is)^(?!.*\\btojson\\().*?\\$\\{\\{(?:\\s*(?:github\\.event\\.discussion\\.title|github\\.event\\.changes\\.title\\.from|github\\.event\\.discussion\\.body|github\\.event\\.changes\\.body\\.from|github\\.event\\.changes\\.head\\.ref\\.from)\\b|(?:(?!\\}\\}).)*?(?:from|to)json\\(\\s*(?:github\\.event\\.discussion|github\\.event\\.changes|github\\.event)\\s*\\))(?:(?!\\}\\}).)*\\}\\}"
              - pattern-not-inside:
                  patterns:
                    - pattern: |
                        $KEY:
                          ...
                          if: $COND
                          ...
                    - metavariable-regex:
                        metavariable: "$COND"
                        regex:
                          "$text": actions/actor-condition-label-regex
              - pattern-not-inside:
