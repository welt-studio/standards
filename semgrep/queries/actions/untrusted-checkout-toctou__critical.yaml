rules:
  - id: welt-actions-untrusted-checkout-toctou-critical
    message: "A verificação de acesso antes do checkout (environment ou comentário autorizado) não cobre mudanças feitas no PR depois dela (TOCTOU), e o código baixado é executado em seguida num workflow privilegiado. Faça o checkout de um SHA fixo (o `head.sha` registrado na aprovação) e confira a data do commit contra a do comentário."
    severity: ERROR
    languages:
      - yaml
    metadata:
      category: security
      cwe: "CWE-367: Time-of-check Time-of-use (TOCTOU) Race Condition"
      codeql: actions/untrusted-checkout-toctou/critical
      confidence: MEDIUM
      technology:
        - github-actions
      notes: "Job sem privilégio: permissões só de leitura e sem segredos (hasExplicitSecretAccess)."
    paths:
      include:
        - "*.yml"
        - "*.yaml"
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside:
                  pattern-regex:
                    "$text": actions/workflow-on-pull-request-target-regex
              - "$model": actions/job-with-environment
              - pattern-not-inside:
                  patterns:
                    - pattern: |
                        $KEY:
                          ...
                          if: $COND
                          ...
                    - metavariable-regex:
                        metavariable: "$COND"
                        regex:
                          "$text": actions/actor-condition-pr-head-repository-regex
              - pattern-not-inside:
                  patterns:
                    - pattern: |
                        - ...
                          if: $COND
                          ...
                    - metavariable-regex:
                        metavariable: "$COND"
                        regex:
                          "$text": actions/actor-condition-pr-head-repository-regex
              - "$model": actions/job-with-needs-exclusion
              - "$model": actions/run-step-build-tool-commands
              - "$model": actions/job-with-steps
