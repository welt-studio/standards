rules:
  - id: welt-actions-secrets-in-artifacts
    message: "O upload-artifact em versão afetada (v4.0.0 a v4.3.6) envia a pasta do checkout com o token do GITHUB_TOKEN gravado em .git/config. Use persist-credentials: false no checkout, envie só os arquivos necessários e atualize o upload-artifact."
    severity: ERROR
    languages:
      - yaml
    metadata:
      category: security
      cwe: "CWE-312: Cleartext Storage of Sensitive Information"
      codeql: actions/secrets-in-artifacts
      confidence: MEDIUM
      technology:
        - github-actions
    paths:
      include:
        - "*.yml"
        - "*.yaml"
    pattern-regex: "(?ms)(?:^(?<i>[ \\t]*)-[ \\t](?=(?:(?!\\n(?!\\k<i>[ \\t]|[ \\t]*\\n)).)*?uses:[ \\t]*[\"\\']?actions/checkout@)(?!(?:(?!\\n(?!\\k<i>[ \\t]|[ \\t]*\\n)).)*?persist-credentials:[ \\t]*[\"\\']?false)(?!(?:(?!\\n(?!\\k<i>[ \\t]|[ \\t]*\\n)).)*?\\bpath:)(?:(?!\\n[ \\t]*runs-on:).)*?^(?<j>[ \\t]*)-[ \\t](?=(?:(?!\\n(?!\\k<j>[ \\t]|[ \\t]*\\n)).)*?uses:[ \\t]*[\"\\']?actions/upload-artifact@(?:v4\\.3\\.6|834a144ee995460fba8ed112a2fc961b36a5ec5a|v4\\.3\\.5|89ef406dd8d7e03cfd12d9e0a4a378f454709029|v4\\.3\\.4|0b2256b8c012f0828dc542b3febcab082c67f72b|v4\\.3\\.3|65462800fd760344b1a7b4382951275a0abb4808|v4\\.3\\.2|1746f4ab65b179e0ea60a494b83293b640dd5bba|v4\\.3\\.1|5d5d22a31266ced268874388b861e4b58bb5c2f3|v4\\.3\\.0|26f96dfa697d77e81fd5907df203aa23a56210a8|v4\\.2\\.0|694cdabd8bdb0f10b2cea11669e1bf5453eed0a6|v4\\.1\\.0|1eb3cb2b3e0f29609092a73eb033bb759a334595|v4\\.0\\.0|c7d193f32edcb7bfad88892161225aeda64e9392)\\b)(?=(?:(?!\\n(?!\\k<j>[ \\t]|[ \\t]*\\n)).)*?\\bpath:[ \\t]*[\"\\']?(?:\\.|\\*)[\"\\']?[ \\t]*(?:#[^\\n]*)?(?:\\n|\\Z)))|(?:^(?<k>[ \\t]*)-[ \\t](?=(?:(?!\\n(?!\\k<k>[ \\t]|[ \\t]*\\n)).)*?uses:[ \\t]*[\"\\']?actions/checkout@)(?!(?:(?!\\n(?!\\k<k>[ \\t]|[ \\t]*\\n)).)*?persist-credentials:[ \\t]*[\"\\']?false)(?=(?:(?!\\n(?!\\k<k>[ \\t]|[ \\t]*\\n)).)*?\\bpath:[ \\t]*[\"\\']?(?<p>[^\\s\"\\'#]+))(?:(?!\\n[ \\t]*runs-on:).)*?^(?<l>[ \\t]*)-[ \\t](?=(?:(?!\\n(?!\\k<l>[ \\t]|[ \\t]*\\n)).)*?uses:[ \\t]*[\"\\']?actions/upload-artifact@(?:v4\\.3\\.6|834a144ee995460fba8ed112a2fc961b36a5ec5a|v4\\.3\\.5|89ef406dd8d7e03cfd12d9e0a4a378f454709029|v4\\.3\\.4|0b2256b8c012f0828dc542b3febcab082c67f72b|v4\\.3\\.3|65462800fd760344b1a7b4382951275a0abb4808|v4\\.3\\.2|1746f4ab65b179e0ea60a494b83293b640dd5bba|v4\\.3\\.1|5d5d22a31266ced268874388b861e4b58bb5c2f3|v4\\.3\\.0|26f96dfa697d77e81fd5907df203aa23a56210a8|v4\\.2\\.0|694cdabd8bdb0f10b2cea11669e1bf5453eed0a6|v4\\.1\\.0|1eb3cb2b3e0f29609092a73eb033bb759a334595|v4\\.0\\.0|c7d193f32edcb7bfad88892161225aeda64e9392)\\b)(?=(?:(?!\\n(?!\\k<l>[ \\t]|[ \\t]*\\n)).)*?\\bpath:[ \\t]*[\"\\']?\\k<p>(?:/\\*)?[\"\\']?[ \\t]*(?:#[^\\n]*)?(?:\\n|\\Z)))"
