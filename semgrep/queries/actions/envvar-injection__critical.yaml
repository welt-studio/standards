                          regex: "(?is)^(?=.*\\$\\{?(?!GITHUB_ENV\\b|GITHUB_PATH\\b|GITHUB_OUTPUT\\b|GITHUB_STATE\\b)[A-Za-z_]\\w*)(?=.*(?:>>?[ \\t]*[\\\"']?\\$\\{?GITHUB_ENV\\b|tee[^\\n]*GITHUB_ENV\\b|::set-env)).*"
              - pattern-not-inside:
                  patterns:
                    - pattern: |
                        $KEY:
                          ...
                          if: $COND
                          ...
                    - metavariable-regex:
                        metavariable: "$COND"
