rules:
  - id: welt-actions-excessive-secrets-exposure
    message: "Todos os segredos do repositório e da organização são passados ao runner (toJSON(secrets) ou secrets[expressão dinâmica]). Referencie só os segredos necessários, pelo nome fixo, por exemplo secrets.NOME."
    severity: WARNING
    languages:
      - yaml
    metadata:
      category: security
      cwe: "CWE-312: Cleartext Storage of Sensitive Information"
      codeql: actions/excessive-secrets-exposure
      confidence: HIGH
      technology:
        - github-actions
    paths:
      include:
        - "*.yml"
        - "*.yaml"
    pattern-either:
      - pattern-regex: "(?i)\\$\\{\\{(?:(?!\\}\\}).)*?\\btojson\\(\\s*secrets\\b(?:(?!\\}\\}).)*\\}\\}"
      - pattern-regex: "\\$\\{\\{\\s*secrets\\[(?!\\s*['\"])(?:(?!\\}\\}).)*\\}\\}"
