rules:
  - id: welt-actions-cache-poisoning-poisonable-step
    message: "O job faz checkout de código não confiável (ref vinda de input ou do PR) e executa um passo que roda esse código (instalação de dependências, script, action local). O passo pode vazar o token do cache e envenenar o cache do branch padrão. Faça checkout só de refs confiáveis (SHA validado) nos jobs que usam cache."
    severity: ERROR
    languages:
      - yaml
    metadata:
      category: security
      cwe: "CWE-349: Acceptance of Extraneous Untrusted Data With Trusted Data"
      codeql: actions/cache-poisoning/poisonable-step
      confidence: MEDIUM
      technology:
        - github-actions
    paths:
      include:
        - "*.yml"
        - "*.yaml"
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside:
