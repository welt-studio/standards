                          - uses: $U
                            with:
                              ...
                              run-id: $RUN
                              ...
                            ...
                      - metavariable-regex:
                          metavariable: "$U"
                          regex: "^actions/download-artifact@"
                      - metavariable-regex:
                          metavariable: "$RUN"
                          regex: "(?is)^.*github\\.event\\.workflow_run\\.id"
                  - patterns:
                      - "$model": actions/uses-step
                      - metavariable-regex:
                          metavariable: "$U"
                          regex: "^(?:dawidd6/action\\-download\\-artifact|marcofaggian/action\\-download\\-multiple\\-artifacts|benday\\-inc/download\\-latest\\-artifact|blablacar/action\\-download\\-last\\-artifact|levonet/action\\-download\\-last\\-artifact|bettermarks/action\\-artifact\\-download|aochmann/actions\\-download\\-artifact|cytopia/download\\-artifact\\-retry\\-action|alextompkins/download\\-prior\\-artifact|nmerget/download\\-gzip\\-artifact|benday\\-inc/download\\-artifact|synergy\\-au/download\\-workflow\\-artifacts\\-action|ishworkh/docker\\-image\\-artifact\\-download|ishworkh/container\\-image\\-artifact\\-download|sidx1024/action\\-download\\-artifact|hyperskill/azblob\\-download\\-artifact|ma\\-ve/action\\-download\\-artifact\\-with\\-retry|Legit\\-Labs/action\\-download\\-artifact)@"
                      - pattern-not: |
                          - uses: $U
                            with:
                              ...
                              branch: $B
                              ...
                            ...
                      - pattern-not: |
                          - uses: $U
                            with:
                              ...
                              event: pull_request
                              ...
                            ...
                  - patterns:
                      - pattern: |
                          - uses: $U
                            with:
                              ...
                              script: $JS
                              ...
                            ...
                      - metavariable-regex:
                          metavariable: "$U"
                          regex:
                            "$text": actions/github-script-action-ref
                      - metavariable-regex:
                          metavariable: "$JS"
                          regex: "(?is)^(?!.*exclude_pull_requests:\\s*true)(?=.*listWorkflowRunArtifacts\\().*downloadArtifact\\(.*"
