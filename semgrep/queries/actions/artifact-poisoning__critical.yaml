rules:
  - id: welt-actions-artifact-poisoning-critical
    message: "O artefato baixado de outro workflow (`workflow_run`, `gh run download` etc.) é produzido por código do PR e pode ter qualquer conteúdo; um passo seguinte que o executa (scripts, `npm install`, action local) roda com os privilégios deste workflow. Extraia o artefato num diretório temporário e trate o conteúdo como dado."
    severity: ERROR
    languages:
      - yaml
    metadata:
      category: security
      cwe: "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      codeql: actions/artifact-poisoning/critical
      confidence: MEDIUM
      technology:
        - github-actions
      notes: |-
        download em diretório temporário não conta (isSubpath com o caminho do passo seguinte)
        download em diretório temporário não conta (isSubpath com o caminho do passo seguinte)
        download em diretório temporário não conta (isSubpath com o caminho do passo seguinte)
        download em diretório temporário não conta (isSubpath com o caminho do passo seguinte)
        Job sem privilégio: permissões só de leitura e sem segredos (hasExplicitSecretAccess).
    paths:
      include:
        - "*.yml"
        - "*.yaml"
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside:
                  pattern-regex:
                    "$text": actions/workflow-on-workflow-run-without-branches-regex
