rules:
  - id: welt-actions-envpath-injection-critical
    message: "Entrada controlada por terceiros chega ao `$GITHUB_PATH` num workflow privilegiado: o diretório injetado passa a ter prioridade na busca de executáveis dos passos seguintes. Não grave valores de PR ou artefato no PATH; use um caminho fixo."
    severity: ERROR
    languages:
      - yaml
    metadata:
      category: security
      cwe: "CWE-077: Improper Neutralization of Special Elements used in a Command"
      codeql: actions/envpath-injection/critical
      confidence: MEDIUM
      technology:
        - github-actions
      notes: |-
        --- discussion: variável de ambiente com entrada de terceiros que chega ao arquivo de ambiente
        --- discussion_comment: variável de ambiente com entrada de terceiros que chega ao arquivo de ambiente
        --- issues: variável de ambiente com entrada de terceiros que chega ao arquivo de ambiente
        --- issue_comment: variável de ambiente com entrada de terceiros que chega ao arquivo de ambiente
        --- pull_request_comment: variável de ambiente com entrada de terceiros que chega ao arquivo de ambiente
        --- pull_request_review: variável de ambiente com entrada de terceiros que chega ao arquivo de ambiente
        --- pull_request_review_comment: variável de ambiente com entrada de terceiros que chega ao arquivo de ambiente
        --- pull_request_target: variável de ambiente com entrada de terceiros que chega ao arquivo de ambiente
        --- workflow_run: variável de ambiente com entrada de terceiros que chega ao arquivo de ambiente
        --- workflow_call: variável de ambiente com entrada de terceiros que chega ao arquivo de ambiente
        --- discussion: arquivo de artefato ou checkout não confiável lido e gravado no arquivo de ambiente
        --- discussion_comment: arquivo de artefato ou checkout não confiável lido e gravado no arquivo de ambiente
        --- issues: arquivo de artefato ou checkout não confiável lido e gravado no arquivo de ambiente
        --- issue_comment: arquivo de artefato ou checkout não confiável lido e gravado no arquivo de ambiente
        --- pull_request_comment: arquivo de artefato ou checkout não confiável lido e gravado no arquivo de ambiente
        --- pull_request_review: arquivo de artefato ou checkout não confiável lido e gravado no arquivo de ambiente
        --- pull_request_review_comment: arquivo de artefato ou checkout não confiável lido e gravado no arquivo de ambiente
        --- pull_request_target: arquivo de artefato ou checkout não confiável lido e gravado no arquivo de ambiente
        --- workflow_run: arquivo de artefato ou checkout não confiável lido e gravado no arquivo de ambiente
        --- workflow_call: arquivo de artefato ou checkout não confiável lido e gravado no arquivo de ambiente
        Job sem privilégio: permissões só de leitura e sem segredos (hasExplicitSecretAccess).
