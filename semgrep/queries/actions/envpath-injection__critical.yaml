      include:
        - "*.yml"
        - "*.yaml"
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside:
                  pattern-regex:
                    "$text": actions/workflow-on-discussion-regex
              - pattern-either:
                  - patterns:
                      - "$model": actions/step-env-and-run
                      - metavariable-regex:
                          metavariable: "$V"
                          regex:
                            "$text": actions/github-expression-discussion-changes
                      - metavariable-regex:
                          metavariable: "$S"
                          regex: "(?is)^(?=.*\\$\\{?(?!GITHUB_ENV\\b|GITHUB_PATH\\b|GITHUB_OUTPUT\\b|GITHUB_STATE\\b)[A-Za-z_]\\w*)(?=.*(?:>>?[ \\t]*[\\\"']?\\$\\{?GITHUB_PATH\\b|tee[^\\n]*GITHUB_PATH\\b|::add-path::)).*"
