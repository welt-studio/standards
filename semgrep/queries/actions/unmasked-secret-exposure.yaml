rules:
  - id: welt-actions-unmasked-secret-exposure
    message: "Um segredo derivado de outro com fromJson(secrets.X).campo não é mascarado nos logs e pode vazar. Guarde cada valor como um segredo próprio."
    severity: WARNING
    languages:
      - yaml
    metadata:
      category: security
      cwe: "CWE-312: Cleartext Storage of Sensitive Information"
      codeql: actions/unmasked-secret-exposure
      confidence: HIGH
      technology:
        - github-actions
    paths:
      include:
        - "*.yml"
        - "*.yaml"
    pattern-regex: "(?i)\\$\\{\\{(?:(?!\\}\\}).)*?fromjson\\(secrets\\..*?\\)\\.(?:(?!\\}\\}).)*\\}\\}"
