rules:
  - id: welt-actions-missing-workflow-permissions
    message: "O job não limita as permissões do GITHUB_TOKEN: nem o workflow nem o job declaram `permissions`. Declare `permissions:` no topo do workflow (por exemplo `contents: read`) e eleve só no job que precisa."
    severity: WARNING
    languages:
      - yaml
    metadata:
      category: security
      cwe: "CWE-275: Permission Issues"
      codeql: actions/missing-workflow-permissions
      confidence: HIGH
      technology:
        - github-actions
      notes: "Workflow só reutilizável: o CodeQL olha os chamadores (outro arquivo), aqui fica de fora."
    paths:
      include:
        - "*.yml"
        - "*.yaml"
    patterns:
      - pattern-either:
          - pattern: |
              $JOB:
                runs-on: ...
                ...
          - pattern: |
              $JOB:
                uses: $REUSABLE
                ...
      - pattern-not: |
          $JOB:
            ...
            permissions: ...
            ...
      - pattern-not-inside: |
          permissions: ...
          ...
      - pattern-inside: |
          jobs:
            ...
      - pattern-not-inside:
          pattern-regex: "(?ms)\\A.*?^(?:on:[ \\t]*(?:workflow_call|\\[[ \\t]*workflow_call[ \\t]*\\])[ \\t]*$|on:[ \\t]*\\n([ \\t]+)workflow_call:[^\\n]*\\n(?:\\1[ \\t]+[^\\n]*\\n|[ \\t]*\\n)*(?=\\S|\\Z)).*\\z"
