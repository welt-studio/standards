# `exact`: limpa só o valor convertido, não o sumidouro de dentro (`int(os.path.getmtime(p))`).
# O motor não leva o `exact` pela atribuição, então a variável que recebeu o resultado é limpa à parte.
- pattern: "int(...)"
  exact: true
- patterns:
    - pattern-inside: |
        $Y = int(...)
        ...
    - pattern: "$Y"
