# Os demais parâmetros (`$P`, os da URL) de uma view de função: a que recebe a requisição do
# framework como primeiro parâmetro (tipada, decorada ou registrada por rota no arquivo, ver
# `http-request-receiver`), nunca a reconhecida pelo nome `request`.
- "$model": python/http-request-receiver
- pattern-either:
    - pattern-inside: |
        def $V($R, ..., $P, ...):
          ...
    - pattern-inside: |
        async def $V($R, ..., $P, ...):
          ...
- metavariable-regex:
    metavariable: "$V"
    regex: "^(?!_)"
