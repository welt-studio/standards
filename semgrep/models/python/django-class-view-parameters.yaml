# Os parâmetros da URL (`$P`) de um método de view de classe com nome de verbo HTTP: os que vêm
# depois do `self` e da requisição (o nome da requisição não importa).
- "$model": python/view-class-context
- pattern-either:
    - pattern-inside: |
        def $V(self, $R, ..., $P, ...):
          ...
    - pattern-inside: |
        async def $V(self, $R, ..., $P, ...):
          ...
- metavariable-regex:
    metavariable: "$V"
    regex: "^(get|post|put|patch|delete|head|options|list|retrieve|create|update|partial_update|destroy|dispatch|form_valid|get_object|get_queryset)$"
