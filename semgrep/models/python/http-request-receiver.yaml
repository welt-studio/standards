# A requisição HTTP (`$R`) amarrada ao framework, nunca ao nome da variável (`request` local
# qualquer não é requisição): o parâmetro anotado com a classe de requisição do framework
# (Starlette/FastAPI, DRF e Django: `RequestHandlerParam`, `HttpRequest` dos `.qll`), o parâmetro
# depois do `self` num método de view com nome de verbo HTTP (Django/DRF), e o primeiro parâmetro
# da função registrada por chamada de rota no mesmo arquivo (`DjangoRouteSetup`) ou com decorador de view
# do Django/DRF. O `$V` é a função.
- pattern-either:
    - pattern-inside: |
        def $V(..., $R: fastapi.Request, ...):
          ...
