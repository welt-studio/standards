- pattern-not-inside:
    patterns:
      - "$model": actions/job-with-write-permissions
- pattern-not-inside:
    patterns:
      - "$model": actions/job-steps-using-secrets
- pattern-not-inside:
    pattern-regex: "(?ms)\\\\A.*?^permissions:[ \\\\t]*(?:write-all|\\\\n(?:[ \\\\t]+[^\\\\n]*\\\\n)*?[ \\\\t]+[\\\\w-]+:[ \\\\t]*write).*\\\\z"
- pattern-not-inside:
    pattern-regex: "(?ms)\\\\A.*?^env:[^\\\\n]*\\\\n(?:[ \\\\t]+[^\\\\n]*\\\\n)*?[ \\\\t]+[^\\\\n]*\\bsecrets(?:\\.(?!GITHUB_TOKEN\\b)|\\[).*\\\\z"
