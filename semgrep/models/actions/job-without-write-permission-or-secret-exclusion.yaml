- pattern-not-inside:
    patterns:
      - pattern: |
          $JOB:
            ...
            permissions: $P
            ...
            steps: $BODY
            ...
      - metavariable-regex:
          metavariable: "$P"
          regex: "(?is)^(?!.*write).*$"
      - metavariable-regex:
          metavariable: "$BODY"
          regex: "(?is)^(?!.*\\bsecrets(?:\\.(?!GITHUB_TOKEN\\b)|\\[)).*$"
      - pattern-inside:
          pattern-regex: "(?ms)\\A(?!.*^env:[^\\n]*\\n(?:[ \\t]+[^\\n]*\\n)*?[ \\t]+[^\\n]*\\bsecrets(?:\\.(?!GITHUB_TOKEN\\b)|\\[)).*\\z"
- pattern-not-inside:
    pattern-regex: "(?ms)\\A(?!.*\\bsecrets(?:\\.(?!GITHUB_TOKEN\\b)|\\[))(?!.*\\bwrite)(?=.*^[ \\t]*permissions:).*\\z"
