# As entradas da requisição que o `Hapi.qll` do CodeQL modela, sobre o `$REQ` de um tratador:
# `rawPayload`, `payload`, `query`, `params`, `url.path`, `url.origin` e a leitura de um cabeçalho
# (`headers.x`).
- pattern: "$REQ.rawPayload"
- pattern: "$REQ.payload"
- "$model": javascript/req-query
- "$model": javascript/req-params
- pattern: "$REQ.url.path"
- pattern: "$REQ.url.origin"
- "$model": javascript/req-headers
