- patterns:
    - pattern-either:
        - pattern-inside: "function ($REQ, $RES, ...) {...}"
        - pattern-inside: "function $F($REQ, $RES, ...) {...}"
        - pattern-inside: "async function ($REQ, $RES, ...) {...}"
        - pattern-inside: "async function $F($REQ, $RES, ...) {...}"
        - pattern-inside: "($REQ, $RES, ...) => {...}"
        - pattern-inside: "($REQ, $RES, ...) => $E"
        - pattern-inside: "async ($REQ, $RES, ...) => {...}"
        - pattern-inside: "async ($REQ, $RES, ...) => $E"
        - pattern-inside: "$M($REQ, $RES, ...) {...}"
        - pattern-inside: "async $M($REQ, $RES, ...) {...}"
        - pattern-inside: "function ($REQ) {...}"
        - pattern-inside: "function $F($REQ) {...}"
        - pattern-inside: "($REQ) => {...}"
        - pattern-inside: "($REQ) => $E"
        - pattern-inside: "async ($REQ) => {...}"
        - pattern-inside: "async function $F($REQ) {...}"
        - pattern-inside: "$M($REQ) {...}"
    - metavariable-regex:
        metavariable: "$REQ"
        regex:
          "$text": javascript/short-request-variable-name-regex
    - pattern-either:
        - "$model": javascript/req-query
        - "$model": javascript/req-body
        - "$model": javascript/req-params
        - "$model": javascript/req-headers
        - "$model": javascript/req-signed-cookies
        - "$model": javascript/req-url
        - "$model": javascript/req-original-url
        - "$model": javascript/req-path
        - "$model": javascript/req-hostname
        - "$model": javascript/req-host
        - "$model": javascript/express-request-base-url-sources
        - "$model": javascript/req-files
        - "$model": javascript/express-request-extra-sources
        - "$model": javascript/req-get
        - "$model": javascript/req-header
        - "$model": javascript/req-param
        - "$model": javascript/fetch-request-body-sources
- patterns:
    - pattern-either:
        - pattern-inside: "$APP.$M(..., function ($REQ, ...) {...})"
        - pattern-inside: "$APP.$M(..., async function ($REQ, ...) {...})"
        - pattern-inside: "$APP.$M(..., ($REQ, ...) => {...})"
        - pattern-inside: "$APP.$M(..., ($REQ, ...) => $E)"
        - pattern-inside: "$APP.$M(..., async ($REQ, ...) => {...})"
        - pattern-inside: "$APP.$M(..., async ($REQ, ...) => $E)"
        - pattern-inside: "$APP.$M(..., function $F($REQ, ...) {...})"
    - metavariable-regex:
        metavariable: "$M"
        regex:
          "$text": javascript/http-verb-method-regex
    - pattern-either:
        - "$model": javascript/req-query
        - "$model": javascript/req-body
        - "$model": javascript/req-params
        - "$model": javascript/req-headers
        - "$model": javascript/req-signed-cookies
        - "$model": javascript/req-url
        - "$model": javascript/req-original-url
        - "$model": javascript/req-path
        - "$model": javascript/req-hostname
        - "$model": javascript/req-host
        - "$model": javascript/express-request-base-url-sources
        - "$model": javascript/req-files
        - "$model": javascript/express-request-extra-sources
        - "$model": javascript/req-get
        - "$model": javascript/req-header
        - "$model": javascript/req-param
        - "$model": javascript/fetch-request-body-sources
