- "patterns":
    - "pattern": "child_process.execFile($X, ...)"
    - "focus-metavariable": "$X"
- "patterns":
    - "pattern": "child_process.execFileSync($X, ...)"
    - "focus-metavariable": "$X"
- "patterns":
    - "pattern": "child_process.spawn($X, ...)"
    - "focus-metavariable": "$X"
- "patterns":
    - "pattern": "child_process.spawnSync($X, ...)"
    - "focus-metavariable": "$X"
- "patterns":
    - "pattern": "child_process.fork($X, ...)"
    - "focus-metavariable": "$X"
- "patterns":
    - "pattern": "$E.$M($X, ...)"
    - "$model": "javascript/child-process-module-alias-bindings"
    - "metavariable-regex":
        "metavariable": "$M"
        "regex":
          "$text": "javascript/child-process-command-method-regex"
    - "focus-metavariable": "$X"
- "patterns":
    - "pattern": "$M($X, ...)"
    - "$model": "javascript/child-process-module-named-bindings"
    - "metavariable-regex":
        "metavariable": "$M"
        "regex":
          "$text": "javascript/child-process-command-method-regex"
    - "focus-metavariable": "$X"
- "patterns":
    - "pattern": "$V($X, ...)"
    - "$model": "javascript/child-process-member-bindings"
    - "metavariable-regex":
        "metavariable": "$M"
        "regex":
          "$text": "javascript/child-process-command-method-regex"
    - "focus-metavariable": "$X"
