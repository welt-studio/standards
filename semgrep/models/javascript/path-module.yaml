- pattern-either:
    - pattern-inside: |
        $M = require("path"); ...
    - pattern-inside: |
        $M = require("node:path"); ...
    - pattern-inside: |
        import $M from "path"; ...
    - pattern-inside: |
        import $M from "node:path"; ...
    - pattern-inside: |
        import * as $M from "path"; ...
    - pattern-inside: |
        import * as $M from "node:path"; ...
    - pattern-inside: |
        $M = require("path").posix; ...
    - pattern-inside: |
        $M = require("node:path").posix; ...
    - pattern-inside: |
        import {..., posix as $M, ...} from "path"; ...
    - pattern-inside: |
        import {..., posix as $M, ...} from "node:path"; ...
    - pattern-inside: |
        $P = require("path"); ...
        $M = $P.posix; ...
    - pattern-inside: |
        import * as $P from "path"; ...
        $M = $P.posix; ...
