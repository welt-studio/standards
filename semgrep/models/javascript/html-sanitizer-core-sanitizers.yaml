# `HtmlSanitizerCall` do CodeQL (HtmlSanitizers.qll), amarrado ao módulo pelo `require`/`import`
# (importação padrão, `* as`, desestruturada com ou sem apelido, e a chamada em linha):
# ent, entities, escape-goat, he, sanitize-html, sanitizer, validator, xss, xss-filters,
# lodash/underscore (`escape`) e html-entities. O `DOMPurify.sanitize` e a heurística de nome
# (`html` mais `saniti|escape|strip`) ficam em modelos próprios.
- patterns:
    - pattern: "$V.$M($X, ...)"
    - pattern-either:
        - pattern-inside: |
            $V = require("he");
            ...
        - pattern-inside: |
            import $V from "he";
            ...
        - pattern-inside: |
            import * as $V from "he";
            ...
    - metavariable-regex:
        metavariable: "$M"
        regex: "^(?:encode|escape)$"
- patterns:
    - pattern: "$F($X, ...)"
    - pattern-either:
        - pattern-inside: |
            import { $M as $F } from "he";
            ...
    - metavariable-regex:
        metavariable: "$M"
        regex: "^(?:encode|escape)$"
- patterns:
    - pattern: "$M($X, ...)"
    - pattern-either:
        - pattern-inside: |
            import { $M } from "he";
            ...
    - metavariable-regex:
        metavariable: "$M"
        regex: "^(?:encode|escape)$"
- patterns:
    - pattern-either:
        - pattern: 'require("he").$M($X, ...)'
    - metavariable-regex:
        metavariable: "$M"
        regex: "^(?:encode|escape)$"
