- patterns:
    - pattern-either:
        - pattern: "child_process.spawn($SH, [..., $X, ...], ...)"
        - pattern: "child_process.spawn($SH, [..., $X].concat(...), ...)"
        - pattern: "child_process.spawn($SH, [...].concat([..., $X]), ...)"
        - pattern: "child_process.spawn($SH, [...].concat($X), ...)"
        - pattern: "child_process.spawn($SH, $X, ...)"
    - metavariable-regex:
        metavariable: "$SH"
        regex: "(?i)^[\"'`]?(?:/(?:usr/)?bin/)?(?:sh|bash|zsh|dash|ksh|csh|cmd(?:\\.exe)?|powershell(?:\\.exe)?|pwsh)[\"'`]?$|^\\w*[sS]hell\\w*$|^sh$|^bash$"
    - focus-metavariable: "$X"
