- patterns:
    - pattern: "$E.innerHTML = $X"
    - focus-metavariable: "$X"
- patterns:
    - pattern: "$E.outerHTML = $X"
    - focus-metavariable: "$X"
- patterns:
    - pattern: "$E.innerHTML += $X"
    - focus-metavariable: "$X"
- patterns:
    - pattern: "$E.outerHTML += $X"
    - focus-metavariable: "$X"
# `document.write`/`writeln` (o receptor é o `document`, ou o `document` de uma janela global): o
# `write` de um fluxo (`process.stdout.write`, `res.write`) não escreve HTML.
- patterns:
    - pattern-either:
        - pattern: "document.write(..., $X, ...)"
        - pattern: "document.writeln(..., $X, ...)"
    - focus-metavariable: "$X"
- patterns:
    - pattern-either:
        - pattern: "$W.document.write(..., $X, ...)"
        - pattern: "$W.document.writeln(..., $X, ...)"
    - metavariable-regex:
        metavariable: "$W"
        regex: "^(?:window|self|top|parent|globalThis)$"
    - focus-metavariable: "$X"
- patterns:
    - pattern: "$E.insertAdjacentHTML($P, $X, ...)"
    - focus-metavariable: "$X"
# Métodos do jQuery que leem a string como HTML (`JQuery::MethodCall.interpretsArgumentAsHtml` do
# CodeQL): o receptor é um objeto jQuery, isto é, o resultado de `$(...)`, `jQuery(...)` ou
# `cash(...)` (com ou sem encadeamento) ou uma variável atribuída dele, e o resultado dos métodos
# que devolvem jQuery (`find`, `filter`, `children`...) sobre ela. O `append`/`prepend`/`after`/
# `before` do DOM nativo (`document.body.append(...)`) e o do cheerio inserem texto ou outro
# objeto, então um receptor qualquer não serve.
- patterns:
    - pattern-either:
        - pattern: "<... $D(...) ...>.$M(..., $X, ...)"
        - patterns:
            - pattern: "$J.$M(..., $X, ...)"
            - pattern-inside: |
                $J = $D(...);
                ...
    - metavariable-regex:
        metavariable: "$D"
        regex:
          "$text": javascript/jquery-dollar-name-regex
    - metavariable-regex:
        metavariable: "$M"
        regex:
          "$text": javascript/jquery-html-method-regex
    - focus-metavariable: "$X"
- patterns:
    - pattern: "<... $J.$T(...) ...>.$M(..., $X, ...)"
    - pattern-inside: |
        $J = $D(...);
        ...
    - metavariable-regex:
        metavariable: "$D"
        regex:
          "$text": javascript/jquery-dollar-name-regex
    - metavariable-regex:
        metavariable: "$T"
        regex:
          "$text": javascript/jquery-chain-method-regex
    - metavariable-regex:
        metavariable: "$M"
        regex:
          "$text": javascript/jquery-html-method-regex
    - focus-metavariable: "$X"
# O nome do método calculado (`base[html ? "html" : "text"](valor)`): a regex olha os nomes entre
# aspas na expressão.
- patterns:
    - pattern-either:
        - pattern: "<... $D(...) ...>[$K](..., $X, ...)"
        - patterns:
            - pattern: "$J[$K](..., $X, ...)"
            - pattern-inside: |
                $J = $D(...);
                ...
    - metavariable-regex:
        metavariable: "$D"
        regex:
          "$text": javascript/jquery-dollar-name-regex
    - metavariable-regex:
        metavariable: "$K"
        regex: '(?s).*["''](?:html|append|prepend|after|before|wrap|wrapAll|wrapInner|replaceWith|appendTo|prependTo|insertAfter|insertBefore)["''].*'
    - focus-metavariable: "$X"
# Os mesmos métodos com callback que devolve o HTML (`.html(d => ...)`, `.replaceWith(function () {...})`).
- patterns:
    - pattern-either:
        - pattern: "<... $D(...) ...>.$M((...) => $X)"
        - pattern: "<... $D(...) ...>.$M(function (...) { ... return $X; })"
        - patterns:
            - pattern-either:
                - pattern: "$J.$M((...) => $X)"
                - pattern: "$J.$M(function (...) { ... return $X; })"
            - pattern-inside: |
                $J = $D(...);
                ...
    - metavariable-regex:
        metavariable: "$D"
        regex:
          "$text": javascript/jquery-dollar-name-regex
    - metavariable-regex:
        metavariable: "$M"
        regex:
          "$text": javascript/jquery-html-method-regex
    - focus-metavariable: "$X"
- patterns:
    - pattern-either:
        - pattern: "<... $J.$T(...) ...>.$M((...) => $X)"
        - pattern: "<... $J.$T(...) ...>.$M(function (...) { ... return $X; })"
    - pattern-inside: |
        $J = $D(...);
        ...
    - metavariable-regex:
        metavariable: "$D"
        regex:
          "$text": javascript/jquery-dollar-name-regex
    - metavariable-regex:
        metavariable: "$T"
        regex:
          "$text": javascript/jquery-chain-method-regex
    - metavariable-regex:
        metavariable: "$M"
        regex:
          "$text": javascript/jquery-html-method-regex
    - focus-metavariable: "$X"
# O jqLite do AngularJS é um objeto jQuery: o resultado de `angular.element(...)` e o elemento que a
# diretiva recebe em `link: function (scope, element) {...}`.
- patterns:
    - pattern-either:
        - pattern: "<... angular.element(...) ...>.$M(..., $X, ...)"
        - pattern: "<... angular.element(...) ...>.$M((...) => $X)"
        - pattern: "<... angular.element(...) ...>.$M(function (...) { ... return $X; })"
        - patterns:
            - pattern-either:
                - pattern: "$J.$M(..., $X, ...)"
                - pattern: "$J.$M((...) => $X)"
                - pattern: "$J.$M(function (...) { ... return $X; })"
            - pattern-inside: |
                $J = angular.element(...);
                ...
        - patterns:
            - pattern-either:
                - pattern: "$EL.$M(..., $X, ...)"
                - pattern: "$EL.$M((...) => $X)"
                - pattern: "$EL.$M(function (...) { ... return $X; })"
            - pattern-inside: "{..., link: function ($SCOPE, $EL, ...) {...}, ...}"
            - pattern-inside: "$APP.directive(...)"
    - metavariable-regex:
        metavariable: "$M"
        regex:
          "$text": javascript/jquery-html-method-regex
    - focus-metavariable: "$X"
# d3: o `html` de uma seleção (`d3.select(...)`, `d3.selectAll(...)`) lê a string como HTML (D3.qll).
- patterns:
    - pattern-either:
        - pattern: "<... d3.$R(...) ...>.html($X)"
        - pattern: "<... d3.$R(...) ...>.html((...) => $X)"
        - pattern: "<... d3.$R(...) ...>.html(function (...) { ... return $X; })"
        - patterns:
            - pattern-either:
                - pattern: "$J.html($X)"
                - pattern: "$J.html((...) => $X)"
                - pattern: "$J.html(function (...) { ... return $X; })"
            - pattern-inside: |
                $J = <... d3.$R(...) ...>;
                ...
    - metavariable-regex:
        metavariable: "$R"
        regex: "^(?:select|selectAll|selection)$"
    - focus-metavariable: "$X"
# `$($X)`: o `$` é o do jQuery (global, de `require` ou de `import`); uma função local de mesmo nome
# (`const $ = (id) => document.getElementById(id)`, `function $(id) {...}`) não é.
- patterns:
    - pattern: "$($X)"
    - pattern-not-inside: |
        $ = (...) => ...;
        ...
    - pattern-not-inside: |
        $ = function (...) {...};
        ...
    - pattern-not-inside: |
        ...
        function $(...) {...}
        ...
    - focus-metavariable: "$X"
- patterns:
    - "$model": javascript/jquery-call
    - focus-metavariable: "$X"
- patterns:
    - pattern: "cash($X)"
    - focus-metavariable: "$X"
- patterns:
    - pattern: "$R.createContextualFragment($X)"
    - focus-metavariable: "$X"
# Serviço `$sce` do AngularJS (o nome é o do serviço injetado): trustAsHtml/trustAsCss e
# trustAs(HTML|CSS, valor) viram HTML confiável.
- patterns:
    - pattern-either:
        - pattern: "$SCE.trustAsHtml($X)"
        - pattern: "$SCE.trustAsCss($X)"
    - metavariable-regex:
        metavariable: "$SCE"
        regex: '^\$sce$'
    - focus-metavariable: "$X"
- patterns:
    - pattern: "$SCE.trustAs($KIND, $X)"
    - metavariable-regex:
        metavariable: "$SCE"
        regex: '^\$sce$'
    - metavariable-regex:
        metavariable: "$KIND"
        regex: '^\$sce\.(?:HTML|CSS)$'
    - focus-metavariable: "$X"
- patterns:
    - pattern: "angular.element($X)"
    - focus-metavariable: "$X"
- patterns:
    - pattern: "<$C dangerouslySetInnerHTML={{__html: $X}} />"
    - focus-metavariable: "$X"
- patterns:
    - pattern: "{__html: $X}"
    - pattern-inside: "<$C dangerouslySetInnerHTML={...} />"
    - focus-metavariable: "$X"
# DOMParser: o instanciado com `new DOMParser()` interpreta o texto como HTML/XML.
- patterns:
    - pattern: "$P.parseFromString($X, ...)"
    - pattern-inside: |
        $P = new DOMParser();
        ...
    - focus-metavariable: "$X"
- patterns:
    - pattern: "new Handlebars.SafeString($X)"
    - focus-metavariable: "$X"
# `jGrowl` do jQuery (`$.jGrowl(msg)`, `$(...).jGrowl(msg)`): a mensagem vira HTML.
- patterns:
    - pattern-either:
        - pattern: "$D.jGrowl($X, ...)"
        - pattern: "<... $D(...) ...>.jGrowl($X, ...)"
        - patterns:
            - pattern: "$J.jGrowl($X, ...)"
            - pattern-inside: |
                $J = $D(...);
                ...
    - metavariable-regex:
        metavariable: "$D"
        regex:
          "$text": javascript/jquery-dollar-name-regex
    - focus-metavariable: "$X"
# MooTools: a opção/propriedade `html` do Element e o appendHtml.
- patterns:
    - pattern-either:
        - pattern: "new Element($TAG, {..., html: $X, ...})"
        - pattern: 'new Element($TAG, {..., "html": $X, ...})'
        - pattern: "new Element(...).set('html', $X)"
        - pattern: 'new Element(...).set({..., "html": $X, ...})'
        - pattern: "new Element(...).setProperty('html', $X)"
        - pattern: 'new Element(...).setProperties({..., "html": $X, ...})'
        - pattern: "new Element(...).appendHtml($X)"
    - focus-metavariable: "$X"
# React.createElement/createFactory com dangerouslySetInnerHTML nas props.
- patterns:
    - pattern-either:
        - pattern: "React.createElement($T, {..., dangerouslySetInnerHTML: {..., __html: $X, ...}, ...})"
        - pattern: "React.createFactory($T)({..., dangerouslySetInnerHTML: {..., __html: $X, ...}, ...})"
    - focus-metavariable: "$X"
# WinJS: as variantes "Unsafe" não filtram o HTML.
- patterns:
    - pattern-either:
        - pattern: "$W.setInnerHTMLUnsafe($EL, $X)"
        - pattern: "$W.setOuterHTMLUnsafe($EL, $X)"
    - focus-metavariable: "$X"
# JSDOM com `runScripts: "dangerously"` executa os scripts do HTML recebido.
- patterns:
    - pattern: 'new JSDOM($X, {..., runScripts: "dangerously", ...})'
    - pattern-either:
        - pattern-inside: |
            import { JSDOM } from "jsdom";
            ...
        - pattern-inside: |
            const { JSDOM } = require("jsdom");
            ...
    - focus-metavariable: "$X"
# Corpo HTML de e-mail (nodemailer): o transporte vem de `createTransport`.
- patterns:
    - pattern: "$T.sendMail({..., html: $X, ...})"
    - pattern-inside: |
        $T = $NM.createTransport(...);
        ...
    - focus-metavariable: "$X"
# Typeahead: o retorno da função `suggestion` dos templates vira HTML.
- patterns:
    - pattern: "return $X;"
    - pattern-inside: "$J.typeahead(..., {..., templates: {..., suggestion: function (...) {...}, ...}, ...})"
    - focus-metavariable: "$X"
# React Native: `html` do WebView.
- patterns:
    - pattern-either:
        - pattern: "<WebView ... html={$X} ... />"
        - pattern: "<WebView ... source={{..., html: $X, ...}} ... />"
    - focus-metavariable: "$X"
# react-tooltip: `data-tip` vira HTML com `data-html` ligado.
- patterns:
    - pattern-either:
        - pattern: '<$EL ... data-tip={$X} ... data-html="true" ... />'
        - pattern: "<$EL ... data-tip={$X} ... data-html={true} ... />"
        - pattern: '<$EL ... data-html="true" ... data-tip={$X} ... />'
        - pattern: "<$EL ... data-html={true} ... data-tip={$X} ... />"
    - focus-metavariable: "$X"
