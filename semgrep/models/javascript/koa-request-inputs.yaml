# As entradas da requisição que o `Koa.qll` do CodeQL modela, sobre o contexto `$CTX` de um tratador:
# a leitura de uma propriedade de `query`; `url`, `originalUrl` e `href`; `params`; o `body` do
# `ctx.request`; e os cabeçalhos (`header.x`, `headers.x` e `get(nome)`), no contexto ou em
# `ctx.request`. Não há modelo para `path`, `querystring`, `host`, `origin` nem `ctx.req`.
- pattern: "$CTX.query"
- pattern: "$CTX.query.$K"
- pattern: "$CTX.query[$K]"
- pattern: "$CTX.request.query"
- pattern: "$CTX.request.query.$K"
- pattern: "$CTX.request.query[$K]"
- pattern: "$CTX.url"
- pattern: "$CTX.originalUrl"
- pattern: "$CTX.href"
- pattern: "$CTX.request.url"
- pattern: "$CTX.request.originalUrl"
- pattern: "$CTX.request.href"
- pattern: "$CTX.params"
- pattern: "$CTX.request.params"
- pattern: "$CTX.request.body"
- pattern: "$CTX.header.$K"
- pattern: "$CTX.header[$K]"
- pattern: "$CTX.headers.$K"
- pattern: "$CTX.headers[$K]"
- pattern: "$CTX.request.header.$K"
- pattern: "$CTX.request.header[$K]"
- pattern: "$CTX.request.headers.$K"
- pattern: "$CTX.request.headers[$K]"
- pattern: "$CTX.get(...)"
- pattern: "$CTX.request.get(...)"
