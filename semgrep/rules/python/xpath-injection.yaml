# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-py-xpath-injection
    message: 'Consulta XPath montada com dado controlado pelo usuário (injeção de XPath). Passe o valor como variável da consulta (`tree.xpath("//a[@id=$v]", v=valor)`) em vez de concatená-lo.'
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-643: Improper Neutralization of Data within XPath Expressions ('XPath Injection')"
      codeql: py/xpath-injection
      notes: |-
        Porta do `py/xpath-injection` (XpathInjectionCustomizations.qll + XPathConstruction/XPathExecution de
        Lxml.qll, Libxml2.qll e ElementTreeFindCall em Stdlib.qll). Sem tipos, os métodos `.xpath`, `.xpathEval`,
        `.find*` só valem em arquivos que importam a biblioteca XML correspondente.
    mode: taint
    options:
      interfile: true
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  def $V(self, request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  async def $V(self, request, ..., $P, ...):
                    ...
          - metavariable-regex:
              metavariable: "$V"
              regex: "^(get|post|put|patch|delete|head|options|list|retrieve|create|update|partial_update|destroy|dispatch|form_valid|get_object|get_queryset)$"
          - focus-metavariable: "$P"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$D
                  def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  @$D(...)
                  def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  @$D
                  async def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  @$D(...)
                  async def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  async def $V(request, ..., $P, ...):
                    ...
          - pattern-not-inside: |
              def $V2(request: $T, ...):
                ...
          - pattern-not-inside: |
              async def $V2(request: $T, ...):
                ...
          - metavariable-regex:
              metavariable: "$V"
              regex: "^(?!_)"
          - focus-metavariable: "$P"
      - patterns:
          - pattern-either:
              - pattern: "request.$A"
              - pattern: "self.request.$A"
          - metavariable-regex:
              metavariable: "$A"
              regex: "^(args|form|values|json|data|files|cookies|headers|GET|POST|body|META|COOKIES|FILES|query_params|path_params|query|match_info|query_string|full_path|view_args|stream|environ|path|url|referrer|content_type)$"
      - patterns:
          - pattern-either:
              - pattern: "request.$M(...)"
              - pattern: "self.request.$M(...)"
              - pattern: "await request.$M(...)"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(get_json|get_data|json|form|body|post|text|read|get_full_path|get_host)$"
      - patterns:
          - pattern: "self.$M(...)"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(get_argument|get_arguments|get_query_argument|get_query_arguments|get_body_argument|get_body_arguments|get_cookie|get_secure_cookie)$"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$VERB(...)
                  def $F(..., $P: $T, ...):
                    ...
              - pattern-inside: |
                  @$APP.$VERB(...)
                  async def $F(..., $P: $T, ...):
                    ...
              - pattern-inside: |
                  @$APP.$VERB(...)
                  def $F(..., $P: $T = $D, ...):
                    ...
              - pattern-inside: |
                  @$APP.$VERB(...)
                  async def $F(..., $P: $T = $D, ...):
                    ...
          - metavariable-regex:
              metavariable: "$VERB"
              regex: "^(get|post|put|patch|delete|api_route|head|options|route|websocket)$"
          - metavariable-regex:
              metavariable: "$T"
              regex: "^(?!.*\\b(Depends|Security)\\()(?!\\s*(Request|Response|BackgroundTasks|WebSocket|HTTPConnection|Session|AsyncSession|SecurityScopes)\\s*$)"
          - focus-metavariable: "$P"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "etree.XPath($X, ...)"
              - pattern: "etree.ETXPath($X, ...)"
              - pattern: "lxml.etree.XPath($X, ...)"
              - pattern: "lxml.etree.ETXPath($X, ...)"
              - pattern: "etree.XPathEvaluator(...)($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import lxml
                  ...
              - pattern-inside: |
                  import lxml.etree
                  ...
              - pattern-inside: |
                  import lxml.html
                  ...
              - pattern-inside: |
                  from lxml import $A
                  ...
              - pattern-inside: |
                  from lxml.etree import $A
                  ...
          - pattern: "$T.xpath($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-inside: |
              import libxml2
              ...
          - pattern: "$D.xpathEval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import xml.etree.ElementTree
                  ...
              - pattern-inside: |
                  import xml.etree.cElementTree
                  ...
              - pattern-inside: |
                  from xml.etree import $A
                  ...
              - pattern-inside: |
                  from xml.etree.ElementTree import $A
                  ...
          - pattern-either:
              - pattern: "$T.find($X, ...)"
              - pattern: "$T.findall($X, ...)"
              - pattern: "$T.findtext($X, ...)"
          - focus-metavariable: "$X"
