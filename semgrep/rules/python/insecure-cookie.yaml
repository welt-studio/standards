# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-py-insecure-cookie
    message: "Cookie sensível enviado na resposta sem o atributo `secure`; o navegador pode transmiti-lo por HTTP em claro."
    severity: WARNING
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"
      codeql: py/insecure-cookie
      notes: |-
        Porta do `py/insecure-cookie` (CookieWrite de Concepts.qll + modelos Flask.qll, Django.qll, Aiohttp.qll).
        Sensível = nome do cookie pelo regex de SensitiveDataHeuristics.qll (notSensitive incluído).
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: "$R.set_cookie($NAME, ...)"
                  - pattern: "$R.set_cookie(..., key=$NAME, ...)"
                  - pattern: "$R.set_cookie(..., name=$NAME, ...)"
              - pattern-not: "$R.set_cookie(..., secure=$S, ...)"
              - pattern-not: "$R.set_cookie(..., **$KW)"
          - patterns:
              - pattern-either:
                  - pattern: "$R.set_cookie($NAME, ...)"
                  - pattern: "$R.set_cookie(..., key=$NAME, ...)"
                  - pattern: "$R.set_cookie(..., name=$NAME, ...)"
              - pattern: "$R.set_cookie(..., secure=False, ...)"
      - metavariable-regex:
          metavariable: "$NAME"
          regex: "(?is)^(?!.*(?:redact|censor|obfuscate|hash|md5|sha|random|(?<!unen)crypt|(?<!un)encode|certain|concert|secretar|wildcard|coauthor|account(?:ant|ab|ing|ed)|(?<!pro)file|path|(?:[_-]|\\b)url)).*(?:pass(?:wd|word|code|.?phrase)(?!.*question)|auth(?:entication|ori[sz]ation)?.?key|oauth|api.?(?:key|tok)|(?:[_-]|\\b)mfa(?:[_-]|\\b)|(?<!is)(?<!is_)secret|(?<!un)(?<!un_)(?<!is)(?<!is_)trusted|confidential|acc(?:ou)?nt|puid|user.?(?:name|id)|session.?(?:id|key)|(?:^|_)uid|cert(?!.*(?:format|name|ification))|social.?security|passport.?(?:num|no)|(?:[_-]|\\b)ssn(?:[_-]|\\b)|post.?code|zip.?code|home.?addr|(?:mob(?:ile)?|home).?(?:num|no|tel|phone)|(?:tel|fax|phone).?(?:num|no)|telephone|emergency.?contact|(?:credit|debit|bank|visa).?(?:card|num|no|acc(?:ou)?nt)|(?:card|acc(?:ou)?nt).?(?:no|num|credit)|routing.?num|salary|billing|beneficiary|credit.?(?:rating|score)|(?:[_-]|\\b)(?:ccn|cvv|iban)(?:[_-]|\\b)|security.?code|birth.?da(?:te|y)|da(?:te|y).?(?:of.?)?birth|gender|medical|(?:health|care).?plan|patient.?(?:id|record)|employ(?:er|ee)|spouse|maiden.?name|mac.?addr)"
