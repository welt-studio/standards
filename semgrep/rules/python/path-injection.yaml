# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-py-path-injection
    message: "Dado vindo da requisição decide o caminho de um arquivo (path traversal). Normalize o caminho e confira que ele continua dentro do diretório permitido."
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      codeql: py/path-injection
      notes: |-
        Flask/Werkzeug: atributos do `request` (Flask.qll, Werkzeug.qll).
        Parâmetros de rota (Flask, FastAPI, Starlette, Bottle...): variáveis da URL e do corpo.
        Django/DRF: parâmetros da view depois do `request` (vêm da URL).
        Tornado: argumentos e dados do RequestHandler (Tornado.qll).
        Normalizar e conferir o prefixo (SafeAccessCheck do Concepts.qll).
        Conferência de contenção com pathlib: `if not path.is_relative_to(root): raise`.
        pathlib: o `Path` montado com dado da requisição, acessado por um método de arquivo.
        Werkzeug.qll: `FileStorage.save` (FileStorageSaveCall).
    mode: taint
    options:
      interfile: true
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: "flask.request.$A"
              - pattern: "flask.request.$A(...)"
              - pattern: "bottle.request.$A"
              - pattern: "request.$A"
              - pattern: "self.request.$A"
          - metavariable-regex:
              metavariable: "$A"
              regex: "^(args|form|values|json|data|cookies|headers|files|stream|environ|view_args|query_string|url|base_url|full_path|path|path_info|script_root|url_root|host|host_url|referrer|user_agent|authorization|get_json|get_data|input_stream|GET|POST|COOKIES|META|FILES|body|get_full_path|get_full_path_info|get_host|build_absolute_uri|query_params|query|match_info|rel_url|json|text|read|content|path_params|params|matchdict|post|headers|raw_post_data)$"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $F(..., $P, ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  async def $F(..., $P, ...):
                    ...
          - metavariable-regex:
              metavariable: "$ROUTE"
              regex: "^(route|get|post|put|delete|patch|api_route|head|options)$"
          - focus-metavariable: "$P"
          - metavariable-regex:
              metavariable: "$P"
              regex: "^(?!self$|cls$|request$|response$)"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  def $V(self, request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  async def $V(self, request, ..., $P, ...):
                    ...
          - metavariable-regex:
              metavariable: "$V"
              regex: "^(get|post|put|patch|delete|head|options|list|retrieve|create|update|partial_update|destroy|dispatch|form_valid|get_object|get_queryset)$"
          - focus-metavariable: "$P"
          - metavariable-regex:
              metavariable: "$P"
              regex: "^(?!self$|cls$|request$|args$|kwargs$)"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$D
                  def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  @$D(...)
                  def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  @$D
                  async def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  @$D(...)
                  async def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  async def $V(request, ..., $P, ...):
                    ...
          - pattern-not-inside: |
              def $V2(request: $T, ...):
                ...
          - pattern-not-inside: |
              async def $V2(request: $T, ...):
                ...
          - metavariable-regex:
              metavariable: "$V"
              regex: "^(?!_)"
          - focus-metavariable: "$P"
          - metavariable-regex:
              metavariable: "$P"
              regex: "^(?!self$|cls$|request$|args$|kwargs$)"
      - pattern-either:
          - pattern: "self.get_argument(...)"
          - pattern: "self.get_arguments(...)"
          - pattern: "self.get_query_argument(...)"
          - pattern: "self.get_query_arguments(...)"
          - pattern: "self.get_body_argument(...)"
          - pattern: "self.get_body_arguments(...)"
          - pattern: "self.get_cookie(...)"
          - pattern: "self.get_secure_cookie(...)"
          - pattern: self.path_args
          - pattern: self.path_kwargs
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$VERB(...)
                  def $F(..., $P: $T, ...):
                    ...
              - pattern-inside: |
                  @$APP.$VERB(...)
                  async def $F(..., $P: $T, ...):
                    ...
          - metavariable-regex:
              metavariable: "$VERB"
              regex: "^(get|post|put|patch|delete|api_route|head|options|route|websocket)$"
          - metavariable-regex:
              metavariable: "$T"
              regex: "^(?!.*\\b(Depends|Security)\\()(?!\\s*(Request|Response|BackgroundTasks|WebSocket|HTTPConnection|Session|AsyncSession|SecurityScopes)\\s*$)"
          - pattern: "$P.$FIELD"
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $Y = os.path.$N(...)
                  ...
                  if $Y.startswith(...):
                    ...
              - pattern-inside: |
                  $Y = os.path.$N(...)
                  ...
                  if $Y.startswith(...) and ...:
                    ...
              - pattern-inside: |
                  $Y = os.path.$N(...)
                  ...
                  if ... and $Y.startswith(...):
                    ...
          - metavariable-regex:
              metavariable: "$N"
              regex: "^(normpath|realpath|abspath)$"
          - pattern: "$Y"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $Y = os.path.$N(...)
                  ...
                  if not $Y.startswith(...):
                    ...
                    $EXIT
                  ...
              - pattern-inside: |
                  $Y = os.path.$N(...)
                  ...
                  if not $Y.startswith(...) or ...:
                    ...
                    $EXIT
                  ...
              - pattern-inside: |
                  $Y = os.path.$N(...)
                  ...
                  if ... or not $Y.startswith(...):
                    ...
                    $EXIT
                  ...
          - metavariable-regex:
              metavariable: "$N"
              regex: "^(normpath|realpath|abspath)$"
          - metavariable-pattern:
              metavariable: "$EXIT"
              pattern-either:
                - pattern: "raise ..."
                - pattern: return
                - pattern: "return ..."
                - pattern: "abort(...)"
                - pattern: "flask.abort(...)"
          - pattern: "$Y"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  if $Y.is_relative_to(...):
                    ...
              - pattern-inside: |
                  if $Y.is_relative_to(...) and ...:
                    ...
              - pattern-inside: |
                  if ... and $Y.is_relative_to(...):
                    ...
          - pattern: "$Y"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  if not $Y.is_relative_to(...):
                    ...
                    $EXIT
                  ...
              - pattern-inside: |
                  if not $Y.is_relative_to(...) or ...:
                    ...
                    $EXIT
                  ...
              - pattern-inside: |
                  if ... or not $Y.is_relative_to(...):
                    ...
                    $EXIT
                  ...
          - metavariable-pattern:
              metavariable: "$EXIT"
              pattern-either:
                - pattern: "raise ..."
                - pattern: return
                - pattern: "return ..."
                - pattern: "abort(...)"
                - pattern: "flask.abort(...)"
          - pattern: "$Y"
      - pattern: "os.path.basename(...)"
      - pattern: "werkzeug.utils.secure_filename(...)"
      - pattern: "int(...)"
        exact: true
      - patterns:
          - pattern-inside: |
              $Y = int(...)
              ...
          - pattern: "$Y"
      - pattern: "uuid.UUID(...)"
        exact: true
      - patterns:
          - pattern-inside: |
              $Y = uuid.UUID(...)
              ...
          - pattern: "$Y"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "open($X, ...)"
              - pattern: "io.open($X, ...)"
              - pattern: "codecs.open($X, ...)"
              - pattern: "aiofiles.open($X, ...)"
              - pattern: "flask.send_file($X, ...)"
              - pattern: "flask.send_from_directory($X, ...)"
              - pattern: "flask.send_from_directory(..., directory=$X, ...)"
              - pattern: "starlette.responses.FileResponse($X, ...)"
              - pattern: "starlette.responses.FileResponse(..., path=$X, ...)"
              - pattern: "fastapi.responses.FileResponse($X, ...)"
              - pattern: "fastapi.responses.FileResponse(..., path=$X, ...)"
              - pattern: "sanic.response.file($X, ...)"
              - pattern: "sanic.response.file_stream($X, ...)"
              - pattern: "cherrypy.lib.static.serve_file($X, ...)"
              - pattern: "cherrypy.lib.static.serve_download($X, ...)"
              - pattern: "cherrypy.lib.static.staticfile($X, ...)"
              - pattern: "shutil.disk_usage($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "os.$FN($X, ...)"
          - metavariable-regex:
              metavariable: "$FN"
              regex: "^(open|access|chdir|chflags|chmod|chown|chroot|lchflags|lchmod|lchown|link|listdir|lstat|mkdir|makedirs|mkfifo|mknod|pathconf|readlink|remove|removedirs|rename|renames|replace|rmdir|scandir|stat|statvfs|symlink|truncate|unlink|utime|walk|startfile)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "os.$FN($Z, $X, ...)"
          - metavariable-regex:
              metavariable: "$FN"
              regex: "^(link|rename|renames|replace|symlink)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "shutil.$SH($X, ...)"
          - metavariable-regex:
              metavariable: "$SH"
              regex: "^(copy|copy2|copyfile|copytree|move|rmtree|copymode|copystat|chown)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "shutil.$SH($Z, $X, ...)"
          - metavariable-regex:
              metavariable: "$SH"
              regex: "^(copy|copy2|copyfile|copytree|move|copymode|copystat)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "os.path.$PF($X, ...)"
          - metavariable-regex:
              metavariable: "$PF"
              regex: "^(exists|isfile|isdir|islink|ismount|lexists|getsize|getmtime|getatime|getctime|samefile)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "os.path.samefile($Z, $X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$P.$PM(...)"
          - metavariable-pattern:
              metavariable: "$P"
              pattern-either:
                - pattern: "pathlib.Path(...)"
                - pattern: "$A / $B"
          - metavariable-regex:
              metavariable: "$PM"
              regex: "^(read_text|read_bytes|write_text|write_bytes|mkdir|rmdir|unlink|touch|symlink_to|hardlink_to|iterdir|rglob|glob|is_file|is_dir|open|chmod|rename|replace|stat|lstat|resolve|samefile|exists|expanduser|group|owner|readlink|is_mount|is_symlink|is_socket|is_fifo|is_block_device|is_char_device|lchmod|link_to)$"
          - focus-metavariable: "$P"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $P = pathlib.Path(...)
                  ...
              - pattern-inside: |
                  $P = $A / $B
                  ...
          - pattern: "$P.$PM(...)"
          - metavariable-regex:
              metavariable: "$PM"
              regex: "^(read_text|read_bytes|write_text|write_bytes|mkdir|rmdir|unlink|touch|symlink_to|hardlink_to|iterdir|rglob|glob|is_file|is_dir|open|chmod|rename|replace|stat|lstat|resolve|samefile|exists|expanduser|group|owner|readlink|is_mount|is_symlink|is_socket|is_fifo|is_block_device|is_char_device|lchmod|link_to)$"
          - focus-metavariable: "$P"
      - patterns:
          - pattern-either:
              - pattern: "flask.request.files[...].save($X, ...)"
              - pattern: "flask.request.files.get(...).save($X, ...)"
              - pattern: "flask.request.files[...].save(..., dst=$X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $F = flask.request.files[...]
                  ...
              - pattern-inside: |
                  $F = flask.request.files.get(...)
                  ...
              - pattern-inside: |
                  $F = werkzeug.datastructures.FileStorage(...)
                  ...
          - pattern: "$F.save($X, ...)"
          - focus-metavariable: "$X"
