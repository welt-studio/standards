# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-py-xxe
    message: "Dado controlado pelo usuário é lido por um parser XML que resolve entidades externas (XXE). Desligue a resolução (`resolve_entities=False`) ou use `defusedxml`."
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-611: Improper Restriction of XML External Entity Reference"
      codeql: py/xxe
      notes: |-
        Porta do `py/xxe` (XxeCustomizations.qll + XmlParsing.vulnerableTo(XXE) de Lxml.qll e Stdlib.qll
        para xml.sax/xml.dom com feature_external_ges ligada).
        lxml sem parser explícito (o padrão resolve entidades); `HTML` fica de fora, como no CodeQL.
        lxml com parser criado antes e que não desliga resolve_entities.
        lxml com parser criado na própria chamada.
        xml.sax / xml.dom com a feature de entidades externas ligada.
    mode: taint
    options:
      interfile: true
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
