# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-py-polynomial-redos
    message: "Texto controlado pelo usuário é testado contra uma expressão regular que pode levar tempo polinomial (quadrático ou pior) em entradas longas. Limite o tamanho da entrada ou reescreva a regex sem quantificadores sobrepostos."
    severity: WARNING
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-1333: Inefficient Regular Expression Complexity"
        - "CWE-730: OWASP Top Ten 2004 Category A9 - Denial of Service"
        - "CWE-400: Uncontrolled Resource Consumption"
      codeql: py/polynomial-redos
      notes: |-
        Porta APROXIMADA do `py/polynomial-redos` (PolynomialReDoSCustomizations.qll). O CodeQL roda a análise de
        NFA (SuperlinearBackTracking) sobre a regex; o Semgrep não tem isso. Aproximação: a regex literal que
        chega à chamada tem um átomo (\s \d \w . [classe]) com quantificador ilimitado repetido depois, ou um
        quantificador ilimitado logo antes de `$`; e o texto buscado vem do cliente.
        re.<fn>(regex, texto)
        padrão compilado na mesma função e executado depois
    mode: taint
    options:
      interfile: true
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  def $V(self, request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  async def $V(self, request, ..., $P, ...):
                    ...
          - metavariable-regex:
              metavariable: "$V"
              regex: "^(get|post|put|patch|delete|head|options|list|retrieve|create|update|partial_update|destroy|dispatch|form_valid|get_object|get_queryset)$"
          - focus-metavariable: "$P"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$D
                  def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  @$D(...)
                  def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  @$D
                  async def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  @$D(...)
                  async def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  async def $V(request, ..., $P, ...):
                    ...
          - pattern-not-inside: |
              def $V2(request: $T, ...):
                ...
          - pattern-not-inside: |
              async def $V2(request: $T, ...):
                ...
          - metavariable-regex:
              metavariable: "$V"
              regex: "^(?!_)"
          - focus-metavariable: "$P"
      - patterns:
          - pattern-either:
              - pattern: "request.$A"
              - pattern: "self.request.$A"
          - metavariable-regex:
              metavariable: "$A"
              regex: "^(args|form|values|json|data|files|cookies|headers|GET|POST|body|META|COOKIES|FILES|query_params|path_params|query|match_info|query_string|full_path|view_args|stream|environ|path|url|referrer|content_type)$"
      - patterns:
          - pattern-either:
              - pattern: "request.$M(...)"
              - pattern: "self.request.$M(...)"
              - pattern: "await request.$M(...)"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(get_json|get_data|json|form|body|post|text|read|get_full_path|get_host)$"
      - patterns:
          - pattern: "self.$M(...)"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(get_argument|get_arguments|get_query_argument|get_query_arguments|get_body_argument|get_body_arguments|get_cookie|get_secure_cookie)$"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$VERB(...)
                  def $F(..., $P: $T, ...):
                    ...
              - pattern-inside: |
                  @$APP.$VERB(...)
                  async def $F(..., $P: $T, ...):
                    ...
              - pattern-inside: |
                  @$APP.$VERB(...)
                  def $F(..., $P: $T = $D, ...):
                    ...
              - pattern-inside: |
                  @$APP.$VERB(...)
                  async def $F(..., $P: $T = $D, ...):
                    ...
          - metavariable-regex:
              metavariable: "$VERB"
              regex: "^(get|post|put|patch|delete|api_route|head|options|route|websocket)$"
          - metavariable-regex:
              metavariable: "$T"
              regex: "^(?!.*\\b(Depends|Security)\\()(?!\\s*(Request|Response|BackgroundTasks|WebSocket|HTTPConnection|Session|AsyncSession|SecurityScopes)\\s*$)"
          - focus-metavariable: "$P"
    pattern-sanitizers:
      - patterns:
          - pattern-inside: |
              if $U == "...":
                ...
          - pattern: "$U"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: 're.$F("$RE", $X, ...)'
              - pattern: 're.$F(r"$RE", $X, ...)'
              - pattern: 're.$F(pattern="$RE", string=$X, ...)'
              - pattern: 're.$F("$RE", string=$X, ...)'
          - metavariable-regex:
              metavariable: "$F"
              regex: "^(match|prefixmatch|fullmatch|search|split|findall|finditer)$"
          - metavariable-regex:
              metavariable: "$RE"
              regex: "(?s).*?(?:((?:\\\\[sdwSDW]|\\.|\\[(?:\\\\.|[^\\]\\\\])+\\]))[+*].*\\1[+*]|(?:\\\\[sdwSDW]|\\.|\\[(?:\\\\.|[^\\]\\\\])+\\])[+*]\\$|(?:\\\\[sdwSDW]|\\.|\\[(?:\\\\.|[^\\]\\\\])+\\])[+*]\\)?\\$)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: 're.$F("$RE", $A, $X, ...)'
              - pattern: 're.$F(r"$RE", $A, $X, ...)'
              - pattern: 're.$F("$RE", $A, string=$X, ...)'
          - metavariable-regex:
              metavariable: "$F"
              regex: "^(sub|subn)$"
          - metavariable-regex:
              metavariable: "$RE"
              regex: "(?s).*?(?:((?:\\\\[sdwSDW]|\\.|\\[(?:\\\\.|[^\\]\\\\])+\\]))[+*].*\\1[+*]|(?:\\\\[sdwSDW]|\\.|\\[(?:\\\\.|[^\\]\\\\])+\\])[+*]\\$|(?:\\\\[sdwSDW]|\\.|\\[(?:\\\\.|[^\\]\\\\])+\\])[+*]\\)?\\$)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-inside: |
              $P = re.compile("$RE", ...)
              ...
          - pattern-either:
              - pattern: "$P.$F($X, ...)"
              - pattern: "$P.$F(string=$X, ...)"
              - pattern: "$P.$F($A, $X, ...)"
          - metavariable-regex:
              metavariable: "$F"
              regex: "^(match|prefixmatch|fullmatch|search|split|findall|finditer|sub|subn)$"
          - metavariable-regex:
              metavariable: "$RE"
              regex: "(?s).*?(?:((?:\\\\[sdwSDW]|\\.|\\[(?:\\\\.|[^\\]\\\\])+\\]))[+*].*\\1[+*]|(?:\\\\[sdwSDW]|\\.|\\[(?:\\\\.|[^\\]\\\\])+\\])[+*]\\$|(?:\\\\[sdwSDW]|\\.|\\[(?:\\\\.|[^\\]\\\\])+\\])[+*]\\)?\\$)"
          - focus-metavariable: "$X"
