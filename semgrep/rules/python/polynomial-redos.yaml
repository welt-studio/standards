# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-py-polynomial-redos
    message: "Texto controlado pelo usuário é testado contra uma expressão regular que pode levar tempo polinomial (quadrático ou pior) em entradas longas. Limite o tamanho da entrada ou reescreva a regex sem quantificadores sobrepostos."
    severity: WARNING
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-1333: Inefficient Regular Expression Complexity"
        - "CWE-730: OWASP Top Ten 2004 Category A9 - Denial of Service"
        - "CWE-400: Uncontrolled Resource Consumption"
      codeql: py/polynomial-redos
      notes: |-
        Porta APROXIMADA do `py/polynomial-redos` (PolynomialReDoSCustomizations.qll). O CodeQL roda a análise de
        NFA (SuperlinearBackTracking) sobre a regex; o Semgrep não tem isso. Aproximação: a regex literal que
        chega à chamada tem um átomo (\s \d \w . [classe]) com quantificador ilimitado repetido depois, ou um
        quantificador ilimitado logo antes de `$`; e o texto buscado vem do cliente.
        re.<fn>(regex, texto)
        padrão compilado na mesma função e executado depois
