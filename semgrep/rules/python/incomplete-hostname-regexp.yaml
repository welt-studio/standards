# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-py-incomplete-hostname-regexp
    message: "A expressão regular tem um '.' sem escape antes do domínio, então casa mais hosts do que o esperado (o '.' casa qualquer caractere). Escape com `\\.`."
    severity: WARNING
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-20: Improper Input Validation"
      codeql: py/incomplete-hostname-regexp
      notes: "Literal de regex com um domínio de TLD comum cujo ponto não foi escapado."
    patterns:
      - pattern-either:
          - pattern: "re.$F($R, ...)"
          - pattern: "regex.$F($R, ...)"
      - metavariable-regex:
          metavariable: "$F"
          regex: "^(compile|match|search|fullmatch|findall|finditer|sub|subn|split)$"
      - metavariable-regex:
          metavariable: "$R"
          regex: "(?is)^[rRuUbB]*(\"\"\"|'''|\"|')(?!.*(re\\.escape)).*[a-z0-9)\\]-](?<!\\\\)\\.(com|org|edu|gov|uk|net|io)(?![a-z0-9])"
