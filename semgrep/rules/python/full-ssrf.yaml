                    ...
              - pattern-inside: |
                  class $C(..., django.views.generic.detail.$G, ...):
                    ...
              - pattern-inside: |
                  class $C(..., rest_framework.views.APIView, ...):
                    ...
              - pattern-inside: |
                  class $C(..., rest_framework.generics.$G, ...):
                    ...
              - pattern-inside: |
                  class $C(..., rest_framework.viewsets.$G, ...):
                    ...
              - pattern-inside: |
                  class $C(..., rest_framework.mixins.$G, ...):
                    ...
              - pattern-inside: |
                  class $C(..., tornado.web.RequestHandler, ...):
                    ...
          - pattern-either:
              - pattern-inside: |
                  def $V(self, $R, ..., $P, ...):
