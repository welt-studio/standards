# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-py-reflective-xss
    message: "Dado vindo da requisição é escrito na resposta HTML sem escape (XSS refletido). Escape o valor (markupsafe.escape, html.escape) ou use um template com autoescape."
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      codeql: py/reflective-xss
      notes: |-
        Flask/Werkzeug: atributos do `request` (Flask.qll, Werkzeug.qll).
        Parâmetros de rota (Flask, FastAPI, Starlette, Bottle...): variáveis da URL e do corpo.
        Django/DRF: parâmetros da view depois do `request` (vêm da URL).
        Tornado: argumentos e dados do RequestHandler (Tornado.qll).
        Flask: o retorno da rota é o corpo HTML da resposta.
    mode: taint
    options:
      interfile: true
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: "flask.request.$A"
              - pattern: "flask.request.$A(...)"
              - pattern: "bottle.request.$A"
              - pattern: "request.$A"
              - pattern: "self.request.$A"
          - metavariable-regex:
              metavariable: "$A"
              regex: "^(args|form|values|json|data|cookies|headers|files|stream|environ|view_args|query_string|url|base_url|full_path|path|path_info|script_root|url_root|host|host_url|referrer|user_agent|authorization|get_json|get_data|input_stream|GET|POST|COOKIES|META|FILES|body|get_full_path|get_full_path_info|get_host|build_absolute_uri|query_params|query|match_info|rel_url|json|text|read|content|path_params|params|matchdict|post|headers|raw_post_data)$"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $F(..., $P, ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  async def $F(..., $P, ...):
                    ...
          - metavariable-regex:
              metavariable: "$ROUTE"
              regex: "^(route|get|post|put|delete|patch|api_route|head|options)$"
          - focus-metavariable: "$P"
          - metavariable-regex:
              metavariable: "$P"
              regex: "^(?!self$|cls$|request$|response$)"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  def $F(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  def $F(self, request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  async def $F(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  async def $F(self, request, ..., $P, ...):
                    ...
          - focus-metavariable: "$P"
          - metavariable-regex:
              metavariable: "$P"
              regex: "^(?!self$|cls$|request$|args$|kwargs$)"
      - pattern-either:
          - pattern: "self.get_argument(...)"
          - pattern: "self.get_arguments(...)"
          - pattern: "self.get_query_argument(...)"
          - pattern: "self.get_query_arguments(...)"
          - pattern: "self.get_body_argument(...)"
          - pattern: "self.get_body_arguments(...)"
          - pattern: "self.get_cookie(...)"
          - pattern: "self.get_secure_cookie(...)"
          - pattern: self.path_args
          - pattern: self.path_kwargs
    pattern-sanitizers:
      - pattern: "escape(...)"
      - pattern: "flask.escape(...)"
      - pattern: "markupsafe.escape(...)"
      - pattern: "html.escape(...)"
      - pattern: "cgi.escape(...)"
      - pattern: "django.utils.html.escape(...)"
      - pattern: "django.utils.html.conditional_escape(...)"
      - pattern: "bleach.clean(...)"
      - pattern: "jsonify(...)"
      - pattern: "flask.jsonify(...)"
      - pattern: "int(...)"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "make_response($X, ...)"
              - pattern: "flask.make_response($X, ...)"
              - pattern: "flask.Response($X, ...)"
              - pattern: "django.http.HttpResponse($X, ...)"
              - pattern: "HttpResponse($X, ...)"
              - pattern: "HttpResponse(..., content=$X, ...)"
              - pattern: "django.http.HttpResponseBadRequest($X, ...)"
              - pattern: "HttpResponseBadRequest($X, ...)"
              - pattern: "HttpResponseNotFound($X, ...)"
              - pattern: "HttpResponseForbidden($X, ...)"
              - pattern: "HttpResponseServerError($X, ...)"
              - pattern: "HTMLResponse($X, ...)"
              - pattern: "HTMLResponse(..., content=$X, ...)"
              - pattern: "web.Response(..., text=$X, ...)"
              - pattern: "aiohttp.web.Response(..., text=$X, ...)"
              - pattern: "$S.write($X)"
              - pattern: "$S.finish($X)"
          - pattern-not: "$F(..., content_type=$CT, ...)"
          - pattern-not: "$F(..., mimetype=$CT, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.route(...)
                  def $F(...):
                    ...
              - pattern-inside: |
                  @$APP.route(...)
                  async def $F(...):
                    ...
          - pattern: "return $X"
          - focus-metavariable: "$X"
