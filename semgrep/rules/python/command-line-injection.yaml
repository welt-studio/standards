# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-py-command-line-injection
    message: "Dado vindo da requisição chega a um comando do sistema operacional (command injection). Evite shell=True e passe os argumentos como lista, ou escape com shlex.quote."
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      codeql: py/command-line-injection
      notes: |-
        Flask/Werkzeug: atributos do `request` (Flask.qll, Werkzeug.qll).
        Parâmetros de rota (Flask, FastAPI, Starlette, Bottle...): variáveis da URL e do corpo.
        Django/DRF: parâmetros da view depois do `request` (vêm da URL).
        Tornado: argumentos e dados do RequestHandler (Tornado.qll).
    mode: taint
    options:
      interfile: true
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: "flask.request.$A"
              - pattern: "flask.request.$A(...)"
              - pattern: "bottle.request.$A"
              - pattern: "request.$A"
              - pattern: "self.request.$A"
          - metavariable-regex:
              metavariable: "$A"
              regex: "^(args|form|values|json|data|cookies|headers|files|stream|environ|view_args|query_string|url|base_url|full_path|path|path_info|script_root|url_root|host|host_url|referrer|user_agent|authorization|get_json|get_data|input_stream|GET|POST|COOKIES|META|FILES|body|get_full_path|get_full_path_info|get_host|build_absolute_uri|query_params|query|match_info|rel_url|json|text|read|content|path_params|params|matchdict|post|headers|raw_post_data)$"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $F(..., $P, ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  async def $F(..., $P, ...):
                    ...
          - metavariable-regex:
              metavariable: "$ROUTE"
              regex: "^(route|get|post|put|delete|patch|api_route|head|options)$"
          - focus-metavariable: "$P"
          - metavariable-regex:
              metavariable: "$P"
              regex: "^(?!self$|cls$|request$|response$)"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  def $F(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  def $F(self, request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  async def $F(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  async def $F(self, request, ..., $P, ...):
                    ...
          - focus-metavariable: "$P"
          - metavariable-regex:
              metavariable: "$P"
              regex: "^(?!self$|cls$|request$|args$|kwargs$)"
      - pattern-either:
          - pattern: "self.get_argument(...)"
          - pattern: "self.get_arguments(...)"
          - pattern: "self.get_query_argument(...)"
          - pattern: "self.get_query_arguments(...)"
          - pattern: "self.get_body_argument(...)"
          - pattern: "self.get_body_arguments(...)"
          - pattern: "self.get_cookie(...)"
          - pattern: "self.get_secure_cookie(...)"
          - pattern: self.path_args
          - pattern: self.path_kwargs
    pattern-sanitizers:
      - pattern: "shlex.quote(...)"
      - pattern: "pipes.quote(...)"
      - pattern: "int(...)"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "os.$F($X, ...)"
              - pattern: "os.$F($M, $X, ...)"
              - pattern: "os.$F($M, $P, $X, ...)"
          - metavariable-regex:
              metavariable: "$F"
              regex: "^(system|popen|popen2|popen3|popen4|spawnl|spawnle|spawnlp|spawnlpe|spawnv|spawnve|spawnvp|spawnvpe|execl|execle|execlp|execlpe|execv|execve|execvp|execvpe|posix_spawn|posix_spawnp|startfile)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "subprocess.$F($X, ...)"
              - pattern: "subprocess.$F(..., args=$X, ...)"
              - pattern: "subprocess.Popen($X, ...)"
          - metavariable-regex:
              metavariable: "$F"
              regex: "^(Popen|call|check_call|check_output|run|getoutput|getstatusoutput)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "$M.$F($X, ...)"
              - pattern: "$M.$F($X)"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(platform|popen2|commands|asyncio|pexpect|fabric|invoke|paramiko|pty|sh|plumbum|ptyprocess)$"
          - metavariable-regex:
              metavariable: "$F"
              regex: "^(popen|popen2|popen3|popen4|Popen3|Popen4|getoutput|getstatusoutput|create_subprocess_shell|create_subprocess_exec|spawn|run|sudo|local|execute|exec_command|call|spawnu|runpty)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "$C.exec_command($X, ...)"
              - pattern: "$C.run($X, ...)"
              - pattern: "$C.sudo($X, ...)"
          - pattern-inside: |
              import $M
              ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(paramiko|fabric|invoke)$"
          - focus-metavariable: "$X"
