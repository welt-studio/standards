# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-py-stack-trace-exposure
    message: "Informação da exceção (mensagem ou stack trace) chega ao corpo da resposta HTTP e vaza detalhe interno ao cliente. Registre no log e devolva uma mensagem genérica."
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-209: Generation of Error Message Containing Sensitive Information"
      codeql: py/stack-trace-exposure
      notes: |-
        ExceptionInfo.qll: a exceção capturada, as oito funções do `traceback` e o sys.exc_info().
        Como no CodeQL: atributo da exceção capturada (`exc.detail`, `exc.messages`, `e.errors()`) é
        dado que a exceção carrega de propósito para o cliente, não o texto interno dela. Só o
        `args` e o `__traceback__` continuam.
        Flask: o retorno da rota, make_response/jsonify/Response (Flask.qll).
        RestFramework.qll: Response(arg0 | data=) e o `detail` das exceções da API.
        Django.qll / FastApi.qll: o conteúdo das classes de resposta.
        FastApi.qll (FastApiRequestHandlerReturn): o retorno da rota é o corpo da resposta.
        Além do CodeQL (decisão do PO): JSONResponse, PlainTextResponse e HTMLResponse do
        `starlette.responses`, que o Starlette.qll não modela mas expõem a exceção no corpo.
    mode: taint
    options:
      interfile: true
    pattern-sources:
      - patterns:
          - pattern-inside: |
              try:
                ...
              except $T as $E:
                ...
          - pattern: "$E"
      - patterns:
          - pattern: "traceback.$FMT(...)"
          - metavariable-regex:
              metavariable: "$FMT"
              regex: "^(extract_tb|extract_stack|format_list|format_exception_only|format_exception|format_exc|format_tb|format_stack)$"
      - pattern: "sys.exc_info()"
    pattern-sanitizers:
      - patterns:
          - pattern: "$O.$ATTR"
          - pattern-not-inside: "$O.$ATTR(...)"
          - metavariable-regex:
              metavariable: "$ATTR"
              regex: "^(?!args$|__traceback__$).+"
      - patterns:
          - pattern-inside: |
              try:
                ...
              except $T as $E:
                ...
          - pattern: "$E.$ATTR(...)"
          - metavariable-regex:
              metavariable: "$ATTR"
              regex: "^(?!args$|__traceback__$).+"
    pattern-propagators:
      - pattern: "$C.append($X)"
        from: "$X"
        to: "$C"
      - pattern: "$C.extend($X)"
        from: "$X"
        to: "$C"
      - pattern: "$C.add($X)"
        from: "$X"
        to: "$C"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.route(...)
                  def $F(...):
                    ...
              - pattern-inside: |
                  @$APP.route(...)
                  async def $F(...):
                    ...
          - pattern: "return $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "flask.jsonify($X, ...)"
              - pattern: "jsonify($X, ...)"
              - pattern: "flask.make_response($X, ...)"
              - pattern: "make_response($X, ...)"
              - pattern: "flask.Response($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "rest_framework.response.Response($X, ...)"
              - pattern: "rest_framework.response.Response(..., data=$X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "rest_framework.exceptions.$EXC($X, ...)"
              - pattern: "rest_framework.exceptions.$EXC(..., detail=$X, ...)"
          - metavariable-regex:
              metavariable: "$EXC"
              regex: "^(APIException|ValidationError|ParseError|AuthenticationFailed|NotAuthenticated|PermissionDenied|NotFound|NotAcceptable)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "rest_framework.exceptions.$EXC($Z, $X, ...)"
              - pattern: "rest_framework.exceptions.$EXC(..., detail=$X, ...)"
          - metavariable-regex:
              metavariable: "$EXC"
              regex: "^(MethodNotAllowed|UnsupportedMediaType|Throttled)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "rest_framework.fields.ValidationError($X, ...)"
              - pattern: "rest_framework.fields.ValidationError(..., detail=$X, ...)"
              - pattern: "rest_framework.serializers.ValidationError($X, ...)"
              - pattern: "rest_framework.serializers.ValidationError(..., detail=$X, ...)"
              - pattern: "rest_framework.validators.ValidationError($X, ...)"
              - pattern: "rest_framework.validators.ValidationError(..., detail=$X, ...)"
              - pattern: "rest_framework.pagination.NotFound($X, ...)"
              - pattern: "rest_framework.pagination.NotFound(..., detail=$X, ...)"
              - pattern: "rest_framework.parsers.ParseError($X, ...)"
              - pattern: "rest_framework.parsers.ParseError(..., detail=$X, ...)"
              - pattern: "rest_framework.renderers.ParseError($X, ...)"
              - pattern: "rest_framework.renderers.ParseError(..., detail=$X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "django.http.$R($X, ...)"
              - pattern: "django.http.$R(..., content=$X, ...)"
              - pattern: "django.http.response.$R($X, ...)"
              - pattern: "django.http.response.$R(..., content=$X, ...)"
          - metavariable-regex:
              metavariable: "$R"
              regex: "^(HttpResponse\\w*|JsonResponse|StreamingHttpResponse)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "fastapi.Response($X, ...)"
              - pattern: "fastapi.Response(..., content=$X, ...)"
              - pattern: "fastapi.responses.$R($X, ...)"
              - pattern: "fastapi.responses.$R(..., content=$X, ...)"
          - metavariable-regex:
              metavariable: "$R"
              regex: "^(Response|HTMLResponse|PlainTextResponse|JSONResponse|UJSONResponse|ORJSONResponse|StreamingResponse)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "starlette.responses.$R($X, ...)"
              - pattern: "starlette.responses.$R(..., content=$X, ...)"
          - metavariable-regex:
              metavariable: "$R"
              regex: "^(JSONResponse|PlainTextResponse|HTMLResponse)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-inside: |
              @$APP.$VERB(...)
              async def $F(...):
                ...
          - metavariable-regex:
              metavariable: "$VERB"
              regex: "^(get|post|put|patch|delete|api_route)$"
          - pattern: "return $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-inside: |
              @$APP.$VERB(...)
              def $F(...):
                ...
          - metavariable-regex:
              metavariable: "$VERB"
              regex: "^(get|post|put|patch|delete|api_route)$"
          - pattern: "return $X"
          - focus-metavariable: "$X"
