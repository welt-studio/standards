# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-py-bad-tag-filter
    message: "A expressão regular que filtra tags HTML erra casos que o navegador aceita (`</script >`, tags em maiúsculas, quebras de linha dentro da tag ou do comentário). Não filtre HTML com regex; use uma biblioteca de sanitização (bleach, nh3)."
    severity: WARNING
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-116: Improper Encoding or Escaping of Output"
        - "CWE-185: Incorrect Regular Expression"
      codeql: py/bad-tag-filter
      notes: |-
        A tag de fechamento é só `</script>`: não casa `</script >` nem `</script foo>`.
        `.` sem DOTALL entre as tags: não casa quebras de linha no conteúdo.
        Comentário `<!--.*-->` sem DOTALL.
        Só `script` minúsculo e sem IGNORECASE: não casa `<SCRIPT>`.
    pattern-either:
      - pattern-regex: "re\\.\\w+\\(\\s*[rRuU]?(\"\"\"|'''|\"|')[^\\n]*?<\\\\?/script>[^\\n]*?\\1"
      - pattern-regex: "re\\.\\w+\\(\\s*[rRuU]?(\"\"\"|'''|\"|')(?!\\(\\?[a-z]*s)[^\\n]*?<(?:\\(\\?:)?script[^\\n]*?\\.\\*[^\\n]*?\\1(?![^\\n)]*(?:DOTALL|re\\.S\\b))[^\\n)]*\\)"
      - pattern-regex: "re\\.\\w+\\(\\s*[rRuU]?(\"\"\"|'''|\"|')(?!\\(\\?[a-z]*s)[^\\n]*?<!--\\.\\*[^\\n]*?\\1(?![^\\n)]*(?:DOTALL|re\\.S\\b))[^\\n)]*\\)"
      - pattern-regex: "re\\.\\w+\\(\\s*[rRuU]?(\"\"\"|'''|\"|')(?!\\(\\?[a-z]*i)[^\\n]*?<\\(?script[^\\n]*?\\1(?![^\\n)]*(?:IGNORECASE|re\\.I\\b))[^\\n)]*\\)"
