# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-py-regex-injection
    message: "A expressão regular é montada com dado controlado pelo usuário (injeção de regex / ReDoS). Escape o valor com `re.escape` antes de usá-lo."
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-730: OWASP Top Ten 2004 Category A9 - Denial of Service"
        - "CWE-400: Uncontrolled Resource Consumption"
      codeql: py/regex-injection
      notes: |-
        Porta do `py/regex-injection` (RegexInjectionCustomizations.qll + RegexExecution de Stdlib.qll:
        funções do módulo `re` que executam a expressão na hora, e `re.compile`). Saneador: `re.escape`.
    mode: taint
    options:
      interfile: true
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  def $V(self, request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  async def $V(self, request, ..., $P, ...):
                    ...
          - metavariable-regex:
              metavariable: "$V"
              regex: "^(get|post|put|patch|delete|head|options|list|retrieve|create|update|partial_update|destroy|dispatch|form_valid|get_object|get_queryset)$"
          - focus-metavariable: "$P"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$D
                  def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  @$D(...)
                  def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  @$D
                  async def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  @$D(...)
                  async def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  async def $V(request, ..., $P, ...):
                    ...
          - pattern-not-inside: |
              def $V2(request: $T, ...):
                ...
          - pattern-not-inside: |
              async def $V2(request: $T, ...):
                ...
          - metavariable-regex:
              metavariable: "$V"
              regex: "^(?!_)"
          - focus-metavariable: "$P"
      - patterns:
          - pattern-either:
              - pattern: "request.$A"
              - pattern: "self.request.$A"
          - metavariable-regex:
              metavariable: "$A"
              regex: "^(args|form|values|json|data|files|cookies|headers|GET|POST|body|META|COOKIES|FILES|query_params|path_params|query|match_info|query_string|full_path|view_args|stream|environ|path|url|referrer|content_type)$"
      - patterns:
          - pattern-either:
              - pattern: "request.$M(...)"
              - pattern: "self.request.$M(...)"
              - pattern: "await request.$M(...)"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(get_json|get_data|json|form|body|post|text|read|get_full_path|get_host)$"
      - patterns:
          - pattern: "self.$M(...)"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(get_argument|get_arguments|get_query_argument|get_query_arguments|get_body_argument|get_body_arguments|get_cookie|get_secure_cookie)$"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$VERB(...)
                  def $F(..., $P: $T, ...):
                    ...
              - pattern-inside: |
                  @$APP.$VERB(...)
                  async def $F(..., $P: $T, ...):
                    ...
              - pattern-inside: |
                  @$APP.$VERB(...)
                  def $F(..., $P: $T = $D, ...):
                    ...
              - pattern-inside: |
                  @$APP.$VERB(...)
                  async def $F(..., $P: $T = $D, ...):
                    ...
          - metavariable-regex:
              metavariable: "$VERB"
              regex: "^(get|post|put|patch|delete|api_route|head|options|route|websocket)$"
          - metavariable-regex:
              metavariable: "$T"
              regex: "^(?!.*\\b(Depends|Security)\\()(?!\\s*(Request|Response|BackgroundTasks|WebSocket|HTTPConnection|Session|AsyncSession|SecurityScopes)\\s*$)"
          - focus-metavariable: "$P"
    pattern-sanitizers:
      - pattern: "re.escape(...)"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "re.$M($X, ...)"
              - pattern: "re.$M(pattern=$X, ...)"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(match|prefixmatch|fullmatch|search|split|findall|finditer|sub|subn|compile)$"
          - focus-metavariable: "$X"
