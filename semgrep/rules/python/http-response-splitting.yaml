# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-py-http-response-splitting
    message: "Dado vindo da requisição chega a um cabeçalho da resposta HTTP sem remover quebras de linha (header injection / response splitting)."
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-113: Improper Neutralization of CRLF Sequences in HTTP Headers ('HTTP Response Splitting')"
      codeql: py/http-response-splitting
      notes: |-
        Flask/Werkzeug: atributos do `request` (Flask.qll, Werkzeug.qll).
        Parâmetros de rota (Flask, FastAPI, Starlette, Bottle...): variáveis da URL e do corpo.
        Django/DRF: parâmetros da view depois do `request` (vêm da URL).
        Tornado: argumentos e dados do RequestHandler (Tornado.qll).
        http.server: cabeçalhos e caminho da requisição (Stdlib.qll, BaseHTTPRequestHandler).
        WSGI: o `environ` da aplicação.
        Remover \n do valor (ReplaceLineBreaksSanitizer, HttpHeaderInjectionCustomizations.qll).
        Flask / Werkzeug: só o NOME do cabeçalho (o valor é rejeitado pelo framework).
        http.server: o nome e o valor.
        WSGI: start_response(status, headers).
        Django, FastAPI, Tornado, Bottle e Aiohttp não têm sumidouro: rejeitam quebra de linha.
    mode: taint
    options:
      interfile: true
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: "flask.request.$A"
              - pattern: "flask.request.$A(...)"
              - pattern: "bottle.request.$A"
              - pattern: "request.$A"
              - pattern: "self.request.$A"
          - metavariable-regex:
              metavariable: "$A"
              regex: "^(args|form|values|json|data|cookies|headers|files|stream|environ|view_args|query_string|url|base_url|full_path|path|path_info|script_root|url_root|host|host_url|referrer|user_agent|authorization|get_json|get_data|input_stream|GET|POST|COOKIES|META|FILES|body|get_full_path|get_full_path_info|get_host|build_absolute_uri|query_params|query|match_info|rel_url|json|text|read|content|path_params|params|matchdict|post|headers|raw_post_data)$"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $F(..., $P, ...):
                    ...
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  async def $F(..., $P, ...):
                    ...
          - metavariable-regex:
              metavariable: "$ROUTE"
              regex: "^(route|get|post|put|delete|patch|api_route|head|options)$"
          - focus-metavariable: "$P"
          - metavariable-regex:
              metavariable: "$P"
              regex: "^(?!self$|cls$|request$|response$)"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  def $V(self, request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  async def $V(self, request, ..., $P, ...):
                    ...
          - metavariable-regex:
              metavariable: "$V"
              regex: "^(get|post|put|patch|delete|head|options|list|retrieve|create|update|partial_update|destroy|dispatch|form_valid|get_object|get_queryset)$"
          - focus-metavariable: "$P"
          - metavariable-regex:
              metavariable: "$P"
              regex: "^(?!self$|cls$|request$|args$|kwargs$)"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$D
                  def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  @$D(...)
                  def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  @$D
                  async def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  @$D(...)
                  async def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  async def $V(request, ..., $P, ...):
                    ...
          - pattern-not-inside: |
              def $V2(request: $T, ...):
                ...
          - pattern-not-inside: |
              async def $V2(request: $T, ...):
                ...
          - metavariable-regex:
              metavariable: "$V"
              regex: "^(?!_)"
          - focus-metavariable: "$P"
          - metavariable-regex:
              metavariable: "$P"
              regex: "^(?!self$|cls$|request$|args$|kwargs$)"
      - pattern-either:
          - pattern: "self.get_argument(...)"
          - pattern: "self.get_arguments(...)"
          - pattern: "self.get_query_argument(...)"
          - pattern: "self.get_query_arguments(...)"
          - pattern: "self.get_body_argument(...)"
          - pattern: "self.get_body_arguments(...)"
          - pattern: "self.get_cookie(...)"
          - pattern: "self.get_secure_cookie(...)"
          - pattern: self.path_args
          - pattern: self.path_kwargs
      - patterns:
          - pattern-either:
              - pattern: self.headers
              - pattern: self.path
          - pattern-either:
              - pattern-inside: |
                  class $C(http.server.BaseHTTPRequestHandler):
                    ...
              - pattern-inside: |
                  class $C(http.server.SimpleHTTPRequestHandler):
                    ...
              - pattern-inside: |
                  class $C(http.server.CGIHTTPRequestHandler):
                    ...
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  def $APP(environ, start_response):
                    ...
              - pattern-inside: |
                  def $APP(self, environ, start_response):
                    ...
          - pattern: environ
    pattern-sanitizers:
      - patterns:
          - pattern: "$X.replace(\"\\n\", ...)"
      - pattern: "int(...)"
        exact: true
      - patterns:
          - pattern-inside: |
              $Y = int(...)
              ...
          - pattern: "$Y"
    pattern-sinks:
      - patterns:
          - pattern: "$R.headers.$M($N, ...)"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(add|add_header|set|setdefault)$"
          - pattern-either:
              - pattern-inside: |
                  from flask import $X
                  ...
              - pattern-inside: |
                  from werkzeug.datastructures import $X
                  ...
              - pattern-inside: |
                  import flask
                  ...
              - pattern-inside: |
                  import werkzeug
                  ...
          - focus-metavariable: "$N"
      - patterns:
          - pattern-inside: |
              $H = werkzeug.datastructures.Headers(...)
              ...
          - pattern: "$H.$M($N, ...)"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(add|add_header|set|setdefault)$"
          - focus-metavariable: "$N"
      - patterns:
          - pattern-either:
              - pattern: "$R.headers[$N] = $V"
              - pattern: "$R.headers.extend($N)"
          - pattern-either:
              - pattern-inside: |
                  from flask import $X
                  ...
              - pattern-inside: |
                  from werkzeug.datastructures import $X
                  ...
              - pattern-inside: |
                  import flask
                  ...
              - pattern-inside: |
                  import werkzeug
                  ...
          - focus-metavariable: "$N"
      - patterns:
          - pattern-either:
              - pattern: "flask.make_response($B, {$N: $V, ...})"
              - pattern: "flask.make_response($B, [($N, $V), ...])"
              - pattern: "flask.make_response($B, $S, {$N: $V, ...}, ...)"
              - pattern: "flask.make_response($B, $S, [($N, $V), ...], ...)"
              - pattern: "flask.make_response(..., headers={$N: $V, ...}, ...)"
              - pattern: "flask.make_response(..., headers=[($N, $V), ...], ...)"
              - pattern: "flask.Response($B, $S, {$N: $V, ...}, ...)"
              - pattern: "flask.Response($B, $S, [($N, $V), ...], ...)"
              - pattern: "flask.Response(..., headers={$N: $V, ...}, ...)"
              - pattern: "flask.Response(..., headers=[($N, $V), ...], ...)"
          - focus-metavariable: "$N"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $C(http.server.BaseHTTPRequestHandler):
                    ...
              - pattern-inside: |
                  class $C(http.server.SimpleHTTPRequestHandler):
                    ...
              - pattern-inside: |
                  class $C(http.server.CGIHTTPRequestHandler):
                    ...
          - pattern: "self.send_header($N, $V)"
          - focus-metavariable: "$N"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $C(http.server.BaseHTTPRequestHandler):
                    ...
              - pattern-inside: |
                  class $C(http.server.SimpleHTTPRequestHandler):
                    ...
              - pattern-inside: |
                  class $C(http.server.CGIHTTPRequestHandler):
                    ...
          - pattern: "self.send_header($N, $V)"
          - focus-metavariable: "$V"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $C(http.server.SimpleHTTPRequestHandler):
                    ...
              - pattern-inside: |
                  class $C(http.server.CGIHTTPRequestHandler):
                    ...
          - pattern: "$S.extra_response_headers = $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "http.server.SimpleHTTPRequestHandler(..., extra_response_headers=$X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "start_response($ST, $X, ...)"
          - focus-metavariable: "$X"
