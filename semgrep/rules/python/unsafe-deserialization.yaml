# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-py-unsafe-deserialization
    message: "Dado controlado pelo usuário é desserializado por um formato que pode executar código (pickle, marshal, YAML inseguro, dill...). Use um formato só de dados, como JSON, ou `yaml.safe_load`."
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-502: Deserialization of Untrusted Data"
      codeql: py/unsafe-deserialization
      notes: |-
        Porta do `py/unsafe-deserialization` (UnsafeDeserializationCustomizations.qll + Decoding com
        mayExecuteInput de Stdlib.qll, Yaml.qll, RuamelYaml.qll, Dill.qll, JsonPickle.qll, Joblib.qll,
        Pandas.qll, Numpy.qll, Torch.qll).
        yaml.load com Loader que não é o seguro (SafeLoader/BaseLoader e as versões C).
    mode: taint
    options:
      interfile: true
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  def $V(self, request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  async def $V(self, request, ..., $P, ...):
                    ...
          - metavariable-regex:
              metavariable: "$V"
              regex: "^(get|post|put|patch|delete|head|options|list|retrieve|create|update|partial_update|destroy|dispatch|form_valid|get_object|get_queryset)$"
          - focus-metavariable: "$P"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$D
                  def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  @$D(...)
                  def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  @$D
                  async def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  @$D(...)
                  async def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  def $V(request, ..., $P, ...):
                    ...
              - pattern-inside: |
                  async def $V(request, ..., $P, ...):
                    ...
          - pattern-not-inside: |
              def $V2(request: $T, ...):
                ...
          - pattern-not-inside: |
              async def $V2(request: $T, ...):
                ...
          - metavariable-regex:
              metavariable: "$V"
              regex: "^(?!_)"
          - focus-metavariable: "$P"
      - patterns:
          - pattern-either:
              - pattern: "request.$A"
              - pattern: "self.request.$A"
          - metavariable-regex:
              metavariable: "$A"
              regex: "^(args|form|values|json|data|files|cookies|headers|GET|POST|body|META|COOKIES|FILES|query_params|path_params|query|match_info|query_string|full_path|view_args|stream|environ|path|url|referrer|content_type)$"
      - patterns:
          - pattern-either:
              - pattern: "request.$M(...)"
              - pattern: "self.request.$M(...)"
              - pattern: "await request.$M(...)"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(get_json|get_data|json|form|body|post|text|read|get_full_path|get_host)$"
      - patterns:
          - pattern: "self.$M(...)"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(get_argument|get_arguments|get_query_argument|get_query_arguments|get_body_argument|get_body_arguments|get_cookie|get_secure_cookie)$"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$VERB(...)
                  def $F(..., $P: $T, ...):
                    ...
              - pattern-inside: |
                  @$APP.$VERB(...)
                  async def $F(..., $P: $T, ...):
                    ...
              - pattern-inside: |
                  @$APP.$VERB(...)
                  def $F(..., $P: $T = $D, ...):
                    ...
              - pattern-inside: |
                  @$APP.$VERB(...)
                  async def $F(..., $P: $T = $D, ...):
                    ...
          - metavariable-regex:
              metavariable: "$VERB"
              regex: "^(get|post|put|patch|delete|api_route|head|options|route|websocket)$"
          - metavariable-regex:
              metavariable: "$T"
              regex: "^(?!.*\\b(Depends|Security)\\()(?!\\s*(Request|Response|BackgroundTasks|WebSocket|HTTPConnection|Session|AsyncSession|SecurityScopes)\\s*$)"
          - focus-metavariable: "$P"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "pickle.load($X, ...)"
              - pattern: "pickle.loads($X, ...)"
              - pattern: "pickle.Unpickler($X, ...)"
              - pattern: "cPickle.load($X, ...)"
              - pattern: "cPickle.loads($X, ...)"
              - pattern: "_pickle.load($X, ...)"
              - pattern: "_pickle.loads($X, ...)"
              - pattern: "dill.load($X, ...)"
              - pattern: "dill.loads($X, ...)"
              - pattern: "marshal.load($X)"
              - pattern: "marshal.loads($X)"
              - pattern: "shelve.open($X, ...)"
              - pattern: "jsonpickle.decode($X, ...)"
              - pattern: "jsonpickle.unpickler.decode($X, ...)"
              - pattern: "joblib.load($X, ...)"
              - pattern: "pandas.read_pickle($X, ...)"
              - pattern: "numpy.load($X, ..., allow_pickle=True, ...)"
              - pattern: "torch.jit.load($X, ...)"
              - pattern: "torch.load($X, ...)"
              - pattern: "yaml.full_load($X, ...)"
              - pattern: "yaml.full_load_all($X, ...)"
              - pattern: "yaml.unsafe_load($X, ...)"
              - pattern: "yaml.unsafe_load_all($X, ...)"
              - pattern: "yaml.load($X)"
              - pattern: "yaml.load_all($X)"
              - pattern: "ruamel.yaml.load($X)"
              - pattern: "ruamel.yaml.load_all($X)"
          - pattern-not: "torch.load($X, ..., pickle_module=$PM, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "yaml.load($X, $L, ...)"
              - pattern: "yaml.load($X, ..., Loader=$L, ...)"
              - pattern: "yaml.load_all($X, $L, ...)"
              - pattern: "yaml.load_all($X, ..., Loader=$L, ...)"
              - pattern: "ruamel.yaml.load($X, $L, ...)"
              - pattern: "ruamel.yaml.load($X, ..., Loader=$L, ...)"
          - metavariable-regex:
              metavariable: "$L"
              regex: "^(?!(yaml\\.|ruamel\\.yaml\\.)?C?(Safe|Base)Loader$)"
          - focus-metavariable: "$X"
