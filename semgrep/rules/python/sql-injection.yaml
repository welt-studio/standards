# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-py-sql-injection
    message: "Dado vindo da requisição é concatenado/interpolado numa consulta SQL (SQL injection). Use consultas parametrizadas."
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      codeql: py/sql-injection
      notes: |-
        Flask/Werkzeug: atributos do `request` (Flask.qll, Werkzeug.qll).
        Parâmetros de rota (Flask, FastAPI, Starlette, Bottle...): variáveis da URL e do corpo.
        Django/DRF: parâmetros da view depois do `request` (vêm da URL).
        Tornado: argumentos e dados do RequestHandler (Tornado.qll).
        Construtores do SQLAlchemy ORM/Core parametrizam o valor: o dado não vira SQL.
    mode: taint
    options:
      interfile: true
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: "flask.request.$A(...)"
              - pattern: "flask.request.$A"
              - pattern: "bottle.request.$A"
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          def $V(..., $R: fastapi.Request, ...):
                            ...
                      - pattern-inside: |
