# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-py-ldap-injection
    message: "Dado vindo da requisição monta o DN ou o filtro de uma consulta LDAP sem escape (LDAP injection). Use escape_filter_chars e escape_dn_chars."
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-90: Improper Neutralization of Special Elements used in an LDAP Query ('LDAP Injection')"
      codeql: py/ldap-injection
      notes: |-
        Flask/Werkzeug: atributos do `request` (Flask.qll, Werkzeug.qll).
        Parâmetros de rota (Flask, FastAPI, Starlette, Bottle...): variáveis da URL e do corpo.
        Django/DRF: parâmetros da view depois do `request` (vêm da URL).
        Tornado: argumentos e dados do RequestHandler (Tornado.qll).
        python-ldap: search_s/search/search_st/search_ext/search_ext_s (DN base e filtro).
    mode: taint
    options:
      interfile: true
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: "flask.request.$A(...)"
              - pattern: "flask.request.$A"
              - pattern: "bottle.request.$A"
