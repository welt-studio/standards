# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-py-nosql-injection
    message: "Consulta NoSQL (MongoDB) montada com dado controlado pelo usuário. Um dicionário vindo do cliente injeta operadores (`$ne`, `$where`...); valide o formato ou use `mongosanitizer.sanitize`."
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      codeql: py/nosql-injection
      notes: |-
        Porta do `py/nosql-injection` (NoSqlInjectionCustomizations.qll + PyMongo.qll). O CodeQL separa dado
        "string" de dado "dicionário": só o dicionário (JSON decodificado) vira operador do MongoDB, e um
        valor string solto dentro de `{"campo": valor}` não é injeção. Aqui os rótulos STR e DICT fazem isso:
        `json.loads` troca STR por DICT. `$where`/`$function` executam JavaScript e aceitam string.
        Filtro passado a métodos da coleção (find, find_one, ...): só dicionário.
        $where, $function, $accumulator e map_reduce executam JavaScript: vulneráveis também a string.
    mode: taint
    options:
      interfile: true
    pattern-sources:
      - label: STR
        patterns:
          - pattern-either:
              - pattern-inside: |
                  class $C(..., django.views.View, ...):
                    ...
              - pattern-inside: |
                  class $C(..., django.views.generic.$G, ...):
                    ...
              - pattern-inside: |
                  class $C(..., django.views.generic.base.$G, ...):
                    ...
              - pattern-inside: |
                  class $C(..., django.views.generic.edit.$G, ...):
                    ...
              - pattern-inside: |
                  class $C(..., django.views.generic.list.$G, ...):
                    ...
              - pattern-inside: |
                  class $C(..., django.views.generic.detail.$G, ...):
                    ...
              - pattern-inside: |
                  class $C(..., rest_framework.views.APIView, ...):
                    ...
              - pattern-inside: |
                  class $C(..., rest_framework.generics.$G, ...):
                    ...
              - pattern-inside: |
                  class $C(..., rest_framework.viewsets.$G, ...):
                    ...
              - pattern-inside: |
                  class $C(..., rest_framework.mixins.$G, ...):
                    ...
              - pattern-inside: |
                  class $C(..., tornado.web.RequestHandler, ...):
                    ...
          - pattern-either:
              - pattern-inside: |
                  def $V(self, $R, ..., $P, ...):
                    ...
              - pattern-inside: |
                  async def $V(self, $R, ..., $P, ...):
                    ...
          - metavariable-regex:
              metavariable: "$V"
              regex: "^(get|post|put|patch|delete|head|options|list|retrieve|create|update|partial_update|destroy|dispatch|form_valid|get_object|get_queryset)$"
          - focus-metavariable: "$P"
