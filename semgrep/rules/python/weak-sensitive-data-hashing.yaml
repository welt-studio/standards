# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-py-weak-sensitive-data-hashing
    message: "Dado sensível (senha, segredo, certificado...) entra num hash inadequado. Para senha use bcrypt, scrypt, argon2 ou PBKDF2; para outros dados, SHA-256 ou superior."
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
        - "CWE-328: Use of Weak Hash"
        - "CWE-916: Use of Password Hash With Insufficient Computational Effort"
      codeql: py/weak-sensitive-data-hashing
      notes: |-
        Porta do `py/weak-sensitive-data-hashing` (WeakSensitiveDataHashingCustomizations.qll + SensitiveDataSources.qll
        + Cryptography::HashingAlgorithm de Cryptodome.qll, Cryptography.qll, Stdlib hashlib).
        Dois fluxos, como no CodeQL: senha (rótulo PW) em qualquer hash simples (SHA-256 incluído, pois não é
        custoso); outro dado sensível (rótulo SENS) só em hash fraco (MD5, SHA-1...). Sensível = pelo NOME
        (SensitiveDataHeuristics.qll), em variável, parâmetro, atributo, chave ou chamada.
    mode: taint
    options:
      interfile: true
    pattern-sources:
      - label: PW
        patterns:
          - pattern-either:
              - pattern: "$V = $E"
              - pattern: "$V: $T = $E"
          - metavariable-regex:
              metavariable: "$V"
              regex: "(?is)^(?!.*(?:redact|censor|obfuscate|hash|md5|sha|random|(?<!unen)crypt|(?<!un)encode|certain|concert|secretar|wildcard|coauthor|account(?:ant|ab|ing|ed)|(?<!pro)file|path|(?:[_-]|\\b)url)).*(?:pass(?:wd|word|code|.?phrase)(?!.*question)|auth(?:entication|ori[sz]ation)?.?key|oauth|api.?(?:key|tok)|(?:[_-]|\\b)mfa(?:[_-]|\\b))"
          - focus-metavariable: "$E"
      - label: PW
        patterns:
          - pattern-inside: |
              def $F(..., $P, ...):
                ...
          - metavariable-regex:
              metavariable: "$P"
              regex: "(?is)^(?!.*(?:redact|censor|obfuscate|hash|md5|sha|random|(?<!unen)crypt|(?<!un)encode|certain|concert|secretar|wildcard|coauthor|account(?:ant|ab|ing|ed)|(?<!pro)file|path|(?:[_-]|\\b)url)).*(?:pass(?:wd|word|code|.?phrase)(?!.*question)|auth(?:entication|ori[sz]ation)?.?key|oauth|api.?(?:key|tok)|(?:[_-]|\\b)mfa(?:[_-]|\\b))"
          - focus-metavariable: "$P"
      - label: PW
        patterns:
          - pattern-inside: |
              def $F(..., $P: $T, ...):
                ...
          - metavariable-regex:
              metavariable: "$P"
              regex: "(?is)^(?!.*(?:redact|censor|obfuscate|hash|md5|sha|random|(?<!unen)crypt|(?<!un)encode|certain|concert|secretar|wildcard|coauthor|account(?:ant|ab|ing|ed)|(?<!pro)file|path|(?:[_-]|\\b)url)).*(?:pass(?:wd|word|code|.?phrase)(?!.*question)|auth(?:entication|ori[sz]ation)?.?key|oauth|api.?(?:key|tok)|(?:[_-]|\\b)mfa(?:[_-]|\\b))"
          - focus-metavariable: "$P"
      - label: PW
        patterns:
          - pattern: "$O.$A"
          - metavariable-regex:
              metavariable: "$A"
              regex: "(?is)^(?!.*(?:redact|censor|obfuscate|hash|md5|sha|random|(?<!unen)crypt|(?<!un)encode|certain|concert|secretar|wildcard|coauthor|account(?:ant|ab|ing|ed)|(?<!pro)file|path|(?:[_-]|\\b)url)).*(?:pass(?:wd|word|code|.?phrase)(?!.*question)|auth(?:entication|ori[sz]ation)?.?key|oauth|api.?(?:key|tok)|(?:[_-]|\\b)mfa(?:[_-]|\\b))"
