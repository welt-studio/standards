    languages:
      - yaml
    metadata:
      category: security
      cwe: "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      codeql: actions/artifact-poisoning/critical
      confidence: MEDIUM
      technology:
        - github-actions
      notes: |-
        download em diretório temporário não conta (isSubpath com o caminho do passo seguinte)
        download em diretório temporário não conta (isSubpath com o caminho do passo seguinte)
        download em diretório temporário não conta (isSubpath com o caminho do passo seguinte)
        download em diretório temporário não conta (isSubpath com o caminho do passo seguinte)
