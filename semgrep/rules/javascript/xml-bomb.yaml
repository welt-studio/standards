# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-xml-bomb
    languages:
      - javascript
      - typescript
    severity: ERROR
    mode: taint
    options:
      interfile: true
    message: "O parse de XML depende de um valor controlado pelo usuário e não protege contra a expansão descontrolada de entidades (XML bomb). Use um parser que não expanda entidades."
    metadata:
      category: security
      cwe: "CWE-776: Improper Restriction of Recursive Entity References in DTDs"
      codeql: js/xml-bomb
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: "$REQ.query"
              - pattern: "$REQ.body"
              - pattern: "$REQ.params"
              - pattern: "$REQ.headers"
              - pattern: "$REQ.cookies"
              - pattern: "$REQ.url"
              - pattern: "$REQ.originalUrl"
              - pattern: "$REQ.path"
              - pattern: "$REQ.hostname"
              - pattern: "$REQ.host"
              - pattern: "$REQ.param(...)"
              - pattern: "$REQ.header(...)"
              - pattern: "$REQ.get(...)"
          - metavariable-regex:
              metavariable: "$REQ"
              regex: "^(req|request|ctx|ctx\\.request|this\\.request)$"
      - pattern-either:
          - pattern: location.search
          - pattern: location.hash
          - pattern: location.href
          - pattern: location.pathname
          - pattern: window.location.search
          - pattern: window.location.hash
          - pattern: window.location.href
          - pattern: document.location.search
          - pattern: document.location.hash
          - pattern: document.location.href
          - pattern: document.URL
          - pattern: document.documentURI
          - pattern: document.referrer
          - pattern: document.cookie
          - pattern: window.name
      - patterns:
          - pattern: "$EV.data"
          - pattern-either:
              - pattern-inside: |
                  $W.addEventListener("message", function ($EV, ...) {...})
              - pattern-inside: |
                  $W.addEventListener("message", ($EV, ...) => {...})
              - pattern-inside: |
                  addEventListener("message", function ($EV, ...) {...})
              - pattern-inside: |
                  addEventListener("message", ($EV, ...) => {...})
              - pattern-inside: |
                  $W.onmessage = ($EV) => {...}
              - pattern-inside: |
                  function $F($EV, ...) {...}
                  ...
                  $W.addEventListener("message", $F.bind($THIS))
              - pattern-inside: |
                  function $F($A, $EV, ...) {...}
                  ...
                  $W.addEventListener("message", $F.bind($THIS, $B))
              - pattern-inside: |
                  function $F($A, $B, $EV, ...) {...}
                  ...
                  $W.addEventListener("message", $F.bind($THIS, $C, $D))
      - patterns:
          - pattern: data
          - pattern-either:
              - pattern-inside: |
                  $W.addEventListener("message", function ({data}) {...})
              - pattern-inside: |
                  $W.addEventListener("message", ({data}) => {...})
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "new DOMParser().parseFromString($X, ...)"
              - pattern: "new ActiveXObject(...).loadXML($X)"
              - pattern: "$.parseXML($X)"
              - pattern: "jQuery.parseXML($X)"
              - pattern: "goog.dom.xml.loadXml($X)"
              - pattern: "libxmljs.parseXml($X, {..., noent: true, ...})"
              - pattern: "libxmljs.parseXmlString($X, {..., noent: true, ...})"
              - pattern: |
                  $P = new expat.Parser(...);
                  ...
                  $P.write($X)
              - pattern: |
                  $P = new expat.Parser(...);
                  ...
                  $P.parse($X)
          - focus-metavariable: "$X"
