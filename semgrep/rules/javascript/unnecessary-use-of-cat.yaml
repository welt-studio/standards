          - pattern: "shelljs.exec($C, {encoding: $E}, ($OUT) => ...);"
          - pattern: "shelljs.exec($C, function ($OUT) {...});"
          - pattern: "shelljs.exec($C, {encoding: $E}, function ($OUT) {...});"
          - pattern: "shelljs.exec($C, ($ERR, $OUT) => {...});"
          - pattern: "shelljs.exec($C, {encoding: $E}, ($ERR, $OUT) => {...});"
          - pattern: "shelljs.exec($C, function ($ERR, $OUT) {...});"
          - pattern: "shelljs.exec($C, ($ERR, $OUT) => ...);"
          - pattern: "shelljs.exec($C, ($OUT) => ...);"
          - pattern: "shelljs.exec($C, function ($OUT) {...});"
          - pattern: "shelljs.exec($C, ($ERR, $OUT) => {...});"
          - pattern: "child_process.exec($C);"
          - pattern: "child_process.exec($C, {encoding: $E});"
          - pattern: "child_process.exec($C, function ($ERR, $OUT) {...});"
          - pattern: "child_process.exec($C, {encoding: $E}, function ($ERR, $OUT) {...});"
