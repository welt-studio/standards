# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-unnecessary-use-of-cat
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "Uso desnecessário do processo `cat`: ler arquivo por um processo é complexo, ineficiente, não portável e abre espaço para injeção. Use fs.readFile(..) ou fs.readFileSync(..)."
    metadata:
      category: security
      cwe: "CWE-078: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      codeql: js/unnecessary-use-of-cat
    patterns:
      - pattern-either:
          - pattern: "execSync($C)"
          - pattern: "execSync($C, {encoding: $E})"
          - pattern: "$CP.execSync($C)"
          - pattern: "$CP.execSync($C, {encoding: $E})"
          - pattern: "child_process.execSync($C)"
          - pattern: "child_process.execSync($C, {encoding: $E})"
          - pattern: "exec($C);"
          - pattern: "exec($C, {encoding: $E});"
          - pattern: "exec($C, function ($ERR, $OUT) {...});"
          - pattern: "exec($C, {encoding: $E}, function ($ERR, $OUT) {...});"
          - pattern: "exec($C, ($ERR, $OUT) => ...);"
          - pattern: "exec($C, {encoding: $E}, ($ERR, $OUT) => ...);"
          - pattern: "exec($C, ($OUT) => ...);"
          - pattern: "exec($C, {encoding: $E}, ($OUT) => ...);"
          - pattern: "exec($C, function ($OUT) {...});"
          - pattern: "exec($C, {encoding: $E}, function ($OUT) {...});"
          - pattern: "exec($C, ($ERR, $OUT) => {...});"
          - pattern: "exec($C, {encoding: $E}, ($ERR, $OUT) => {...});"
          - pattern: "exec($C, function ($ERR, $OUT) {...});"
          - pattern: "exec($C, ($ERR, $OUT) => ...);"
          - pattern: "exec($C, ($OUT) => ...);"
          - pattern: "exec($C, function ($OUT) {...});"
          - pattern: "exec($C, ($ERR, $OUT) => {...});"
          - pattern: "$CP.exec($C);"
          - pattern: "$CP.exec($C, {encoding: $E});"
          - pattern: "$CP.exec($C, function ($ERR, $OUT) {...});"
          - pattern: "$CP.exec($C, {encoding: $E}, function ($ERR, $OUT) {...});"
          - pattern: "$CP.exec($C, ($ERR, $OUT) => ...);"
          - pattern: "$CP.exec($C, {encoding: $E}, ($ERR, $OUT) => ...);"
          - pattern: "$CP.exec($C, ($OUT) => ...);"
          - pattern: "$CP.exec($C, {encoding: $E}, ($OUT) => ...);"
          - pattern: "$CP.exec($C, function ($OUT) {...});"
          - pattern: "$CP.exec($C, {encoding: $E}, function ($OUT) {...});"
          - pattern: "$CP.exec($C, ($ERR, $OUT) => {...});"
          - pattern: "$CP.exec($C, {encoding: $E}, ($ERR, $OUT) => {...});"
          - pattern: "$CP.exec($C, function ($ERR, $OUT) {...});"
          - pattern: "$CP.exec($C, ($ERR, $OUT) => ...);"
          - pattern: "$CP.exec($C, ($OUT) => ...);"
          - pattern: "$CP.exec($C, function ($OUT) {...});"
          - pattern: "$CP.exec($C, ($ERR, $OUT) => {...});"
          - pattern: "shelljs.exec($C);"
          - pattern: "shelljs.exec($C, {encoding: $E});"
          - pattern: "shelljs.exec($C, function ($ERR, $OUT) {...});"
          - pattern: "shelljs.exec($C, {encoding: $E}, function ($ERR, $OUT) {...});"
          - pattern: "shelljs.exec($C, ($ERR, $OUT) => ...);"
          - pattern: "shelljs.exec($C, {encoding: $E}, ($ERR, $OUT) => ...);"
