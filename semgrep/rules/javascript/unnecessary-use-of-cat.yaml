          - pattern: "child_process.exec($C, ($ERR, $OUT) => ...);"
          - pattern: "child_process.exec($C, ($OUT) => ...);"
          - pattern: "child_process.exec($C, function ($OUT) {...});"
          - pattern: "child_process.exec($C, ($ERR, $OUT) => {...});"
          - pattern: "execmod($C);"
          - pattern: "execmod($C, {encoding: $E});"
          - pattern: "execmod($C, function ($ERR, $OUT) {...});"
          - pattern: "execmod($C, {encoding: $E}, function ($ERR, $OUT) {...});"
          - pattern: "execmod($C, ($ERR, $OUT) => ...);"
          - pattern: "execmod($C, {encoding: $E}, ($ERR, $OUT) => ...);"
          - pattern: "execmod($C, ($OUT) => ...);"
          - pattern: "execmod($C, {encoding: $E}, ($OUT) => ...);"
          - pattern: "execmod($C, function ($OUT) {...});"
          - pattern: "execmod($C, {encoding: $E}, function ($OUT) {...});"
          - pattern: "execmod($C, ($ERR, $OUT) => {...});"
          - pattern: "execmod($C, {encoding: $E}, ($ERR, $OUT) => {...});"
          - pattern: "execmod($C, function ($ERR, $OUT) {...});"
          - pattern: "execmod($C, ($ERR, $OUT) => ...);"
          - pattern: "execmod($C, ($OUT) => ...);"
          - pattern: "execmod($C, function ($OUT) {...});"
          - pattern: "execmod($C, ($ERR, $OUT) => {...});"
      - metavariable-regex:
          metavariable: "$C"
          regex: "(?:^([\"'])(?:/(?:usr/)?bin/)?cat [^\\s*|><$&,;`\"']+\\1$)|(?:^`(?:/(?:usr/)?bin/)?cat (?:[^\\s*|><&,;`$\\\\]|\\$\\{[^}`\\s]*\\}?)+`?$)|(?:^([\"'])(?:/(?:usr/)?bin/)?cat [^\\s*|><$&,;`\"']*\\1(?:\\s*\\+\\s*(?:[A-Za-z_$][\\w.$]*|([\"'])[^\\s*|><$&,;`\"']*\\2))+$)"
  - id: welt-js-unnecessary-use-of-cat-args
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "Uso desnecessário do processo `cat`: ler arquivo por um processo é complexo, ineficiente, não portável e abre espaço para injeção. Use fs.readFile(..) ou fs.readFileSync(..)."
    metadata:
      category: security
      cwe: "CWE-078: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      codeql: js/unnecessary-use-of-cat
    patterns:
      - pattern-either:
          - pattern: "execFileSync($X, [$F])"
          - pattern: "execFileSync($X, [$F], {encoding: $E})"
          - pattern: "$CP.execFileSync($X, [$F])"
          - pattern: "$CP.execFileSync($X, [$F], {encoding: $E})"
          - pattern: "cspawn.sync($X, [$F])"
          - pattern: "cspawn.sync($X, [$F], {encoding: $E})"
          - pattern: "execFile($X, [$F]);"
          - pattern: "execFile($X, [$F], {encoding: $E});"
          - pattern: "execFile($X, [$F], function ($ERR, $OUT) {...});"
          - pattern: "execFile($X, [$F], {encoding: $E}, function ($ERR, $OUT) {...});"
          - pattern: "execFile($X, [$F], function ($ERR, $OUT, $STDERR) {...});"
          - pattern: "execFile($X, [$F], {encoding: $E}, function ($ERR, $OUT, $STDERR) {...});"
          - pattern: "execFile($X, [$F], ($ERR, $OUT) => ...);"
          - pattern: "execFile($X, [$F], {encoding: $E}, ($ERR, $OUT) => ...);"
          - pattern: "execFile($X, [$F], ($ERR, $OUT, $STDERR) => ...);"
          - pattern: "execFile($X, [$F], {encoding: $E}, ($ERR, $OUT, $STDERR) => ...);"
          - pattern: "$CP.execFile($X, [$F]);"
          - pattern: "$CP.execFile($X, [$F], {encoding: $E});"
          - pattern: "$CP.execFile($X, [$F], function ($ERR, $OUT) {...});"
          - pattern: "$CP.execFile($X, [$F], {encoding: $E}, function ($ERR, $OUT) {...});"
          - pattern: "$CP.execFile($X, [$F], function ($ERR, $OUT, $STDERR) {...});"
          - pattern: "$CP.execFile($X, [$F], {encoding: $E}, function ($ERR, $OUT, $STDERR) {...});"
          - pattern: "$CP.execFile($X, [$F], ($ERR, $OUT) => ...);"
          - pattern: "$CP.execFile($X, [$F], {encoding: $E}, ($ERR, $OUT) => ...);"
          - pattern: "$CP.execFile($X, [$F], ($ERR, $OUT, $STDERR) => ...);"
          - pattern: "$CP.execFile($X, [$F], {encoding: $E}, ($ERR, $OUT, $STDERR) => ...);"
          - pattern: "cspawn($X, [$F]);"
          - pattern: "cspawn($X, [$F], {encoding: $E});"
      - metavariable-regex:
          metavariable: "$X"
          regex: '^["''](?:/(?:usr/)?bin/)?cat["'']$'
      - pattern-not: "$FN($X, [$F], ..., function ($ERR, $OUT, $STDERR) { ... $STDERR; ... })"
      - pattern-not: "$FN($X, [$F], ..., ($ERR, $OUT, $STDERR) => { ... $STDERR; ... })"
