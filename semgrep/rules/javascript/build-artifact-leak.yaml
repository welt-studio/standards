# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-build-artifact-leak
    languages:
      - javascript
      - typescript
    severity: WARNING
    mode: taint
    options:
      interfile: true
    message: "O `DefinePlugin` do webpack grava no artefato de build (público) dados sensíveis, como o `process.env` inteiro ou uma senha. Exponha só as variáveis necessárias, com um prefixo explícito (por exemplo `REACT_APP_`)."
    metadata:
      category: security
      cwe: "CWE-312: Cleartext Storage of Sensitive Information"
      codeql: js/build-artifact-leak
    pattern-sources:
      - patterns:
          - pattern: "$N"
          - metavariable-regex:
              metavariable: "$N"
              regex: "^[A-Za-z_$][\\w$]*$"
          - metavariable-regex:
              metavariable: "$N"
              regex: "^(?!(?is:.*(?:[^\\w$.-]|redact|censor|obfuscate|hash|md5|sha|random|(?<!unen)crypt|(?<!un)encode|certain|concert|secretar|wildcard|coauthor|account(ant|ab|ing|ed)|(?<!pro)file|path|([_-]|\\b)url)))(?is:.*(?:(?:pass(wd|word|code|.?phrase)(?!.*question)|(auth(entication|ori[sz]ation)?).?key|oauth|api.?(key|tok)|([_-]|\\b)mfa([_-]|\\b))))"
      - patterns:
          - pattern: "$O.$N"
          - metavariable-regex:
              metavariable: "$N"
              regex: "^(?!(?is:.*(?:[^\\w$.-]|redact|censor|obfuscate|hash|md5|sha|random|(?<!unen)crypt|(?<!un)encode|certain|concert|secretar|wildcard|coauthor|account(ant|ab|ing|ed)|(?<!pro)file|path|([_-]|\\b)url)))(?is:.*(?:(?:pass(wd|word|code|.?phrase)(?!.*question)|(auth(entication|ori[sz]ation)?).?key|oauth|api.?(key|tok)|([_-]|\\b)mfa([_-]|\\b))))"
      - patterns:
          - pattern: "{..., $N: $V, ...}"
          - metavariable-regex:
              metavariable: "$N"
              regex: "^(?!(?is:.*(?:[^\\w$.-]|redact|censor|obfuscate|hash|md5|sha|random|(?<!unen)crypt|(?<!un)encode|certain|concert|secretar|wildcard|coauthor|account(ant|ab|ing|ed)|(?<!pro)file|path|([_-]|\\b)url)))(?is:.*(?:(?:pass(wd|word|code|.?phrase)(?!.*question)|(auth(entication|ori[sz]ation)?).?key|oauth|api.?(key|tok)|([_-]|\\b)mfa([_-]|\\b))))"
          - focus-metavariable: "$V"
      - patterns:
          - pattern: "$O.$N = $V"
          - metavariable-regex:
              metavariable: "$N"
              regex: "^(?!(?is:.*(?:[^\\w$.-]|redact|censor|obfuscate|hash|md5|sha|random|(?<!unen)crypt|(?<!un)encode|certain|concert|secretar|wildcard|coauthor|account(ant|ab|ing|ed)|(?<!pro)file|path|([_-]|\\b)url)))(?is:.*(?:(?:pass(wd|word|code|.?phrase)(?!.*question)|(auth(entication|ori[sz]ation)?).?key|oauth|api.?(key|tok)|([_-]|\\b)mfa([_-]|\\b))))"
          - focus-metavariable: "$V"
      - patterns:
          - pattern: "$F(...)"
          - metavariable-regex:
              metavariable: "$F"
              regex: "(?is)^getPassword$"
      - patterns:
          - pattern: "$O.$F(...)"
          - metavariable-regex:
              metavariable: "$F"
              regex: "(?is)^getPassword$"
      - patterns:
          - pattern: process.env
          - pattern-not-inside: "process.env.$X"
          - pattern-not-inside: "process.env[$X]"
      - patterns:
          - pattern: "process.env[$K]"
          - metavariable-regex:
              metavariable: "$K"
              regex: "^[A-Za-z_$][\\w$]*$"
    pattern-sanitizers:
      - patterns:
          - pattern: "$F(...)"
          - metavariable-regex:
              metavariable: "$F"
              regex: "(?is).*(?:[^\\w$.-]|redact|censor|obfuscate|hash|md5|sha|random|(?<!unen)crypt|(?<!un)encode|certain|concert|secretar|wildcard|coauthor|account(ant|ab|ing|ed)|(?<!pro)file|path|([_-]|\\b)url)"
      - patterns:
          - pattern: "$O.$F(...)"
          - metavariable-regex:
              metavariable: "$F"
              regex: "(?is).*(?:[^\\w$.-]|redact|censor|obfuscate|hash|md5|sha|random|(?<!unen)crypt|(?<!un)encode|certain|concert|secretar|wildcard|coauthor|account(ant|ab|ing|ed)|(?<!pro)file|path|([_-]|\\b)url)"
      - patterns:
          - pattern: "$X.replace(...)"
          - pattern-regex: "\\.replace\\(\\s*/\\.[+*]?/[a-z]*g[a-z]*\\s*,"
      - pattern: "$X.filter(...)"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "new webpack.DefinePlugin($A)"
              - pattern: "new (require('webpack').DefinePlugin)($A)"
              - pattern: "new DefinePlugin($A)"
          - focus-metavariable: "$A"
