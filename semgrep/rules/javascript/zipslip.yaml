      category: security
      cwe: "CWE-022: Improper Limitation of a Pathname to a Restricted Directory"
      codeql: js/zipslip
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: "$E.path"
          - pattern-inside: "$S.on('entry', ($E) => {...})"
      - patterns:
          - pattern: "$E.path"
          - pattern-inside: "$S.on('entry', function($E) {...})"
      - patterns:
          - pattern: "$E.fileName"
          - pattern-inside: "$S.on('entry', ($E) => {...})"
      - patterns:
          - pattern: "$E.fileName"
          - pattern-inside: "$S.on('entry', function($E) {...})"
      - patterns:
          - pattern: "$E.header.name"
          - pattern-inside: "$S.on('entry', function($E) {...})"
      - patterns:
          - pattern: "$E.entryName"
          - pattern-inside: "$Z.forEach(function($E) {...})"
      - patterns:
          - pattern: "$E.entryName"
          - pattern-inside: "$Z.forEach(($E) => {...})"
      - patterns:
          - pattern: "$E.entryName"
          - pattern-inside: "for (const $E of $Z.getEntries()) {...}"
      - pattern: "$Z.getEntries()"
      - patterns:
          - pattern: "$NAME"
          - pattern-inside: "for ($NAME in $Z.files) {...}"
      - patterns:
          - pattern: "$NAME"
          - pattern-inside: "$Z.forEach(function($NAME, ...) {...})"
      - patterns:
          - pattern: "$NAME"
          - pattern-inside: "$Z.forEach(($NAME, ...) => {...})"
      - patterns:
          - pattern: "$H.name"
          - pattern-inside: "$X.on('entry', function($H, ...) {...})"
      - patterns:
          - pattern: "$E.path"
          - pattern-inside: "tar.extract({..., filter: ($E) => {...}})"
      - patterns:
          - pattern: "$ENTRY.$P"
          - metavariable-regex:
              metavariable: "$P"
              regex: "^(?:fileName|entryName|path)$"
          - pattern-inside: "$Y.eachEntry(function($ENTRY) {...})"
