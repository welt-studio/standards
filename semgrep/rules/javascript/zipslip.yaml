# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-zipslip
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: "Zip Slip: o caminho de uma entrada de arquivo compactado é usado para gravar arquivos sem validação e pode escapar do diretório de extração (entradas com '..'). Resolva o caminho e confira que ele fica dentro do destino."
    metadata:
      category: security
      cwe: "CWE-022: Improper Limitation of a Pathname to a Restricted Directory"
      codeql: js/zipslip
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: "$NAME"
          - pattern-either:
              - pattern-inside: "$Z.$M(($NAME, ...) => {...})"
              - pattern-inside: "$Z.$M(function ($NAME, ...) {...})"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:forEach|filter)$"
          - patterns:
              - pattern-inside: |
                  $Z = new $J(...);
                  ...
              - pattern-either:
                  - pattern-inside: |
                      $J = require("jszip");
                      ...
                  - pattern-inside: |
                      import $J from "jszip";
                      ...
                  - pattern-inside: |
                      import * as $J from "jszip";
                      ...
      - patterns:
          - pattern: "$NAME"
          - pattern-inside: "for ($NAME in $Z.files) {...}"
          - patterns:
              - pattern-inside: |
                  $Z = new $J(...);
                  ...
              - pattern-either:
                  - pattern-inside: |
                      $J = require("jszip");
                      ...
                  - pattern-inside: |
                      import $J from "jszip";
                      ...
                  - pattern-inside: |
                      import * as $J from "jszip";
                      ...
