          - focus-metavariable: "$X"
      - patterns:
          - pattern: "child_process.fork($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "exec($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execSync($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execFile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
