              regex: "^\\\\\\\\.+$"
      - patterns:
          - pattern: "$S = $S.replace(/$C/g, \"$E\"); ... $S = $S.replace(/\\\\/g, \"$PR\");"
          - metavariable-regex:
              metavariable: "$E"
              regex: "^\\\\\\\\.+$"
          - metavariable-regex:
              metavariable: "$PR"
              regex: "^\\\\\\\\.+$"
      - patterns:
          - pattern: '$S.replace(/$C/g, ($X) => $R[$X]).replace(/&/g, "&amp;")'
  - id: welt-js-double-escaping-unescape
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "Esta substituição pode gerar caracteres que serão desescapados duas vezes por uma substituição posterior da cadeia."
    metadata:
      category: security
      cwe: "CWE-116: Improper Encoding or Escaping of Output"
      codeql: js/double-escaping
    pattern-either:
      - patterns:
          - pattern: '$S.replace(/&amp;/g, "&").replace(/$O/g, $R)'
          - metavariable-regex:
              metavariable: "$O"
              regex: "^&.+;$"
      - patterns:
          - pattern: '$S.replace(/&amp;/g, "&").replace(...).replace(/$O/g, $R)'
          - metavariable-regex:
              metavariable: "$O"
              regex: "^&.+;$"
      - patterns:
          - pattern: '$S = $S.replace(/&amp;/g, "&"); ... $S = $S.replace(/$O/g, $R);'
          - metavariable-regex:
              metavariable: "$O"
              regex: "^&.+;$"
