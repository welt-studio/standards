# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-double-escaping
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "Esta substituição pode escapar duas vezes o caractere, pois outra substituição anterior da cadeia já produziu escapes."
    metadata:
      category: security
      cwe: "CWE-116: Improper Encoding or Escaping of Output"
      codeql: js/double-escaping
    pattern-either:
      - patterns:
          - pattern: '$S.replace(/$C/g, "$E").replace(/&/g, "$PR")'
          - metavariable-regex:
              metavariable: "$E"
              regex: "^&.+;$"
          - metavariable-regex:
              metavariable: "$PR"
              regex: "^&.+;$"
      - patterns:
          - pattern: '$S.replace(/$C/g, "$E").replace(new RegExp("&", "g"), "$PR")'
          - metavariable-regex:
              metavariable: "$E"
              regex: "^&.+;$"
          - metavariable-regex:
              metavariable: "$PR"
              regex: "^&.+;$"
      - patterns:
          - pattern: '$S.replace(new RegExp("$C", "g"), "$E").replace(/&/g, "$PR")'
          - metavariable-regex:
              metavariable: "$E"
              regex: "^&.+;$"
          - metavariable-regex:
              metavariable: "$PR"
              regex: "^&.+;$"
      - patterns:
          - pattern: '$S.replace(new RegExp("$C", "g"), "$E").replace(new RegExp("&", "g"), "$PR")'
          - metavariable-regex:
              metavariable: "$E"
              regex: "^&.+;$"
          - metavariable-regex:
              metavariable: "$PR"
              regex: "^&.+;$"
      - patterns:
          - pattern: '$S.replace(/$C/g, "$E").replace(...).replace(/&/g, "$PR")'
          - metavariable-regex:
              metavariable: "$E"
              regex: "^&.+;$"
