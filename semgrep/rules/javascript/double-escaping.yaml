          - metavariable-regex:
              metavariable: "$PR"
              regex: "^&.+;$"
      - patterns:
          - pattern: '$S = $S.replace(/$C/g, "$E"); ... $S = $S.replace(/&/g, "$PR");'
          - metavariable-regex:
              metavariable: "$E"
              regex: "^&.+;$"
          - metavariable-regex:
              metavariable: "$PR"
              regex: "^&.+;$"
      - patterns:
          - pattern: '$S.replace(/$C/g, "$E").replace(/%/g, "$PR")'
          - metavariable-regex:
              metavariable: "$E"
              regex: "^%.+$"
          - metavariable-regex:
              metavariable: "$PR"
              regex: "^%.+$"
