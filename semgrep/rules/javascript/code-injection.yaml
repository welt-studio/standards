# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-code-injection
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: "Injeção de código: este valor, controlado pelo usuário, é interpretado como código (eval, new Function, setTimeout com string, vm, motor de template). Não execute dados do usuário como código."
    metadata:
      category: security
      cwe: "CWE-094: Improper Control of Generation of Code ('Code Injection')"
      codeql: js/code-injection
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: "function ($REQ, $RES, ...) {...}"
              - pattern-inside: "function $F($REQ, $RES, ...) {...}"
              - pattern-inside: "async function ($REQ, $RES, ...) {...}"
              - pattern-inside: "async function $F($REQ, $RES, ...) {...}"
              - pattern-inside: "($REQ, $RES, ...) => {...}"
              - pattern-inside: "($REQ, $RES, ...) => $E"
              - pattern-inside: "async ($REQ, $RES, ...) => {...}"
              - pattern-inside: "async ($REQ, $RES, ...) => $E"
              - pattern-inside: "$M($REQ, $RES, ...) {...}"
              - pattern-inside: "async $M($REQ, $RES, ...) {...}"
              - pattern-inside: "function ($REQ) {...}"
              - pattern-inside: "function $F($REQ) {...}"
              - pattern-inside: "($REQ) => {...}"
              - pattern-inside: "($REQ) => $E"
              - pattern-inside: "async ($REQ) => {...}"
              - pattern-inside: "async function $F($REQ) {...}"
              - pattern-inside: "$M($REQ) {...}"
          - metavariable-regex:
              metavariable: "$REQ"
              regex: "^(?i:_?(?:req|request|r))$"
          - pattern-either:
              - pattern: "$REQ.query"
              - pattern: "$REQ.body"
              - pattern: "$REQ.params"
              - pattern: "$REQ.headers"
              - pattern: "$REQ.signedCookies"
              - pattern: "$REQ.url"
              - pattern: "$REQ.originalUrl"
              - pattern: "$REQ.path"
              - pattern: "$REQ.hostname"
              - pattern: "$REQ.host"
              - pattern: "$REQ.baseUrl"
              - pattern: "$REQ.subdomains"
              - pattern: "$REQ.files"
              - pattern: "$REQ.file"
              - pattern: "$REQ.rawBody"
              - pattern: "$REQ.payload"
              - pattern: "$REQ.state"
              - pattern: "$REQ.get(...)"
              - pattern: "$REQ.header(...)"
              - pattern: "$REQ.param(...)"
              - pattern: "$REQ.getHeader(...)"
              - pattern: "$REQ.json()"
              - pattern: "$REQ.text()"
              - pattern: "$REQ.formData()"
              - pattern: "$REQ.blob()"
              - pattern: "$REQ.arrayBuffer()"
              - pattern: "$REQ.nextUrl.$K"
      - patterns:
          - pattern-either:
              - pattern-inside: "$APP.$M(..., function ($REQ, ...) {...})"
              - pattern-inside: "$APP.$M(..., async function ($REQ, ...) {...})"
              - pattern-inside: "$APP.$M(..., ($REQ, ...) => {...})"
              - pattern-inside: "$APP.$M(..., ($REQ, ...) => $E)"
              - pattern-inside: "$APP.$M(..., async ($REQ, ...) => {...})"
              - pattern-inside: "$APP.$M(..., async ($REQ, ...) => $E)"
              - pattern-inside: "$APP.$M(..., function $F($REQ, ...) {...})"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:get|post|put|delete|patch|all|use|route|head|options|on|createServer|handle|addHook|register)$"
          - pattern-either:
              - pattern: "$REQ.query"
              - pattern: "$REQ.body"
              - pattern: "$REQ.params"
              - pattern: "$REQ.headers"
              - pattern: "$REQ.signedCookies"
              - pattern: "$REQ.url"
              - pattern: "$REQ.originalUrl"
              - pattern: "$REQ.path"
              - pattern: "$REQ.hostname"
              - pattern: "$REQ.host"
              - pattern: "$REQ.baseUrl"
              - pattern: "$REQ.subdomains"
              - pattern: "$REQ.files"
              - pattern: "$REQ.file"
              - pattern: "$REQ.rawBody"
              - pattern: "$REQ.payload"
              - pattern: "$REQ.state"
              - pattern: "$REQ.get(...)"
              - pattern: "$REQ.header(...)"
              - pattern: "$REQ.param(...)"
              - pattern: "$REQ.getHeader(...)"
              - pattern: "$REQ.json()"
              - pattern: "$REQ.text()"
              - pattern: "$REQ.formData()"
              - pattern: "$REQ.blob()"
              - pattern: "$REQ.arrayBuffer()"
              - pattern: "$REQ.nextUrl.$K"
      - patterns:
          - pattern-either:
              - pattern-inside: "function getServerSideProps($CTX) {...}"
              - pattern-inside: "async function getServerSideProps($CTX) {...}"
              - pattern-inside: "function getInitialProps($CTX) {...}"
              - pattern-inside: "$P.getInitialProps = async ($CTX) => {...}"
              - pattern-inside: "$P.getInitialProps = ($CTX) => {...}"
          - pattern-either:
              - pattern: "$CTX.query"
              - pattern: "$CTX.params"
              - pattern: "$CTX.req.url"
              - pattern: "$CTX.req.headers"
              - pattern: "$CTX.req.body"
      - patterns:
          - pattern-either:
              - pattern-inside: "function getServerSideProps($CTX) {...}"
              - pattern-inside: "async function getServerSideProps($CTX) {...}"
              - pattern-inside: "function getInitialProps($CTX) {...}"
              - pattern-inside: "$P.getInitialProps = async ($CTX) => {...}"
              - pattern-inside: "$P.getInitialProps = ($CTX) => {...}"
          - pattern-inside: "$REQ = $CTX.req; ..."
          - pattern-either:
              - pattern: "$REQ.url"
              - pattern: "$REQ.headers"
              - pattern: "$REQ.body"
              - pattern: "$REQ.query"
              - pattern: "$REQ.cookies"
      - patterns:
          - pattern-either:
              - pattern-inside: "function ($CTX, ...) {...}"
              - pattern-inside: "async function ($CTX, ...) {...}"
              - pattern-inside: "async ($CTX, ...) => {...}"
              - pattern-inside: "($CTX, ...) => {...}"
              - pattern-inside: "async function $F($CTX, ...) {...}"
              - pattern-inside: "function $F($CTX, ...) {...}"
              - pattern-inside: "async ($CTX, $NEXT) => {...}"
          - metavariable-regex:
              metavariable: "$CTX"
              regex: "^(?i:_?(?:ctx|context|koaContext))$"
          - pattern-either:
              - pattern: "$CTX.query"
              - pattern: "$CTX.params"
              - pattern: "$CTX.headers"
              - pattern: "$CTX.url"
              - pattern: "$CTX.originalUrl"
              - pattern: "$CTX.path"
              - pattern: "$CTX.href"
              - pattern: "$CTX.querystring"
              - pattern: "$CTX.search"
              - pattern: "$CTX.hostname"
              - pattern: "$CTX.host"
              - pattern: "$CTX.origin"
              - pattern: "$CTX.request.query"
              - pattern: "$CTX.request.body"
              - pattern: "$CTX.request.headers"
              - pattern: "$CTX.request.url"
              - pattern: "$CTX.request.path"
              - pattern: "$CTX.request.href"
              - pattern: "$CTX.request.querystring"
              - pattern: "$CTX.request.search"
              - pattern: "$CTX.request.originalUrl"
              - pattern: "$CTX.request.host"
              - pattern: "$CTX.request.hostname"
              - pattern: "$CTX.req.url"
              - pattern: "$CTX.req.headers"
              - pattern: "$CTX.request.params"
              - pattern: "$CTX.cookies"
              - pattern: "$CTX.get(...)"
              - pattern: "$CTX.cookies.get(...)"
              - pattern: "$CTX.request.get(...)"
              - pattern: "$CTX.header(...)"
      - patterns:
          - pattern: "@Body(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@Query(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@Param(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@Headers(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@Req(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@Request(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@Cookies(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@UploadedFile(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@UploadedFiles(...) $X"
          - focus-metavariable: "$X"
      - pattern: location.hash
      - pattern: location.search
      - pattern: location.href
      - pattern: location.pathname
      - pattern: window.location.hash
      - pattern: window.location.search
      - pattern: window.location.href
      - pattern: window.location.pathname
      - pattern: document.location.hash
      - pattern: document.location.search
      - pattern: document.location.href
      - pattern: document.location.pathname
      - pattern: document.URL
      - pattern: document.documentURI
      - pattern: document.baseURI
      - pattern: document.referrer
      - pattern: window.name
      - pattern: self.location.hash
      - pattern: self.location.search
      - pattern: self.location.href
      - pattern: top.location.hash
      - pattern: top.location.search
      - patterns:
          - pattern-either:
              - pattern: "$E.data"
          - pattern-inside: 'window.addEventListener("message", function($E) {...})'
      - patterns:
          - pattern: "$E.data"
          - pattern-inside: 'window.addEventListener("message", ($E) => {...})'
      - patterns:
          - pattern: "$E.data"
          - pattern-inside: "window.onmessage = function($E) {...}"
      - patterns:
          - pattern: "$E.data"
          - pattern-inside: "window.onmessage = ($E) => {...}"
    pattern-sinks:
      - patterns:
          - pattern: "eval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "new Function(..., $X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "Function(..., $X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "setTimeout($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "setInterval($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "setImmediate($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "vm.runInThisContext($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "vm.runInNewContext($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "vm.runInContext($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "vm.compileFunction($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "new vm.Script($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "vm.Script($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$VM.runInNewContext($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$VM.runInThisContext($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$VM.runInContext($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$VM.Script($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "new $VM.Script($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$.globalEval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "jQuery.globalEval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$SCOPE.$eval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$SCOPE.$evalAsync($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$SCOPE.$apply($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$SCOPE.$watch($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$SCOPE.$applyAsync($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$parse($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$compile($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$interpolate($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$WINDOW.eval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "window.eval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "self.eval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "globalThis.eval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "global.eval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$W.injectJavaScript($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$W.executeJavaScript($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$W.evaluateJavaScript($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$PAGE.evaluate($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$PAGE.evaluateOnNewDocument($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$PAGE.addScriptTag({..., content: $X, ...})"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "new Function($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "Function($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "pug.compile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "pug.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "jade.compile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "jade.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "dot.template($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "dot.compile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "ejs.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "ejs.compile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "nunjucks.renderString($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "lodash.template($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "_.template($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "handlebars.compile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "Handlebars.compile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "mustache.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "Mustache.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "Hogan.compile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "Eta.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "Eta.compile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "Sqrl.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "squirrelly.render($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "webix.ui($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "webix.ui({..., template: $X, ...})"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "new Vue({..., template: $X, ...})"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "Vue.compile($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "require('safer-eval')($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "saferEval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "safeEval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$VM2.run($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "new VM().run($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "new NodeVM().run($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "new vm2.VM().run($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "executeJavaScript($X)"
          - focus-metavariable: "$X"
    pattern-sanitizers:
      - pattern: "parseInt($X, ...)"
      - pattern: "Number($X)"
      - pattern: "parseFloat($X)"
      - pattern: "+$X"
      - pattern: "JSON.stringify($X)"
      - pattern: "$X.length"
      - pattern: "encodeURIComponent($X)"
      - pattern: "Boolean($X)"
    options:
      interfile: true
