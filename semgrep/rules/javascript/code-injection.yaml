              - pattern: 'child_process.$M("node", [..., $X, ..., "-e", ...], ...)'
              - pattern: 'child_process.$M(process.argv[0], [..., "-e", ..., $X, ...], ...)'
              - pattern: 'child_process.$M(process.argv[0], [..., $X, ..., "-e", ...], ...)'
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:spawn|spawnSync|execFile|execFileSync)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$SH.write($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $PTY = require("node-pty");
                  ...
                  $SH = $PTY.spawn(...);
                  ...
              - pattern-inside: |
                  import * as $PTY from "node-pty";
                  ...
                  $SH = $PTY.spawn(...);
                  ...
              - pattern-inside: |
                  import $PTY from "node-pty";
                  ...
                  $SH = $PTY.spawn(...);
                  ...
              - pattern-inside: |
                  import {..., spawn, ...} from "node-pty";
                  ...
                  $SH = spawn(...);
                  ...
              - pattern-inside: |
                  const {..., spawn, ...} = require("node-pty");
                  ...
                  $SH = spawn(...);
                  ...
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$M._compile($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $MOD = require("module");
                  ...
                  $M = new $MOD(...);
                  ...
              - pattern-inside: |
                  import $MOD from "module";
                  ...
                  $M = new $MOD(...);
                  ...
              - pattern-inside: |
                  $M = new module.constructor(...);
                  ...
              - pattern-inside: |
                  $M = new module.constructor;
                  ...
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "<WebView ... injectedJavaScript={$X} ... />"
          - pattern-either:
              - pattern-inside: |
                  import {..., WebView, ...} from "react-native";
                  ...
              - pattern-inside: |
                  const {..., WebView, ...} = require("react-native");
                  ...
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "<script ...>{$X}</script>"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "WebAssembly.compile(..., $X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "WebAssembly.compileStreaming(..., $X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "$E.attr($N, $X)"
              - pattern: "$E.setAttribute($N, $X)"
          - metavariable-regex:
              metavariable: "$N"
              regex: '(?i)^["'']on.+["'']$'
          - focus-metavariable: "$X"
    pattern-sanitizers:
      - pattern: "parseInt($X, ...)"
      - pattern: "Number($X)"
      - pattern: "parseFloat($X)"
      - pattern: "+$X"
      - pattern: "JSON.stringify($X)"
      - pattern: "$X.length"
      - pattern: "encodeURIComponent($X)"
      - pattern: "Boolean($X)"
    options:
      interfile: true
