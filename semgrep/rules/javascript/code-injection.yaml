          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$VM.runInContext($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$VM.Script($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "new $VM.Script($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$.globalEval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "jQuery.globalEval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$SCOPE.$eval($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$SCOPE.$evalAsync($X)"
          - focus-metavariable: "$X"
      - patterns:
