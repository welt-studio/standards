# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-reflected-xss
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "Vulnerabilidade de XSS refletido: dados controlados pelo usuário na requisição chegam à resposta HTTP sem escape. Escape a saída para HTML ou use um template com autoescape."
    metadata:
      category: security
      cwe: "CWE-079: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      codeql: js/reflected-xss
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: "function ($REQ, $RES, ...) {...}"
              - pattern-inside: "function $F($REQ, $RES, ...) {...}"
              - pattern-inside: "async function ($REQ, $RES, ...) {...}"
              - pattern-inside: "async function $F($REQ, $RES, ...) {...}"
              - pattern-inside: "($REQ, $RES, ...) => {...}"
              - pattern-inside: "($REQ, $RES, ...) => $E"
              - pattern-inside: "async ($REQ, $RES, ...) => {...}"
              - pattern-inside: "async ($REQ, $RES, ...) => $E"
              - pattern-inside: "$M($REQ, $RES, ...) {...}"
              - pattern-inside: "async $M($REQ, $RES, ...) {...}"
              - pattern-inside: "function ($REQ) {...}"
              - pattern-inside: "function $F($REQ) {...}"
              - pattern-inside: "($REQ) => {...}"
              - pattern-inside: "($REQ) => $E"
              - pattern-inside: "async ($REQ) => {...}"
              - pattern-inside: "async function $F($REQ) {...}"
              - pattern-inside: "$M($REQ) {...}"
          - metavariable-regex:
              metavariable: "$REQ"
              regex: "^(?i:_?(?:req|request|r))$"
          - pattern-either:
              - pattern: "$REQ.query"
              - pattern: "$REQ.body"
              - pattern: "$REQ.params"
              - pattern: "$REQ.headers"
              - pattern: "$REQ.url"
              - pattern: "$REQ.originalUrl"
              - pattern: "$REQ.path"
              - pattern: "$REQ.hostname"
              - pattern: "$REQ.host"
              - pattern: "$REQ.baseUrl"
              - pattern: "$REQ.subdomains"
              - pattern: "$REQ.files"
              - pattern: "$REQ.file"
              - pattern: "$REQ.rawBody"
              - pattern: "$REQ.payload"
              - pattern: "$REQ.state"
              - pattern: "$REQ.get(...)"
              - pattern: "$REQ.header(...)"
              - pattern: "$REQ.param(...)"
              - pattern: "$REQ.getHeader(...)"
              - pattern: "$REQ.json()"
              - pattern: "$REQ.text()"
              - pattern: "$REQ.formData()"
              - pattern: "$REQ.blob()"
              - pattern: "$REQ.arrayBuffer()"
              - pattern: "$REQ.nextUrl.$K"
      - patterns:
          - pattern-either:
              - pattern-inside: "$APP.$M(..., function ($REQ, ...) {...})"
              - pattern-inside: "$APP.$M(..., async function ($REQ, ...) {...})"
              - pattern-inside: "$APP.$M(..., ($REQ, ...) => {...})"
              - pattern-inside: "$APP.$M(..., ($REQ, ...) => $E)"
              - pattern-inside: "$APP.$M(..., async ($REQ, ...) => {...})"
              - pattern-inside: "$APP.$M(..., async ($REQ, ...) => $E)"
              - pattern-inside: "$APP.$M(..., function $F($REQ, ...) {...})"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:get|post|put|delete|patch|all|use|route|head|options|on|createServer|handle|addHook|register)$"
          - pattern-either:
              - pattern: "$REQ.query"
              - pattern: "$REQ.body"
              - pattern: "$REQ.params"
              - pattern: "$REQ.headers"
              - pattern: "$REQ.url"
              - pattern: "$REQ.originalUrl"
              - pattern: "$REQ.path"
              - pattern: "$REQ.hostname"
              - pattern: "$REQ.host"
              - pattern: "$REQ.baseUrl"
              - pattern: "$REQ.subdomains"
              - pattern: "$REQ.files"
              - pattern: "$REQ.file"
              - pattern: "$REQ.rawBody"
              - pattern: "$REQ.payload"
              - pattern: "$REQ.state"
              - pattern: "$REQ.get(...)"
              - pattern: "$REQ.header(...)"
              - pattern: "$REQ.param(...)"
              - pattern: "$REQ.getHeader(...)"
              - pattern: "$REQ.json()"
              - pattern: "$REQ.text()"
              - pattern: "$REQ.formData()"
              - pattern: "$REQ.blob()"
              - pattern: "$REQ.arrayBuffer()"
              - pattern: "$REQ.nextUrl.$K"
      - patterns:
          - pattern-either:
              - pattern-inside: "function getServerSideProps($CTX) {...}"
              - pattern-inside: "async function getServerSideProps($CTX) {...}"
              - pattern-inside: "function getInitialProps($CTX) {...}"
              - pattern-inside: "$P.getInitialProps = async ($CTX) => {...}"
              - pattern-inside: "$P.getInitialProps = ($CTX) => {...}"
          - pattern-either:
              - pattern: "$CTX.query"
              - pattern: "$CTX.params"
              - pattern: "$CTX.req.url"
              - pattern: "$CTX.req.headers"
              - pattern: "$CTX.req.body"
      - patterns:
          - pattern-either:
              - pattern-inside: "function getServerSideProps($CTX) {...}"
              - pattern-inside: "async function getServerSideProps($CTX) {...}"
              - pattern-inside: "function getInitialProps($CTX) {...}"
              - pattern-inside: "$P.getInitialProps = async ($CTX) => {...}"
              - pattern-inside: "$P.getInitialProps = ($CTX) => {...}"
          - pattern-inside: "$REQ = $CTX.req; ..."
          - pattern-either:
              - pattern: "$REQ.url"
              - pattern: "$REQ.headers"
              - pattern: "$REQ.body"
              - pattern: "$REQ.query"
              - pattern: "$REQ.cookies"
      - patterns:
          - pattern-either:
              - pattern-inside: "function ($CTX, ...) {...}"
              - pattern-inside: "async function ($CTX, ...) {...}"
              - pattern-inside: "async ($CTX, ...) => {...}"
              - pattern-inside: "($CTX, ...) => {...}"
              - pattern-inside: "async function $F($CTX, ...) {...}"
              - pattern-inside: "function $F($CTX, ...) {...}"
              - pattern-inside: "async ($CTX, $NEXT) => {...}"
          - metavariable-regex:
              metavariable: "$CTX"
              regex: "^(?i:_?(?:ctx|context|koaContext))$"
          - pattern-either:
              - pattern: "$CTX.query"
              - pattern: "$CTX.params"
              - pattern: "$CTX.headers"
              - pattern: "$CTX.url"
              - pattern: "$CTX.originalUrl"
              - pattern: "$CTX.path"
              - pattern: "$CTX.href"
              - pattern: "$CTX.querystring"
              - pattern: "$CTX.search"
              - pattern: "$CTX.hostname"
              - pattern: "$CTX.host"
              - pattern: "$CTX.origin"
              - pattern: "$CTX.request.query"
              - pattern: "$CTX.request.body"
              - pattern: "$CTX.request.headers"
              - pattern: "$CTX.request.url"
              - pattern: "$CTX.request.path"
              - pattern: "$CTX.request.href"
              - pattern: "$CTX.request.querystring"
              - pattern: "$CTX.request.search"
              - pattern: "$CTX.request.originalUrl"
              - pattern: "$CTX.request.host"
              - pattern: "$CTX.request.hostname"
              - pattern: "$CTX.req.url"
              - pattern: "$CTX.req.headers"
              - pattern: "$CTX.request.params"
              - pattern: "$CTX.cookies"
              - pattern: "$CTX.get(...)"
              - pattern: "$CTX.cookies.get(...)"
              - pattern: "$CTX.request.get(...)"
              - pattern: "$CTX.header(...)"
      - patterns:
          - pattern: "@Body(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@Query(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@Param(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@Headers(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@Req(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@Request(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@Cookies(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@UploadedFile(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@UploadedFiles(...) $X"
          - focus-metavariable: "$X"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "$RES.send($X)"
              - pattern: "$RES.write($X)"
              - pattern: "$RES.end($X, ...)"
              - pattern: "$RES.status(...).send($X)"
              - pattern: "$RES.type(...).send($X)"
              - pattern: "$RES.set(...).send($X)"
          - metavariable-regex:
              metavariable: "$RES"
              regex: "^(?i:_?(?:res|response|reply|resp))$"
          - focus-metavariable: "$X"
          - pattern-not-inside:
              patterns:
                - pattern-inside: '$RES.set("$K", "$CT"); ...'
                - metavariable-regex:
                    metavariable: "$K"
                    regex: "(?i)^content-type$"
                - metavariable-regex:
                    metavariable: "$CT"
                    regex: "(?i)^(?!.*html).*$"
          - pattern-not-inside:
              patterns:
                - pattern-inside: '$RES.setHeader("$K", "$CT"); ...'
                - metavariable-regex:
                    metavariable: "$K"
                    regex: "(?i)^content-type$"
                - metavariable-regex:
                    metavariable: "$CT"
                    regex: "(?i)^(?!.*html).*$"
          - pattern-not-inside:
              patterns:
                - pattern-inside: '$RES.header("$K", "$CT"); ...'
                - metavariable-regex:
                    metavariable: "$K"
                    regex: "(?i)^content-type$"
                - metavariable-regex:
                    metavariable: "$CT"
                    regex: "(?i)^(?!.*html).*$"
          - pattern-not-inside:
              patterns:
                - pattern-inside: '$RES.append("$K", "$CT"); ...'
                - metavariable-regex:
                    metavariable: "$K"
                    regex: "(?i)^content-type$"
                - metavariable-regex:
                    metavariable: "$CT"
                    regex: "(?i)^(?!.*html).*$"
          - pattern-not-inside:
              patterns:
                - pattern-inside: '$RES.set({"$K": "$CT"}); ...'
                - metavariable-regex:
                    metavariable: "$K"
                    regex: "(?i)^content-type$"
                - metavariable-regex:
                    metavariable: "$CT"
                    regex: "(?i)^(?!.*html).*$"
          - pattern-not-inside:
              patterns:
                - pattern-inside: '$RES.header({"$K": "$CT"}); ...'
                - metavariable-regex:
                    metavariable: "$K"
                    regex: "(?i)^content-type$"
                - metavariable-regex:
                    metavariable: "$CT"
                    regex: "(?i)^(?!.*html).*$"
          - pattern-not-inside:
              patterns:
                - pattern-inside: '$RES.writeHead($S, {"$K": "$CT"}); ...'
                - metavariable-regex:
                    metavariable: "$K"
                    regex: "(?i)^content-type$"
                - metavariable-regex:
                    metavariable: "$CT"
                    regex: "(?i)^(?!.*html).*$"
          - pattern-not-inside:
              patterns:
                - pattern-inside: '$RES.type("$CT"); ...'
                - metavariable-regex:
                    metavariable: "$CT"
                    regex: "(?i)^(?!.*html).*$"
          - pattern-not-inside:
              patterns:
                - pattern-inside: '$RES.contentType("$CT"); ...'
                - metavariable-regex:
                    metavariable: "$CT"
                    regex: "(?i)^(?!.*html).*$"
      - patterns:
          - pattern-either:
              - pattern: "$CTX.body = $X"
              - pattern: "$CTX.response.body = $X"
          - metavariable-regex:
              metavariable: "$CTX"
              regex: "^(?i:_?(?:ctx|context|koaContext))$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: 'new Response($X, {headers: {"$K": "$CT"}})'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex: "(?i)^content-type$"
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new Response($X, {headers: $H})"
          - pattern-inside: '$H = new Headers({"$K": "$CT"}); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex: "(?i)^content-type$"
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new Response($X, {headers})"
          - pattern-inside: 'headers = new Headers({"$K": "$CT"}); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex: "(?i)^content-type$"
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new Response($X, {headers: $H})"
          - pattern-inside: '$H.append("$K", "$CT"); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex: "(?i)^content-type$"
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new Response($X, {headers})"
          - pattern-inside: 'headers.append("$K", "$CT"); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex: "(?i)^content-type$"
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new Response($X, {headers: $H})"
          - pattern-inside: '$H.set("$K", "$CT"); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex: "(?i)^content-type$"
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new Response($X, {headers})"
          - pattern-inside: 'headers.set("$K", "$CT"); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex: "(?i)^content-type$"
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: 'new NextResponse($X, {headers: {"$K": "$CT"}})'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex: "(?i)^content-type$"
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new NextResponse($X, {headers: $H})"
          - pattern-inside: '$H = new Headers({"$K": "$CT"}); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex: "(?i)^content-type$"
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new NextResponse($X, {headers})"
          - pattern-inside: 'headers = new Headers({"$K": "$CT"}); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex: "(?i)^content-type$"
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new NextResponse($X, {headers: $H})"
          - pattern-inside: '$H.append("$K", "$CT"); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex: "(?i)^content-type$"
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new NextResponse($X, {headers})"
          - pattern-inside: 'headers.append("$K", "$CT"); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex: "(?i)^content-type$"
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new NextResponse($X, {headers: $H})"
          - pattern-inside: '$H.set("$K", "$CT"); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex: "(?i)^content-type$"
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
      - patterns:
          - pattern: "new NextResponse($X, {headers})"
          - pattern-inside: 'headers.set("$K", "$CT"); ...'
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$K"
              regex: "(?i)^content-type$"
          - metavariable-regex:
              metavariable: "$CT"
              regex: "(?i)^.*html.*$"
    pattern-sanitizers:
      - pattern: "escapeHtml($X)"
      - pattern: "escapeHTML($X)"
      - pattern: "escape($X)"
      - pattern: "escapeString($X)"
      - pattern: "encodeURIComponent($X)"
      - pattern: "encodeURI($X)"
      - pattern: "sanitize($X)"
      - pattern: "sanitizeHtml($X, ...)"
      - pattern: "sanitizeHtml($X)"
      - pattern: "xss($X)"
      - pattern: "$L.escape($X)"
      - pattern: "$L.sanitize($X, ...)"
      - pattern: "$L.encode($X, ...)"
      - pattern: "$L.escapeHtml($X)"
      - pattern: "$L.escapeHTML($X)"
      - pattern: "he.escape($X)"
      - pattern: "DOMPurify.sanitize($X, ...)"
      - pattern: "validator.escape($X)"
      - pattern: "_.escape($X)"
      - pattern: "parseInt($X, ...)"
      - pattern: "parseFloat($X)"
      - pattern: "Number($X)"
      - pattern: "Boolean($X)"
      - pattern: "isNaN($X)"
      - pattern: "$L.stripTags($X)"
      - pattern: "striptags($X)"
      - pattern: "$L.filterXSS($X)"
      - pattern: "filterXSS($X)"
      - pattern: "escapeHtmlEntities($X)"
      - pattern: "htmlEscape($X)"
      - pattern: "$X.toFixed(...)"
      - pattern: "$L.encodeForHTML($X)"
      - pattern: "encodeHTML($X)"
      - pattern: "$X.length"
      - pattern: "JSON.stringify($X)"
      - pattern: "+$X"
      - pattern: "typeof $X"
      - patterns:
          - pattern: "$X"
          - pattern-inside: "if (!/$RE/.exec($X)) {...}"
          - metavariable-regex:
              metavariable: "$RE"
              regex: ".*[<>].*"
      - patterns:
          - pattern: "$X"
          - pattern-inside: "if (!/$RE/.test($X)) {...}"
          - metavariable-regex:
              metavariable: "$RE"
              regex: ".*[<>].*"
      - pattern: "serializeJavaScript($X)"
    options:
      interfile: true
