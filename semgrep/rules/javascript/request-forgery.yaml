# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-request-forgery
    languages:
      - javascript
      - typescript
    severity: ERROR
    mode: taint
    options:
      interfile: true
    message: "A URL (ou parte dela, como host ou caminho) de uma requisição feita pelo servidor é controlada pelo usuário: risco de SSRF (server-side request forgery). Valide o destino contra uma lista de hosts permitidos."
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      codeql: js/request-forgery
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: "$REQ.query"
              - pattern: "$REQ.body"
              - pattern: "$REQ.params"
              - pattern: "$REQ.headers"
              - pattern: "$REQ.cookies"
              - pattern: "$REQ.url"
              - pattern: "$REQ.originalUrl"
              - pattern: "$REQ.path"
              - pattern: "$REQ.hostname"
              - pattern: "$REQ.host"
              - pattern: "$REQ.param(...)"
              - pattern: "$REQ.header(...)"
              - pattern: "$REQ.get(...)"
          - metavariable-regex:
              metavariable: "$REQ"
              regex: "^(req|request|ctx|ctx\\.request|this\\.request)$"
      - pattern: process.argv
      - patterns:
          - pattern: "$P"
          - pattern-inside: |
              $APP.$M($PATH, ($CTX, ..., $P, ...) => {...})
          - metavariable-regex:
              metavariable: "$CTX"
              regex: "^(context|ctx)$"
    pattern-sanitizers:
      - pattern: "encodeURIComponent(...)"
      - pattern: "encodeURI(...)"
      - pattern: "parseInt(...)"
      - pattern: "Number(...)"
      - pattern: "$V.isURL(...)"
      - pattern: "$V.isInt(...)"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "request($X, ...)"
              - pattern: "request.$M($X, ...)"
              - pattern: "axios($X, ...)"
              - pattern: "axios.$M($X, ...)"
              - pattern: "axios({..., url: $X, ...})"
              - pattern: "$AX.get($X, ...)"
              - pattern: "$AX.post($X, ...)"
              - pattern: "$AX.put($X, ...)"
              - pattern: "$AX.delete($X, ...)"
              - pattern: "$AX.head($X, ...)"
              - pattern: "$AX.patch($X, ...)"
              - pattern: "$AX.request($X, ...)"
              - pattern: "http.get($U, {..., host: $X, ...})"
              - pattern: "http.get($X, ...)"
              - pattern: "http.request($X, ...)"
              - pattern: "https.get($X, ...)"
              - pattern: "https.request($X, ...)"
              - pattern: "fetch($X, ...)"
              - pattern: "got($X, ...)"
              - pattern: "got.$M($X, ...)"
              - pattern: "needle($M, $X, ...)"
              - pattern: "needle.$M($X, ...)"
              - pattern: "superagent.$M($X, ...)"
              - pattern: "$XHR.send(new Uri($X))"
              - pattern: "new WebSocket($X, ...)"
              - pattern: "new ws($X, ...)"
              - pattern: "new WebSocket.WebSocket($X, ...)"
              - pattern: "JSDOM.fromURL($X, ...)"
              - pattern: "$C.Page.navigate({..., url: $X, ...})"
              - pattern: "$.ajax({..., url: $X, ...})"
              - pattern: "$.get($X, ...)"
              - pattern: "$.post($X, ...)"
              - pattern: "$CFG.url = $X"
          - focus-metavariable: "$X"
