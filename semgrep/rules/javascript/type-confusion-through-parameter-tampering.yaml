# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-type-confusion-through-parameter-tampering
    languages:
      - javascript
      - typescript
    severity: WARNING
    mode: taint
    options:
      interfile: true
    message: 'Parâmetro HTTP usado como string sem verificar o tipo. Um atacante pode enviar um array ou objeto (`?foo[]=x`) e quebrar a lógica de `indexOf`, `concat`, `slice` ou `length`. Verifique `typeof valor === "string"` antes de usar.'
    metadata:
      category: security
      cwe: "CWE-843: Access of Resource Using Incompatible Type ('Type Confusion')"
      codeql: js/type-confusion-through-parameter-tampering
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: "$REQ.query.$P"
              - pattern: "$REQ.query[$P]"
              - pattern: "$REQ.body.$P"
              - pattern: "$REQ.body[$P]"
              - pattern: "$REQ.query"
              - pattern: "$REQ.body"
          - metavariable-regex:
              metavariable: "$REQ"
              regex: "^(req|request|ctx|ctx\\.request|this\\.request)$"
    pattern-sanitizers:
      - patterns:
          - pattern: "$X"
          - pattern-inside: |
              if (typeof $X === "string") {...}
      - patterns:
          - pattern: "$X"
          - pattern-inside: |
              if (typeof $X === "string") {...} else {...}
      - patterns:
          - pattern: "$X"
          - pattern-inside: |
              if ($X instanceof Array) {...} else {...}
      - patterns:
          - pattern: "$X"
          - pattern-inside: |
              if (typeof $X === "string" && ...) {...}
      - patterns:
          - pattern: "$X"
          - pattern-inside: |
              if (typeof $X !== "string") { return ...; }
              ...
      - patterns:
          - pattern: "$X"
          - pattern-inside: |
              if (Array.isArray($X)) {...}
      - patterns:
          - pattern: "$X"
          - pattern-inside: |
              if ($X instanceof Array) {...}
      - pattern: "String($X)"
      - pattern: "`${$X}`"
      - pattern: "$X.toString()"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "$X.indexOf(...)"
              - pattern: "$X.concat(...)"
              - pattern: "$X.slice(...)"
              - pattern: "$X.length"
          - pattern-not-inside: "$X.indexOf(...) === 0"
          - pattern-not-inside: "$X.indexOf(...) == 0"
          - pattern-not-inside: "$X.indexOf(...) !== 0"
          - pattern-not-inside: "$X.indexOf(...) != 0"
          - pattern-not-inside: "$X.slice(-1) === $Y"
          - pattern-not-inside: "$X.slice(-1) == $Y"
          - pattern-not-inside: "if ($X.length) {...}"
          - pattern-not-inside: "while ($X.length) {...}"
          - pattern-not-inside: "!$X.length"
          - pattern-not-inside: "$X.length == 0"
          - pattern-not-inside: "$X.length > 0"
          - pattern-not-inside: "$X.length < 1"
          - focus-metavariable: "$X"
