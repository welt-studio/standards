# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-xpath-injection
    languages:
      - javascript
      - typescript
    severity: ERROR
    mode: taint
    options:
      interfile: true
    message: "Um valor controlado pelo usuário é usado para montar uma expressão XPath, o que permite injeção e a leitura de dados do XML. Use expressões parametrizadas (variáveis do XPath) ou valide o valor contra uma lista de permitidos."
    metadata:
      category: security
      cwe: "CWE-643: Improper Neutralization of Data within XPath Expressions"
      codeql: js/xpath-injection
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: "$REQ.query"
              - pattern: "$REQ.body"
              - pattern: "$REQ.params"
              - pattern: "$REQ.headers"
              - pattern: "$REQ.cookies"
              - pattern: "$REQ.url"
              - pattern: "$REQ.originalUrl"
              - pattern: "$REQ.hostname"
              - pattern: "$REQ.path"
              - pattern: "$REQ.param(...)"
              - pattern: "$REQ.get(...)"
              - pattern: "$REQ.header(...)"
              - pattern: "$REQ.request.body"
              - pattern: "$REQ.request.query"
              - pattern: "$REQ.req.url"
              - pattern: "$REQ.query.$K"
              - pattern: "$REQ.body.$K"
              - pattern: "$REQ.params.$K"
          - metavariable-regex:
              metavariable: "$REQ"
              regex: "^(req|request|ctx|context)$"
      - pattern: document.location.hash
      - pattern: document.location.search
      - pattern: document.location.href
      - pattern: document.location.pathname
      - pattern: window.location.hash
      - pattern: window.location.search
      - pattern: window.location.href
      - pattern: window.location.pathname
      - pattern: location.hash
      - pattern: location.search
      - pattern: location.href
      - pattern: location.pathname
      - pattern: document.URL
      - pattern: document.documentURI
      - pattern: document.referrer
      - pattern: window.name
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "xpath.parse($X, ...)"
              - pattern: "xpath.select($X, ...)"
              - pattern: "xpath.select1($X, ...)"
              - pattern: "xpath.evaluate($X, ...)"
              - pattern: 'require("xpath").parse($X, ...)'
              - pattern: 'require("xpath").select($X, ...)'
              - pattern: 'require("xpath").select1($X, ...)'
              - pattern: "xpath.js.parse($X, ...)"
              - pattern: "xpath.js.select($X, ...)"
              - pattern: "xpath.js.select1($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-inside: |
              $E = xpath.useNamespaces(...);
              ...
          - pattern: "$E($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "xpath.useNamespaces(...)($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "document.createExpression($X, ...)"
              - pattern: "document.evaluate($X, ...)"
          - focus-metavariable: "$X"
