# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-shell-command-injection-from-environment
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "Este comando de shell depende de um caminho não controlado (diretório do script, diretório atual, caminho absoluto) que pode conter caracteres especiais do shell e injetar comandos. Escape o valor ou coloque entre aspas."
    metadata:
      category: security
      cwe: "CWE-078: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      codeql: js/shell-command-injection-from-environment
    mode: taint
    pattern-sources:
      - pattern: __dirname
      - pattern: __filename
      - pattern: process.execPath
      - pattern: "process.cwd()"
      - pattern: "path.resolve(...)"
      - pattern: "path.join(__dirname, ...)"
      - pattern: "fs.realpathSync(...)"
      - pattern: "fs.realpath(...)"
      - pattern: import.meta.dirname
      - pattern: import.meta.filename
    pattern-sinks:
      - patterns:
          - pattern: "child_process.exec($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "child_process.execSync($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "exec($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execSync($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execFile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execFileSync($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "spawn($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "spawnSync($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "fork($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "shelljs.exec($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "shell.exec($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "shx.exec($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execa($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execa.sync($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execa.shell($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execa.shellSync($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execa.command($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execa.commandSync($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execa.stdout($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execa.stderr($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execa.node($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "cross_spawn($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "crossSpawn($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "crossSpawn.sync($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "cspawn($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "cspawn.sync($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "exec_sh($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
