          - focus-metavariable: "$X"
      - patterns:
          - pattern: "require('exec')($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "require('exec-async')($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
