          - focus-metavariable: "$X"
      - patterns:
          - pattern: "require('execa').shell($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "require('execa').shellSync($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "require('execa').stdout($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
