          - focus-metavariable: "$X"
      - patterns:
          - pattern: "require('exec-sh').promise($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "require('shelljs').exec($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execaSync($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execaCommand($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execaCommandSync($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$TAG`${$X} ...`"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$TAG`...${$X}...`"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "opener($U, {command: $X})"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "mz_exec($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$E.$M($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $E = require("@actions/exec");
                  ...
              - pattern-inside: |
                  import * as $E from "@actions/exec";
                  ...
              - pattern-inside: |
                  import $E from "@actions/exec";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:exec|getExecOutput)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "child_process.spawn($SH, [..., $X, ...], ...)"
              - pattern: "child_process.spawn($SH, [..., $X].concat(...), ...)"
              - pattern: "child_process.spawn($SH, [...].concat([..., $X]), ...)"
              - pattern: "child_process.spawn($SH, [...].concat($X), ...)"
              - pattern: "child_process.spawn($SH, $X, ...)"
          - metavariable-pattern:
              metavariable: "$SH"
              pattern-either:
                - pattern: '"sh"'
                - pattern: '"bash"'
                - pattern: '"zsh"'
                - pattern: '"dash"'
                - pattern: '"ksh"'
                - pattern: '"csh"'
                - pattern: '"/bin/sh"'
                - pattern: '"/bin/bash"'
                - pattern: '"/bin/zsh"'
                - pattern: '"/bin/dash"'
                - pattern: '"/bin/ksh"'
                - pattern: '"/bin/csh"'
                - pattern: '"/usr/bin/sh"'
                - pattern: '"/usr/bin/bash"'
                - pattern: '"/usr/bin/zsh"'
                - pattern: '"/usr/bin/dash"'
                - pattern: '"/usr/bin/ksh"'
                - pattern: '"/usr/bin/csh"'
                - pattern: '"cmd"'
                - pattern: '"cmd.exe"'
                - pattern: '"CMD"'
                - pattern: '"CMD.EXE"'
                - pattern: '"powershell"'
                - pattern: '"powershell.exe"'
                - pattern: '"pwsh"'
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "child_process.spawnSync($SH, [..., $X, ...], ...)"
              - pattern: "child_process.spawnSync($SH, [..., $X].concat(...), ...)"
              - pattern: "child_process.spawnSync($SH, [...].concat([..., $X]), ...)"
              - pattern: "child_process.spawnSync($SH, [...].concat($X), ...)"
              - pattern: "child_process.spawnSync($SH, $X, ...)"
          - metavariable-pattern:
              metavariable: "$SH"
              pattern-either:
                - pattern: '"sh"'
                - pattern: '"bash"'
                - pattern: '"zsh"'
                - pattern: '"dash"'
                - pattern: '"ksh"'
                - pattern: '"csh"'
                - pattern: '"/bin/sh"'
                - pattern: '"/bin/bash"'
                - pattern: '"/bin/zsh"'
