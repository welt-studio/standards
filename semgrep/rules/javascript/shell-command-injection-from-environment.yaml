                - pattern: '"/usr/bin/ksh"'
                - pattern: '"/usr/bin/csh"'
                - pattern: '"cmd"'
                - pattern: '"cmd.exe"'
                - pattern: '"CMD"'
                - pattern: '"CMD.EXE"'
                - pattern: '"powershell"'
                - pattern: '"powershell.exe"'
                - pattern: '"pwsh"'
          - focus-metavariable: "$X"
