                  $V = $W(require("child_process"), ...);
                  ...
              - pattern-inside: |
                  $V = $W.$A(require("child_process"), ...);
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:exec|execSync|execFile|execFileSync|spawn|spawnSync|fork)$"
          - focus-metavariable: "$X"
    pattern-sanitizers:
      - patterns:
          - pattern: "$X"
          - pattern-inside: "\"\\\"\" + $X + \"\\\"\""
      - patterns:
          - pattern: "$X"
          - pattern-inside: '"''" + $X + "''"'
    options:
      interfile: true
