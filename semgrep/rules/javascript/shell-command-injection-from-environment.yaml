          - focus-metavariable: "$X"
      - patterns:
          - pattern: "foregroundChild($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "exec_async($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "require('cross-spawn')($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "require('cross-spawn').sync($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
