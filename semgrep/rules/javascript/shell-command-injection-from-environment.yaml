              - pattern: "child_process.execFile($SH, [..., $X, ...], ...)"
              - pattern: "child_process.execFile($SH, [..., $X].concat(...), ...)"
              - pattern: "child_process.execFile($SH, [...].concat([..., $X]), ...)"
              - pattern: "child_process.execFile($SH, [...].concat($X), ...)"
              - pattern: "child_process.execFile($SH, $X, ...)"
          - metavariable-pattern:
