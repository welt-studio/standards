          - pattern-either:
              - pattern: "child_process.execFileSync($SH, [..., $X, ...], ...)"
              - pattern: "child_process.execFileSync($SH, [..., $X].concat(...), ...)"
              - pattern: "child_process.execFileSync($SH, [...].concat([..., $X]), ...)"
              - pattern: "child_process.execFileSync($SH, [...].concat($X), ...)"
              - pattern: "child_process.execFileSync($SH, $X, ...)"
          - metavariable-pattern:
              metavariable: "$SH"
              pattern-either:
                - pattern: '"sh"'
                - pattern: '"bash"'
                - pattern: '"zsh"'
                - pattern: '"dash"'
                - pattern: '"ksh"'
                - pattern: '"csh"'
                - pattern: '"/bin/sh"'
                - pattern: '"/bin/bash"'
                - pattern: '"/bin/zsh"'
                - pattern: '"/bin/dash"'
                - pattern: '"/bin/ksh"'
                - pattern: '"/bin/csh"'
                - pattern: '"/usr/bin/sh"'
                - pattern: '"/usr/bin/bash"'
                - pattern: '"/usr/bin/zsh"'
                - pattern: '"/usr/bin/dash"'
                - pattern: '"/usr/bin/ksh"'
                - pattern: '"/usr/bin/csh"'
                - pattern: '"cmd"'
                - pattern: '"cmd.exe"'
                - pattern: '"CMD"'
                - pattern: '"CMD.EXE"'
                - pattern: '"powershell"'
                - pattern: '"powershell.exe"'
                - pattern: '"pwsh"'
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$F($SH, $ARGS)"
          - pattern-inside: "$ARGS[$I] = $X; ..."
          - metavariable-pattern:
