# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-shell-command-injection-from-environment
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "Este comando de shell depende de um caminho não controlado (diretório do script, diretório atual, caminho absoluto) que pode conter caracteres especiais do shell e injetar comandos. Escape o valor ou coloque entre aspas."
    metadata:
      category: security
      cwe: "CWE-078: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      codeql: js/shell-command-injection-from-environment
    mode: taint
    pattern-sources:
      - pattern: __dirname
      - pattern: __filename
      - pattern: process.execPath
      - pattern: "process.cwd()"
      - pattern: "path.resolve(...)"
      - pattern: "path.join(__dirname, ...)"
      - pattern: "fs.realpathSync(...)"
      - pattern: "fs.realpath(...)"
      - pattern: import.meta.dirname
      - pattern: import.meta.filename
    pattern-sinks:
      - patterns:
          - pattern: "child_process.exec($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "child_process.execSync($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$E.$M($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $E = require("node:child_process");
                  ...
              - pattern-inside: |
                  import * as $E from "node:child_process";
                  ...
              - pattern-inside: |
                  import $E from "node:child_process";
                  ...
              - pattern-inside: |
                  $E = require("mz/child_process");
                  ...
              - pattern-inside: |
                  import * as $E from "mz/child_process";
                  ...
              - pattern-inside: |
                  import $E from "mz/child_process";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:exec|execSync)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$M($X, ...)"
