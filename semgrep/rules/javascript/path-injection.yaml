# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-path-injection
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: "Injeção de caminho: este caminho de arquivo é construído a partir de dados controlados pelo usuário e pode acessar arquivos fora do diretório pretendido. Valide e normalize (path.resolve + verificação de prefixo) antes de usar."
    metadata:
      category: security
      cwe: "CWE-022: Improper Limitation of a Pathname to a Restricted Directory"
      codeql: js/path-injection
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: "function ($REQ, $RES, ...) {...}"
              - pattern-inside: "function $F($REQ, $RES, ...) {...}"
              - pattern-inside: "async function ($REQ, $RES, ...) {...}"
              - pattern-inside: "async function $F($REQ, $RES, ...) {...}"
              - pattern-inside: "($REQ, $RES, ...) => {...}"
              - pattern-inside: "($REQ, $RES, ...) => $E"
              - pattern-inside: "async ($REQ, $RES, ...) => {...}"
              - pattern-inside: "async ($REQ, $RES, ...) => $E"
              - pattern-inside: "$M($REQ, $RES, ...) {...}"
              - pattern-inside: "async $M($REQ, $RES, ...) {...}"
              - pattern-inside: "function ($REQ) {...}"
              - pattern-inside: "function $F($REQ) {...}"
              - pattern-inside: "($REQ) => {...}"
              - pattern-inside: "($REQ) => $E"
              - pattern-inside: "async ($REQ) => {...}"
              - pattern-inside: "async function $F($REQ) {...}"
              - pattern-inside: "$M($REQ) {...}"
          - metavariable-regex:
              metavariable: "$REQ"
              regex: "^(?i:_?(?:req|request|r))$"
          - pattern-either:
              - pattern: "$REQ.query"
              - pattern: "$REQ.body"
              - pattern: "$REQ.params"
              - pattern: "$REQ.headers"
              - pattern: "$REQ.cookies"
              - pattern: "$REQ.signedCookies"
              - pattern: "$REQ.url"
              - pattern: "$REQ.originalUrl"
              - pattern: "$REQ.path"
              - pattern: "$REQ.hostname"
              - pattern: "$REQ.host"
              - pattern: "$REQ.baseUrl"
              - pattern: "$REQ.subdomains"
              - pattern: "$REQ.files"
              - pattern: "$REQ.file"
              - pattern: "$REQ.rawBody"
              - pattern: "$REQ.payload"
              - pattern: "$REQ.state"
              - pattern: "$REQ.get(...)"
              - pattern: "$REQ.header(...)"
              - pattern: "$REQ.param(...)"
              - pattern: "$REQ.getHeader(...)"
              - pattern: "$REQ.json()"
              - pattern: "$REQ.text()"
              - pattern: "$REQ.formData()"
              - pattern: "$REQ.blob()"
              - pattern: "$REQ.arrayBuffer()"
              - pattern: "$REQ.nextUrl.$K"
      - patterns:
          - pattern-either:
              - pattern-inside: "$APP.$M(..., function ($REQ, ...) {...})"
              - pattern-inside: "$APP.$M(..., async function ($REQ, ...) {...})"
              - pattern-inside: "$APP.$M(..., ($REQ, ...) => {...})"
              - pattern-inside: "$APP.$M(..., ($REQ, ...) => $E)"
              - pattern-inside: "$APP.$M(..., async ($REQ, ...) => {...})"
              - pattern-inside: "$APP.$M(..., async ($REQ, ...) => $E)"
              - pattern-inside: "$APP.$M(..., function $F($REQ, ...) {...})"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:get|post|put|delete|patch|all|use|route|head|options|on|createServer|handle|addHook|register)$"
          - pattern-either:
              - pattern: "$REQ.query"
              - pattern: "$REQ.body"
              - pattern: "$REQ.params"
              - pattern: "$REQ.headers"
              - pattern: "$REQ.cookies"
              - pattern: "$REQ.signedCookies"
              - pattern: "$REQ.url"
              - pattern: "$REQ.originalUrl"
              - pattern: "$REQ.path"
              - pattern: "$REQ.hostname"
              - pattern: "$REQ.host"
              - pattern: "$REQ.baseUrl"
              - pattern: "$REQ.subdomains"
              - pattern: "$REQ.files"
              - pattern: "$REQ.file"
              - pattern: "$REQ.rawBody"
              - pattern: "$REQ.payload"
              - pattern: "$REQ.state"
              - pattern: "$REQ.get(...)"
              - pattern: "$REQ.header(...)"
              - pattern: "$REQ.param(...)"
              - pattern: "$REQ.getHeader(...)"
              - pattern: "$REQ.json()"
              - pattern: "$REQ.text()"
              - pattern: "$REQ.formData()"
              - pattern: "$REQ.blob()"
              - pattern: "$REQ.arrayBuffer()"
              - pattern: "$REQ.nextUrl.$K"
      - patterns:
          - pattern-either:
              - pattern-inside: "function getServerSideProps($CTX) {...}"
              - pattern-inside: "async function getServerSideProps($CTX) {...}"
              - pattern-inside: "function getInitialProps($CTX) {...}"
              - pattern-inside: "$P.getInitialProps = async ($CTX) => {...}"
              - pattern-inside: "$P.getInitialProps = ($CTX) => {...}"
          - pattern-either:
              - pattern: "$CTX.query"
              - pattern: "$CTX.params"
              - pattern: "$CTX.req.url"
              - pattern: "$CTX.req.headers"
