# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-xxe
    languages:
      - javascript
      - typescript
    severity: ERROR
    mode: taint
    options:
      interfile: true
    message: "Um XML controlado pelo usuário é analisado com resolução de entidades externas habilitada (`noent: true`, parser SAX do libxmljs, ActiveX), o que permite XXE: leitura de arquivos locais e requisições internas (SSRF). Desligue a expansão de entidades."
    metadata:
      category: security
      cwe: "CWE-611: Improper Restriction of XML External Entity Reference"
      codeql: js/xxe
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: "$REQ.query"
              - pattern: "$REQ.body"
              - pattern: "$REQ.params"
              - pattern: "$REQ.headers"
              - pattern: "$REQ.cookies"
              - pattern: "$REQ.url"
              - pattern: "$REQ.originalUrl"
              - pattern: "$REQ.hostname"
              - pattern: "$REQ.path"
              - pattern: "$REQ.param(...)"
              - pattern: "$REQ.get(...)"
              - pattern: "$REQ.header(...)"
              - pattern: "$REQ.request.body"
              - pattern: "$REQ.request.query"
              - pattern: "$REQ.req.url"
              - pattern: "$REQ.query.$K"
              - pattern: "$REQ.body.$K"
              - pattern: "$REQ.params.$K"
          - metavariable-regex:
              metavariable: "$REQ"
              regex: "^(req|request|ctx|context)$"
      - patterns:
          - pattern: "$REQ.files"
          - metavariable-regex:
              metavariable: "$REQ"
              regex: "^(req|request|ctx|context)$"
      - pattern: document.location.hash
      - pattern: document.location.search
      - pattern: document.location.href
      - pattern: document.location.pathname
      - pattern: window.location.hash
      - pattern: window.location.search
      - pattern: window.location.href
      - pattern: window.location.pathname
      - pattern: location.hash
      - pattern: location.search
      - pattern: location.href
      - pattern: location.pathname
      - pattern: document.URL
      - pattern: document.documentURI
      - pattern: document.referrer
      - pattern: window.name
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "libxmljs.parseXml($X, {..., noent: true, ...})"
              - pattern: "libxmljs.parseXmlString($X, {..., noent: true, ...})"
              - pattern: 'require("libxmljs").parseXml($X, {..., noent: true, ...})'
              - pattern: "libxmljs.parseHtml($X, {..., noent: true, ...})"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-inside: |
              $P = new libxmljs.SaxParser(...);
              ...
          - pattern-either:
              - pattern: "$P.parseString($X, ...)"
              - pattern: "$P.parseFile($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-inside: |
              $P = new libxmljs.SaxPushParser(...);
              ...
          - pattern: "$P.push($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: '(new ActiveXObject("Microsoft.XMLDOM")).loadXML($X)'
              - pattern: '(new ActiveXObject("Msxml2.DOMDocument")).loadXML($X)'
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$P.loadXML($X)"
          - pattern-inside: |
              $P = new ActiveXObject(...);
              ...
          - focus-metavariable: "$X"
