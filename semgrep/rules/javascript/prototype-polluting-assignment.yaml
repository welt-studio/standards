# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-prototype-polluting-assignment
    languages:
      - javascript
      - typescript
    severity: WARNING
    mode: taint
    options:
      interfile: true
    message: "Atribuição a uma propriedade de um objeto obtido com chave controlada pelo usuário. Se a chave for `__proto__` ou `constructor`, o atacante altera `Object.prototype`. Valide a chave, use `hasOwnProperty` ou `Object.create(null)` / `Map`."
    metadata:
      category: security
      cwe: "CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"
      codeql: js/prototype-polluting-assignment
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: "$REQ.query"
              - pattern: "$REQ.body"
              - pattern: "$REQ.params"
              - pattern: "$REQ.headers"
              - pattern: "$REQ.cookies"
              - pattern: "$REQ.url"
              - pattern: "$REQ.originalUrl"
              - pattern: "$REQ.path"
              - pattern: "$REQ.hostname"
              - pattern: "$REQ.host"
              - pattern: "$REQ.param(...)"
              - pattern: "$REQ.header(...)"
              - pattern: "$REQ.get(...)"
          - metavariable-regex:
              metavariable: "$REQ"
              regex: "^(req|request|ctx|ctx\\.request|this\\.request)$"
      - pattern: process.argv
    pattern-propagators:
      - pattern: "$V = $O[$K]"
        from: "$K"
        to: "$V"
    pattern-sanitizers:
      - patterns:
          - pattern: "$K"
          - pattern-inside: |
              if ($O.hasOwnProperty($K)) {...}
      - patterns:
          - pattern: "$K"
          - pattern-inside: |
              if ($K === "__proto__" || ...) { return ...; }
              ...
      - patterns:
          - pattern: "$K"
          - pattern-inside: |
              if ($K !== "__proto__" && ...) {...}
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "$O[$K][$K2] = $V"
              - pattern: "$O[$K].$P = $V"
          - focus-metavariable: "$K"
      - patterns:
          - pattern-either:
              - pattern: "$B[$K2] = $V"
              - pattern: "$B.$P = $V"
          - pattern-not: "this.$P = $V"
          - focus-metavariable: "$B"
