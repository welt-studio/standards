# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-cors-permissive-configuration
    languages:
      - javascript
      - typescript
    severity: WARNING
    mode: taint
    options:
      interfile: true
    message: "A origem CORS aceita acesso amplo demais: o valor é permissivo (`*`, `true`, `null`) ou controlado pelo usuário. Liste explicitamente as origens confiáveis."
    metadata:
      category: security
      cwe: "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      codeql: js/cors-permissive-configuration
    pattern-sources:
      - pattern: "'*'"
      - pattern: '"*"'
      - pattern: "true"
      - pattern: "null"
      - patterns:
          - pattern-either:
              - pattern: "$REQ.query"
              - pattern: "$REQ.body"
              - pattern: "$REQ.params"
              - pattern: "$REQ.headers"
              - pattern: "$REQ.cookies"
              - pattern: "$REQ.url"
              - pattern: "$REQ.originalUrl"
              - pattern: "$REQ.path"
              - pattern: "$REQ.hostname"
              - pattern: "$REQ.host"
              - pattern: "$REQ.param(...)"
              - pattern: "$REQ.header(...)"
              - pattern: "$REQ.get(...)"
          - metavariable-regex:
              metavariable: "$REQ"
              regex: "^(req|request|ctx|ctx\\.request|this\\.request)$"
      - pattern-either:
          - pattern: location.search
          - pattern: location.hash
          - pattern: location.href
          - pattern: location.pathname
          - pattern: window.location.search
          - pattern: window.location.hash
          - pattern: window.location.href
          - pattern: document.location.search
          - pattern: document.location.hash
          - pattern: document.location.href
          - pattern: document.URL
          - pattern: document.documentURI
          - pattern: document.referrer
          - pattern: document.cookie
          - pattern: window.name
      - patterns:
          - pattern: "$EV.data"
          - pattern-either:
              - pattern-inside: |
                  $W.addEventListener("message", function ($EV, ...) {...})
              - pattern-inside: |
                  $W.addEventListener("message", ($EV, ...) => {...})
              - pattern-inside: |
                  addEventListener("message", function ($EV, ...) {...})
              - pattern-inside: |
                  addEventListener("message", ($EV, ...) => {...})
              - pattern-inside: |
                  $W.onmessage = ($EV) => {...}
              - pattern-inside: |
                  function $F($EV, ...) {...}
                  ...
                  $W.addEventListener("message", $F.bind($THIS))
              - pattern-inside: |
                  function $F($A, $EV, ...) {...}
                  ...
                  $W.addEventListener("message", $F.bind($THIS, $B))
              - pattern-inside: |
                  function $F($A, $B, $EV, ...) {...}
                  ...
                  $W.addEventListener("message", $F.bind($THIS, $C, $D))
      - patterns:
          - pattern: data
          - pattern-either:
              - pattern-inside: |
                  $W.addEventListener("message", function ({data}) {...})
              - pattern-inside: |
                  $W.addEventListener("message", ({data}) => {...})
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "cors({..., origin: $X, ...})"
              - pattern: "new ApolloServer({..., cors: {..., origin: $X, ...}, ...})"
              - pattern: |
                  $O = {..., origin: $X, ...};
                  ...
                  cors($O)
              - pattern: |
                  $O = {..., origin: $X, ...};
                  ...
                  new ApolloServer({..., cors: $O, ...})
          - pattern-not: |
              $O = {..., credentials: false, ...};
              ...
              cors($O)
          - pattern-not: "cors({..., credentials: false, ...})"
          - focus-metavariable: "$X"
