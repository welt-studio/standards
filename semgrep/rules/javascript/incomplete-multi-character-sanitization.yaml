# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-incomplete-multi-character-sanitization
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "Esta substituição pode produzir a sequência perigosa de novo: remover '<script', '<!--', '../' ou atributos 'on*' uma vez só deixa o restante se reunir (ex.: '<scr<script>ipt'). Repita até estabilizar ou use um sanitizador."
    metadata:
      category: security
      cwe: "CWE-116: Improper Encoding or Escaping of Output"
      codeql: js/incomplete-multi-character-sanitization
    pattern-regex: "\\.replace\\(\\s*(?<![\\w)\\]}])/(?!\\^)(?=(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\])*?(?:\\\\?<(?:\\(\\?:|\\()?(?:\\.[*+]\\??)?(?:script|scrip|cript|iframe|style)|\\\\?<!--|\\\\?<\\[a-zA-Z\\\\/\\](?:\\.|\\(\\.)|(?:\\\\\\.\\\\\\.\\\\/|\\\\/\\\\\\.\\\\\\.|\\\\x2E\\\\x2E\\\\x2F)|(?:on\\\\w\\+|on\\[a-z\\]\\+|\\\\sng-|[ \\s]ng-)))(?:(?:[^/\\\\\\n\\[]|\\\\.|\\[(?:[^\\]\\\\\\n]|\\\\.)*\\]))+/[a-z]*\\s*,\\s*(?:\\\"\\\"|'')\\s*\\)"
