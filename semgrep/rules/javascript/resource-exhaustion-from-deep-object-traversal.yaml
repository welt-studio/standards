# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-resource-exhaustion-from-deep-object-traversal
    languages:
      - javascript
      - typescript
    severity: WARNING
    mode: taint
    options:
      interfile: true
    message: "Um objeto controlado pelo usuário é validado pelo Ajv com `allErrors: true`. Um objeto profundamente aninhado ou com muitos erros faz a validação consumir muita CPU e memória (negação de serviço). Remova `allErrors` ou limite o tamanho e a profundidade da entrada."
    metadata:
      category: security
      cwe: "CWE-400: Uncontrolled Resource Consumption"
      codeql: js/resource-exhaustion-from-deep-object-traversal
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: "$REQ.query"
              - pattern: "$REQ.body"
              - pattern: "$REQ.params"
              - pattern: "$REQ.headers"
              - pattern: "$REQ.cookies"
              - pattern: "$REQ.url"
              - pattern: "$REQ.originalUrl"
              - pattern: "$REQ.hostname"
              - pattern: "$REQ.path"
              - pattern: "$REQ.param(...)"
              - pattern: "$REQ.get(...)"
              - pattern: "$REQ.header(...)"
              - pattern: "$REQ.request.body"
              - pattern: "$REQ.request.query"
              - pattern: "$REQ.req.url"
              - pattern: "$REQ.query.$K"
              - pattern: "$REQ.body.$K"
              - pattern: "$REQ.params.$K"
          - metavariable-regex:
              metavariable: "$REQ"
              regex: "^(req|request|ctx|context)$"
    pattern-sinks:
      - patterns:
          - pattern-inside: |
              $A = new Ajv({..., allErrors: true, ...});
              ...
          - pattern: "$A.validate($S, $X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-inside: |
              $A = new Ajv({..., allErrors: true, ...});
              ...
          - pattern-inside: |
              $V = $A.compile(...);
              ...
          - pattern: "$V($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-inside: |
              $A = new Ajv({..., allErrors: true, ...});
              ...
          - pattern: "$A.compile(...)($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-inside: |
              $A = new Ajv.default({..., allErrors: true, ...});
              ...
          - pattern: "$A.validate($S, $X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-inside: |
              $A = new Ajv.default({..., allErrors: true, ...});
              ...
          - pattern-inside: |
              $V = $A.compile(...);
              ...
          - pattern: "$V($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-inside: |
              $A = new Ajv.default({..., allErrors: true, ...});
              ...
          - pattern: "$A.compile(...)($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-inside: |
              $A = new (require("ajv"))({..., allErrors: true, ...});
              ...
          - pattern: "$A.validate($S, $X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-inside: |
              $A = new (require("ajv"))({..., allErrors: true, ...});
              ...
          - pattern-inside: |
              $V = $A.compile(...);
              ...
          - pattern: "$V($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-inside: |
              $A = new (require("ajv"))({..., allErrors: true, ...});
              ...
          - pattern: "$A.compile(...)($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-inside: |
              $A = ajv({..., allErrors: true, ...});
              ...
          - pattern: "$A.validate($S, $X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-inside: |
              $A = ajv({..., allErrors: true, ...});
              ...
          - pattern-inside: |
              $V = $A.compile(...);
              ...
          - pattern: "$V($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-inside: |
              $A = ajv({..., allErrors: true, ...});
              ...
          - pattern: "$A.compile(...)($X)"
          - focus-metavariable: "$X"
