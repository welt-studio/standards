          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $R = require("koa-route");
                  ...
              - pattern-inside: |
                  import * as $R from "koa-route";
                  ...
              - pattern-inside: |
                  import $R from "koa-route";
                  ...
          - pattern-either:
              - pattern-inside: |
                  $R.$M($ROUTE, ($C, $P, ...) => {...})
              - pattern-inside: |
