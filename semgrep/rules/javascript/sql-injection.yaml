              - pattern-inside: |
                  $R.$M($ROUTE, function ($C, $P, ...) {...})
              - pattern-inside: |
                  $R.$M($ROUTE, async ($C, $P, ...) => {...})
              - pattern-inside: |
                  $R.$M($ROUTE, async function ($C, $P, ...) {...})
          - pattern: "$P"
      - patterns:
          - pattern-inside: |
              $IO = require("socket.io")(...);
              ...
          - pattern-either:
              - pattern-inside: |
                  $IO.on("connection", ($S) => {...})
              - pattern-inside: |
                  $IO.on("connection", function ($S) {...})
              - pattern-inside: |
                  $IO.on("connection", async ($S) => {...})
          - pattern-either:
              - pattern-inside: |
                  $S.on($EVENT, ($D, ...) => {...})
              - pattern-inside: |
                  $S.on($EVENT, ($D, ...) => $E)
              - pattern-inside: |
                  $S.on($EVENT, function ($D, ...) {...})
              - pattern-inside: |
                  $S.on($EVENT, async ($D, ...) => {...})
              - pattern-inside: |
                  $S.on($EVENT, async function ($D, ...) {...})
