# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-useless-regexp-character-escape
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "Este escape '\\' dentro da string é descartado antes de a expressão regular ser construída (a string vira só o caractere), então a regex não escapa o que se esperava. Use '\\\\' na string."
    metadata:
      category: security
      cwe: "CWE-020: Improper Input Validation"
      codeql: js/useless-regexp-character-escape
    patterns:
      - pattern-either:
          - pattern: 'RegExp("...")'
          - pattern: "RegExp(`...`)"
          - pattern: "RegExp(`...${$E}...`)"
      - pattern: "RegExp($T)"
      - metavariable-regex:
          metavariable: "$T"
          regex: "(?s)^.*?(?:^|[^\\\\])(?:\\\\{4})*\\\\[dDwWsSBpPkK.\\[\\](){}*+?|\\^$/\\-]"
