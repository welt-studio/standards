# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-shell-command-constructed-from-input
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "Comando de shell montado a partir de um parâmetro de função exportada: se o valor tiver caracteres especiais do shell, o comando pode ser injetado. Use execFile/spawn com lista de argumentos ou escape o valor."
    metadata:
      category: security
      cwe: "CWE-078: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      codeql: js/shell-command-constructed-from-input
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: "module.exports = function (..., $P, ...) {...}"
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "module.exports.$F = function (..., $P, ...) {...}"
          - metavariable-regex:
              metavariable: "$F"
              regex: "^[a-zA-Z0-9]"
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "exports.$F = function (..., $P, ...) {...}"
          - metavariable-regex:
              metavariable: "$F"
              regex: "^[a-zA-Z0-9]"
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "module.exports.$F.$G = function (..., $P, ...) {...}"
          - metavariable-regex:
              metavariable: "$F"
              regex: "^[a-zA-Z0-9]"
          - metavariable-regex:
              metavariable: "$G"
              regex: "^[a-zA-Z0-9]"
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "module.exports = { ..., $F: function (..., $P, ...) {...}, ... }"
          - metavariable-regex:
              metavariable: "$F"
              regex: "^[a-zA-Z0-9]"
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "module.exports.$F = { ..., $G: function (..., $P, ...) {...}, ... }"
          - metavariable-regex:
              metavariable: "$F"
              regex: "^[a-zA-Z0-9]"
          - metavariable-regex:
              metavariable: "$G"
              regex: "^[a-zA-Z0-9]"
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "module.exports = (..., $P, ...) => ..."
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "module.exports.$F = (..., $P, ...) => ..."
          - metavariable-regex:
              metavariable: "$F"
              regex: "^[a-zA-Z0-9]"
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "exports.$F = (..., $P, ...) => ..."
          - metavariable-regex:
              metavariable: "$F"
              regex: "^[a-zA-Z0-9]"
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "module.exports.$F.$G = (..., $P, ...) => ..."
          - metavariable-regex:
              metavariable: "$F"
              regex: "^[a-zA-Z0-9]"
          - metavariable-regex:
              metavariable: "$G"
              regex: "^[a-zA-Z0-9]"
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "module.exports = { ..., $F: (..., $P, ...) => ..., ... }"
          - metavariable-regex:
              metavariable: "$F"
              regex: "^[a-zA-Z0-9]"
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "module.exports.$F = { ..., $G: (..., $P, ...) => ..., ... }"
          - metavariable-regex:
              metavariable: "$F"
              regex: "^[a-zA-Z0-9]"
          - metavariable-regex:
              metavariable: "$G"
              regex: "^[a-zA-Z0-9]"
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "export function $F(..., $P, ...) {...}"
          - metavariable-regex:
              metavariable: "$F"
              regex: "^[a-zA-Z0-9]"
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "export default function $F(..., $P, ...) {...}"
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "export default function (..., $P, ...) {...}"
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "export default (..., $P, ...) => ..."
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "export const $F = function (..., $P, ...) {...}"
          - metavariable-regex:
              metavariable: "$F"
              regex: "^[a-zA-Z0-9]"
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "export const $F = (..., $P, ...) => ..."
          - metavariable-regex:
              metavariable: "$F"
              regex: "^[a-zA-Z0-9]"
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "function $F(..., $P, ...) {...}"
          - pattern-either:
              - pattern-inside: |
                  function $F(...) {...}
                  ...
                  module.exports = $F;
              - pattern-inside: |
                  module.exports = $F;
                  ...
                  function $F(...) {...}
              - pattern-inside: |
                  function $F(...) {...}
                  ...
                  module.exports.$F = $F;
              - pattern-inside: |
                  module.exports.$F = $F;
                  ...
                  function $F(...) {...}
              - pattern-inside: |
                  function $F(...) {...}
                  ...
                  exports.$F = $F;
              - pattern-inside: |
                  exports.$F = $F;
                  ...
                  function $F(...) {...}
              - pattern-inside: |
                  function $F(...) {...}
                  ...
                  module.exports = {..., $F, ...};
              - pattern-inside: |
                  module.exports = {..., $F, ...};
                  ...
                  function $F(...) {...}
              - pattern-inside: |
                  function $F(...) {...}
                  ...
                  export { $F };
              - pattern-inside: |
                  export { $F };
                  ...
                  function $F(...) {...}
              - pattern-inside: |
                  function $F(...) {...}
                  ...
                  export default $F;
              - pattern-inside: |
                  export default $F;
                  ...
                  function $F(...) {...}
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "const $F = function (..., $P, ...) {...}"
          - pattern-either:
              - pattern-inside: |
                  const $F = function (...) {...};
                  ...
                  module.exports = $F;
              - pattern-inside: |
                  module.exports = $F;
                  ...
                  const $F = function (...) {...};
              - pattern-inside: |
                  const $F = function (...) {...};
                  ...
                  module.exports.$F = $F;
              - pattern-inside: |
                  module.exports.$F = $F;
                  ...
                  const $F = function (...) {...};
              - pattern-inside: |
                  const $F = function (...) {...};
                  ...
                  exports.$F = $F;
              - pattern-inside: |
                  exports.$F = $F;
                  ...
                  const $F = function (...) {...};
              - pattern-inside: |
                  const $F = function (...) {...};
                  ...
                  module.exports = {..., $F, ...};
              - pattern-inside: |
                  module.exports = {..., $F, ...};
                  ...
                  const $F = function (...) {...};
              - pattern-inside: |
                  const $F = function (...) {...};
                  ...
                  export { $F };
              - pattern-inside: |
                  export { $F };
                  ...
                  const $F = function (...) {...};
              - pattern-inside: |
                  const $F = function (...) {...};
                  ...
                  export default $F;
              - pattern-inside: |
                  export default $F;
                  ...
                  const $F = function (...) {...};
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "const $F = (..., $P, ...) => ..."
          - pattern-either:
              - pattern-inside: |
                  const $F = (...) => $B;
                  ...
                  module.exports = $F;
              - pattern-inside: |
                  module.exports = $F;
                  ...
                  const $F = (...) => $B;
              - pattern-inside: |
                  const $F = (...) => $B;
                  ...
                  module.exports.$F = $F;
              - pattern-inside: |
                  module.exports.$F = $F;
                  ...
                  const $F = (...) => $B;
              - pattern-inside: |
                  const $F = (...) => $B;
                  ...
                  exports.$F = $F;
              - pattern-inside: |
                  exports.$F = $F;
                  ...
                  const $F = (...) => $B;
              - pattern-inside: |
                  const $F = (...) => $B;
                  ...
                  module.exports = {..., $F, ...};
              - pattern-inside: |
                  module.exports = {..., $F, ...};
                  ...
                  const $F = (...) => $B;
              - pattern-inside: |
                  const $F = (...) => $B;
                  ...
                  export { $F };
              - pattern-inside: |
                  export { $F };
                  ...
                  const $F = (...) => $B;
              - pattern-inside: |
                  const $F = (...) => $B;
                  ...
                  export default $F;
              - pattern-inside: |
                  export default $F;
                  ...
                  const $F = (...) => $B;
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "class $C { $M(..., $P, ...) {...} }"
          - pattern-not: |
              class $C { private $M(...) {...} }
          - pattern-not: |
              class $C { protected $M(...) {...} }
          - pattern-either:
              - pattern-inside: |
                  export class $C {...}
              - pattern-inside: |
                  export default class $C {...}
              - pattern-inside: |
                  module.exports = class $C {...}
              - pattern-inside: |
                  class $C {...}
                  ...
                  module.exports = $C;
              - pattern-inside: |
                  class $C {...}
                  ...
                  module.exports.$N = $C;
              - pattern-inside: |
                  class $C {...}
                  ...
                  exports.$N = $C;
              - pattern-inside: |
                  class $C {...}
                  ...
                  export { $C };
              - pattern-inside: |
                  class $C {...}
                  ...
                  export { $C as $N };
              - pattern-inside: |
                  class $C {...}
                  ...
                  export default $C;
              - pattern-inside: |
                  class $C {...}
                  ...
                  module.exports = new $C(...);
          - metavariable-regex:
              metavariable: "$M"
              regex: "^[a-zA-Z0-9]"
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "class { $M(..., $P, ...) {...} }"
          - pattern-not: |
              class { private $M(...) {...} }
          - pattern-not: |
              class { protected $M(...) {...} }
          - pattern-either:
              - pattern-inside: |
                  module.exports = class {...}
              - pattern-inside: |
                  export default class {...}
              - pattern-inside: |
                  module.exports.$N = class {...}
              - pattern-inside: |
                  exports.$N = class {...}
          - metavariable-regex:
              metavariable: "$M"
              regex: "^[a-zA-Z0-9]"
          - focus-metavariable: "$P"
      - patterns:
          - pattern: "$C.prototype.$M = function (..., $P, ...) {...}"
          - pattern-inside: |
              ...
              module.exports = new $C(...);
              ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^[a-zA-Z0-9]"
          - focus-metavariable: "$P"
    pattern-sinks:
      - patterns:
          - pattern: 'child_process.exec("...$X...", ...)'
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "child_process.exec($A + $X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "child_process.exec(`...${$X}...`, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "child_process.exec($A + $X + ..., ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: 'child_process.execSync("...$X...", ...)'
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "child_process.execSync($A + $X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "child_process.execSync(`...${$X}...`, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "child_process.execSync($A + $X + ..., ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "shelljs.exec($A + $X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "shelljs.exec(`...${$X}...`, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execa.shell($A + $X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execa.shell(`...${$X}...`, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execa.shellSync($A + $X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execa.shellSync(`...${$X}...`, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execa.command($A + $X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execa.command(`...${$X}...`, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "require('mz/child_process').exec($A + $X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "require('mz/child_process').exec(`...${$X}...`, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execSh($A + $X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "execSh(`...${$X}...`, ...)"
          - focus-metavariable: "$X"
    pattern-sanitizers:
      - pattern: "shellEscape($X)"
      - pattern: "shellescape($X)"
      - pattern: "$L.quote($X)"
      - pattern: "JSON.stringify($X)"
      - pattern: "parseInt($X, ...)"
      - pattern: "Number($X)"
    options:
      interfile: true
