# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-xss-through-exception
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "XSS por exceção: o texto de uma exceção (que pode conter dados controlados pelo usuário, por exemplo o valor que falhou no parse) é inserido no HTML da página sem escape. Escape a mensagem antes de exibi-la como HTML."
    metadata:
      category: security
      cwe: "CWE-079: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      codeql: js/xss-through-exception
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: "$E"
          - pattern-inside: "try { $...BODY } catch ($E) {...}"
          - focus-metavariable: "$E"
    pattern-sinks:
      - patterns:
          - pattern: "$E.innerHTML = $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$E.outerHTML = $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$E.innerHTML += $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$E.outerHTML += $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$E.srcdoc = $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "document.write($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "document.writeln($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$D.write($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$D.writeln($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$E.insertAdjacentHTML($P, $X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$E.html($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "$E.append($X)"
              - pattern: "$E.prepend($X)"
              - pattern: "$E.after($X)"
              - pattern: "$E.before($X)"
          - pattern-not: "document.$P.$M($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$E.wrap($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$E.wrapAll($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$E.wrapInner($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$E.replaceWith($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$E.appendTo($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$E.prependTo($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "jQuery($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$.parseHTML($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "jQuery.parseHTML($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$R.createContextualFragment($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "$SCE.trustAsHtml($X)"
              - pattern: "$SCE.trustAsCss($X)"
          - metavariable-regex:
              metavariable: "$SCE"
              regex: "^\\$sce$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$SCE.trustAs($KIND, $X)"
          - metavariable-regex:
              metavariable: "$SCE"
              regex: "^\\$sce$"
          - metavariable-regex:
              metavariable: "$KIND"
              regex: "^\\$sce\\.(?:HTML|CSS)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "angular.element($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$S.bypassSecurityTrustHtml($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$S.bypassSecurityTrustScript($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$S.bypassSecurityTrustStyle($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$S.bypassSecurityTrustUrl($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$S.bypassSecurityTrustResourceUrl($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$E.setAttribute('srcdoc', $X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$E.setAttribute('on$EV', $X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "<$C dangerouslySetInnerHTML={{__html: $X}} />"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$E.setHTML($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$E.setHTMLUnsafe($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$W.document.write($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$E.insertAdjacentHTML($P, $X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "{__html: $X}"
          - pattern-inside: "<$C dangerouslySetInnerHTML={...} />"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "$E.$M(($D) => $X)"
              - pattern: "$E.$M(function ($D) { ... return $X; })"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:html|append|prepend|before|after|wrap|wrapAll|wrapInner|replaceWith)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$P.parseFromString($X, ...)"
          - pattern-inside: |
              $P = new DOMParser();
              ...
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "new Handlebars.SafeString($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$J.jGrowl($X, ...)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "new Element($TAG, {..., html: $X, ...})"
              - pattern: 'new Element($TAG, {..., "html": $X, ...})'
              - pattern: "new Element(...).set('html', $X)"
              - pattern: 'new Element(...).set({..., "html": $X, ...})'
              - pattern: "new Element(...).setProperty('html', $X)"
              - pattern: 'new Element(...).setProperties({..., "html": $X, ...})'
              - pattern: "new Element(...).appendHtml($X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "React.createElement($T, {..., dangerouslySetInnerHTML: {..., __html: $X, ...}, ...})"
              - pattern: "React.createFactory($T)({..., dangerouslySetInnerHTML: {..., __html: $X, ...}, ...})"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "$W.setInnerHTMLUnsafe($EL, $X)"
              - pattern: "$W.setOuterHTMLUnsafe($EL, $X)"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: 'new JSDOM($X, {..., runScripts: "dangerously", ...})'
          - pattern-either:
              - pattern-inside: |
                  import { JSDOM } from "jsdom";
                  ...
              - pattern-inside: |
                  const { JSDOM } = require("jsdom");
                  ...
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$T.sendMail({..., html: $X, ...})"
          - pattern-inside: |
              $T = $NM.createTransport(...);
              ...
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "return $X;"
          - pattern-inside: "$J.typeahead(..., {..., templates: {..., suggestion: function (...) {...}, ...}, ...})"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "<WebView ... html={$X} ... />"
              - pattern: "<WebView ... source={{..., html: $X, ...}} ... />"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: '<$EL ... data-tip={$X} ... data-html="true" ... />'
              - pattern: "<$EL ... data-tip={$X} ... data-html={true} ... />"
              - pattern: '<$EL ... data-html="true" ... data-tip={$X} ... />'
              - pattern: "<$EL ... data-html={true} ... data-tip={$X} ... />"
          - focus-metavariable: "$X"
      - patterns:
          - pattern-either:
              - pattern: "$RES.send($X)"
              - pattern: "$RES.write($X)"
              - pattern: "$RES.end($X, ...)"
          - metavariable-regex:
              metavariable: "$RES"
              regex: "^(?i:_?(?:res|response|reply|resp))$"
          - focus-metavariable: "$X"
    pattern-sanitizers:
      - pattern: "escapeHtml($X)"
      - pattern: "escapeHTML($X)"
      - pattern: "escape($X)"
      - pattern: "escapeString($X)"
      - pattern: "encodeURIComponent($X)"
      - pattern: "encodeURI($X)"
      - pattern: "sanitize($X)"
      - pattern: "sanitizeHtml($X, ...)"
      - pattern: "sanitizeHtml($X)"
      - pattern: "xss($X)"
      - pattern: "$L.escape($X)"
      - pattern: "$L.sanitize($X, ...)"
      - pattern: "$L.encode($X, ...)"
      - pattern: "he.escape($X)"
      - pattern: "$L.escapeHtml($X)"
      - pattern: "$L.escapeHTML($X)"
      - pattern: "DOMPurify.sanitize($X, ...)"
      - pattern: "validator.escape($X)"
      - pattern: "_.escape($X)"
      - pattern: "parseInt($X, ...)"
      - pattern: "parseFloat($X)"
      - pattern: "Number($X)"
      - pattern: "Boolean($X)"
      - pattern: "isNaN($X)"
      - pattern: "$L.stripTags($X)"
      - pattern: "striptags($X)"
      - pattern: "$L.filterXSS($X)"
      - pattern: "filterXSS($X)"
      - pattern: "escapeHtmlEntities($X)"
      - pattern: "htmlEscape($X)"
      - pattern: "$X.toFixed(...)"
      - pattern: "$L.encodeForHTML($X)"
      - pattern: "encodeHTML($X)"
      - pattern: "$X.length"
      - pattern: "JSON.stringify($X)"
      - pattern: "+$X"
      - pattern: "typeof $X"
      - patterns:
          - pattern: '"$P" + $X'
          - metavariable-regex:
              metavariable: "$P"
              regex: "^(?!\\s*<).+"
      - pattern: "DOMPurify.sanitize($X, ...)"
      - pattern: "$D.sanitize($X, ...)"
      - pattern: "$E.text($X)"
      - pattern: "document.createTextNode($X)"
      - pattern: "$T.sanitizeHtml($X)"
      - pattern: '$X.replace(/[<>&"'']/g, ...)'
      - patterns:
          - pattern: "$X"
          - pattern-inside: "if ($X.jquery) {...}"
      - patterns:
          - pattern: "$X"
          - pattern-inside: "if (typeof $X === 'object') {...}"
      - patterns:
          - pattern: "$X"
          - pattern-inside: "if (typeof $X !== 'string') {...}"
      - patterns:
          - pattern: "$X"
          - pattern-inside: "if (isElement($X)) {...}"
      - patterns:
          - pattern-either:
              - pattern: "$X.replace(/$RE/g, ...)"
              - pattern: "$X.replace(/$RE/gi, ...)"
              - pattern: "$X.replace(/$RE/gm, ...)"
              - pattern: "$X.replace(/$RE/gu, ...)"
              - pattern: "$X.replace(/$RE/ig, ...)"
          - metavariable-regex:
              metavariable: "$RE"
              regex: "^(?:[^|]*\\|)*(?:[<'\"]|(?:\\\\x3[cC]|\\\\u003[cC]|\\\\x27|\\\\x22|\\\\u0027|\\\\u0022)|\\.|\\\\[WSD]|\\[\\^(?:[^\\]\\\\]|\\\\.)*\\]|\\[(?!\\^)(?:[^\\]\\\\]|\\\\.)*(?:[<'\"]|\\\\[WSD]|(?:\\\\x3[cC]|\\\\u003[cC]|\\\\x27|\\\\x22|\\\\u0027|\\\\u0022))(?:[^\\]\\\\]|\\\\.)*\\]|(?:\\.|\\\\[WSD]|\\[\\^(?:[^\\]\\\\]|\\\\.)*\\])[*+])(?:\\|.*)?$"
      - patterns:
          - pattern-either:
              - pattern: "$X.replaceAll(/$RE/g, ...)"
              - pattern: "$X.replaceAll(/$RE/gi, ...)"
          - metavariable-regex:
              metavariable: "$RE"
              regex: "^(?:[^|]*\\|)*(?:[<'\"]|(?:\\\\x3[cC]|\\\\u003[cC]|\\\\x27|\\\\x22|\\\\u0027|\\\\u0022)|\\.|\\\\[WSD]|\\[\\^(?:[^\\]\\\\]|\\\\.)*\\]|\\[(?!\\^)(?:[^\\]\\\\]|\\\\.)*(?:[<'\"]|\\\\[WSD]|(?:\\\\x3[cC]|\\\\u003[cC]|\\\\x27|\\\\x22|\\\\u0027|\\\\u0022))(?:[^\\]\\\\]|\\\\.)*\\]|(?:\\.|\\\\[WSD]|\\[\\^(?:[^\\]\\\\]|\\\\.)*\\])[*+])(?:\\|.*)?$"
      - patterns:
          - pattern-either:
              - pattern: '$X.replace(new RegExp("$RE", $FLAGS), ...)'
              - pattern: '$X.replaceAll(new RegExp("$RE", $FLAGS), ...)'
          - metavariable-regex:
              metavariable: "$RE"
              regex: "^(?:[^|]*\\|)*(?:[<'\"]|(?:\\\\x3[cC]|\\\\u003[cC]|\\\\x27|\\\\x22|\\\\u0027|\\\\u0022)|\\.|\\\\[WSD]|\\[\\^(?:[^\\]\\\\]|\\\\.)*\\]|\\[(?!\\^)(?:[^\\]\\\\]|\\\\.)*(?:[<'\"]|\\\\[WSD]|(?:\\\\x3[cC]|\\\\u003[cC]|\\\\x27|\\\\x22|\\\\u0027|\\\\u0022))(?:[^\\]\\\\]|\\\\.)*\\]|(?:\\.|\\\\[WSD]|\\[\\^(?:[^\\]\\\\]|\\\\.)*\\])[*+])(?:\\|.*)?$"
          - metavariable-regex:
              metavariable: "$FLAGS"
              regex: '^(?:["''][^"'']*g[^"'']*["'']|[^"''].*)$'
      - pattern: "$X.charCodeAt(...)"
      - pattern: "$X.indexOf(...)"
      - pattern: "$X.search(...)"
      - patterns:
          - pattern: "$E.data"
          - pattern-inside: "if ($E.origin === $O) {...}"
      - patterns:
          - pattern: "$E.data"
          - pattern-inside: "if ($E.origin == $O) {...}"
      - patterns:
          - pattern: "$E.data"
          - pattern-inside: "if ($E.origin !== $O) { return; } ..."
      - patterns:
          - pattern: "$E.data"
          - pattern-inside: "if ($E.origin != $O) { return; } ..."
      - patterns:
          - pattern: "$E.data"
          - pattern-inside: "if (!$E.origin.startsWith($O)) { return; } ..."
      - patterns:
          - pattern: "$E.data"
          - pattern-inside: "if ($O.includes($E.origin)) {...}"
    options:
      interfile: true
