    pattern-sanitizers:
      - patterns:
          - pattern: "$F(...)"
          - metavariable-regex:
              metavariable: "$F"
              regex: "(?is).*(protect|encode|encrypt)"
      - patterns:
          - pattern: "$O.$F(...)"
          - metavariable-regex:
              metavariable: "$F"
              regex: "(?is).*(protect|encode|encrypt)"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: '$W.postMessage($D, "*", ...)'
              - pattern: "$W.postMessage($D, '*', ...)"
          - focus-metavariable: "$D"
