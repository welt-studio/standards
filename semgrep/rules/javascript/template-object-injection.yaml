# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-template-object-injection
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "Injeção de objeto em template: o objeto de entrada do usuário é passado inteiro ao motor de template (res.render(view, req.body)), o que pode ativar opções do motor e levar a execução de código ou leitura de arquivos. Passe só os campos esperados, como strings."
    metadata:
      category: security
      cwe: "CWE-073: External Control of File Name or Path"
      codeql: js/template-object-injection
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: "function ($REQ, $RES, ...) {...}"
              - pattern-inside: "function $F($REQ, $RES, ...) {...}"
              - pattern-inside: "async function ($REQ, $RES, ...) {...}"
              - pattern-inside: "async function $F($REQ, $RES, ...) {...}"
              - pattern-inside: "($REQ, $RES, ...) => {...}"
              - pattern-inside: "($REQ, $RES, ...) => $E"
              - pattern-inside: "async ($REQ, $RES, ...) => {...}"
              - pattern-inside: "async ($REQ, $RES, ...) => $E"
              - pattern-inside: "$M($REQ, $RES, ...) {...}"
              - pattern-inside: "async $M($REQ, $RES, ...) {...}"
              - pattern-inside: "function ($REQ) {...}"
              - pattern-inside: "function $F($REQ) {...}"
              - pattern-inside: "($REQ) => {...}"
              - pattern-inside: "($REQ) => $E"
              - pattern-inside: "async ($REQ) => {...}"
              - pattern-inside: "async function $F($REQ) {...}"
              - pattern-inside: "$M($REQ) {...}"
          - metavariable-regex:
              metavariable: "$REQ"
              regex: "^(?i:_?(?:req|request|r))$"
          - pattern-either:
              - pattern: "$REQ.query"
              - pattern: "$REQ.body"
              - pattern: "$REQ.params"
              - pattern: "$REQ.headers"
              - pattern: "$REQ.cookies"
              - pattern: "$REQ.signedCookies"
              - pattern: "$REQ.url"
              - pattern: "$REQ.originalUrl"
              - pattern: "$REQ.path"
              - pattern: "$REQ.hostname"
              - pattern: "$REQ.host"
              - pattern: "$REQ.baseUrl"
              - pattern: "$REQ.subdomains"
              - pattern: "$REQ.files"
              - pattern: "$REQ.file"
              - pattern: "$REQ.rawBody"
              - pattern: "$REQ.payload"
              - pattern: "$REQ.state"
              - pattern: "$REQ.get(...)"
              - pattern: "$REQ.header(...)"
              - pattern: "$REQ.param(...)"
              - pattern: "$REQ.getHeader(...)"
              - pattern: "$REQ.json()"
              - pattern: "$REQ.text()"
              - pattern: "$REQ.formData()"
              - pattern: "$REQ.blob()"
              - pattern: "$REQ.arrayBuffer()"
              - pattern: "$REQ.nextUrl.$K"
      - patterns:
          - pattern-either:
              - pattern-inside: "$APP.$M(..., function ($REQ, ...) {...})"
              - pattern-inside: "$APP.$M(..., async function ($REQ, ...) {...})"
              - pattern-inside: "$APP.$M(..., ($REQ, ...) => {...})"
              - pattern-inside: "$APP.$M(..., ($REQ, ...) => $E)"
              - pattern-inside: "$APP.$M(..., async ($REQ, ...) => {...})"
              - pattern-inside: "$APP.$M(..., async ($REQ, ...) => $E)"
              - pattern-inside: "$APP.$M(..., function $F($REQ, ...) {...})"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:get|post|put|delete|patch|all|use|route|head|options|on|createServer|handle|addHook|register)$"
          - pattern-either:
              - pattern: "$REQ.query"
              - pattern: "$REQ.body"
              - pattern: "$REQ.params"
              - pattern: "$REQ.headers"
              - pattern: "$REQ.cookies"
              - pattern: "$REQ.signedCookies"
              - pattern: "$REQ.url"
              - pattern: "$REQ.originalUrl"
              - pattern: "$REQ.path"
              - pattern: "$REQ.hostname"
              - pattern: "$REQ.host"
              - pattern: "$REQ.baseUrl"
              - pattern: "$REQ.subdomains"
              - pattern: "$REQ.files"
              - pattern: "$REQ.file"
              - pattern: "$REQ.rawBody"
              - pattern: "$REQ.payload"
              - pattern: "$REQ.state"
              - pattern: "$REQ.get(...)"
              - pattern: "$REQ.header(...)"
              - pattern: "$REQ.param(...)"
              - pattern: "$REQ.getHeader(...)"
              - pattern: "$REQ.json()"
              - pattern: "$REQ.text()"
              - pattern: "$REQ.formData()"
              - pattern: "$REQ.blob()"
              - pattern: "$REQ.arrayBuffer()"
              - pattern: "$REQ.nextUrl.$K"
      - patterns:
          - pattern-either:
              - pattern-inside: "function getServerSideProps($CTX) {...}"
              - pattern-inside: "async function getServerSideProps($CTX) {...}"
              - pattern-inside: "function getInitialProps($CTX) {...}"
              - pattern-inside: "$P.getInitialProps = async ($CTX) => {...}"
              - pattern-inside: "$P.getInitialProps = ($CTX) => {...}"
          - pattern-either:
              - pattern: "$CTX.query"
              - pattern: "$CTX.params"
              - pattern: "$CTX.req.url"
              - pattern: "$CTX.req.headers"
              - pattern: "$CTX.req.body"
      - patterns:
          - pattern-either:
              - pattern-inside: "function getServerSideProps($CTX) {...}"
              - pattern-inside: "async function getServerSideProps($CTX) {...}"
              - pattern-inside: "function getInitialProps($CTX) {...}"
              - pattern-inside: "$P.getInitialProps = async ($CTX) => {...}"
              - pattern-inside: "$P.getInitialProps = ($CTX) => {...}"
          - pattern-inside: "$REQ = $CTX.req; ..."
          - pattern-either:
              - pattern: "$REQ.url"
              - pattern: "$REQ.headers"
              - pattern: "$REQ.body"
              - pattern: "$REQ.query"
              - pattern: "$REQ.cookies"
      - patterns:
          - pattern-either:
              - pattern-inside: "function ($CTX, ...) {...}"
              - pattern-inside: "async function ($CTX, ...) {...}"
              - pattern-inside: "async ($CTX, ...) => {...}"
              - pattern-inside: "($CTX, ...) => {...}"
              - pattern-inside: "async function $F($CTX, ...) {...}"
              - pattern-inside: "function $F($CTX, ...) {...}"
              - pattern-inside: "async ($CTX, $NEXT) => {...}"
          - metavariable-regex:
              metavariable: "$CTX"
              regex: "^(?i:_?(?:ctx|context|koaContext))$"
          - pattern-either:
              - pattern: "$CTX.query"
              - pattern: "$CTX.params"
              - pattern: "$CTX.headers"
              - pattern: "$CTX.url"
              - pattern: "$CTX.originalUrl"
              - pattern: "$CTX.path"
              - pattern: "$CTX.href"
              - pattern: "$CTX.querystring"
              - pattern: "$CTX.search"
              - pattern: "$CTX.hostname"
              - pattern: "$CTX.host"
              - pattern: "$CTX.origin"
              - pattern: "$CTX.request.query"
              - pattern: "$CTX.request.body"
              - pattern: "$CTX.request.headers"
              - pattern: "$CTX.request.url"
              - pattern: "$CTX.request.path"
              - pattern: "$CTX.request.href"
              - pattern: "$CTX.request.querystring"
              - pattern: "$CTX.request.search"
              - pattern: "$CTX.request.originalUrl"
              - pattern: "$CTX.request.host"
              - pattern: "$CTX.request.hostname"
              - pattern: "$CTX.req.url"
              - pattern: "$CTX.req.headers"
              - pattern: "$CTX.request.params"
              - pattern: "$CTX.cookies"
              - pattern: "$CTX.get(...)"
              - pattern: "$CTX.cookies.get(...)"
              - pattern: "$CTX.request.get(...)"
              - pattern: "$CTX.header(...)"
      - patterns:
          - pattern: "@Body(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@Query(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@Param(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@Headers(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@Req(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@Request(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@Cookies(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@UploadedFile(...) $X"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "@UploadedFiles(...) $X"
          - focus-metavariable: "$X"
    pattern-sinks:
      - patterns:
          - pattern: "$RES.render($T, $X)"
          - pattern-not: "$RES.render($T, {...})"
          - pattern-not: "$RES.render($T, [...])"
          - focus-metavariable: "$X"
          - metavariable-regex:
              metavariable: "$RES"
              regex: "^(?i:_?(?:res|response|reply|resp))$"
    pattern-sanitizers:
      - patterns:
          - pattern: "$X"
          - pattern-inside: 'if (typeof $X === "string") {...}'
      - patterns:
          - pattern: "$X"
          - pattern-inside: 'if (typeof $X == "string") {...}'
      - pattern: '$X + ""'
      - pattern: '"" + $X'
      - pattern: "String($X)"
      - pattern: "`${$X}`"
      - pattern: "$X.toString()"
      - pattern: "parseInt($X, ...)"
      - pattern: "Number($X)"
      - pattern: "JSON.stringify($X)"
    options:
      interfile: true
