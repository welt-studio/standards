                  - pattern-either:
                      - pattern: "$J.html($X)"
                      - pattern: "$J.html((...) => $X)"
                      - pattern: "$J.html(function (...) { ... return $X; })"
                  - pattern-inside: |
                      $J = <... d3.$R(...) ...>;
                      ...
          - metavariable-regex:
              metavariable: "$R"
              regex: "^(?:select|selectAll|selection)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$($X)"
          - focus-metavariable: "$X"
      - patterns:
