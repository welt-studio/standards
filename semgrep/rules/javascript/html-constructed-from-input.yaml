              regex: "^\\$sce$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "$SCE.trustAs($KIND, $X)"
          - metavariable-regex:
              metavariable: "$SCE"
              regex: "^\\$sce$"
          - metavariable-regex:
              metavariable: "$KIND"
              regex: "^\\$sce\\.(?:HTML|CSS)$"
          - focus-metavariable: "$X"
      - patterns:
          - pattern: "angular.element($X)"
          - focus-metavariable: "$X"
      - patterns:
