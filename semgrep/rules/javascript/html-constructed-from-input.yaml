# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-html-constructed-from-input
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "HTML montado a partir de parâmetro de função de biblioteca: se o valor contiver HTML, o resultado será XSS ao ir para o DOM. Escape o valor (ou use textContent) antes de montar o HTML."
    metadata:
      category: security
      cwe: "CWE-079: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      codeql: js/html-constructed-from-input
    paths:
      exclude:
        - "*.test.*"
        - "*.spec.*"
        - "__tests__/"
        - "fixtures/"
        - "testing/"
    mode: taint
    pattern-sources:
      - label: INPUT
        pattern-either:
          - patterns:
              - pattern: "module.exports = function (..., $P, ...) {...}"
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "module.exports.$F = function (..., $P, ...) {...}"
              - metavariable-regex:
                  metavariable: "$F"
                  regex: "^[a-zA-Z0-9]"
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "exports.$F = function (..., $P, ...) {...}"
              - metavariable-regex:
                  metavariable: "$F"
                  regex: "^[a-zA-Z0-9]"
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "module.exports.$F.$G = function (..., $P, ...) {...}"
              - metavariable-regex:
                  metavariable: "$F"
                  regex: "^[a-zA-Z0-9]"
              - metavariable-regex:
                  metavariable: "$G"
                  regex: "^[a-zA-Z0-9]"
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "module.exports = { ..., $F: function (..., $P, ...) {...}, ... }"
              - metavariable-regex:
                  metavariable: "$F"
                  regex: "^[a-zA-Z0-9]"
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "module.exports.$F = { ..., $G: function (..., $P, ...) {...}, ... }"
              - metavariable-regex:
                  metavariable: "$F"
                  regex: "^[a-zA-Z0-9]"
              - metavariable-regex:
                  metavariable: "$G"
                  regex: "^[a-zA-Z0-9]"
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "module.exports = (..., $P, ...) => ..."
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "module.exports.$F = (..., $P, ...) => ..."
              - metavariable-regex:
                  metavariable: "$F"
                  regex: "^[a-zA-Z0-9]"
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "exports.$F = (..., $P, ...) => ..."
              - metavariable-regex:
                  metavariable: "$F"
                  regex: "^[a-zA-Z0-9]"
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "module.exports.$F.$G = (..., $P, ...) => ..."
              - metavariable-regex:
                  metavariable: "$F"
                  regex: "^[a-zA-Z0-9]"
              - metavariable-regex:
                  metavariable: "$G"
                  regex: "^[a-zA-Z0-9]"
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "module.exports = { ..., $F: (..., $P, ...) => ..., ... }"
              - metavariable-regex:
                  metavariable: "$F"
                  regex: "^[a-zA-Z0-9]"
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "module.exports.$F = { ..., $G: (..., $P, ...) => ..., ... }"
              - metavariable-regex:
                  metavariable: "$F"
                  regex: "^[a-zA-Z0-9]"
              - metavariable-regex:
                  metavariable: "$G"
                  regex: "^[a-zA-Z0-9]"
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "export function $F(..., $P, ...) {...}"
              - metavariable-regex:
                  metavariable: "$F"
                  regex: "^[a-zA-Z0-9]"
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "export default function $F(..., $P, ...) {...}"
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "export default function (..., $P, ...) {...}"
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "export default (..., $P, ...) => ..."
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "export const $F = function (..., $P, ...) {...}"
              - metavariable-regex:
                  metavariable: "$F"
                  regex: "^[a-zA-Z0-9]"
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "export const $F = (..., $P, ...) => ..."
              - metavariable-regex:
                  metavariable: "$F"
                  regex: "^[a-zA-Z0-9]"
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "function $F(..., $P, ...) {...}"
              - pattern-either:
                  - pattern-inside: |
                      function $F(...) {...}
                      ...
                      module.exports = $F;
                  - pattern-inside: |
                      module.exports = $F;
                      ...
                      function $F(...) {...}
                  - pattern-inside: |
                      function $F(...) {...}
                      ...
                      module.exports.$F = $F;
                  - pattern-inside: |
                      module.exports.$F = $F;
                      ...
                      function $F(...) {...}
                  - pattern-inside: |
                      function $F(...) {...}
                      ...
                      exports.$F = $F;
                  - pattern-inside: |
                      exports.$F = $F;
                      ...
                      function $F(...) {...}
                  - pattern-inside: |
                      function $F(...) {...}
                      ...
                      module.exports = {..., $F, ...};
                  - pattern-inside: |
                      module.exports = {..., $F, ...};
                      ...
                      function $F(...) {...}
                  - pattern-inside: |
                      function $F(...) {...}
                      ...
                      export { $F };
                  - pattern-inside: |
                      export { $F };
                      ...
                      function $F(...) {...}
                  - pattern-inside: |
                      function $F(...) {...}
                      ...
                      export default $F;
                  - pattern-inside: |
                      export default $F;
                      ...
                      function $F(...) {...}
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "const $F = function (..., $P, ...) {...}"
              - pattern-either:
                  - pattern-inside: |
                      const $F = function (...) {...};
                      ...
                      module.exports = $F;
                  - pattern-inside: |
                      module.exports = $F;
                      ...
                      const $F = function (...) {...};
                  - pattern-inside: |
                      const $F = function (...) {...};
                      ...
                      module.exports.$F = $F;
                  - pattern-inside: |
                      module.exports.$F = $F;
                      ...
                      const $F = function (...) {...};
                  - pattern-inside: |
                      const $F = function (...) {...};
                      ...
                      exports.$F = $F;
                  - pattern-inside: |
                      exports.$F = $F;
                      ...
                      const $F = function (...) {...};
                  - pattern-inside: |
                      const $F = function (...) {...};
                      ...
                      module.exports = {..., $F, ...};
                  - pattern-inside: |
                      module.exports = {..., $F, ...};
                      ...
                      const $F = function (...) {...};
                  - pattern-inside: |
                      const $F = function (...) {...};
                      ...
                      export { $F };
                  - pattern-inside: |
                      export { $F };
                      ...
                      const $F = function (...) {...};
                  - pattern-inside: |
                      const $F = function (...) {...};
                      ...
                      export default $F;
                  - pattern-inside: |
                      export default $F;
                      ...
                      const $F = function (...) {...};
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "const $F = (..., $P, ...) => ..."
              - pattern-either:
                  - pattern-inside: |
                      const $F = (...) => $B;
                      ...
                      module.exports = $F;
                  - pattern-inside: |
                      module.exports = $F;
                      ...
                      const $F = (...) => $B;
                  - pattern-inside: |
                      const $F = (...) => $B;
                      ...
                      module.exports.$F = $F;
                  - pattern-inside: |
                      module.exports.$F = $F;
                      ...
                      const $F = (...) => $B;
                  - pattern-inside: |
                      const $F = (...) => $B;
                      ...
                      exports.$F = $F;
                  - pattern-inside: |
                      exports.$F = $F;
                      ...
                      const $F = (...) => $B;
                  - pattern-inside: |
                      const $F = (...) => $B;
                      ...
                      module.exports = {..., $F, ...};
                  - pattern-inside: |
                      module.exports = {..., $F, ...};
                      ...
                      const $F = (...) => $B;
                  - pattern-inside: |
                      const $F = (...) => $B;
                      ...
                      export { $F };
                  - pattern-inside: |
                      export { $F };
                      ...
                      const $F = (...) => $B;
                  - pattern-inside: |
                      const $F = (...) => $B;
                      ...
                      export default $F;
                  - pattern-inside: |
                      export default $F;
                      ...
                      const $F = (...) => $B;
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "class $C { $M(..., $P, ...) {...} }"
              - pattern-not: |
                  class $C { private $M(...) {...} }
              - pattern-not: |
                  class $C { protected $M(...) {...} }
              - pattern-either:
                  - pattern-inside: |
                      export class $C {...}
                  - pattern-inside: |
                      export default class $C {...}
                  - pattern-inside: |
                      module.exports = class $C {...}
                  - pattern-inside: |
                      class $C {...}
                      ...
                      module.exports = $C;
                  - pattern-inside: |
                      class $C {...}
                      ...
                      module.exports.$N = $C;
                  - pattern-inside: |
                      class $C {...}
                      ...
                      exports.$N = $C;
                  - pattern-inside: |
                      class $C {...}
                      ...
                      export { $C };
                  - pattern-inside: |
                      class $C {...}
                      ...
                      export { $C as $N };
                  - pattern-inside: |
                      class $C {...}
                      ...
                      export default $C;
                  - pattern-inside: |
                      class $C {...}
                      ...
                      module.exports = new $C(...);
              - metavariable-regex:
                  metavariable: "$M"
                  regex: "^[a-zA-Z0-9]"
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "class { $M(..., $P, ...) {...} }"
              - pattern-not: |
                  class { private $M(...) {...} }
              - pattern-not: |
                  class { protected $M(...) {...} }
              - pattern-either:
                  - pattern-inside: |
                      module.exports = class {...}
                  - pattern-inside: |
                      export default class {...}
                  - pattern-inside: |
                      module.exports.$N = class {...}
                  - pattern-inside: |
                      exports.$N = class {...}
              - metavariable-regex:
                  metavariable: "$M"
                  regex: "^[a-zA-Z0-9]"
              - focus-metavariable: "$P"
          - patterns:
              - pattern: "$C.prototype.$M = function (..., $P, ...) {...}"
              - pattern-inside: |
                  ...
                  module.exports = new $C(...);
                  ...
              - metavariable-regex:
                  metavariable: "$M"
                  regex: "^[a-zA-Z0-9]"
              - focus-metavariable: "$P"
          - patterns:
              - pattern-either:
                  - pattern: "$D.fn.$N = function (..., $P, ...) {...}"
                  - pattern: "$D.fn.$N = (..., $P, ...) => ..."
                  - pattern: "$D.fn.extend({..., $N: function (..., $P, ...) {...}, ...})"
                  - pattern: "$D.fn.extend({..., $N: (..., $P, ...) => ..., ...})"
                  - pattern: "$D.fn.extend({..., $N(..., $P, ...) {...}, ...})"
              - metavariable-regex:
                  metavariable: "$D"
                  regex: "^(?:\\$|jQuery|cash)$"
              - focus-metavariable: "$P"
          - patterns:
              - pattern-either:
                  - pattern: "$D.extend($G.fn, {..., $N: function (..., $P, ...) {...}, ...})"
                  - pattern: "$D.extend($G.fn, {..., $N: (..., $P, ...) => ..., ...})"
                  - pattern: "$D.extend($G.fn, {..., $N(..., $P, ...) {...}, ...})"
              - metavariable-regex:
                  metavariable: "$D"
                  regex: "^(?:\\$|jQuery|cash)$"
              - metavariable-regex:
                  metavariable: "$G"
                  regex: "^(?:\\$|jQuery|cash)$"
              - focus-metavariable: "$P"
          - patterns:
              - pattern-either:
                  - pattern: |
                      function $F(..., $P, ...) {...}
                  - pattern: |
                      const $F = function (..., $P, ...) {...}
                  - pattern: |
                      const $F = (..., $P, ...) => ...
              - pattern-either:
                  - pattern-inside: |
                      ...
                      $D.fn.$N = $F;
                      ...
                  - pattern-inside: |
                      ...
                      $D.fn.extend({..., $N: $F, ...});
                      ...
                  - pattern-inside: |
                      ...
                      $D.extend($G.fn, {..., $N: $F, ...});
                      ...
              - metavariable-regex:
                  metavariable: "$D"
                  regex: "^(?:\\$|jQuery|cash)$"
              - focus-metavariable: "$P"
      - label: HTML
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: '"$A" + $X'
              - pattern: '$X + "$A"'
              - pattern: '<... "$A" ...> + $X'
              - pattern: '$X + <... "$A" ...>'
          - metavariable-regex:
              metavariable: "$A"
              regex: "(?s).*</?[a-zA-Z]"
      - label: HTML
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "`$A${$X}$B`"
              - pattern: "`$A${$X}$B${$Y}$C`"
              - pattern: "`$A${$X}$B${$Y}$C${$Z}$D`"
          - metavariable-regex:
              metavariable: "$A"
              regex: "(?s).*</?[a-zA-Z]"
      - label: HTML
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "`$A${$X}$B`"
              - pattern: "`$A${$X}$B${$Y}$C`"
              - pattern: "`$A${$X}$B${$Y}$C${$Z}$D`"
          - metavariable-regex:
              metavariable: "$B"
              regex: "(?s).*</?[a-zA-Z]"
      - label: HTML
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "`$A${$X}$B${$Y}$C`"
              - pattern: "`$A${$X}$B${$Y}$C${$Z}$D`"
          - metavariable-regex:
              metavariable: "$C"
              regex: "(?s).*</?[a-zA-Z]"
      - label: HTML
        requires: INPUT
        patterns:
          - pattern: "`$A${$X}$B${$Y}$C${$Z}$D`"
          - metavariable-regex:
              metavariable: "$D"
              regex: "(?s).*</?[a-zA-Z]"
      - label: HTML
        requires: INPUT
        patterns:
          - pattern: '[..., "$A", ...].join("")'
          - metavariable-regex:
              metavariable: "$A"
              regex: "(?s).*</?[a-zA-Z]"
      - label: XML
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: 'new DOMParser().parseFromString($X, "$T")'
              - patterns:
                  - pattern: '$D.parseFromString($X, "$T")'
                  - pattern-inside: |
                      $D = new DOMParser();
                      ...
          - metavariable-regex:
              metavariable: "$T"
              regex: ".*xml"
      - label: MD
        requires: INPUT
        patterns:
          - pattern: "$V($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $V = require("marked");
                  ...
              - pattern-inside: |
                  import $V from "marked";
                  ...
              - pattern-inside: |
                  import * as $V from "marked";
                  ...
      - label: MD
        requires: INPUT
        patterns:
          - pattern: "marked($X, ...)"
          - pattern-not-inside: |
              import marked from "$M";
              ...
          - pattern-not-inside: |
              import * as marked from "$M";
              ...
          - pattern-not-inside: |
              import { ..., marked, ... } from "$M";
              ...
          - pattern-not-inside: |
              import { ..., $O as marked, ... } from "$M";
              ...
          - pattern-not-inside: |
              marked = $E;
              ...
      - label: MD
        requires: INPUT
        patterns:
          - pattern: "$V($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $V = require("snarkdown");
                  ...
              - pattern-inside: |
                  import $V from "snarkdown";
                  ...
              - pattern-inside: |
                  import * as $V from "snarkdown";
                  ...
      - label: MD
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "new $S.Converter(...).makeHtml($X, ...)"
              - pattern: "new $S.Converter(...).makeMd($X, ...)"
              - patterns:
                  - pattern-either:
                      - pattern: "$C.makeHtml($X, ...)"
                      - pattern: "$C.makeMd($X, ...)"
                  - pattern-inside: |
                      $C = new $S.Converter(...);
                      ...
          - pattern-either:
              - pattern-inside: |
                  $S = require("showdown");
                  ...
              - pattern-inside: |
                  import $S from "showdown";
                  ...
              - pattern-inside: |
                  import * as $S from "showdown";
                  ...
      - label: MD
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "new showdown.Converter(...).makeHtml($X, ...)"
              - pattern: "new showdown.Converter(...).makeMd($X, ...)"
              - patterns:
                  - pattern-either:
                      - pattern: "$C.makeHtml($X, ...)"
                      - pattern: "$C.makeMd($X, ...)"
                  - pattern-inside: |
                      $C = new showdown.Converter(...);
                      ...
          - pattern-not-inside: |
              import showdown from "$M";
              ...
          - pattern-not-inside: |
              import * as showdown from "$M";
              ...
          - pattern-not-inside: |
              import { ..., showdown, ... } from "$M";
              ...
          - pattern-not-inside: |
              import { ..., $O as showdown, ... } from "$M";
              ...
          - pattern-not-inside: |
              showdown = $E;
              ...
          - pattern-not-inside: |
              function showdown(...) {...}
      - label: MD
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "new $K(...).makeHtml($X, ...)"
              - pattern: "new $K(...).makeMd($X, ...)"
              - patterns:
                  - pattern-either:
                      - pattern: "$C.makeHtml($X, ...)"
                      - pattern: "$C.makeMd($X, ...)"
                  - pattern-inside: |
                      $C = new $K(...);
                      ...
          - pattern-either:
              - pattern-inside: |
                  import { ..., Converter as $K, ... } from "showdown";
                  ...
      - label: MD
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "new Converter(...).makeHtml($X, ...)"
              - pattern: "new Converter(...).makeMd($X, ...)"
              - patterns:
                  - pattern-either:
                      - pattern: "$C.makeHtml($X, ...)"
                      - pattern: "$C.makeMd($X, ...)"
                  - pattern-inside: |
                      $C = new Converter(...);
                      ...
          - pattern-either:
              - pattern-inside: |
                  import { ..., Converter, ... } from "showdown";
                  ...
      - label: MD
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "$V.render($ID, $X, ...)"
              - pattern: "$V.mermaidAPI.render($ID, $X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $V = require("mermaid");
                  ...
              - pattern-inside: |
                  import $V from "mermaid";
                  ...
              - pattern-inside: |
                  import * as $V from "mermaid";
                  ...
      - label: MD
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "mermaid.render($ID, $X, ...)"
              - pattern: "mermaid.mermaidAPI.render($ID, $X, ...)"
          - pattern-not-inside: |
              import mermaid from "$M";
              ...
          - pattern-not-inside: |
              import * as mermaid from "$M";
              ...
          - pattern-not-inside: |
              import { ..., mermaid, ... } from "$M";
              ...
          - pattern-not-inside: |
              import { ..., $O as mermaid, ... } from "$M";
              ...
          - pattern-not-inside: |
              mermaid = $E;
              ...
          - pattern-not-inside: |
              function mermaid(...) {...}
      - label: MD
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "<... $U(...) ...>.processSync($X, ...)"
              - pattern: "<... $U(...) ...>.process($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $U = require("unified");
                  ...
              - pattern-inside: |
                  import $U from "unified";
                  ...
              - pattern-inside: |
                  $U = require("remark");
                  ...
              - pattern-inside: |
                  import $U from "remark";
                  ...
          - pattern-not:
              patterns:
                - pattern-either:
                    - pattern: "<... $Q.use($S, ...) ...>.processSync($X, ...)"
                    - pattern: "<... $Q.use($S, ...) ...>.process($X, ...)"
                - pattern-either:
                    - pattern-inside: |
                        import $S from "$MOD";
                        ...
                    - pattern-inside: |
                        import { ..., $S, ... } from "$MOD";
                        ...
                    - pattern-inside: |
                        $S = require("$MOD");
                        ...
                - metavariable-regex:
                    metavariable: "$MOD"
                    regex: ".*sanitize"
      - label: MD
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "$V.render($X, ...)"
              - pattern: "$V.renderInline($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $V = require("markdown-it")({..., html: true, ...});
                  ...
              - pattern-inside: |
                  $V = require("markdown-it")({..., html: true, ...}).$M(...);
                  ...
              - pattern-inside: |
                  $V = require("markdown-it").Markdown({..., html: true, ...});
                  ...
      - label: MD
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: "$V.render($X, ...)"
              - pattern: "$V.renderInline($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $V = new $K({..., html: true, ...});
                  ...
              - pattern-inside: |
                  $V = $K({..., html: true, ...});
                  ...
              - pattern-inside: |
                  $V = new $K({..., html: true, ...}).$M(...);
                  ...
              - pattern-inside: |
                  $V = $K({..., html: true, ...}).$M(...);
                  ...
          - pattern-either:
              - pattern-inside: |
                  $K = require("markdown-it");
                  ...
              - pattern-inside: |
                  import $K from "markdown-it";
                  ...
              - pattern-inside: |
                  import * as $K from "markdown-it";
                  ...
      - label: MD
        requires: INPUT
        patterns:
          - pattern-either:
              - pattern: 'require("markdown-it")({..., html: true, ...}).render($X, ...)'
              - pattern: 'require("markdown-it")({..., html: true, ...}).renderInline($X, ...)'
    pattern-propagators:
      - pattern: "$V.render($ID, $X, function ($SVG) {...})"
        from: "$X"
        to: "$SVG"
        label: MD
        requires: INPUT
      - pattern: "$V.render($ID, $X, ($SVG) => {...})"
        from: "$X"
        to: "$SVG"
        label: MD
        requires: INPUT
      - pattern: "$V.mermaidAPI.render($ID, $X, function ($SVG) {...})"
        from: "$X"
        to: "$SVG"
        label: MD
        requires: INPUT
      - pattern: "$R.appendChild($X)"
        from: "$X"
        to: "$R"
      - pattern: "$R.insertBefore($X, ...)"
        from: "$X"
        to: "$R"
      - pattern: "$R.replaceChild($X, ...)"
        from: "$X"
        to: "$R"
      - pattern: "$R.append(..., $X, ...)"
        from: "$X"
        to: "$R"
      - pattern: "$R.prepend(..., $X, ...)"
