# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-prototype-pollution
    languages:
      - javascript
      - typescript
    severity: ERROR
    mode: taint
    options:
      interfile: true
    message: "Dado controlado pelo usuário é mesclado profundamente em um objeto com uma função de merge vulnerável a poluição de protótipo (`__proto__`). Use uma versão corrigida da biblioteca, ou filtre as chaves `__proto__`, `constructor` e `prototype`."
    metadata:
      category: security
      cwe: "CWE-1321: Improperly Controlled Modification of Object Prototype Attributes"
      codeql: js/prototype-pollution
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: "$REQ.query"
              - pattern: "$REQ.body"
              - pattern: "$REQ.params"
              - pattern: "$REQ.headers"
              - pattern: "$REQ.cookies"
              - pattern: "$REQ.url"
              - pattern: "$REQ.originalUrl"
              - pattern: "$REQ.path"
              - pattern: "$REQ.hostname"
              - pattern: "$REQ.host"
              - pattern: "$REQ.param(...)"
              - pattern: "$REQ.header(...)"
              - pattern: "$REQ.get(...)"
          - metavariable-regex:
              metavariable: "$REQ"
              regex: "^(req|request|ctx|ctx\\.request|this\\.request)$"
      - pattern-either:
          - pattern: location.search
          - pattern: location.hash
          - pattern: location.href
          - pattern: location.pathname
          - pattern: window.location.search
          - pattern: window.location.hash
          - pattern: window.location.href
          - pattern: document.location.search
          - pattern: document.location.hash
          - pattern: document.location.href
          - pattern: document.URL
          - pattern: document.documentURI
          - pattern: document.referrer
          - pattern: document.cookie
          - pattern: window.name
      - patterns:
          - pattern: "$EV.data"
          - pattern-either:
              - pattern-inside: |
                  $W.addEventListener("message", function ($EV, ...) {...})
              - pattern-inside: |
                  $W.addEventListener("message", ($EV, ...) => {...})
              - pattern-inside: |
                  addEventListener("message", ($EV, ...) => {...})
              - pattern-inside: |
                  $W.onmessage = ($EV) => {...}
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "_.merge($T, ..., $X)"
              - pattern: "_.mergeWith($T, ..., $X, ...)"
              - pattern: "_.defaultsDeep($T, ..., $X)"
              - pattern: "_.extend(true, $T, ..., $X)"
              - pattern: "lodash.merge($T, ..., $X)"
              - pattern: "lodash.defaultsDeep($T, ..., $X)"
              - pattern: "merge($T, ..., $X)"
              - pattern: "deepmerge($T, $X)"
              - pattern: "deepExtend($T, ..., $X)"
              - pattern: "mergeDeep($T, ..., $X)"
              - pattern: "$.extend(true, $T, ..., $X)"
              - pattern: "jQuery.extend(true, $T, ..., $X)"
              - pattern: "angular.merge($T, ..., $X)"
              - pattern: "webix.extend($T, $X, ...)"
              - pattern: "webix.copy($T, $X, ...)"
              - pattern: "$M.extend($T, $X, true)"
          - focus-metavariable: "$X"
