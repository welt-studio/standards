# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-stored-xss
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "XSS armazenado: nomes de arquivo (ou outros dados lidos do sistema) são enviados na resposta HTTP sem escape. Escape para HTML antes de escrever na resposta."
    metadata:
      category: security
      cwe: "CWE-079: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      codeql: js/stored-xss
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: "$F"
          - pattern-inside: "fs.readdir($P, function($E, $F) {...})"
      - patterns:
          - pattern: "$F"
          - pattern-inside: "fs.readdir($P, ($E, $F) => {...})"
      - patterns:
          - pattern: "$F"
          - pattern-inside: "fs.readdir($P, $O, function($E, $F) {...})"
      - pattern: "fs.readdirSync(...)"
      - pattern: "fs.promises.readdir(...)"
      - pattern: "$FS.readdirSync(...)"
      - patterns:
          - pattern: "$T.name"
          - pattern-inside: "$C.on('torrent', function($T) {...})"
      - patterns:
          - pattern: "$T.files"
          - pattern-inside: "$C.on('torrent', function($T) {...})"
      - patterns:
          - pattern: "$F.name"
          - pattern-inside: "$T.files.forEach(function($F) {...})"
      - patterns:
          - pattern: "$F.path"
          - pattern-inside: "$T.files.forEach(function($F) {...})"
      - pattern: "glob.sync(...)"
      - pattern: "klaw.sync(...)"
      - pattern: "readdirp.promise(...)"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "$RES.send($X)"
              - pattern: "$RES.write($X)"
              - pattern: "$RES.end($X, ...)"
          - metavariable-regex:
              metavariable: "$RES"
              regex: "^(?i:_?(?:res|response|reply|resp))$"
          - focus-metavariable: "$X"
          - pattern-not-inside:
              patterns:
                - pattern-inside: '$RES.set("$K", "$CT"); ...'
                - metavariable-regex:
                    metavariable: "$K"
                    regex: "(?i)^content-type$"
                - metavariable-regex:
                    metavariable: "$CT"
                    regex: "(?i)^(?!.*html).*$"
          - pattern-not-inside:
              patterns:
                - pattern-inside: '$RES.setHeader("$K", "$CT"); ...'
                - metavariable-regex:
                    metavariable: "$K"
                    regex: "(?i)^content-type$"
                - metavariable-regex:
                    metavariable: "$CT"
                    regex: "(?i)^(?!.*html).*$"
          - pattern-not-inside:
              patterns:
                - pattern-inside: '$RES.header("$K", "$CT"); ...'
                - metavariable-regex:
                    metavariable: "$K"
                    regex: "(?i)^content-type$"
                - metavariable-regex:
                    metavariable: "$CT"
                    regex: "(?i)^(?!.*html).*$"
          - pattern-not-inside:
              patterns:
                - pattern-inside: '$RES.append("$K", "$CT"); ...'
                - metavariable-regex:
                    metavariable: "$K"
                    regex: "(?i)^content-type$"
                - metavariable-regex:
                    metavariable: "$CT"
                    regex: "(?i)^(?!.*html).*$"
          - pattern-not-inside:
              patterns:
                - pattern-inside: '$RES.set({"$K": "$CT"}); ...'
                - metavariable-regex:
                    metavariable: "$K"
                    regex: "(?i)^content-type$"
                - metavariable-regex:
                    metavariable: "$CT"
                    regex: "(?i)^(?!.*html).*$"
          - pattern-not-inside:
              patterns:
                - pattern-inside: '$RES.header({"$K": "$CT"}); ...'
                - metavariable-regex:
                    metavariable: "$K"
                    regex: "(?i)^content-type$"
                - metavariable-regex:
                    metavariable: "$CT"
                    regex: "(?i)^(?!.*html).*$"
          - pattern-not-inside:
              patterns:
                - pattern-inside: '$RES.writeHead($S, {"$K": "$CT"}); ...'
                - metavariable-regex:
                    metavariable: "$K"
                    regex: "(?i)^content-type$"
                - metavariable-regex:
                    metavariable: "$CT"
                    regex: "(?i)^(?!.*html).*$"
          - pattern-not-inside:
              patterns:
                - pattern-inside: '$RES.type("$CT"); ...'
                - metavariable-regex:
                    metavariable: "$CT"
                    regex: "(?i)^(?!.*html).*$"
          - pattern-not-inside:
              patterns:
                - pattern-inside: '$RES.contentType("$CT"); ...'
                - metavariable-regex:
                    metavariable: "$CT"
                    regex: "(?i)^(?!.*html).*$"
    pattern-sanitizers:
      - patterns:
          - pattern: "$F(...)"
          - metavariable-regex:
              metavariable: "$F"
              regex: "^[\\w$]+$"
          - metavariable-regex:
              metavariable: "$F"
              regex: "(?i)^(?=.*html)(?=.*(?<!un)(?:saniti[sz]|escape|strip)).*$"
      - pattern: "escape($X)"
      - pattern: "encodeURIComponent($X)"
      - pattern: "encodeURI($X)"
      - patterns:
          - pattern: "$V.$M($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $V = require("he");
                  ...
              - pattern-inside: |
                  import $V from "he";
                  ...
              - pattern-inside: |
                  import * as $V from "he";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:encode|escape)$"
      - patterns:
          - pattern: "$F($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  import { $M as $F } from "he";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:encode|escape)$"
      - patterns:
          - pattern: "$M($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  import { $M } from "he";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:encode|escape)$"
      - patterns:
          - pattern-either:
              - pattern: 'require("he").$M($X, ...)'
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:encode|escape)$"
      - patterns:
          - pattern: "$V.$M($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $V = require("escape-goat");
                  ...
              - pattern-inside: |
                  import $V from "escape-goat";
                  ...
              - pattern-inside: |
                  import * as $V from "escape-goat";
                  ...
              - pattern-inside: |
                  $V = require("validator");
                  ...
              - pattern-inside: |
                  import $V from "validator";
                  ...
              - pattern-inside: |
                  import * as $V from "validator";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:escape)$"
      - patterns:
          - pattern: "$F($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  import { $M as $F } from "escape-goat";
                  ...
              - pattern-inside: |
                  import { $M as $F } from "validator";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:escape)$"
      - patterns:
          - pattern: "$M($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  import { $M } from "escape-goat";
                  ...
              - pattern-inside: |
                  import { $M } from "validator";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:escape)$"
      - patterns:
          - pattern-either:
              - pattern: 'require("escape-goat").$M($X, ...)'
              - pattern: 'require("validator").$M($X, ...)'
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:escape)$"
      - patterns:
          - pattern: "$V.$M($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $V = require("sanitizer");
                  ...
              - pattern-inside: |
                  import $V from "sanitizer";
                  ...
              - pattern-inside: |
                  import * as $V from "sanitizer";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:escape|sanitize)$"
      - patterns:
          - pattern: "$F($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  import { $M as $F } from "sanitizer";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:escape|sanitize)$"
      - patterns:
          - pattern: "$M($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  import { $M } from "sanitizer";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:escape|sanitize)$"
      - patterns:
          - pattern-either:
              - pattern: 'require("sanitizer").$M($X, ...)'
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:escape|sanitize)$"
      - patterns:
          - pattern: "$V.$M($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $V = require("ent");
                  ...
              - pattern-inside: |
                  import $V from "ent";
                  ...
              - pattern-inside: |
                  import * as $V from "ent";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:encode)$"
      - patterns:
          - pattern: "$F($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  import { $M as $F } from "ent";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:encode)$"
      - patterns:
          - pattern: "$M($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  import { $M } from "ent";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:encode)$"
      - patterns:
          - pattern-either:
              - pattern: 'require("ent").$M($X, ...)'
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:encode)$"
      - patterns:
          - pattern: "$V.$M($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $V = require("entities");
                  ...
              - pattern-inside: |
                  import $V from "entities";
                  ...
              - pattern-inside: |
                  import * as $V from "entities";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:encodeHTML|encodeXML)$"
      - patterns:
          - pattern: "$F($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  import { $M as $F } from "entities";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:encodeHTML|encodeXML)$"
      - patterns:
          - pattern: "$M($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  import { $M } from "entities";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:encodeHTML|encodeXML)$"
      - patterns:
          - pattern-either:
              - pattern: 'require("entities").$M($X, ...)'
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:encodeHTML|encodeXML)$"
      - patterns:
          - pattern: "$V.$M($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $V = require("xss-filters");
                  ...
              - pattern-inside: |
                  import $V from "xss-filters";
                  ...
              - pattern-inside: |
                  import * as $V from "xss-filters";
                  ...
      - patterns:
          - pattern: "$F($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  import { $M as $F } from "xss-filters";
                  ...
      - patterns:
          - pattern: "$M($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  import { $M } from "xss-filters";
                  ...
      - patterns:
          - pattern-either:
              - pattern: 'require("xss-filters").$M($X, ...)'
      - patterns:
          - pattern: "$V.$M($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $V = require("underscore");
                  ...
              - pattern-inside: |
                  import $V from "underscore";
                  ...
              - pattern-inside: |
                  import * as $V from "underscore";
                  ...
              - pattern-inside: |
                  $V = require("lodash");
                  ...
              - pattern-inside: |
                  import $V from "lodash";
                  ...
              - pattern-inside: |
                  import * as $V from "lodash";
                  ...
              - pattern-inside: |
                  $V = require("lodash-es");
                  ...
              - pattern-inside: |
                  import $V from "lodash-es";
                  ...
              - pattern-inside: |
                  import * as $V from "lodash-es";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:escape)$"
      - patterns:
          - pattern: "$F($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  import { $M as $F } from "underscore";
                  ...
              - pattern-inside: |
                  import { $M as $F } from "lodash";
                  ...
              - pattern-inside: |
                  import { $M as $F } from "lodash-es";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:escape)$"
      - patterns:
          - pattern: "$M($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  import { $M } from "underscore";
                  ...
              - pattern-inside: |
                  import { $M } from "lodash";
                  ...
              - pattern-inside: |
                  import { $M } from "lodash-es";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:escape)$"
      - patterns:
          - pattern-either:
              - pattern: 'require("underscore").$M($X, ...)'
              - pattern: 'require("lodash").$M($X, ...)'
              - pattern: 'require("lodash-es").$M($X, ...)'
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:escape)$"
      - patterns:
          - pattern: "$F($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $F = require("sanitize-html");
                  ...
              - pattern-inside: |
                  import $F from "sanitize-html";
                  ...
              - pattern-inside: |
                  import * as $F from "sanitize-html";
                  ...
              - pattern-inside: |
                  $F = require("xss");
                  ...
              - pattern-inside: |
                  import $F from "xss";
                  ...
              - pattern-inside: |
                  import * as $F from "xss";
                  ...
              - pattern-inside: |
                  $F = require("lodash/escape");
                  ...
              - pattern-inside: |
                  import $F from "lodash/escape";
                  ...
              - pattern-inside: |
                  import * as $F from "lodash/escape";
                  ...
              - pattern-inside: |
                  $F = require("lodash-es/escape");
                  ...
              - pattern-inside: |
                  import $F from "lodash-es/escape";
                  ...
              - pattern-inside: |
                  import * as $F from "lodash-es/escape";
                  ...
              - pattern-inside: |
                  $F = require("lodash.escape");
                  ...
              - pattern-inside: |
                  import $F from "lodash.escape";
                  ...
              - pattern-inside: |
                  import * as $F from "lodash.escape";
                  ...
      - patterns:
          - pattern-either:
              - pattern: 'require("sanitize-html")($X, ...)'
              - pattern: 'require("xss")($X, ...)'
              - pattern: 'require("lodash/escape")($X, ...)'
              - pattern: 'require("lodash-es/escape")($X, ...)'
              - pattern: 'require("lodash.escape")($X, ...)'
      - pattern: "_.escape($X)"
      - patterns:
          - pattern: "$I.$M($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  $I = new $C(...);
                  ...
          - pattern-either:
              - pattern-inside: |
                  import { $K as $C } from "html-entities";
                  ...
              - pattern-inside: |
                  import { $C } from "html-entities";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:encode|encodeNonUTF)$"
      - patterns:
          - pattern: "$C.$M($X, ...)"
          - pattern-either:
              - pattern-inside: |
                  import { $K as $C } from "html-entities";
                  ...
              - pattern-inside: |
                  import { $C } from "html-entities";
                  ...
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(?:encode|encodeNonUTF)$"
      - patterns:
          - pattern: "$O.$F(...)"
          - metavariable-regex:
              metavariable: "$F"
              regex: "(?i)^(?=.*html)(?=.*(?<!un)(?:saniti[sz]|escape|strip)).*$"
      - pattern: "DOMPurify.sanitize($X, ...)"
      - pattern: "parseInt($X, ...)"
      - pattern: "parseFloat($X)"
      - pattern: "Number($X)"
      - pattern: "Boolean($X)"
      - pattern: "isNaN($X)"
      - patterns:
          - pattern: "$S($X)"
          - pattern-either:
              - pattern-inside: |
                  $S = require("striptags");
                  ...
              - pattern-inside: |
                  import $S from "striptags";
                  ...
      - pattern: "$X.toFixed(...)"
      - pattern: "$X.length"
      - pattern: "JSON.stringify($X)"
      - pattern: "+$X"
      - pattern: "typeof $X"
    options:
      interfile: true
