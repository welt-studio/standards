# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-incorrect-suffix-check
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "Esta verificação de sufixo não compara os comprimentos, então não trata indexOf retornando -1."
    metadata:
      category: security
      cwe: "CWE-020: Improper Input Validation"
      codeql: js/incorrect-suffix-check
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: "$X.$M($ARG) === $X.length - $Y.length"
                  - pattern: "$X.$M($ARG) == $X.length - $Y.length"
                  - pattern: "$X.$M($ARG) !== $X.length - $Y.length"
                  - pattern: "$X.$M($ARG) != $X.length - $Y.length"
                  - pattern: "$X.length - $Y.length === $X.$M($ARG)"
                  - pattern: "$X.length - $Y.length == $X.$M($ARG)"
                  - pattern: "$X.length - $Y.length !== $X.$M($ARG)"
                  - pattern: "$X.length - $Y.length != $X.$M($ARG)"
                  - pattern: "$X.$M($ARG) === $X.length - $Y.length - 1"
                  - pattern: "$X.$M($ARG) == $X.length - $Y.length - 1"
                  - pattern: "$X.$M($ARG) !== $X.length - $Y.length - 1"
                  - pattern: "$X.$M($ARG) != $X.length - $Y.length - 1"
                  - pattern: "$X.length - $Y.length - 1 === $X.$M($ARG)"
                  - pattern: "$X.length - $Y.length - 1 == $X.$M($ARG)"
                  - pattern: "$X.length - $Y.length - 1 !== $X.$M($ARG)"
                  - pattern: "$X.length - $Y.length - 1 != $X.$M($ARG)"
                  - pattern: "$X.$M($ARG) === $X.length - ($Y.length + 1)"
                  - pattern: "$X.$M($ARG) == $X.length - ($Y.length + 1)"
                  - pattern: "$X.$M($ARG) !== $X.length - ($Y.length + 1)"
                  - pattern: "$X.$M($ARG) != $X.length - ($Y.length + 1)"
                  - pattern: "$X.length - ($Y.length + 1) === $X.$M($ARG)"
                  - pattern: "$X.length - ($Y.length + 1) == $X.$M($ARG)"
                  - pattern: "$X.length - ($Y.length + 1) !== $X.$M($ARG)"
                  - pattern: "$X.length - ($Y.length + 1) != $X.$M($ARG)"
                  - pattern: "$X.$M($ARG) === $X.length - 1 - $Y.length"
                  - pattern: "$X.$M($ARG) == $X.length - 1 - $Y.length"
                  - pattern: "$X.$M($ARG) !== $X.length - 1 - $Y.length"
                  - pattern: "$X.$M($ARG) != $X.length - 1 - $Y.length"
                  - pattern: "$X.length - 1 - $Y.length === $X.$M($ARG)"
                  - pattern: "$X.length - 1 - $Y.length == $X.$M($ARG)"
                  - pattern: "$X.length - 1 - $Y.length !== $X.$M($ARG)"
                  - pattern: "$X.length - 1 - $Y.length != $X.$M($ARG)"
          - patterns:
              - pattern-either:
                  - pattern: "$X.$M($ARG) === $D"
                  - pattern: "$X.$M($ARG) == $D"
                  - pattern: "$X.$M($ARG) !== $D"
                  - pattern: "$X.$M($ARG) != $D"
                  - pattern: "$D === $X.$M($ARG)"
                  - pattern: "$D == $X.$M($ARG)"
                  - pattern: "$D !== $X.$M($ARG)"
                  - pattern: "$D != $X.$M($ARG)"
              - pattern-either:
                  - pattern-inside: |
                      $D = $X.length - $Y.length;
                      ...
                  - pattern-inside: |
                      $D = $X.length - $Y.length - 1;
                      ...
                  - pattern-inside: |
                      $D = $X.length - ($Y.length + 1);
                      ...
                  - pattern-inside: |
                      $D = $X.length - 1 - $Y.length;
                      ...
              - pattern-not-inside:
                  pattern-either:
                    - pattern: "$D >= $Z && ..."
                    - pattern: "$D > $Z && ..."
                    - pattern: "$Z <= $D && ..."
                    - pattern: "$Z < $D && ..."
      - metavariable-regex:
          metavariable: "$M"
          regex: "^(?:indexOf|lastIndexOf)$"
      - metavariable-regex:
          metavariable: "$ARG"
          regex: "(?s)^(?!\\()(?![\"'`](?:[^\"'`\\\\]|\\\\.)[\"'`]$)"
      - metavariable-pattern:
          metavariable: "$ARG"
          pattern-either:
            - pattern: "$Y"
            - pattern: "$P + $Y"
            - pattern: "$Y + $P"
      - pattern-not-inside:
          pattern-either:
            - pattern: "$X.$M($ARG) !== -1 && ..."
            - pattern: "$X.$M($ARG) != -1 && ..."
            - pattern: "$X.$M($ARG) >= 0 && ..."
            - pattern: "$X.$M($ARG) > -1 && ..."
            - pattern: "$X.$M($ARG) > 0 && ..."
            - pattern: "0 <= $X.$M($ARG) && ..."
            - pattern: "0 < $X.$M($ARG) && ..."
            - pattern: "-1 < $X.$M($ARG) && ..."
            - pattern: "!($X.$M($ARG) < 0) && ..."
            - pattern: "!($X.$M($ARG) <= -1) && ..."
            - pattern: "$X.$M($ARG) === -1 || ..."
            - pattern: "$X.$M($ARG) == -1 || ..."
            - pattern: "$X.$M($ARG) < 0 || ..."
            - pattern: "$X.$M($ARG) <= -1 || ..."
      - pattern-not-inside:
