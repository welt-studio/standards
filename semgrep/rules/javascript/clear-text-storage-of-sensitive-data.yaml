          - pattern: "$O.$M($A, ...)"
          - metavariable-regex:
              metavariable: "$A"
              regex: "^[\"'`](?!(?is:[^\"'`]*(?:[^\\w$.\"\\'`-]|redact|censor|obfuscate|hash|md5|sha|random|(?<!unen)crypt|(?<!un)encode|certain|concert|secretar|wildcard|coauthor|account(ant|ab|ing|ed)|(?<!pro)file|path|([_-]|\\b)url)))(?is:[^\"'`]*(?:(?:(?<!is|is_)secret|(?<!un|un_|is|is_)trusted(?!_iter|_?schema)|confidential)|(?:pass(wd|word|code|.?phrase)(?!.*question)|(auth(entication|ori[sz]ation)?).?key|oauth|api.?(key|tok)|([_-]|\\b)mfa([_-]|\\b))|(?:(cert)(?!.*(format|name|ification)))|(?:social.?security|employer.?identification|national.?insurance|resident.?id|passport.?(num|no)|([_-]|\\b)ssn([_-]|\\b)|post.?code|zip.?code|home.?addr|(mob(ile)?|home).?(num|no|tel|phone)|(tel|fax|phone).?(num|no)|telephone|emergency.?contact|latitude|longitude|nationality|(credit|debit|bank|visa).?(card|num|no|acc(ou)?nt)|(card|acc(ou)?nt).?(no|num|credit)|routing.?num|salary|billing|beneficiary|credit.?(rating|score)|([_-]|\\b)(ccn|cvv|iban)([_-]|\\b)|security.?code|birth.?da(te|y)|da(te|y).?(of.?)?birth|gender|([_-]|\\b)sex([_-]|\\b)|medical|(health|care).?plan|healthkit|appointment|prescription|patient.?(id|record)|blood.?(type|alcohol|glucose|pressure)|heart.?(rate|rhythm)|body.?(mass|fat)|menstrua|pregnan|insulin|inhaler|employ(er|ee)|spouse|maiden.?name|mac.?addr)))[\"'`]?$"
    pattern-sanitizers:
      - patterns:
          - pattern: "$F(...)"
          - metavariable-regex:
              metavariable: "$F"
              regex: "(?is).*(protect|encode|encrypt)"
      - patterns:
          - pattern: "$O.$F(...)"
          - metavariable-regex:
              metavariable: "$F"
              regex: "(?is).*(protect|encode|encrypt)"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "$R.cookie($K, $V, ...)"
              - pattern: "$R.cookie($K, $V)"
          - metavariable-regex:
              metavariable: "$R"
              regex: "^(res|response|reply|resp|ctx)$"
          - focus-metavariable: "$V"
      - patterns:
          - pattern: '$R.setHeader("Set-Cookie", $V)'
          - focus-metavariable: "$V"
      - patterns:
          - pattern: "{..., 'Set-Cookie': $V, ...}"
          - focus-metavariable: "$V"
      - patterns:
          - pattern: "$S.setItem($K, $V)"
          - metavariable-regex:
              metavariable: "$S"
              regex: "^(window\\.)?(localStorage|sessionStorage)$"
          - focus-metavariable: "$V"
      - patterns:
          - pattern: "$S.$P = $V"
          - metavariable-regex:
              metavariable: "$S"
              regex: "^(window\\.)?(localStorage|sessionStorage)$"
          - focus-metavariable: "$V"
      - patterns:
          - pattern: "$S[$P] = $V"
          - metavariable-regex:
              metavariable: "$S"
              regex: "^(window\\.)?(localStorage|sessionStorage)$"
          - focus-metavariable: "$V"
      - patterns:
          - pattern-either:
              - pattern: "$C.put($K, $V)"
              - pattern: "$C.putObject($K, $V)"
          - metavariable-regex:
              metavariable: "$C"
              regex: "^\\$(cacheFactory|templateCache|cookies)$"
          - focus-metavariable: "$V"
