# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-clear-text-storage-of-sensitive-data
    languages:
      - javascript
      - typescript
    severity: WARNING
    mode: taint
    options:
      interfile: true
    message: "Dado sensível é gravado em texto puro em cookie ou no armazenamento do navegador (`localStorage`, `sessionStorage`). Não guarde senhas e segredos no cliente; se for inevitável, criptografe antes."
    metadata:
      category: security
      cwe: "CWE-312: Cleartext Storage of Sensitive Information"
      codeql: js/clear-text-storage-of-sensitive-data
    pattern-sources:
      - patterns:
          - pattern: "$N"
          - metavariable-regex:
              metavariable: "$N"
              regex: "^[A-Za-z_$][\\w$]*$"
