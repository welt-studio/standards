# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-clear-text-logging
    languages:
      - javascript
      - typescript
    severity: WARNING
    mode: taint
    options:
      interfile: true
    message: "Dado sensível (senha, chave ou variáveis de ambiente) é escrito em um log em texto puro. Remova o valor do log ou mascare-o antes de registrar."
    metadata:
      category: security
      cwe: "CWE-312: Cleartext Storage of Sensitive Information"
      codeql: js/clear-text-logging
    pattern-sources:
      - patterns:
          - pattern: "$N"
          - metavariable-regex:
              metavariable: "$N"
              regex: "^[A-Za-z_$][\\w$]*$"
          - metavariable-regex:
              metavariable: "$N"
              regex: "^(?!(?is:.*(?:[^\\w$.-]|redact|censor|obfuscate|hash|md5|sha|random|(?<!unen)crypt|(?<!un)encode|certain|concert|secretar|wildcard|coauthor|account(ant|ab|ing|ed)|(?<!pro)file|path|([_-]|\\b)url)))(?is:.*(?:(?:pass(wd|word|code|.?phrase)(?!.*question)|(auth(entication|ori[sz]ation)?).?key|oauth|api.?(key|tok)|([_-]|\\b)mfa([_-]|\\b))))"
      - patterns:
          - pattern: "$O.$N"
          - metavariable-regex:
              metavariable: "$N"
              regex: "^(?!(?is:.*(?:[^\\w$.-]|redact|censor|obfuscate|hash|md5|sha|random|(?<!unen)crypt|(?<!un)encode|certain|concert|secretar|wildcard|coauthor|account(ant|ab|ing|ed)|(?<!pro)file|path|([_-]|\\b)url)))(?is:.*(?:(?:pass(wd|word|code|.?phrase)(?!.*question)|(auth(entication|ori[sz]ation)?).?key|oauth|api.?(key|tok)|([_-]|\\b)mfa([_-]|\\b))))"
      - patterns:
          - pattern: "{..., $N: $V, ...}"
          - metavariable-regex:
              metavariable: "$N"
              regex: "^(?!(?is:.*(?:[^\\w$.-]|redact|censor|obfuscate|hash|md5|sha|random|(?<!unen)crypt|(?<!un)encode|certain|concert|secretar|wildcard|coauthor|account(ant|ab|ing|ed)|(?<!pro)file|path|([_-]|\\b)url)))(?is:.*(?:(?:pass(wd|word|code|.?phrase)(?!.*question)|(auth(entication|ori[sz]ation)?).?key|oauth|api.?(key|tok)|([_-]|\\b)mfa([_-]|\\b))))"
          - focus-metavariable: "$V"
      - patterns:
          - pattern: "$O.$N = $V"
          - metavariable-regex:
              metavariable: "$N"
              regex: "^(?!(?is:.*(?:[^\\w$.-]|redact|censor|obfuscate|hash|md5|sha|random|(?<!unen)crypt|(?<!un)encode|certain|concert|secretar|wildcard|coauthor|account(ant|ab|ing|ed)|(?<!pro)file|path|([_-]|\\b)url)))(?is:.*(?:(?:pass(wd|word|code|.?phrase)(?!.*question)|(auth(entication|ori[sz]ation)?).?key|oauth|api.?(key|tok)|([_-]|\\b)mfa([_-]|\\b))))"
          - focus-metavariable: "$V"
      - patterns:
          - pattern: "$F(...)"
          - metavariable-regex:
              metavariable: "$F"
              regex: "(?is)^getPassword$"
      - patterns:
          - pattern: "$O.$F(...)"
          - metavariable-regex:
              metavariable: "$F"
              regex: "(?is)^getPassword$"
      - patterns:
          - pattern: process.env
          - pattern-not-inside: "process.env.$X"
          - pattern-not-inside: "process.env[$X]"
    pattern-sanitizers:
      - patterns:
          - pattern: "$F(...)"
          - metavariable-regex:
              metavariable: "$F"
              regex: "(?is).*(?:[^\\w$.-]|redact|censor|obfuscate|hash|md5|sha|random|(?<!unen)crypt|(?<!un)encode|certain|concert|secretar|wildcard|coauthor|account(ant|ab|ing|ed)|(?<!pro)file|path|([_-]|\\b)url)"
      - patterns:
          - pattern: "$O.$F(...)"
          - metavariable-regex:
              metavariable: "$F"
              regex: "(?is).*(?:[^\\w$.-]|redact|censor|obfuscate|hash|md5|sha|random|(?<!unen)crypt|(?<!un)encode|certain|concert|secretar|wildcard|coauthor|account(ant|ab|ing|ed)|(?<!pro)file|path|([_-]|\\b)url)"
      - patterns:
          - pattern: "$X.replace(...)"
          - pattern-regex: "\\.replace\\(\\s*/\\.[+*]?/[a-z]*g[a-z]*\\s*,"
    pattern-sinks:
      - patterns:
          - pattern: "console.$M(...)"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(log|info|warn|error|debug|trace|dir|table|assert)$"
      - patterns:
          - pattern: "console.$M.apply(...)"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(log|info|warn|error|debug|trace)$"
      - patterns:
          - pattern: "$L.$M(...)"
          - metavariable-regex:
              metavariable: "$L"
              regex: "^(log|logger|LOG|Logger|logging|winston|bunyan|log4js|loglevel|npmlog|pino|fancyLog|debug|signale)$"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(log|info|warn|warning|error|debug|trace|fatal|verbose|silly|notice|critical)$"
      - patterns:
          - pattern: "$L(...)"
          - metavariable-regex:
              metavariable: "$L"
              regex: "^(debug|fancyLog)$"
      - patterns:
          - pattern: "require('debug')(...)(...)"
