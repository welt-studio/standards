# GERADO por `hooks/generate_semgrep.py` a partir de `semgrep/models/` e `semgrep/queries/`.
# NÃO EDITE: edite o modelo ou a consulta e rode `uv run hooks/generate_semgrep.py`.
rules:
  - id: welt-js-case-sensitive-middleware-path
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "Este middleware usa uma expressão regular de caminho que diferencia maiúsculas de minúsculas, mas o roteador do Express trata os caminhos sem diferenciar. Um caminho com a caixa trocada (por exemplo `/FOO`) contorna o middleware. Adicione a flag `i` à expressão regular."
    metadata:
      category: security
      cwe: "CWE-178: Improper Handling of Case Sensitivity"
      codeql: js/case-sensitive-middleware-path
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: "$APP.$M(/$RE/, ..., function($A, $B, $N) {...})"
              - pattern: "$APP.$M(/$RE/, ..., ($A, $B, $N) => {...})"
              - pattern: "$APP.$M(/$RE/, $H)"
              - pattern: "$APP.$M(/$RE/, $H, $H2)"
              - pattern: "$APP.$M(/$RE/, $H, $H2, $H3)"
          - pattern-not: "$APP.$M(/$RE/gi, ...)"
          - pattern-not: "$APP.$M(/$RE/gim, ...)"
          - pattern-not: "$APP.$M(/$RE/gis, ...)"
          - pattern-not: "$APP.$M(/$RE/giu, ...)"
          - pattern-not: "$APP.$M(/$RE/giy, ...)"
          - pattern-not: "$APP.$M(/$RE/gmi, ...)"
          - pattern-not: "$APP.$M(/$RE/gsi, ...)"
          - pattern-not: "$APP.$M(/$RE/gui, ...)"
          - pattern-not: "$APP.$M(/$RE/gyi, ...)"
          - pattern-not: "$APP.$M(/$RE/i, ...)"
          - pattern-not: "$APP.$M(/$RE/ig, ...)"
          - pattern-not: "$APP.$M(/$RE/igm, ...)"
          - pattern-not: "$APP.$M(/$RE/igs, ...)"
          - pattern-not: "$APP.$M(/$RE/igu, ...)"
          - pattern-not: "$APP.$M(/$RE/igy, ...)"
          - pattern-not: "$APP.$M(/$RE/im, ...)"
          - pattern-not: "$APP.$M(/$RE/img, ...)"
          - pattern-not: "$APP.$M(/$RE/ims, ...)"
          - pattern-not: "$APP.$M(/$RE/imu, ...)"
          - pattern-not: "$APP.$M(/$RE/imy, ...)"
          - pattern-not: "$APP.$M(/$RE/is, ...)"
          - pattern-not: "$APP.$M(/$RE/isg, ...)"
          - pattern-not: "$APP.$M(/$RE/ism, ...)"
          - pattern-not: "$APP.$M(/$RE/isu, ...)"
          - pattern-not: "$APP.$M(/$RE/isy, ...)"
          - pattern-not: "$APP.$M(/$RE/iu, ...)"
          - pattern-not: "$APP.$M(/$RE/iug, ...)"
          - pattern-not: "$APP.$M(/$RE/ium, ...)"
          - pattern-not: "$APP.$M(/$RE/ius, ...)"
          - pattern-not: "$APP.$M(/$RE/iuy, ...)"
          - pattern-not: "$APP.$M(/$RE/iy, ...)"
          - pattern-not: "$APP.$M(/$RE/iyg, ...)"
          - pattern-not: "$APP.$M(/$RE/iym, ...)"
          - pattern-not: "$APP.$M(/$RE/iys, ...)"
          - pattern-not: "$APP.$M(/$RE/iyu, ...)"
          - pattern-not: "$APP.$M(/$RE/mgi, ...)"
          - pattern-not: "$APP.$M(/$RE/mi, ...)"
          - pattern-not: "$APP.$M(/$RE/mig, ...)"
          - pattern-not: "$APP.$M(/$RE/mis, ...)"
          - pattern-not: "$APP.$M(/$RE/miu, ...)"
          - pattern-not: "$APP.$M(/$RE/miy, ...)"
          - pattern-not: "$APP.$M(/$RE/msi, ...)"
          - pattern-not: "$APP.$M(/$RE/mui, ...)"
          - pattern-not: "$APP.$M(/$RE/myi, ...)"
          - pattern-not: "$APP.$M(/$RE/sgi, ...)"
          - pattern-not: "$APP.$M(/$RE/si, ...)"
          - pattern-not: "$APP.$M(/$RE/sig, ...)"
          - pattern-not: "$APP.$M(/$RE/sim, ...)"
          - pattern-not: "$APP.$M(/$RE/siu, ...)"
          - pattern-not: "$APP.$M(/$RE/siy, ...)"
          - pattern-not: "$APP.$M(/$RE/smi, ...)"
          - pattern-not: "$APP.$M(/$RE/sui, ...)"
          - pattern-not: "$APP.$M(/$RE/syi, ...)"
          - pattern-not: "$APP.$M(/$RE/ugi, ...)"
          - pattern-not: "$APP.$M(/$RE/ui, ...)"
          - pattern-not: "$APP.$M(/$RE/uig, ...)"
          - pattern-not: "$APP.$M(/$RE/uim, ...)"
          - pattern-not: "$APP.$M(/$RE/uis, ...)"
          - pattern-not: "$APP.$M(/$RE/uiy, ...)"
          - pattern-not: "$APP.$M(/$RE/umi, ...)"
          - pattern-not: "$APP.$M(/$RE/usi, ...)"
          - pattern-not: "$APP.$M(/$RE/uyi, ...)"
          - pattern-not: "$APP.$M(/$RE/ygi, ...)"
          - pattern-not: "$APP.$M(/$RE/yi, ...)"
          - pattern-not: "$APP.$M(/$RE/yig, ...)"
          - pattern-not: "$APP.$M(/$RE/yim, ...)"
          - pattern-not: "$APP.$M(/$RE/yis, ...)"
          - pattern-not: "$APP.$M(/$RE/yiu, ...)"
          - pattern-not: "$APP.$M(/$RE/ymi, ...)"
          - pattern-not: "$APP.$M(/$RE/ysi, ...)"
          - pattern-not: "$APP.$M(/$RE/yui, ...)"
          - pattern-not: "$APP.$M(/$RE/, ..., function($A, $B) {...})"
          - pattern-not: "$APP.$M(/$RE/, ..., ($A, $B) => {...})"
          - pattern-not: "$APP.$M(/$RE/, express.static(...))"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(use|all|get|post|put|delete|patch|head|options)$"
          - metavariable-regex:
              metavariable: "$RE"
              regex: "^(?!.*(?:a-zA-Z|A-Za-z))(?:\\\\.|\\[[a-zA-Z]{2}\\]|[^a-zA-Z\\\\\\[]|\\[(?![a-zA-Z]{2}\\]))*[a-zA-Z]"
      - patterns:
          - pattern-either:
              - pattern: "$APP.$M(new RegExp($S), ..., function($A, $B, $N) {...})"
              - pattern: "$APP.$M(new RegExp($S), ..., ($A, $B, $N) => {...})"
              - pattern: "$APP.$M(new RegExp($S), $H)"
              - pattern: "$APP.$M(new RegExp($S), $H, $H2)"
              - pattern: "$APP.$M(new RegExp($S), $H, $H2, $H3)"
          - pattern-not: "$APP.$M(new RegExp($S), ..., function($A, $B) {...})"
          - pattern-not: "$APP.$M(new RegExp($S), ..., ($A, $B) => {...})"
          - pattern-not: "$APP.$M(new RegExp($S), express.static(...))"
          - metavariable-regex:
              metavariable: "$M"
              regex: "^(use|all|get|post|put|delete|patch|head|options)$"
          - metavariable-regex:
              metavariable: "$S"
              regex: '^["''`].*[a-zA-Z]'
