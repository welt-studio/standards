  - id: welt-js-missing-token-validation-route
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: "Este middleware de cookies atende rotas que alteram estado (POST, PUT, PATCH, DELETE) sem proteção contra CSRF. Adicione um middleware de token anti-CSRF, como `csurf` ou `lusca.csrf`, depois do middleware de cookies."
    metadata:
      category: security
      cwe: "CWE-352: Cross-Site Request Forgery (CSRF)"
      codeql: js/missing-token-validation
    patterns:
      - pattern-either:
          - pattern: "$R.$M($P, cookieParser(...), ..., function($REQ, ...) { ... <... $REQ.cookies ...>; ... })"
          - pattern: "$R.$M($P, cookieParser(...), ..., async function($REQ, ...) { ... <... $REQ.cookies ...>; ... })"
          - pattern: "$R.$M($P, cookieParser(...), ..., ($REQ, ...) => { ... <... $REQ.cookies ...>; ... })"
          - pattern: "$R.$M($P, cookieParser(...), ..., async ($REQ, ...) => { ... <... $REQ.cookies ...>; ... })"
      - metavariable-regex:
          metavariable: "$M"
          regex: "^(post|put|patch|delete|all)$"
      - pattern: "$R.$M(...)"
