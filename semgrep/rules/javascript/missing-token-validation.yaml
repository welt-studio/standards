    metadata:
      category: security
      cwe: "CWE-352: Cross-Site Request Forgery (CSRF)"
      codeql: js/missing-token-validation
    patterns:
      - pattern: "$APP.register(require('fastify-cookie'))"
      - pattern-either:
          - pattern-inside: |
              $APP.register(require('fastify-cookie'));
              ...
              $APP.route({method: "POST", url: $U, handler: $H});
              ...
