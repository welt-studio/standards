# Hooks que os projetos usam deste repo pelo pre-commit (`repo: https://github.com/welt-studio/standards`).

# Mantém `ruff-base.toml` na raiz do projeto igual ao `ruff/base.toml` do `rev` declarado, e
# reprova o que a contorna: config de Ruff versionada sem `extend` da cópia, com `select` próprio,
# `exclude`/`include`, o `TID251` (`Any` e `cast`) ou o `PGH004` desligado, `banned-api` sem os
# itens da base; e o `noqa` que desliga um dos dois num `.py`, `.pyi` ou `.ipynb`.
- id: ruff-base
  name: ruff-base (padrão Ruff da Welt Studio)
  entry: hooks/check_ruff.py
  language: script
  pass_filenames: false
  always_run: true

# Mantém `pyright-base.json` na raiz do projeto igual ao `pyright/base.json` do `rev` declarado, e
# reprova o que a contorna: regra no `pyrightconfig.json` (`strict`, `report*`, modo),
# `# pyright: <modo ou regra>` num `.py`/`.pyi`, `# type: ignore` e `# pyright: ignore` fora o
# marcador de lib sem stubs.
- id: pyright-base
  name: pyright-base (padrão Pyright da Welt Studio)
  entry: hooks/check_pyright.py
  language: script
  pass_filenames: false
  always_run: true

# Ruff do projeto (a versão do `uv.lock` do pacote), de dentro do pacote (`uv run --directory`),
# nos arquivos do commit: ele acha a config de cada arquivo como sempre (a de uma subpasta também) e
# aplica as exclusões do padrão. Commit que muda uma config (`ruff-base.toml`; `ruff.toml`,
# `.ruff.toml` ou o `[tool.ruff]` de um `pyproject.toml` do pacote) ou o `uv.lock` roda no pacote
# inteiro: muda o resultado de todo arquivo. A pasta do pacote vai em `args` (obrigatória; ex.:
# `args: [backend]`, ou `args: [.]`). O `ruff` vem antes do `ruff-format`: o `--fix` muda código que
# o format reformata. O `files` casa com todo gatilho do `hooks/run_python_tool.py` (o teste
# confere).
- id: ruff
  name: Ruff (lint, padrão da Welt Studio)
  entry: hooks/run_python_tool.py ruff
  language: script
  require_serial: true
  files: (\.(py|pyi|ipynb)|(^|/)(ruff-base\.toml|\.?ruff\.toml|pyproject\.toml|uv\.lock))$

- id: ruff-format
  name: Ruff (format, padrão da Welt Studio)
  entry: hooks/run_python_tool.py ruff-format
  language: script
  require_serial: true
  files: (\.(py|pyi|ipynb)|(^|/)(ruff-base\.toml|\.?ruff\.toml|pyproject\.toml|uv\.lock))$

# Pyright do projeto (a versão do `uv.lock` do pacote, pelo `uv run --project`), da raiz, nos
# arquivos do commit que o `pyrightconfig.json` analisa (o da raiz, ou o do pacote quando a raiz não
# tem). Commit que muda o `pyrightconfig.json`, o `pyright-base.json` ou o `uv.lock` roda no projeto
# inteiro. A pasta do pacote vai em `args` (obrigatória). Projeto sem fila do strict declara
# `pass_filenames: false` e checa sempre o projeto inteiro.
- id: pyright
  name: Pyright (padrão da Welt Studio)
  entry: hooks/run_python_tool.py pyright
  language: script
  require_serial: true
  files: (\.pyi?|(^|/)(pyrightconfig\.json|pyright-base\.json|uv\.lock))$

# Mantém `.prettierignore` igual ao `prettier/ignore` do `rev` declarado: na raiz, ou na pasta de
# onde o Prettier roda, passada em `args` (ex.: `args: [frontend]`).
- id: prettier-base
  name: prettier-base (padrão Prettier da Welt Studio)
  entry: hooks/sync_base.py prettier
  language: script
  pass_filenames: false
  always_run: true

# Mantém `.jscpd.json` (a trava) e `.jscpd-semantic.json` (o relatório semântico) na raiz do projeto
# iguais ao `jscpd/` do `rev` declarado.
- id: jscpd-base
  name: jscpd-base (padrão jscpd da Welt Studio)
  entry: hooks/sync_base.py jscpd
  language: script
  pass_filenames: false
  always_run: true

# Confere no `pyproject.toml` do pacote Python as opções do padrão de testes (o pytest não herda
# config, então não há cópia): na raiz, ou na pasta do pacote passada em `args` (ex.: `args: [backend]`).
- id: pytest-base
  name: pytest-base (padrão de testes da Welt Studio)
  entry: hooks/check_pytest.py
  language: script
  pass_filenames: false
  always_run: true

# Dependência Python não usada, não declarada ou fora do grupo certo (o Knip do Python): roda o
# deptry do `uv.lock` do projeto na pasta do pacote passada em `args` (obrigatória; ex.:
# `args: [backend]`, ou `args: [.]`). Sem script: o `uv` direto, no ambiente do projeto (o deptry
# lê os metadados dos pacotes instalados para saber de que distribuição vem cada import). O
# `bash -c` só põe a pasta (`$1`) no `--directory`; o `deptry` depois do script é o `$0`. Sem o
# `deptry` no grupo `dev`, o uv reprova com `Failed to spawn: deptry`.
- id: deptry
  name: deptry (dependências Python, padrão da Welt Studio)
  entry: bash -c 'exec uv run --directory "${1:?passe a pasta do pacote Python em args}" deptry .' deptry
  language: system
  pass_filenames: false
  files: (\.py|pyproject\.toml|uv\.lock)$

# Confere a política de scripts de instalação do pnpm (`strictDepBuilds: false`, sem `allowBuilds`,
# npm recusado pelo `devEngines`): na raiz, ou na pasta do `pnpm-workspace.yaml` passada em `args`.
- id: pnpm-base
  name: pnpm-base (scripts de instalação, padrão da Welt Studio)
  entry: hooks/check_pnpm.py
  language: script
  pass_filenames: false
  always_run: true
